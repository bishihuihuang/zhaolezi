<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找乐子——黑客模拟器</title>
    <style>
        *,
        *::before,
        *::after { margin: 0; padding: 0; box-sizing: border-box; }
        /* 六主题适配：页面底随主题；终端本体为深色道具（黑客语义），舱内配色保持不动 */
        body { font-family: 'Consolas','Courier New','Segoe UI','Microsoft YaHei',sans-serif; background: var(--bg); color: var(--txt); overflow-x: hidden; }
        /* 恐怖黑客背景 */
        .hacker-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; overflow: hidden; background: radial-gradient(ellipse at 50% 30%, color-mix(in srgb, var(--glow) 8%, transparent), transparent 70%); }
        .hacker-bg::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: repeating-linear-gradient(0deg, transparent 0px, transparent 3px, rgba(0,255,65,.03) 3px, rgba(0,255,65,.03) 4px); animation: scanline 8s linear infinite; }
        @keyframes scanline { 0% { transform: translateY(0); } 100% { transform: translateY(4px); } }
        .hacker-bg .glitch { position: absolute; font-size: 120px; font-weight: 900; color: rgba(255,0,0,.05); top: 20%; left: 10%; white-space: nowrap; letter-spacing: 20px; animation: glitchShift 3s ease-in-out infinite; }
        .hacker-bg .glitch2 { position: absolute; font-size: 80px; font-weight: 900; color: rgba(0,255,65,.03); top: 70%; right: 10%; white-space: nowrap; letter-spacing: 15px; animation: glitchShift 5s ease-in-out infinite reverse; }
        @keyframes glitchShift { 0%,100% { transform: translate(0,0); opacity: .3; } 50% { transform: translate(10px,-5px); opacity: .8; } }
        .red-particles { position: absolute; inset: 0; overflow: hidden; }
        .red-particles span { position: absolute; width: 4px; height: 4px; background: #ff0000; border-radius: 50%; animation: particleFloat 6s ease-in-out infinite; box-shadow: 0 0 8px #ff0000; }
        @keyframes particleFloat { 0%,100% { transform: translateY(0); opacity: .2; } 50% { transform: translateY(-20px); opacity: 1; } }
        main { position: relative; z-index: 10; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 20px 0; }
        /* 终端外壳=深色道具（黑客模拟语义），六主题下保持暗色舱体 */
        .container { width: 94%; max-width: 1300px; background: rgba(10,10,10,.95); border-radius: 8px; box-shadow: 0 0 30px rgba(0,255,65,.2), 0 0 100px rgba(0,0,0,.8); padding: 10px; margin-top: 20px; border: 1px solid rgba(0,255,65,.3); }
        .grid { display: grid; grid-template-columns: repeat(6,1fr); grid-template-rows: repeat(8,minmax(70px,auto)); gap: 8px; }
        .cell { border-radius: 6px; border: 1px solid rgba(0,255,65,.3); background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 10px; position: relative; }
        /* 标题区 */
        .title-area { grid-row: 1/3; grid-column: 1/5; background: linear-gradient(135deg,#0a0a0a,#1a0a0a); border: 2px solid #ff0000; box-shadow: 0 0 20px rgba(255,0,0,.4); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .title-area h1 { font-size: 36px; font-weight: 900; letter-spacing: 6px; background: linear-gradient(90deg,#ff0000,#ff3333,#ff0000); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: redGlow 2s ease-in-out infinite; text-shadow: 0 0 30px rgba(255,0,0,.5); }
        @keyframes redGlow { 0%,100% { filter: brightness(.8); } 50% { filter: brightness(1.3); } }
        .title-area small { color: rgba(255,255,255,.5); margin-top: 6px; letter-spacing: 3px; font-size: 12px; }
        /* 返回主页 */
        .back-area { grid-row: 1/3; grid-column: 5/7; background: linear-gradient(135deg,#1a0a0a,#0a0a0a); border: 2px solid #ff3333; color: #ff6666; text-decoration: none; font-weight: 900; font-size: 20px; letter-spacing: 3px; cursor: pointer; transition: all .3s; display: flex; flex-direction: column; align-items: center; justify-content: center; text-shadow: 0 0 10px rgba(255,0,0,.6); }
        .back-area:hover { background: #ff0000; color: #fff; box-shadow: 0 0 30px #ff0000; }
        /* 命令提示符区域 */
        .terminal-area { grid-row: 3/9; grid-column: 1/7; background: #0c0c0c; border: 2px solid #00ff41; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 20px rgba(0,255,65,.3); }
        .terminal-titlebar { background: linear-gradient(90deg,#1a1a1a,#0d0d0d); padding: 6px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #00ff4133; }
        .terminal-titlebar .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .terminal-titlebar .dot-red { background: #ff0000; }
        .terminal-titlebar .dot-yellow { background: #ffaa00; }
        .terminal-titlebar .dot-green { background: #00ff41; }
        .terminal-titlebar .title { color: #888 !important; /* 深色道具固定字色：防 common.css var(--txt) 覆盖致浅主题深底深字 */ font-size: 13px; margin-left: 6px; font-family: 'Consolas', monospace; }
        .terminal-titlebar .title::after { content: '|'; animation: blink 1s step-end infinite; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
        .terminal-body { flex: 1; padding: 10px; overflow-y: auto; font-family: 'Consolas','Courier New',monospace; font-size: 14px; line-height: 1.5; max-height: 500px; scrollbar-width: thin; scrollbar-color: #00ff41 #0a0a0a; }
        .terminal-body::-webkit-scrollbar { width: 8px; }
        .terminal-body::-webkit-scrollbar-track { background: #0a0a0a; }
        .terminal-body::-webkit-scrollbar-thumb { background: #00ff41; border-radius: 4px; }
        /* 随机颜色类 */
        .terminal-output.color-red { color: #ff0000; }
        .terminal-output.color-yellow { color: #ffff00; }
        .terminal-output.color-green { color: #00ff00; }
        .terminal-output.random { animation: flicker .3s ease-in-out infinite; }
        @keyframes flicker { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
        /* 输入行 */
        .terminal-input-line { padding: 8px 0; margin-top: 4px; background: transparent; border-top: 1px solid #00ff4133; display: flex; align-items: center; }
        .terminal-input-line .prompt { color: #00ff41; font-weight: bold; margin-right: 6px; font-family: 'Consolas', monospace; white-space: nowrap; margin-left: 10px; }
        .terminal-input-line input { flex: 1; background: transparent; border: none; outline: none; color: #00ff41; font-size: 14px; font-family: 'Consolas','Courier New',monospace; letter-spacing: 1px; caret-color: #00ff41; }
        .terminal-input-line input::placeholder { color: rgba(0,255,65,.4); }
        /* 跳转覆盖层 */
        .transition-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999999; background: rgba(0,0,0,.95); display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: opacity .4s, visibility .4s; pointer-events: none; }
        .transition-overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }
        .transition-overlay::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent 0px, transparent 5px, rgba(255,0,0,.03) 5px, rgba(255,0,0,.03) 6px); animation: scanline 3s linear infinite; }
        .transition-overlay .red-ring { position: relative; width: 180px; height: 180px; border: 3px solid rgba(255,0,0,.8); border-radius: 50%; animation: ringPulse 1.5s ease-in-out infinite; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, rgba(255,0,0,.2), transparent 70%); box-shadow: 0 0 30px rgba(255,0,0,.5), inset 0 0 20px rgba(255,0,0,.3); }
        .transition-overlay .red-ring::before { content: ''; position: absolute; inset: 15px; border-radius: 50%; border: 2px dashed rgba(255,0,0,.5); animation: ringSpin 3s linear infinite; }
        .transition-overlay .red-ring::after { content: ''; position: absolute; inset: 35px; border-radius: 50%; border: 1px solid rgba(255,0,0,.3); animation: ringPulse 2s ease-in-out infinite reverse; }
        @keyframes ringPulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: .6; } }
        @keyframes ringSpin { to { transform: rotate(360deg); } }
        .transition-overlay .find-text { position: relative; font-size: 36px; font-weight: 900; color: #ff0000; text-shadow: 0 0 30px #ff0000; letter-spacing: 8px; animation: textFlicker 1s ease-in-out infinite; z-index: 2; background: rgba(0,0,0,.5); padding: 10px 20px; border-radius: 10px; }
        @keyframes textFlicker { 0%,100% { opacity: 1; } 25% { opacity: .7; } 50% { opacity: 1; } 75% { opacity: .5; } }
        @media (max-width: 900px) { .grid { gap: 6px; } .title-area h1 { font-size: 24px; } .back-area { font-size: 16px; } .terminal-body { font-size: 13px; } }
        @media (max-width: 600px) { .container { width: 98%; padding: 5px; } .grid { grid-template-columns: repeat(2,1fr); grid-template-rows: auto; } .title-area { grid-row: 1; grid-column: 1/3; } .back-area { grid-row: 2; grid-column: 1/3; } .terminal-area { grid-row: 3; grid-column: 1/3; min-height: 400px; } }
    
        /* ========== 手机端响应式适配（通用） ========== */
        @media (max-width: 768px) {
            html, body {
                overflow-x: hidden;
                width: 100%;
            }
            main {
                padding: 70px 0 30px !important;
            }
            .container, .card-container, .wrapper, .box, .panel, .form-box {
                width: 94% !important;
                max-width: 94vw !important;
                padding: 14px !important;
                margin: 0 auto !important;
            }
            /* 6列/多列网格改3列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 8px !important;
                padding: 4px !important;
            }
            /* 大区域占满整行 */
            .title-area, .back-area, .display-area, .game-main,
            .calculator-area, .main-area, .content-area, .result-area,
            .input-area, .output-area, .board-area, .info-area, .settings-area {
                grid-column: 1 / -1 !important;
                grid-row: auto !important;
            }
            /* 左右分栏改上下堆叠 */
            .left-panel, .right-panel, .side-panel, .sidebar {
                flex: 1 1 100% !important;
                width: 100% !important;
                border-right: none !important;
                border-bottom: 1px solid var(--line) !important;
            }
            .display-area, .game-main, .calculator-area {
                flex-direction: column !important;
                padding: 12px !important;
            }
            .cell, .tool-cell, .grid-cell {
                padding: 10px 6px !important;
                min-height: 70px !important;
            }
            h1, h2, h3, .title-text, .author-name, .main-title {
                font-size: 22px !important;
                letter-spacing: 1px !important;
            }
            .btn, button, input, select, textarea {
                font-size: 14px !important;
                padding: 10px 14px !important;
            }
            .ghost-btn, .back-btn, .return-btn {
                padding: 8px 16px !important;
                font-size: 13px !important;
            }
            /* 隐藏非必要装饰元素 */
            .orb, .decoration, .deco-element, .floating-shape {
                display: none !important;
            }
        }
        @media (max-width: 480px) {
            .container, .card-container, .wrapper, .box {
                width: 96% !important;
                padding: 10px !important;
            }
            /* 小屏手机改2列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 6px !important;
            }
            h1, h2, h3, .title-text, .author-name {
                font-size: 18px !important;
            }
            .cell, .tool-cell {
                min-height: 80px !important;
                padding: 8px 4px !important;
            }
            .btn, button {
                font-size: 13px !important;
                padding: 8px 12px !important;
            }
        }
</style>
