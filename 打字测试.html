<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⌨️</text></svg>">
<title>打字速度测试 - 找乐子</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        min-height: 100vh;
        background: var(--bg);
        color: var(--txt);
        overflow-x: hidden;
        position: relative;
    }

    /* ========== 背景流光层（全站统一，20秒无缝循环） ========== */
    .bg-animation {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        z-index: 0; overflow: hidden; pointer-events: none;
    }
    /* 六主题适配：flowGradient 背景位移动画移除（触性能铁律） */
    .bg-flow-1 {
        position: absolute; top: -100%; left: -100%; width: 300%; height: 300%;
        background: var(--flow-grad);
    }
    .bg-flow-2 {
        position: absolute; top: -60%; left: -40%; width: 220%; height: 220%;
        background: radial-gradient(ellipse at 30% 70%, rgba(255,140,100,.35), transparent 50%),
            radial-gradient(ellipse at 65% 35%, rgba(120,180,255,.3), transparent 45%),
            radial-gradient(ellipse at 80% 80%, rgba(220,130,250,.25), transparent 40%);
        animation: flowDrift 20s ease-in-out infinite alternate; will-change: transform;
    }
    .bg-flow-3 {
        position: absolute; top: -30%; left: -20%; width: 180%; height: 180%;
        background: radial-gradient(circle at 50% 50%, rgba(255,200,130,.15), transparent 60%),
            radial-gradient(circle at 20% 80%, rgba(80,220,200,.2), transparent 50%);
        animation: flowRotate 20s linear infinite; will-change: transform;
    }
    /* flowGradient 关键帧已移除（background-position 全屏重绘，性能铁律禁用） */
    @keyframes flowDrift {
        0% { transform: translate(0, 0) scale(1) rotate(0deg); }
        50% { transform: translate(3%, -4%) scale(1.05) rotate(5deg); }
        100% { transform: translate(-2%, 3%) scale(.97) rotate(-5deg); }
    }
    @keyframes flowRotate {
        0% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(180deg) scale(1.08); }
        100% { transform: rotate(360deg) scale(1); }
    }

    /* ========== 透明悬浮球 ========== */
    .orb {
        position: absolute; border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, color-mix(in srgb, var(--card-2) 60%, transparent), color-mix(in srgb, var(--card-2) 15%, transparent) 50%, transparent 70%);
        box-shadow: 0 0 60px color-mix(in srgb, var(--glow) 8%, transparent), inset 0 0 30px color-mix(in srgb, var(--card-2) 20%, transparent);
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        pointer-events: none; will-change: transform, opacity;
    }
    .orb-1 { width: 260px; height: 260px; top: 12%; left: 8%; animation: orbFloatA 18s ease-in-out infinite, orbSpin 40s linear infinite; }
    .orb-2 { width: 160px; height: 160px; top: 55%; left: 75%; animation: orbFloatB 22s ease-in-out infinite, orbSpin 55s linear infinite; }
    .orb-3 { width: 110px; height: 110px; top: 68%; left: 20%; animation: orbFloatA 16s ease-in-out infinite reverse, orbSpin 35s linear infinite; }
    .orb-4 { width: 220px; height: 220px; top: 28%; left: 60%; animation: orbFloatB 20s ease-in-out infinite reverse, orbSpin 50s linear infinite; }
    .orb-5 { width: 80px; height: 80px; top: 80%; left: 45%; animation: orbFloatA 14s ease-in-out infinite, orbSpin 30s linear infinite; }
    @keyframes orbFloatA {
        0% { transform: translate(0,0) scale(1); opacity:.6; }
        30% { transform: translate(18px,-22px) scale(1.04); opacity:.8; }
        60% { transform: translate(-12px,10px) scale(.96); opacity:.5; }
        100% { transform: translate(0,0) scale(1); opacity:.6; }
    }
    @keyframes orbFloatB {
        0% { transform: translate(0,0) scale(1); opacity:.5; }
        35% { transform: translate(-20px,12px) scale(1.06); opacity:.7; }
        70% { transform: translate(14px,-15px) scale(.94); opacity:.4; }
        100% { transform: translate(0,0) scale(1); opacity:.5; }
    }
    @keyframes orbSpin { to { transform: rotate(360deg); } }

    /* ========== 主体布局（全站统一：白色悬浮容器） ========== */
    main {
        position: relative; z-index: 10; min-height: 100vh;
        display: flex; justify-content: center; align-items: flex-start;
        padding: 60px 20px 40px;
    }
    .container {
        width: 80%; max-width: 1200px;
        background: var(--card);
        border-radius: 24px;
        box-shadow: 0 25px 70px rgba(0, 0, 0, .35), 0 0 0 1px var(--line);
        max-height: calc(100vh - 100px);
        overflow-y: auto;
        padding: 20px;
        color: var(--txt);
    }
    .container::-webkit-scrollbar { width: 10px; }
    .container::-webkit-scrollbar-track { background: rgba(0, 0, 0, .04); border-radius: 12px; }
    .container::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 12px; border: 2px solid transparent; }

    .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
    .title-area {
        grid-column: 1 / 5;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        min-height: 90px;
        background: var(--title-grad);
        /* 六主题适配：titleGradient 位移动画移除（标题横幅随主题静态渐变） */
        border-radius: 20px;
        box-shadow: 0 12px 40px color-mix(in srgb, var(--gold-2) 35%, transparent), inset 0 1px 0 color-mix(in srgb, var(--card-2) 40%, transparent);
        padding: 10px;
    }
    .title-area h2 { font-size: 34px; font-weight: 900; letter-spacing: 4px; color: var(--btn-txt); text-shadow: 2px 2px 10px rgba(0, 0, 0, .3); text-align: center; }
    .title-area p { font-size: 13px; color: color-mix(in srgb, var(--btn-txt) 85%, transparent); margin-top: 4px; }
    .back-area {
        grid-column: 5 / 7;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        min-height: 90px;
        background: var(--back-grad);
        border-radius: 20px;
        box-shadow: 0 12px 40px color-mix(in srgb, var(--green) 40%, transparent), inset 0 1px 0 color-mix(in srgb, var(--card-2) 40%, transparent);
        text-decoration: none; color: var(--btn-txt); font-size: 18px; font-weight: 800; cursor: pointer;
        transition: transform .3s, box-shadow .3s;
    }
    .back-area:hover { transform: translateY(-5px); box-shadow: 0 18px 50px color-mix(in srgb, var(--green) 50%, transparent); }
    .back-area:active { transform: translateY(-2px) scale(.96); }
    .card {
        grid-column: 1 / -1;
        background: var(--card-2);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, .1);
        border: 2px solid var(--line);
    }
    .card-title { font-size: 16px; font-weight: 800; color: var(--blue, #667eea); margin-bottom: 10px; }
    .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        border: none; cursor: pointer; font-size: 15px; padding: 10px 20px; border-radius: 10px;
        background: var(--btn-grad); color: var(--btn-txt);
        box-shadow: 0 4px 14px color-mix(in srgb, var(--glow) 40%, transparent); transition: transform .2s, box-shadow .2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px color-mix(in srgb, var(--glow) 55%, transparent); }
    .btn:active { transform: scale(.96); }
    .btn-secondary { background: transparent; border: 1px solid var(--line); color: var(--txt); box-shadow: none; }
    .btn-secondary:hover { background: color-mix(in srgb, var(--glow) 12%, transparent); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    input, textarea, select {
        width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
        font-size: 14px; background: var(--card); color: var(--txt); outline: none;
    }
    input:focus, textarea:focus { border-color: var(--blue, #667eea); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 20%, transparent); }
    input::placeholder, textarea::placeholder { color: var(--dim); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
    .hint { font-size: 12px; color: var(--dim); margin-top: 8px; }
    .stat { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
    .stat div { background: color-mix(in srgb, var(--glow) 8%, transparent); border-radius: 10px; padding: 10px; text-align: center; }
    .stat b { display: block; font-size: 20px; color: var(--blue, #667eea); }
    .stat span { font-size: 12px; color: var(--dim); }

    /* ========== 新增组件 ========== */
    /* 模式切换 */
    .mode-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .mode-tab {
        padding: 8px 16px; border-radius: 10px; border: 2px solid var(--line);
        background: var(--card); color: var(--txt); cursor: pointer; font-size: 14px; font-weight: 700;
        transition: all .2s;
    }
    .mode-tab.active { background: var(--btn-grad); color: var(--btn-txt); border-color: transparent; }
    /* 选项行 */
    .opt-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .opt-row select, .opt-row label { flex: 1; min-width: 140px; }
    .opt-row label { font-size: 13px; color: var(--dim); display: flex; align-items: center; gap: 6px; flex: none; }
    /* 每日挑战 */
    .daily-card {
        background: linear-gradient(135deg, color-mix(in srgb, var(--gold) 14%, transparent), color-mix(in srgb, var(--gold-2) 14%, transparent));
        border: 2px solid color-mix(in srgb, var(--gold) 50%, transparent);
    }
    .daily-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .daily-tag { background: linear-gradient(135deg, var(--gold), var(--gold-2)); color: var(--btn-txt); font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 20px; }
    .daily-done { background: var(--green, #2e7d32) !important; }
    .daily-sentence { font-size: 15px; font-weight: 700; color: var(--txt); margin-top: 8px; line-height: 1.7; }
    .daily-status { font-size: 12px; color: var(--dim); margin-top: 4px; }
    /* 目标文本与光标引导 */
    #targetText { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; font-size: 16px; line-height: 1.9; color: var(--txt); min-height: 90px; letter-spacing: 1px; }
    #targetText span { transition: color .1s, background .1s; }
    #targetText span.next { background: color-mix(in srgb, var(--glow) 28%, transparent); box-shadow: 0 0 0 2px var(--blue, #667eea); border-radius: 3px; }
    #targetText span.ok { color: var(--green, #2e7d32); }
    #targetText span.bad { color: var(--red, #e53935); background: color-mix(in srgb, var(--red) 14%, transparent); border-radius: 3px; }
    /* 等级徽章 */
    .rank-row { display: flex; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
    .rank-badge { padding: 6px 16px; border-radius: 20px; font-weight: 800; color: #fff; font-size: 14px; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
    .rank-progress { font-size: 13px; color: var(--dim); }
    /* 错字列表 */
    .err-wrap { margin-top: 10px; display: none; }
    .err-wrap.show { display: block; }
    .err-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .err-item { background: color-mix(in srgb, var(--red) 10%, transparent); border: 1px solid color-mix(in srgb, var(--red) 30%, transparent); border-radius: 8px; padding: 4px 10px; font-size: 13px; color: var(--red, #c62828); }
    .err-item b { color: var(--green, #2e7d32); }
    /* 音效开关 */
    .icon-btn {
        background: var(--card); border: 1px solid var(--line); border-radius: 10px;
        padding: 9px 12px; cursor: pointer; font-size: 16px; transition: transform .2s;
    }
    .icon-btn:hover { transform: scale(1.08); }
    /* 历史曲线 */
    .chart-wrap { margin-top: 12px; }
    #histChart { width: 100%; height: 160px; background: color-mix(in srgb, var(--glow) 6%, transparent); border-radius: 12px; }
    .records-list { margin-top: 10px; font-size: 13px; color: var(--dim); line-height: 1.8; max-height: 120px; overflow-y: auto; }
    .records-list div { border-bottom: 1px dashed var(--line); padding: 2px 0; }
    /* 结果消息 */
    #resultMsg { margin-top: 10px; font-size: 14px; color: var(--red, #e64a19); font-weight: bold; }
    #resultMsg.good { color: var(--green, #2e7d32); }

    /* ========== 转场遮罩（全站统一样式） ========== */
    .overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999999;
        display: flex; align-items: center; justify-content: center;
        background: rgba(8, 10, 25, .72); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
        opacity: 0; visibility: hidden; transition: opacity .4s ease, visibility .4s ease; pointer-events: none;
    }
    .overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }
    .loader-wrap { position: relative; width: 180px; height: 180px; display: flex; align-items: center; justify-content: center; }
    .loader-ring {
        position: absolute; width: 100%; height: 100%; border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, .1); border-top-color: #f6d365; border-right-color: #fda085;
        animation: ringSpin .8s linear infinite;
    }
    .loader-ring::before {
        content: ''; position: absolute; top: 12px; left: 12px; right: 12px; bottom: 12px; border-radius: 50%;
        border: 2px solid transparent; border-bottom-color: #a78bfa; border-left-color: #667eea;
        animation: ringSpin 1.4s linear infinite reverse;
    }
    .loader-ring::after {
        content: ''; position: absolute; top: 28px; left: 28px; right: 28px; bottom: 28px; border-radius: 50%;
        border: 1px solid transparent; border-top-color: #fb7185; border-right-color: #2dd4bf;
        animation: ringSpin 2s linear infinite;
    }
    .loader-text {
        position: relative; z-index: 5; font-size: 24px; font-weight: 900; letter-spacing: 4px;
        background: linear-gradient(90deg, #f6d365, #fda085, #f6d365); background-size: 200% 100%;
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        animation: textShine 1.5s linear infinite;
    }
    @keyframes ringSpin { to { transform: rotate(360deg); } }
    @keyframes textShine { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
    @media (max-width: 900px) {
        .container { width: 95%; padding: 12px; }
        .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .title-area, .back-area { grid-column: 1 / -1; min-height: 80px; }
        .title-area h2 { font-size: 28px; }
        .back-area { font-size: 16px; }
        .orb { display: none; }
    }
    @media (max-width: 768px) {
        main { padding: 40px 12px 30px; }
        .container { width: 94%; max-width: 94vw; padding: 14px; }
        .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .title-area, .back-area { grid-column: 1 / -1; min-height: 70px; }
        .title-area h2 { font-size: 24px; }
        .stat { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 480px) {
        .container { width: 96%; padding: 10px; }
        .grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .title-area h2 { font-size: 20px; letter-spacing: 2px; }
        .back-area { font-size: 15px; }
    }
</style>

<body>
<div class="bg-animation">
    <div class="bg-flow-1"></div>
    <div class="bg-flow-2"></div>
    <div class="bg-flow-3"></div>
</div>

<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<main>
<div class="container">
    <div class="grid">
        <div class="title-area"><h2>打字速度测试</h2><p>⌨️ 测手速 · 刷等级 · 晒成绩</p></div>
        <a href="娱乐游戏.html" class="back-area" id="backHome"><span style="font-size:28px;">🏠</span>返回主页</a>

        <!-- 每日挑战 -->
        <div class="card daily-card" id="dailyCard">
            <div class="daily-head">
                <span class="daily-tag" id="dailyTag">🔥 今日挑战</span>
                <span class="daily-status" id="dailyStatus"></span>
                <button class="btn btn-secondary" id="dailyUseBtn" style="margin-left:auto;">练这句</button>
            </div>
            <div class="daily-sentence" id="dailySentence"></div>
        </div>

        <!-- 主测试卡 -->
        <div class="card">
            <div class="card-title">⌨️ 打字速度测试</div>
            <div class="mode-tabs" id="modeTabs">
                <button class="mode-tab active" data-mode="free">✍️ 自由模式</button>
                <button class="mode-tab" data-mode="time">⏱ 限时 60 秒</button>
                <button class="mode-tab" data-mode="long">📜 长文段落</button>
            </div>
            <div class="opt-row" id="optRow">
                <select id="diffSel" title="难度">
                    <option value="easy">难度：简单</option>
                    <option value="mid" selected>难度：中等</option>
                    <option value="hard">难度：困难</option>
                </select>
                <select id="srcSel" title="句子来源">
                    <option value="cn">来源：中文名句</option>
                    <option value="en">来源：英文句子</option>
                </select>
                <label><input type="checkbox" id="soundChk" checked> 🔊 音效</label>
            </div>
            <div id="targetText"></div>
            <div class="row">
                <input id="typeInput" type="text" placeholder="点击「开始」后在这里打字，回车提交" autocomplete="off" disabled>
            </div>
            <div class="row">
                <button id="startBtn" class="btn">▶ 开始</button>
                <button id="doneBtn" class="btn btn-secondary" disabled>🏁 完成</button>
                <button id="resetBtn" class="btn btn-secondary">↺ 换句</button>
                <button id="shareBtn" class="btn btn-secondary" disabled>📤 分享成绩</button>
            </div>
            <div class="stat">
                <div><b id="speedVal">0</b><span>字/分钟</span></div>
                <div><b id="accVal">0%</b><span>准确率</span></div>
                <div><b id="timeVal">0s</b><span>用时</span></div>
                <div><b id="leftVal">—</b><span id="leftLabel">剩余</span></div>
            </div>
            <div class="rank-row">
                <span class="rank-badge" id="rankBadge" style="background:linear-gradient(135deg,#9e9e9e,#616161);">青铜</span>
                <span class="rank-progress" id="rankProgress"></span>
                <span class="hint" id="bestLine" style="margin-left:auto;"></span>
            </div>
            <div id="resultMsg"></div>
            <div class="err-wrap" id="errWrap">
                <div style="font-size:13px;font-weight:700;color:var(--dim);">错字对照（前 10 个）：</div>
                <div class="err-list" id="errList"></div>
            </div>
        </div>

        <!-- 历史成绩卡 -->
        <div class="card">
            <div class="card-title">📈 历史成绩 · 最近 20 次</div>
            <div class="chart-wrap"><canvas id="histChart" width="1160" height="160"></canvas></div>
            <div class="records-list" id="recordsList"></div>
        </div>
    </div>
</div>
</main>
