<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>找乐子 - 优质工具箱</title>
<style>
/* ========== 基础重置 ========== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent; /* 【优化】移除触摸高亮 */
}

/* ========== 1. 流光溢彩动态背景（系列统一） ========== */
body {
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    font-family: "Microsoft YaHei", "微软雅黑", Arial, sans-serif;
    background: var(--bg)
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
}

@keyframes gradientBG {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* ========== 背景漂浮光球 ========== */
.bg-orb {
    position: absolute;
    border-radius: 50%;
    background: color-mix(in srgb, var(--glow) 14%, transparent);
    filter: blur(2px);
    z-index: 1;
    animation: orbFloat 8s ease-in-out infinite;
}
.orb1 { width: 120px; height: 120px; top: 15%; left: 12%; }
.orb2 { width: 80px;  height: 80px;  bottom: 18%; right: 15%; animation-delay: -3s; }
.orb3 { width: 50px;  height: 50px;  top: 65%; left: 22%; animation-delay: -5s; }
@keyframes orbFloat {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-25px) scale(1.08); }
}

/* ========== 2. 居中 19:10 横长方形 ========== */
.stage-rect {
    width: min(92vw, 167.2vh);   /* 167.2vh ≈ 92vh × 19 ÷ 10 */
    aspect-ratio: 19 / 10;        /* 强制保持 19:10 比例 */
    background: var(--card);
    backdrop-filter: blur(10px);      /* 磨砂玻璃效果 */
    border-radius: 25px;              /* 大圆角 */
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    position: relative;
    overflow: hidden;                 /* 裁剪内容，保证线不出圆角 */
    z-index: 10;
    animation: cardEnter 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
}

    content: "";

    top: 0;
    left: 50%;
    transform: translateX(-50%);

    z-index: 5;
}

/* 卡片入场动画（上浮淡入） */
@keyframes cardEnter {
    from { opacity: 0; transform: translateY(40px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* ========== 3. 四宫格：2×2 均等划分 ========== */
.stage-grid {
    position: absolute;
    inset: 0;                         /* 铺满整个长方形 */
    display: grid;
    grid-template-columns: 1fr 1fr;   /* 左右两个等宽列 */
    grid-template-rows: 1fr 1fr;      /* 上下两个等高行 */
}

/* 每个小长方形单元格 */
.cell {
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background 0.3s ease;
    cursor: default;
    min-width: 0;                     /* 防止内容撑破格子 */
    min-height: 0;
}
/* 悬停时微微提亮 */
.cell:hover {
    background: color-mix(in srgb, var(--glow) 7%, transparent);
}

/* 每格独立的主题渐变色 + 入场延迟（错峰出现，更灵动） */
#cellTL { --g1: var(--glow); --g2: var(--gold-2); --d: 0.15s; }  /* 橙 → 粉 */
#cellTR { --g1: var(--blue); --g2: var(--green); --d: 0.35s; }  /* 蓝 → 绿 */
#cellBL { --g1: var(--gold-2); --g2: var(--purple); --d: 0.55s; }  /* 粉 → 紫 */
#cellBR { --g1: var(--gold); --g2: var(--gold-2); --d: 0.75s; }  /* 金 → 橙（呼应分割线） */

/* ========== 4. 艺术字占位："功能正在开发中 / 敬请期待~~" ========== */
.art-text {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(8px, 1.4vmin, 16px);
    text-align: center;
    user-select: none;
    opacity: 0;                       /* 初始隐藏，由入场动画带出 */
    animation: artIn 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    animation-delay: var(--d, 0s);    /* 四格错峰入场 */
}

/* 入场：上浮 + 缩放淡入 */
@keyframes artIn {
    from { opacity: 0; transform: translateY(18px) scale(0.94); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* 第一行：渐变流光艺术字 */
.art-line1 {
    font-size: clamp(20px, 3vmin, 32px);
    font-weight: bold;
    letter-spacing: clamp(2px, 0.5vmin, 5px);
    background: linear-gradient(90deg, var(--g1), var(--g2), var(--g1));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.12));
    animation: shineFlow 3.5s linear infinite,
               artBreath 3.2s ease-in-out infinite;
}

/* 中间小星光点缀 */
.art-spark {
    font-size: clamp(10px, 1.3vmin, 14px);
    color: var(--g2);
    letter-spacing: 8px;
    animation: sparkTwinkle 1.8s ease-in-out infinite;
}

/* 第二行：轻盈俏皮的辅助文字 */
.art-line2 {
    font-size: clamp(13px, 1.8vmin, 18px);
    font-weight: bold;
    letter-spacing: clamp(3px, 0.8vmin, 7px);
    color: var(--dim);                   /* 柔和灰紫 */
    animation: artBreath 3.2s ease-in-out infinite;
    animation-delay: 0.4s;            /* 与第一行错开呼吸节奏 */
}

/* 渐变流光：高光缓缓扫过文字 */
@keyframes shineFlow {
    to { background-position: 200% center; }
}

/* 呼吸式上下轻浮 */
@keyframes artBreath {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
}

/* 星光闪烁 */
@keyframes sparkTwinkle {
    0%, 100% { opacity: 0.25; transform: scale(0.9); }
    50%      { opacity: 0.9;  transform: scale(1.05); }
}

/* ========== 5. 四条鲜艳橙色分割线（不碰边框、不在中心相接） ========== */
.divider {
    position: absolute;
    background: var(--gold-2);              /* 鲜艳橙色 */
    border-radius: 3px;               /* 线头圆润 */
    pointer-events: none;             /* 不挡住格子的点击 */
    z-index: 4;
    animation: dividerGlow 3s ease-in-out infinite;  /* 光晕呼吸 */
}

/* 分割线光晕呼吸 */
@keyframes dividerGlow {
    0%, 100% { box-shadow: 0 0 6px color-mix(in srgb, var(--gold-2) 45%, transparent); }
    50%      { box-shadow: 0 0 14px color-mix(in srgb, var(--gold-2) 80%, transparent); }
}

/* ① 左侧横线：分割 左上 与 左下 */
.divider-left {
    height: 3px;
    top: 50%;
    left: 22px;
    right: calc(50% + 16px);
    transform: translateY(-50%);
}

/* ② 底部竖线：分割 左下 与 右下 */
.divider-bottom {
    width: 3px;
    left: 50%;
    top: calc(50% + 16px);
    bottom: 22px;
    transform: translateX(-50%);
}

/* ③ 右侧横线：分割 右下 与 右上 */
.divider-right {
    height: 3px;
    top: 50%;
    left: calc(50% + 16px);
    right: 22px;
    transform: translateY(-50%);
}

/* ④ 顶部竖线：分割 右上 与 左上 */
.divider-top {
    width: 3px;
    left: 50%;
    top: 22px;
    bottom: calc(50% + 16px);
    transform: translateX(-50%);
}

/* ========== 6. 背景左上角透明返回按钮 ========== */
.ghost-btn {
    position: fixed;
    z-index: 100;
    padding: 12px 26px;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 2px;
    text-decoration: none;
    color: var(--txt);
    background: transparent;
    border: 1.5px solid var(--line);
    border-radius: 50px;
    backdrop-filter: blur(2px);
    cursor: pointer;
    transition: all 0.3s ease;
    min-height: 44px;                 /* 【优化】确保触摸目标 ≥44px */
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
.ghost-btn:hover {
    color: var(--txt);
    background: color-mix(in srgb, var(--glow) 10%, transparent);
    border-color: var(--gold-2);
    box-shadow: 0 0 18px color-mix(in srgb, var(--glow) 30%, transparent);
    transform: translateY(-2px);
}
.ghost-btn:active { transform: scale(0.95); }

/* 左上角：返回按钮 */
#backBtn {
    top: 24px;
    left: 24px;
}

/* ========== 7. 转场遮罩层（系列统一"找乐子"转场） ========== */
#transitionMask {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 9999;
    display: none;
    justify-content: center;
    align-items: center;
    background: var(--bg)
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    /* 【优化】无障碍角色 */
    role: dialog;
    aria-modal: true;
}
#transitionMask.show {
    display: flex;
    animation: maskFadeIn 0.3s ease;
}
@keyframes maskFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 遮罩正中间的旋转小圆 */
.spinner-circle {
    width: 100px;
    height: 100px;
    border: 5px solid rgba(255, 255, 255, 0.35);
    border-top-color: #ffffff;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    animation: spinRotate 1.5s linear infinite;
}
.spinner-circle span {
    color: #fff;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
    animation: spinReverse 1.5s linear infinite;
}
@keyframes spinRotate  { to { transform: rotate(360deg); } }
@keyframes spinReverse { to { transform: rotate(-360deg); } }

/* ========== 【优化】移动端适配（不影响原布局） ========== */
@media (max-width: 600px) {
    .stage-rect {
        width: 94vw;
        aspect-ratio: 16 / 10; /* 小屏稍微调整比例，避免过大 */
