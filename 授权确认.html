<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找乐子 - 授权确认</title>
    <style>
        /* =========================================
           1. 全局重置与基础设置
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;

            /* 六主题适配：背景随主题（原霓虹流动渐变 + background-position 动画移除，触性能铁律） */
            background: var(--bg);
        }

        /* =========================================
           背景漂浮光球
           ========================================= */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            background: color-mix(in srgb, var(--glow) 14%, transparent);
            filter: blur(2px);
            z-index: 1;
            animation: orbFloat 8s ease-in-out infinite;
        }
        .orb1 { width: 120px; height: 120px; top: 15%; left: 12%; }
        .orb2 { width: 80px;  height: 80px;  bottom: 18%; right: 15%; animation-delay: -3s; }
        .orb3 { width: 50px;  height: 50px;  top: 65%; left: 22%; animation-delay: -5s; }
        @keyframes orbFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50%      { transform: translateY(-25px) scale(1.08); }
        }

        /* =========================================
           2. 左上角“返回”按钮 (独立于卡片)
           ========================================= */
        .back-button-container {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 100;
        }

        .back-link {
            text-decoration: none;
            color: var(--txt);
            font-size: 16px;
            font-weight: bold;
            padding: 10px 20px;
            border: 2px solid var(--line);
            border-radius: 30px;
            background-color: var(--card);
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .back-link:hover {
            background-color: var(--card-2);
            color: var(--glow);
            border-color: var(--gold-2);
            transform: translateX(-5px);
            box-shadow: 0 0 15px color-mix(in srgb, var(--glow) 30%, transparent);
        }

        /* =========================================
           3. 核心卡片容器 (白色方块)
           ========================================= */
        .card-container {
            background-color: var(--card);
            width: 420px;
            padding: 45px 40px 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
            position: relative;
            z-index: 10;
            border: 1px solid var(--line);
            animation: cardEnter 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            transition: box-shadow 0.3s ease;
        }
        .card-container:hover {
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.28);
        }

        /* 卡片入场动画 */
        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* 卡片顶部四色渐变装饰条 */
        .card-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 5px;
            border-radius: 0 0 10px 10px;
            background: linear-gradient(90deg, #ee7752, #e73c7e, #23a6d5, #23d5ab); /* 页系签名霓虹条（白名单） */
        }

        /* 标题样式 */
        .title-text {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 28px;
            letter-spacing: 3px;
            background: var(--back-grad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 2px 6px color-mix(in srgb, var(--green) 35%, transparent));
        }

        /* =========================================
           ★ 作者署名（新样式：楷体 + 香槟金渐变 + 金线点缀）★
           ========================================= */
        .author-section {
            margin-bottom: 35px;
            text-align: center;
        }

        .author-link {
            text-decoration: none;
            display: inline-block;
        }

        /* 署名主体：楷体衬线 + 香槟金渐变文字 */
        .author-name {
            display: block;
            font-family: "KaiTi", "STKaiti", "FangSong", "Microsoft YaHei", serif;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 4px;
            /* 香槟金渐变（background-size 加大，供悬停流光使用） */
            background: var(--title-grad);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            transition: background-position 0.8s ease, filter 0.3s ease;
        }

        /* 笔名小号衬字 */
        .author-alias {
            display: block;
            margin-top: 8px;
            font-family: "KaiTi", "STKaiti", "FangSong", "Microsoft YaHei", serif;
            font-size: 14px;
            letter-spacing: 3px;
            color: var(--dim); /* 柔和次要色（随主题） */
        }

        /* 两侧细金线 + 中间小菱形点缀 */
        .author-deco {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
        }
        .author-deco .line {
            width: 50px;
            height: 1px;
            background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--gold) 60%, transparent), transparent);
        }
        .author-deco .diamond {
            width: 7px;
            height: 7px;
            background: var(--gold);
            transform: rotate(45deg);
            opacity: 0.8;
        }

        /* 悬停：金光缓缓流转 + 轻柔光晕 */
        .author-link:hover .author-name {
            background-position: 200% center;
            filter: drop-shadow(0 0 6px color-mix(in srgb, var(--gold) 55%, transparent));
        }
        .author-link:hover .author-alias {
            color: var(--gold-2);
        }

        /* =========================================
           4. 协议勾选区域
           ========================================= */
        .agreement-section {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 32px;
            font-size: 14px;
            color: var(--txt);
            text-align: left;
            line-height: 1.5;
        }

        #agreeCheck {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            cursor: pointer;
            accent-color: var(--blue);
        }

        .agreement-section label {
            cursor: pointer;
            user-select: none;
        }

        .protocol-link {
            color: var(--blue);
            text-decoration: underline;
            margin-left: 5px;
        }

        /* =========================================
           5. “下一步”按钮逻辑样式 (关键部分)
           ========================================= */
        .next-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px 0;
            border-radius: 25px;
            text-align: center;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            min-height: 44px; /* 【修复】确保触摸目标不小于44x44 */

            background-color: color-mix(in srgb, var(--dim) 22%, transparent);
            color: var(--txt);
            opacity: 0.6;
            pointer-events: none;
            cursor: not-allowed;

            position: relative;
            overflow: hidden;
        }

        .next-btn.active {
            background-color: var(--glow);
            opacity: 1;
            pointer-events: auto;
            cursor: pointer;
            box-shadow: 0 5px 15px color-mix(in srgb, var(--glow) 40%, transparent);
        }

        .next-btn.active:hover {
            filter: brightness(.9);
            transform: translateY(-2px);
        }

        /* 激活按钮的流光扫过效果 */
        .next-btn.active::after {
            content: "";
            position: absolute;
            top: 0;
            left: -80%;
            width: 50%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.45), transparent);
            transform: skewX(-25deg);
            animation: btnShine 2.5s ease-in-out infinite;
        }
        @keyframes btnShine {
            0%        { left: -80%; }
            60%, 100% { left: 130%; }
        }

        /* =========================================
           6. 转场遮罩层样式（与 1.html / 2.html 一致）
           ========================================= */
        #transitionMask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            /* 六主题适配：遮罩随主题底色 */
            background: var(--bg);
        }
        #transitionMask.show {
            display: flex;
            animation: maskFadeIn 0.3s ease;
        }
        @keyframes maskFadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* 遮罩正中间的旋转小圆 */
        .spinner-circle {
            width: 100px;
            height: 100px;
            border: 5px solid color-mix(in srgb, var(--txt) 35%, transparent);
            border-top-color: var(--txt);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: spinRotate 1.5s linear infinite;
        }
        .spinner-circle span {
            color: var(--txt);
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            animation: spinReverse 1.5s linear infinite;
        }
        @keyframes spinRotate  { to { transform: rotate(360deg); } }
        @keyframes spinReverse { to { transform: rotate(-360deg); } }
    
        /* ========== 手机端响应式适配（通用） ========== */
        @media (max-width: 768px) {
            html, body {
                overflow-x: hidden;
                width: 100%;
            }
            main {
                padding: 70px 0 30px !important;
            }
            .container, .card-container, .wrapper, .box, .panel, .form-box {
                width: 94% !important;
                max-width: 94vw !important;
                padding: 14px !important;
                margin: 0 auto !important;
            }
            /* 6列/多列网格改3列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 8px !important;
                padding: 4px !important;
            }
            /* 大区域占满整行 */
            .title-area, .back-area, .display-area, .game-main,
            .calculator-area, .main-area, .content-area, .result-area,
            .input-area, .output-area, .board-area, .info-area, .settings-area {
                grid-column: 1 / -1 !important;
                grid-row: auto !important;
            }
            /* 左右分栏改上下堆叠 */
            .left-panel, .right-panel, .side-panel, .sidebar {
                flex: 1 1 100% !important;
                width: 100% !important;
                border-right: none !important;
                border-bottom: 1px solid var(--line) !important;
            }
            .display-area, .game-main, .calculator-area {
                flex-direction: column !important;
                padding: 12px !important;
            }
            .cell, .tool-cell, .grid-cell {
                padding: 10px 6px !important;
                min-height: 70px !important;
            }
            h1, h2, h3, .title-text, .author-name, .main-title {
                font-size: 22px !important;
                letter-spacing: 1px !important;
            }
            .btn, button, input, select, textarea {
                font-size: 14px !important;
                padding: 10px 14px !important;
            }
            .ghost-btn, .back-btn, .return-btn {
                padding: 8px 16px !important;
                font-size: 13px !important;
            }
            /* 隐藏非必要装饰元素 */
            .orb, .decoration, .deco-element, .floating-shape {
                display: none !important;
            }
        }
        @media (max-width: 480px) {
            .container, .card-container, .wrapper, .box {
                width: 96% !important;
                padding: 10px !important;
            }
            /* 小屏手机改2列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 6px !important;
            }
            h1, h2, h3, .title-text, .author-name {
                font-size: 18px !important;
            }
            .cell, .tool-cell {
                min-height: 80px !important;
                padding: 8px 4px !important;
            }
            .btn, button {
                font-size: 13px !important;
                padding: 8px 12px !important;
            }
        }

    /* ========== 返回主程序·小房子键（V2.5.3 全站统一，左下角浮动） ========== */
    .home-fab {
        position: fixed;
        top: 14px;
        right: 16px;
        z-index: 2147483647;
        width: 56px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        line-height: 1;
        color: #fff;
        text-decoration: none;
        background: linear-gradient(145deg, rgba(17, 153, 142, .94), rgba(10, 90, 84, .94));
        border: 2px solid rgba(255, 255, 255, .35);
        border-radius: 50%;
        box-shadow: 0 10px 28px rgba(0, 0, 0, .38), inset 0 1px 0 rgba(255, 255, 255, .25);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        transition: transform .3s, box-shadow .3s;
    }
    .home-fab:hover { transform: translateY(-4px) scale(1.06); box-shadow: 0 16px 36px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25); }
    .home-fab:active { transform: translateY(-1px) scale(.94); }

    /* ========== 返回主程序·转场遮罩（与39/36同款） ========== */
    .home-overlay {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(8, 10, 25, .72);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        opacity: 0;
        visibility: hidden;
        transition: opacity .4s ease, visibility .4s ease;
        pointer-events: none;
    }
    .home-overlay.show { opacity: 1; visibility: visible; pointer-events: auto; }
    .home-loader-wrap { position: relative; width: 170px; height: 170px; display: flex; align-items: center; justify-content: center; }
    .home-loader-ring {
        position: absolute; width: 100%; height: 100%; border-radius: 50%;
        border: 3px solid rgba(255,255,255,.1);
        border-top-color: #f6d365; border-right-color: #fda085;
        animation: homeRingSpin .8s linear infinite;
    }
    .home-loader-ring::before {
        content: ''; position: absolute; inset: 22px; border-radius: 50%;
        border: 3px solid rgba(255,255,255,.08);
        border-bottom-color: #5ee7df; border-left-color: #b490ca;
        animation: homeRingSpin 1.1s linear infinite reverse;
    }
    .home-loader-text { color: #fff; font-size: 19px; font-weight: 700; letter-spacing: 5px; }
    @keyframes homeRingSpin { to { transform: rotate(360deg); } }
</style>
