        canvas.art { width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--zl-border); background: var(--zl-card-2); display: block; }

        .art-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .preset-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-top: 10px; }
        .preset-item { border: 1px solid var(--zl-border); border-radius: 10px; padding: 10px 12px; cursor: pointer; text-align: center; background: var(--zl-card-2); transition: all .15s; }
        .preset-item:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.15); }
        .preset-item.active { border-color: var(--zl-accent); background: var(--zl-accent-soft, rgba(99,102,241,.12)); }
        .preset-item .em { font-size: 22px; }
        .preset-item .nm { font-size: 13px; font-weight: 700; color: var(--zl-text); margin-top: 4px; }
        .preset-item .ds { font-size: 11px; color: var(--zl-dim); margin-top: 2px; line-height: 1.5; }
        .hint { font-size: 12px; color: var(--zl-dim); margin-top: 8px; line-height: 1.8; }
    </style>

    <main class="cy-page">
        <div class="cy-card">
            <h2>🖼 创意画布</h2>
            <div class="sub">六种程序化生成算法，每点击一次「再画一张」都是独一无二的作品。颜色自动跟随当前主题。</div>

            </div>

            <div id="galleryRow" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px;"></div>
