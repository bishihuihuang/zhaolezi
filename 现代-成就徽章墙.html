    .ach-card b { display: block; font-size: 14.5px; color: var(--txt); }
    .ach-card span { font-size: 12px; color: var(--dim); display: block; margin-top: 4px; line-height: 1.5; }
    .ach-card .date { font-size: 11.5px; color: var(--green); margin-top: 6px; }
    .ach-card.locked .date { color: var(--dim); }
