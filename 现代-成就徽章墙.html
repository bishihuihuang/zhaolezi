    .ach-summary { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 16px 0 20px; }

    .ach-sum-text b { font-size: 17px; color: var(--blue); }
    .ach-sum-text span { font-size: 13px; color: var(--dim); display: block; }
    .ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
    .ach-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 14px; text-align: center; transition: transform .15s ease, box-shadow .15s ease; }
    .ach-card.locked { opacity: .55; filter: grayscale(.85); }
    .ach-card .ico { font-size: 30px; display: block; margin-bottom: 6px; }
    .ach-card b { display: block; font-size: 14.5px; color: var(--txt); }
    .ach-card span { font-size: 12px; color: var(--dim); display: block; margin-top: 4px; line-height: 1.5; }
    .ach-card .date { font-size: 11.5px; color: var(--green); margin-top: 6px; }
    .ach-card.locked .date { color: var(--dim); }
    .ach-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0, 0, 0, .12); }
