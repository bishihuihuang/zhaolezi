        <h1 class="lesson-title">🧪 提示词实验室</h1>
        <p class="lesson-sub">模块E · 第 4 课 | 组装式提示词生成器</p>

        <div class="callout info">
            <b>怎么玩</b>
            选一个场景，填好<strong>角色 / 任务 / 上下文 / 格式</strong>四块积木，点「生成提示词」，把成品复制到任何 AI 对话框使用。参考 E2 的五要素，越具体效果越好。
        </div>

        <div id="lab">
            <div class="lab-card">
                <div class="lab-field">
                    <label>① 场景模板（选一个，自动填好角色）</label>
                    <select id="sceneSel">
                        <option value="learn">学习提问：把概念讲明白</option>
                        <option value="write">写文章：按受众产出</option>
                        <option value="polish">改稿：保留原意改风格</option>
                        <option value="plan">做计划：表格化任务安排</option>
                        <option value="debug">代码排错：报错秒懂</option>
                        <option value="custom">自定义：从零组装</option>
                    </select>
                </div>
                <div class="lab-field">
                    <label>② 角色（AI 以什么身份回答你）</label>
                    <input id="roleIn" type="text" placeholder="例：一位耐心的初中数学老师">
                    <div class="role-chips" id="roleChips">
                        <span class="chip">耐心的老师</span>
                        <span class="chip">资深编辑</span>
                        <span class="chip">求职辅导师</span>
                        <span class="chip">健身教练</span>
                        <span class="chip">Python 导师</span>
                        <span class="chip">产品经理</span>
                    </div>
                </div>
                <div class="lab-field">
                    <label>③ 任务（要 AI 做什么？带上约束）</label>
                    <input id="taskIn" type="text" placeholder="例：用 200 字以内的通俗语言解释「量子纠缠」，并给 1 个生活例子">
                    <div class="lab-hint">动词开头 + 字数/条数/风格等约束，效果最好。</div>
                </div>
                <div class="lab-field">
                    <label>④ 上下文（给 AI 喂背景 / 原材料）</label>
                    <textarea id="ctxIn" rows="3" placeholder="例：我是零基础的初中生；目标读者是 55 岁阿姨；粘贴你的原稿…"></textarea>
                </div>
                <div class="lab-field">
                    <label>⑤ 格式（输出长什么样）</label>
                    <select id="fmtSel">
                        <option value="分点列出">分点列出，每点不超过 20 字</option>
                        <option value="表格">用 Markdown 表格输出</option>
                        <option value="段落">连贯段落，不用编号</option>
                        <option value="代码">只输出代码，不加解释</option>
                        <option value="自由">自由发挥</option>
                    </select>
                </div>
                <div class="lab-row">
                    <button class="btn" id="genBtn">⚡ 生成提示词</button>
                    <button class="btn btn-secondary" id="copyBtn">📋 复制成品</button>
                </div>
                <div class="lab-field" style="margin-top:14px;">
                    <label>生成的提示词</label>
                    <textarea id="labOut" readonly placeholder="点「生成提示词」后，成品会出现在这里…"></textarea>
                </div>
                <div class="lab-preview" id="labNote"></div>
            </div>
        </div>

        <div class="lesson-footer" style="margin-top:24px;padding-top:14px;border-top:1px solid var(--line);color:var(--dim);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
