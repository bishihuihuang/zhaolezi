<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找乐子</title>
<style>
/* ========== 基础重置 ========== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* ========== 1. 流光溢彩动态背景（系列统一） ========== */
body {
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    font-family: "Microsoft YaHei", "微软雅黑", Arial, sans-serif;
    background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
}

@keyframes gradientBG {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* ========== 背景漂浮光球 ========== */
.bg-orb {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    filter: blur(2px);
    z-index: 1;
    animation: orbFloat 8s ease-in-out infinite;
}
.orb1 { width: 120px; height: 120px; top: 15%; left: 12%; }
.orb2 { width: 80px;  height: 80px;  bottom: 18%; right: 15%; animation-delay: -3s; }
.orb3 { width: 50px;  height: 50px;  top: 65%; left: 22%; animation-delay: -5s; }
@keyframes orbFloat {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-25px) scale(1.08); }
}

/* ========== 2. 居中 19:10 横长方形 ========== */
.stage-rect {
    width: min(92vw, 167.2vh);   /* 167.2vh ≈ 92vh × 19 ÷ 10 */
    aspect-ratio: 19 / 10;        /* 强制保持 19:10 比例 */
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(10px);      /* 磨砂玻璃效果 */
    border-radius: 25px;              /* 大圆角 */
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    position: relative;
    overflow: hidden;                 /* 裁剪内容，保证线不出圆角 */
    z-index: 10;
    animation: cardEnter 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
}

/* 顶部四色渐变装饰条（与系列一致） */
.stage-rect::before {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 40%;
    height: 5px;
    border-radius: 0 0 10px 10px;
    background: linear-gradient(90deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
    z-index: 5;
}

/* 卡片入场动画（上浮淡入） */
@keyframes cardEnter {
    from { opacity: 0; transform: translateY(40px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* ========== 3. 四宫格：2×2 均等划分 ========== */
.stage-grid {
    position: absolute;
    inset: 0;                         /* 铺满整个长方形 */
    display: grid;
    grid-template-columns: 1fr 1fr;   /* 左右两个等宽列 */
    grid-template-rows: 1fr 1fr;      /* 上下两个等高行 */
}

/* 每个小长方形单元格 */
.cell {
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 16px;
    color: #999;
    transition: background 0.3s ease;
    cursor: default;
    min-width: 0;                     /* 防止内容撑破格子 */
    min-height: 0;
}
/* 悬停时微微提亮，增加精致感 */
.cell:hover {
    background: rgba(255, 255, 255, 0.45);
}

/* ========== 4. 三条同款媒体框：16:9，三格大小一致 ========== */
.media-box {
    width: 84%;                       /* 占格子宽度的 84%，"小的"框 */
    aspect-ratio: 16 / 9;             /* 强制 16:9 比例 */
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    overflow: hidden;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* 视频 / 图片铺满播放框 */
.media-box video,
.media-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;              /* 完整显示，不变形 */
    background: #000;
    display: block;
}

/* 文本框：内容自适应 + 超出可滚动 */
.text-content {
    width: 100%;
    height: 100%;
    padding: 14px 18px;
    overflow-y: auto;                 /* 文字太多时内部滚动 */
    color: #444;
    line-height: 1.8;
    text-align: justify;
    word-break: break-all;
    font-size: 18px;                  /* 默认字号，JS 会按文字多少自适应 */
}

/* 音频播放框 */
.audio-content {
    width: 100%;
    padding: 0 18px;
    display: flex;
    justify-content: center;
    align-items: center;
}
.audio-content audio {
    width: 100%;
}

/* 框内空状态提示（未抽取 / 池为空时显示） */
.empty-tip {
    font-size: 14px;
    color: #b5b5b5;
    text-align: center;
    line-height: 1.8;
    padding: 0 16px;
}

/* ========== 5. 右下格：三个橙边白底"输入框样式"按钮 ========== */
.br-column {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 14px;
    width: 84%;
}

.input-btn {
    width: 100%;
    padding: 11px 0;
    font-size: 16px;
    font-weight: bold;
    text-align: center;
    color: #e65100;
    background: #ffffff;              /* 白底 */
    border: 3px solid #FF9800;        /* 橙色边框 */
    border-radius: 50px;              /* 胶囊形，与 4.html 输入框同款 */
    cursor: pointer;
    user-select: none;
    transition: all 0.3s ease;
    min-height: 44px;                 /* 【修复】确保触摸目标 ≥44x44 */
    display: flex;
    align-items: center;
    justify-content: center;
}
.input-btn:hover {
    transform: scale(1.04);
    box-shadow: 0 4px 14px rgba(255, 152, 0, 0.4);
}
.input-btn:active {
    transform: scale(0.96);
}

/* 冷却中的禁用样式 */
.input-btn.disabled {
    background: #f0f0f0;
    border-color: #c8c8c8;
    color: #999;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
}

/* ========== 6. 四条鲜艳橙色分割线（不碰边框、不在中心相接） ========== */
.divider {
    position: absolute;
    background: #FF8C00;              /* 鲜艳橙色 */
    box-shadow: 0 0 8px rgba(255, 140, 0, 0.5); /* 橙色柔光，更醒目 */
    border-radius: 3px;               /* 线头圆润 */
    pointer-events: none;             /* 不挡住格子的点击 */
    z-index: 4;
}

/* ① 左侧横线：分割 左上 与 左下 */
.divider-left {
    height: 3px;
    top: 50%;
    left: 22px;
    right: calc(50% + 16px);
    transform: translateY(-50%);
}

/* ② 底部竖线：分割 左下 与 右下 */
.divider-bottom {
    width: 3px;
    left: 50%;
    top: calc(50% + 16px);
    bottom: 22px;
    transform: translateX(-50%);
}

/* ③ 右侧横线：分割 右下 与 右上 */
.divider-right {
    height: 3px;
    top: 50%;
    left: calc(50% + 16px);
    right: 22px;
    transform: translateY(-50%);
}

/* ④ 顶部竖线：分割 右上 与 左上 */
.divider-top {
    width: 3px;
    left: 50%;
    top: 22px;
    bottom: calc(50% + 16px);
    transform: translateX(-50%);
}

/* ========== 7. 背景上的透明按钮（提高不透明度，且确保不碰大长方形） ========== */
.ghost-btn {
    position: fixed;
    z-index: 100;
    padding: 12px 26px;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 2px;
    text-decoration: none;
    /* 提高不透明度：背景从0.18提升至0.35，文字从0.55提升至0.85，边框从0.35提升至0.7 */
    color: rgba(255, 255, 255, 0.85);
    background: rgba(255, 255, 255, 0.35);
    border: 1.5px solid rgba(255, 255, 255, 0.7);
    border-radius: 50px;
    backdrop-filter: blur(4px);
    cursor: pointer;
    transition: all 0.3s ease;
    min-height: 44px;                 /* 【优化】确保触摸目标 ≥44px */
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
.ghost-btn:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.5);
    border-color: rgba(255, 255, 255, 0.9);
    box-shadow: 0 0 18px rgba(255, 255, 255, 0.45);
    transform: translateY(-2px);
}
.ghost-btn:active { transform: scale(0.95); }

/* 左上角：返回按钮 */
#backBtn {
    top: 24px;
    left: 24px;
}

/* 右上角：返回主程序按钮 */
#backMain {
    top: 24px;
    right: 24px;
}

/* 右下角：高级按钮 */
#advancedBtn {
    bottom: 24px;
    right: 24px;
}

/* ========== 8. 保存乐子弹窗 ========== */
.save-mask {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(4px);
    z-index: 9000;
    display: none;                    /* 默认隐藏，点击"保存乐子"后显示 */
    justify-content: center;
    align-items: center;
}
.save-mask.show {
    display: flex;
    animation: maskFadeIn 0.3s ease;
}

/* 弹窗卡片（玻璃拟态） */
.save-card {
    width: min(90vw, 440px);
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(12px);
    border-radius: 22px;
    padding: 26px 26px 22px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    animation: cardEnter 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.save-title {
    font-size: 22px;
    font-weight: bold;
    color: #333;
    text-align: center;
    letter-spacing: 2px;
}
.save-sub {
    font-size: 13px;
    color: #999;
    text-align: center;
    margin-top: 8px;
}

/* 三项保存项列表 */
.save-list {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.save-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff;
    border: 2.5px solid #FF9800;      /* 橙色边框，与按钮呼应 */
    border-radius: 16px;
    padding: 12px 14px;
    transition: all 0.3s ease;
}
.save-item:hover {
    box-shadow: 0 4px 14px rgba(255, 152, 0, 0.3);
}
/* 无内容时的禁用外观 */
.save-item.disabled {
    border-color: #ddd;
    background: #f7f7f7;
}

.save-item-icon { font-size: 24px; }
.save-item-info { flex: 1; min-width: 0; }
.save-item-name { font-size: 15px; font-weight: bold; color: #e65100; }
.save-item.disabled .save-item-name { color: #999; }
.save-item-file {
    font-size: 12px;
    color: #888;
    margin-top: 3px;
    word-break: break-all;
}

/* 单项保存按钮（黄色胶囊，与 4.html 确定按钮呼应） */
.save-item-btn {
    padding: 8px 20px;
    border-radius: 50px;
    font-size: 14px;
    font-weight: bold;
    background: linear-gradient(to right, #FFC107, #FFEB3B);
    color: #7a5c00;
    cursor: pointer;
    transition: all 0.3s ease;
    white-space: nowrap;
    box-shadow: 0 4px 10px rgba(255, 193, 7, 0.35);
    min-height: 44px;                 /* 【优化】确保触摸目标 ≥44px */
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
.save-item-btn:hover { transform: scale(1.06); }
.save-item.disabled .save-item-btn {
    background: #e0e0e0;
    color: #aaa;
    cursor: not-allowed;
    box-shadow: none;
}

/* 弹窗关闭按钮 */
.save-close {
    margin-top: 18px;
    text-align: center;
    padding: 11px 0;
    border-radius: 50px;
    border: 2.5px solid #FF9800;
    color: #e65100;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    min-height: 44px;                 /* 【优化】确保触摸目标 ≥44px */
    display: flex;
    align-items: center;
    justify-content: center;
}
.save-close:hover {
    background: #FF9800;
    color: #fff;
}

/* ========== 9. 保存成功提示气泡 ========== */
#toast {
    position: fixed;
    top: 18%;
    left: 50%;
    transform: translateX(-50%) translateY(-10px);
    background: rgba(46, 204, 113, 0.92);
    color: #fff;
    font-weight: bold;
    padding: 12px 26px;
    border-radius: 50px;
    font-size: 15px;
    letter-spacing: 1px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 9500;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
}
#toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* ========== 10. 转场遮罩层（index.html 通用圆环样式） ========== */
#transitionMask {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 9999;
    display: none;
    justify-content: center;
    align-items: center;
    background: rgba(8, 10, 25, 0.72);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
}
#transitionMask.show {
    display: flex;
    animation: maskFadeIn 0.3s ease;
}
@keyframes maskFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* 转圈动画结构 */
.loader-wrap {
    position: relative;
    width: 180px;
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.loader-ring {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, .1);
    border-top-color: #f6d365;
    border-right-color: #fda085;
    animation: ringSpin .8s linear infinite;
    box-sizing: border-box;
}
.loader-ring::before {
    content: '';
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    bottom: 12px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-bottom-color: #a78bfa;
    border-left-color: #667eea;
    animation: ringSpin 1.4s linear infinite reverse;
}
.loader-ring::after {
    content: '';
    position: absolute;
    top: 28px;
    left: 28px;
    right: 28px;
    bottom: 28px;
    border-radius: 50%;
    border: 1px solid transparent;
    border-top-color: #fb7185;
    border-right-color: #2dd4bf;
    animation: ringSpin 2s linear infinite;
}
.loader-text {
    position: relative;
    z-index: 5;
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #f6d365, #fda085, #f6d365);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: textShine 1.5s linear infinite;
}
@keyframes ringSpin {
    to { transform: rotate(360deg); }
}
@keyframes textShine {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
}

/* 移动端适配 */
@media (max-width: 480px) {
    .ghost-btn { padding: 8px 16px; font-size: 13px; }
    #backBtn { top: 16px; left: 16px; }
    #backMain { top: 16px; right: 16px; }
    #advancedBtn { bottom: 16px; right: 16px; }
}

        /* ========== 手机端响应式适配（通用） ========== */
        @media (max-width: 768px) {
            html, body {
                overflow-x: hidden;
                width: 100%;
            }
            main {
                padding: 70px 0 30px !important;
            }

                width: 94% !important;
                max-width: 94vw !important;
                padding: 14px !important;

            }
            /* 6列/多列网格改3列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {

                padding: 4px !important;

            .left-panel, .right-panel, .side-panel, .sidebar {

            h1, h2, h3, .title-text, .author-name, .main-title {

        }
        @media (max-width: 480px) {

            /* 小屏手机改2列 */

            }
            .cell, .tool-cell {
                min-height: 80px !important;
                padding: 8px 4px !important;
            }
            .btn, button {
                font-size: 13px !important;
                padding: 8px 12px !important;
            }
        }

        /* ========== 手机端针对性修复：5.html影音娱乐单列布局（优化版） ========== */
@media (max-width: 768px) {

        height: auto !important;
        min-height: 100vh !important;

    }
    .input-btn {
