<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <title>在线词典 - 找乐子</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            min-height: 100vh;
            background: #0a0e27;
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }

        /* ========== 背景流光层（20秒无缝循环） ========== */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-flow-1 {
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: linear-gradient(125deg,
                    #0a0e27, #161a3d, #1f1652, #331d6e,
                    #1d1b4b, #0f122f, #241a54);
            background-size: 400% 400%;
            animation: flowGradient 20s ease-in-out infinite;
        }

        .bg-flow-2 {
            position: absolute;
            top: -60%;
            left: -40%;
            width: 220%;
            height: 220%;
            background: radial-gradient(ellipse at 30% 70%,
                    rgba(255, 140, 100, .35), transparent 50%),
                radial-gradient(ellipse at 65% 35%,
                    rgba(120, 180, 255, .3), transparent 45%),
                radial-gradient(ellipse at 80% 80%,
                    rgba(220, 130, 250, .25), transparent 40%);
            animation: flowDrift 20s ease-in-out infinite alternate;
        }

        .bg-flow-3 {
            position: absolute;
            top: -30%;
            left: -20%;
            width: 180%;
            height: 180%;
            background: radial-gradient(circle at 50% 50%,
                    rgba(255, 200, 130, .15), transparent 60%),
                radial-gradient(circle at 20% 80%,
                    rgba(80, 220, 200, .2), transparent 50%);
            animation: flowRotate 20s linear infinite;
        }

        @keyframes flowGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes flowDrift {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(3%, -4%) scale(1.05) rotate(5deg); }
            100% { transform: translate(-2%, 3%) scale(.97) rotate(-5deg); }
        }

        @keyframes flowRotate {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.08); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* 悬浮球 */
        .orb {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%,
                    rgba(255, 255, 255, .3),
                    rgba(255, 255, 255, .1) 50%,
                    transparent 70%);
            box-shadow: 0 0 60px rgba(255, 255, 255, .08),
                inset 0 0 30px rgba(255, 255, 255, .04);
            pointer-events: none;
            will-change: transform, opacity;
        }

        .orb-1 { width: 260px; height: 260px; top: 12%; left: 8%; animation: orbFloatA 18s ease-in-out infinite, orbSpin 40s linear infinite; }
        .orb-2 { width: 160px; height: 160px; top: 55%; left: 75%; animation: orbFloatB 22s ease-in-out infinite, orbSpin 55s linear infinite; }
        .orb-3 { width: 110px; height: 110px; top: 68%; left: 20%; animation: orbFloatA 16s ease-in-out infinite reverse, orbSpin 35s linear infinite; }
        .orb-4 { width: 220px; height: 220px; top: 28%; left: 60%; animation: orbFloatB 20s ease-in-out infinite reverse, orbSpin 50s linear infinite; }
        .orb-5 { width: 80px; height: 80px; top: 80%; left: 45%; animation: orbFloatA 14s ease-in-out infinite, orbSpin 30s linear infinite; }

        @keyframes orbFloatA {
            0% { transform: translate(0,0) scale(1); opacity:.6; }
            30% { transform: translate(18px,-22px) scale(1.04); opacity:.8; }
            60% { transform: translate(-12px,10px) scale(.96); opacity:.5; }
            100% { transform: translate(0,0) scale(1); opacity:.6; }
        }

        @keyframes orbFloatB {
            0% { transform: translate(0,0) scale(1); opacity:.5; }
            35% { transform: translate(-20px,12px) scale(1.06); opacity:.7; }
            70% { transform: translate(14px,-15px) scale(.94); opacity:.4; }
            100% { transform: translate(0,0) scale(1); opacity:.5; }
        }

        @keyframes orbSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ========== 主容器 ========== */
        main {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 60px 20px 40px;
        }

        .container {
            width: 80%;
            max-width: 1200px;
            background: rgba(245, 247, 255, .96);
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, .35),
                0 0 0 1px rgba(255, 255, 255, .3),
                inset 0 1px 0 rgba(255, 255, 255, .6);
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            padding: 20px;
            color: #333;
        }

        .container::-webkit-scrollbar { width: 10px; }
        .container::-webkit-scrollbar-track { background: rgba(0, 0, 0, .04); border-radius: 12px; }
        .container::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #667eea, #764ba2); border-radius: 12px; border: 2px solid rgba(255, 255, 255, .4); }

        /* ========== 网格布局 ========== */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(8, minmax(80px, auto));
            gap: 12px;
        }

        .title-area {
            grid-column: 1 / 5;
            grid-row: 1 / 3;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ff6b6b, #ffa500, #ffd700, #ff6b6b);
            background-size: 300% 300%;
            animation: titleGradient 6s ease infinite;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(255, 150, 50, .35),
                inset 0 1px 0 rgba(255, 255, 255, .2);
        }

        .title-area h2 {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, .3);
        }

        @keyframes titleGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .back-area {
            grid-column: 5 / 7;
            grid-row: 1 / 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(17, 153, 142, .4),
                inset 0 1px 0 rgba(255, 255, 255, .2);
            text-decoration: none;
            color: #fff;
            font-size: 22px;
            font-weight: 800;
            cursor: pointer;
            transition: transform .3s, box-shadow .3s;
            min-height: 80px;
            min-width: 44px;
        }

        .back-area:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 50px rgba(17, 153, 142, .5);
        }

        .back-area:active {
            transform: translateY(-2px) scale(.96);
        }

        /* ========== 词典功能区（3-8行） ========== */
        .dictionary-area {
            grid-column: 1 / 7;
            grid-row: 3 / 9;
            background: rgba(255, 255, 255, .85);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .search-box {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            max-width: 500px;
            padding: 12px 20px;
            border: 2px solid #d0d0e0;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
            transition: border-color .3s, box-shadow .3s;
            background: #fafafe;
            min-height: 44px;
        }

        .search-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, .15);
        }

        .search-btn {
            padding: 12px 28px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(102, 126, 234, .4);
            transition: transform .2s, box-shadow .2s;
            min-height: 44px;
            min-width: 44px;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, .5);
        }

        .search-btn:active {
            transform: scale(.95);
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 8px 18px;
            border: 2px solid #ddd;
            border-radius: 20px;
            background: #fff;
            color: #555;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
            min-height: 44px;
            min-width: 44px;
        }

        .tab-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: #fff;
        }

        .tab-btn:hover {
            border-color: #667eea;
        }

        .result-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
        }

        .result-card {
            background: #fff;
            border-radius: 12px;
            padding: 15px 20px;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .06);
            border-left: 4px solid #d4af37;
            transition: transform .2s, box-shadow .2s;
            outline: none;
        }

        .result-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, .1);
        }

        .result-card:focus-visible {
            box-shadow: 0 0 0 4px rgba(102, 126, 234, .4);
        }

        .result-card .word {
            font-size: 20px;
            font-weight: 800;
            color: #333;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .result-card .type-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            background: #e3f2fd;
            color: #1565c0;
        }

        .result-card .meaning {
            font-size: 15px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 4px;
        }

        .result-card .example {
            font-size: 14px;
            color: #999;
            font-style: italic;
        }

        .empty-state {
            text-align: center;
            color: #aaa;
            font-size: 16px;
            padding: 40px 0;
            font-style: italic;
        }

        /* ========== 转场遮罩 ========== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(8, 10, 25, .72);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            opacity: 0;
            visibility: hidden;
            transition: opacity .4s ease, visibility .4s ease;
            pointer-events: none;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .loader-wrap {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, .1);
            border-top-color: #f6d365;
            border-right-color: #fda085;
            animation: ringSpin .8s linear infinite;
        }

        .loader-ring::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-bottom-color: #a78bfa;
            border-left-color: #667eea;
            animation: ringSpin 1.4s linear infinite reverse;
        }

        .loader-ring::after {
            content: '';
            position: absolute;
            top: 28px;
            left: 28px;
            right: 28px;
            bottom: 28px;
            border-radius: 50%;
            border: 1px solid transparent;
            border-top-color: #fb7185;
            border-right-color: #2dd4bf;
            animation: ringSpin 2s linear infinite;
        }

        .loader-text {
            position: relative;
            z-index: 5;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #f6d365, #fda085, #f6d365);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textShine 1.5s linear infinite;
        }

        @keyframes ringSpin { to { transform: rotate(360deg); } }
        @keyframes textShine {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* ========== 响应式 ========== */
        @media (max-width: 900px) {
            .container { width: 95%; padding: 12px; }
            .grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: auto; }
            .title-area { grid-column: 1/3; grid-row: auto; min-height: 100px; }
            .back-area { grid-column: 1/3; grid-row: auto; min-height: 80px; }
            .dictionary-area { grid-column: 1/3; grid-row: auto; }
        }
        @media (max-width: 600px) {
            .filter-tabs { gap: 6px; }
            .tab-btn { padding: 6px 12px; font-size: 12px; min-height: 44px; }
            .search-box { gap: 8px; }
            .search-input { padding: 10px 16px; font-size: 14px; min-height: 44px; }
            .search-btn { padding: 10px 20px; font-size: 14px; min-height: 44px; }
            .result-card { padding: 12px 14px; }
            .result-card .word { font-size: 16px; }
            .result-card .meaning { font-size: 13px; }
            .result-card .example { font-size: 12px; }
        }
        @media (max-width: 480px) {
            .container { padding: 8px; }
            .title-area h2 { font-size: 24px; letter-spacing: 2px; }
            .back-area { font-size: 16px; }
            .dictionary-area { padding: 12px; gap: 12px; }
            .search-box { flex-direction: column; }
            .search-input { width: 100%; max-width: none; }
            .search-btn { width: 100%; }
            .filter-tabs { flex-wrap: wrap; }
            .tab-btn { flex: 1 1 calc(50% - 4px); text-align: center; }
        }
    </style>
</head>

                { word: "乐不思蜀", type: "idiom", meaning: "乐不思蜀：比喻乐而忘返", example: "他在国外玩得乐不思蜀。" },
                { word: "胸有成竹", type: "idiom", meaning: "胸有成竹：比喻做事之前已有通盘的考虑", example: "他胸有成竹地走进了考场。" },
                { word: "势如破竹", type: "idiom", meaning: "势如破竹：形容节节胜利，毫无阻碍", example: "我军势如破竹，节节胜利。" },
                { word: "请君入瓮", type: "idiom", meaning: "请君入瓮：比喻用某人整治别人的办法来整治他自己", example: "他想害人，却被人请君入瓮。" },
                { word: "闭门造车", type: "idiom", meaning: "闭门造车：比喻脱离实际，只凭主观办事", example: "不能闭门造车，要了解市场。" },
                { word: "朝三暮四", type: "idiom", meaning: "朝三暮四：比喻反复无常", example: "他朝三暮四，不可信任。" },
                { word: "朝秦暮楚", type: "idiom", meaning: "朝秦暮楚：比喻人没有原则，反复无常", example: "他朝秦暮楚，两面三刀。" },
                { word: "守口如瓶", type: "idiom", meaning: "守口如瓶：形容说话谨慎，严守秘密", example: "她守口如瓶，没有泄露任何信息。" },
                { word: "口若悬河", type: "idiom", meaning: "口若悬河：形容口才好，说话滔滔不绝", example: "他口若悬河，说服了所有人。" },
                { word: "心花怒放", type: "idiom", meaning: "心花怒放：形容内心高兴极了", example: "听到好消息，他心花怒放。" },
                { word: "心旷神怡", type: "idiom", meaning: "心旷神怡：形容心境开阔，精神愉快", example: "站在山顶，心旷神怡。" },
                { word: "心猿意马", type: "idiom", meaning: "心猿意马：形容心思不定，变化无常", example: "他心猿意马，无法集中注意力。" },
                { word: "画蛇添足2", type: "idiom", meaning: "画蛇添足：做多余的事", example: "再加一段就是画蛇添足了。" }
            ];

            // 当前分类过滤条件
            let currentType = 'all';

            // 搜索并渲染结果
            function searchAndRender() {
                const keyword = searchInput.value.trim().toLowerCase();
                let results = dictionary.filter(item => {
                    if (currentType !== 'all' && item.type !== currentType) return false;
                    if (keyword) {
                        return item.word.toLowerCase().includes(keyword) ||
                               item.meaning.toLowerCase().includes(keyword) ||
                               (item.example && item.example.toLowerCase().includes(keyword));
                    }
                    return true;
                });

                if (results.length === 0) {
                    resultList.innerHTML = '<div class="empty-state">没有找到相关词条</div>';
                    return;
                }

                let html = '';
                results.forEach(item => {
                    const typeNames = { word: '单词', idiom: '成语', xiehou: '歇后语' };
                    html += `
                        <div class="result-card" tabindex="0">
                            <div class="word">${item.word} <span class="type-tag">${typeNames[item.type]}</span></div>
                            <div class="meaning">${item.meaning}</div>
                            ${item.example ? `<div class="example">例句：${item.example}</div>` : ''}
                        </div>
                    `;
                });
                resultList.innerHTML = html;

                // 为结果卡片添加键盘支持
                const resultCards = resultList.querySelectorAll('.result-card');
                resultCards.forEach(card => {
                    card.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            this.classList.toggle('active');
                        }
                    });
                });
            }

            // 监听搜索按钮
            searchBtn.addEventListener('click', searchAndRender);

            // 监听输入框回车
            searchInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    searchAndRender();
                }
            });

            // 监听分类切换
            tabBtns.forEach(btn => {
                btn.addEventListener('click', function () {
                    tabBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentType = this.dataset.type;
                    searchAndRender();
                });
            });

            // 返回主页转场动画
            let isTransitioning = false;
            backHome.addEventListener('click', function (e) {
                e.preventDefault();
                if (isTransitioning) return;
                isTransitioning = true;
                overlay.classList.add('active');
                setTimeout(function () {
                    window.location.href = 'index.html';
                }, 1000);
            });

            // 初始显示全部词条
            searchAndRender();
        })();
    </script>
</body>
</html>
