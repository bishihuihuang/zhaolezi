<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找乐子——离线</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { min-height: 100vh; }
        body {
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            min-height: 100vh;
            background: var(--bg, #0a0e27);
            color: var(--txt, #e8ecf5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .icon {
            font-size: 72px;
            line-height: 1;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,.35));
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: .5px;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            line-height: 1.8;
            opacity: .8;
            max-width: 420px;
            margin-bottom: 26px;
        }
        .btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .btn {
            padding: 10px 22px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: transform .15s ease, opacity .15s ease;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:active { transform: translateY(0); }
        .btn.primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #ffffff;
            box-shadow: 0 6px 18px rgba(102,126,234,.35);
        }
        .btn.secondary {
            background: rgba(128,128,128,.15);
            color: var(--txt, #e8ecf5);
            border: 1px solid rgba(128,128,128,.32);
        }
        .status {
            margin-top: 18px;
            font-size: 12px;
            opacity: .55;
            min-height: 18px;
            color: var(--dim, #8b93a7);
        }
    </style>
<script>try{var _zt=localStorage.getItem("zl_theme");var _zok=["dark","blue","gold","light","milk","guofeng","snowsun","cyber","aurora","custom"];if(_zt&&_zok.indexOf(_zt)>=0){document.documentElement.setAttribute("data-theme",_zt);}}catch(e){}</script>

</head>
<body>
    <div class="icon">📡</div>
    <h1>当前处于离线状态</h1>
    <p>网络暂时不可用，您正在浏览的这张页面来自 Service Worker 缓存。<br>恢复网络后点击「重试」，或回到首页。</p>
    <div class="btns">
        <button id="retryBtn" class="btn primary" type="button">🔄 重试</button>
        <a href="./index.html" class="btn secondary">🏠 回到首页</a>
    </div>
    <div id="status" class="status"></div>
    <script>
        (function () {
            var status = document.getElementById('status');
            function sync() {
                status.textContent = (navigator.onLine ? '已检测到网络连接，即将重试…' : '网络仍不可用，请稍后再试');
            }
            document.getElementById('retryBtn').addEventListener('click', function () {
                sync();
                setTimeout(function () { location.reload(); }, 700);
            });
            window.addEventListener('online', sync);
            window.addEventListener('offline', sync);
            sync();
        })();
    </script>
</body>
