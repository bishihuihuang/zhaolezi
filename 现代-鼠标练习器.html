<main>
    <article class="lesson container">
        <h1 class="lesson-title">🖱️ 鼠标练习器</h1>
        <p class="lesson-sub">模块A · 第 6 课 | 单击、双击、右键、拖拽专项训练</p>

        <div class="callout info">
            <b>🎮 怎么练</b>
            选一个模式开始，屏幕会出现目标，按要求操作鼠标即可。每轮 10 个目标，完成后记录用时与失误。没有鼠标的平板用户，可以用手指点按代替单击、双击、拖拽；右键练习需要鼠标（触屏可长按代替）。
        </div>

        <div class="mode-row">
            <button class="btn green" data-mode="click">🖱 单击练习</button>
            <button class="btn" data-mode="dbl">👆 双击练习</button>
            <button class="btn" data-mode="rbtn">📌 右键练习</button>
            <button class="btn" data-mode="drag">↔ 拖拽练习</button>
            <button class="btn ghost" data-mode="mix">🎯 综合闯关</button>
        </div>

        <div class="stat-row" id="statRow">
            <div class="stat-cell"><b id="stRound">0/10</b><span>本轮进度</span></div>
            <div class="stat-cell"><b id="stTime">--</b><span>本轮用时</span></div>
            <div class="stat-cell"><b id="stMiss">0</b><span>本轮失误</span></div>
            <div class="stat-cell"><b id="stTotal">0</b><span>累计完成（总）</span></div>
            <div class="stat-cell"><b id="stBest">--</b><span>最好一轮用时</span></div>
        </div>

        <div class="trainer-panel">
            <div style="font-size:13px;color:var(--dim);">请完成下面的操作：</div>
            <div class="action-name" id="actionName">点击上方任一模式开始</div>
            <div class="state-msg" id="stateMsg">选好模式后，目标会出现</div>
            <div class="stage" id="stage">
                <div class="dropzone" id="dropzone">拖到这里<br>放 开</div>
            </div>
            <div class="done-box" id="doneBox"></div>
        </div>
