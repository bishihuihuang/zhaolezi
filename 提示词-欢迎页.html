<title>AI 提示词库</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:radial-gradient(ellipse 70% 45% at 50% -6%, rgba(255,107,107,.10), rgba(124,92,255,.08), transparent 72%), radial-gradient(ellipse 34% 28% at 14% 20%, rgba(255,107,107,.16), transparent 70%), radial-gradient(ellipse 30% 26% at 84% 16%, rgba(246,211,101,.18), transparent 70%), radial-gradient(ellipse 32% 26% at 78% 80%, rgba(56,239,125,.13), transparent 70%), radial-gradient(ellipse 36% 28% at 16% 78%, rgba(124,92,255,.15), transparent 70%), #f6f7fd;
  display:flex;align-items:center;justify-content:center;
  font-family:"Segoe UI","Microsoft YaHei",sans-serif;
  color:#23263a;-webkit-font-smoothing:antialiased;
}
#stars{position:fixed;inset:0;z-index:0}
.wrap{position:relative;z-index:1;text-align:center;transform:translateY(-5vh);padding:0 20px}
.logo{
  width:86px;height:86px;margin:0 auto 28px;border-radius:24px;
  background:linear-gradient(135deg,#fbe08b 0%,#f6c453 40%,#d99a2b 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:44px;box-shadow:0 16px 46px rgba(240,170,60,.38),inset 0 1px 0 rgba(255,255,255,.4);
  animation:logoIn .95s cubic-bezier(.2,1.5,.4,1) both;
}
@keyframes logoIn{0%{transform:scale(.35) rotate(-14deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.title{
  font-size:34px;font-weight:700;letter-spacing:7px;
  background:linear-gradient(90deg,#ff6b6b 0%,#f6d365 30%,#38ef7d 60%,#7c5cff 100%);
  background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:titleIn 1.05s .18s ease both,shimmer 3.4s 1.3s ease-in-out infinite;
}
@keyframes titleIn{0%{opacity:0;transform:translateY(24px);filter:blur(9px)}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes shimmer{0%,100%{background-position:0% 0}50%{background-position:-220% 0}}
.sub{
  margin-top:15px;font-size:13px;letter-spacing:3px;color:#6b7086;opacity:0;
  animation:fadeIn .9s .55s ease both;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bar-wrap{
  margin:38px auto 0;width:210px;height:3px;border-radius:2px;
  background:rgba(110,110,180,.18);overflow:hidden;
}
.bar{
  height:100%;width:100%;border-radius:2px;
  background:linear-gradient(90deg,#f6d365,#e0b13c);
  transform:scaleX(0);transform-origin:left;
  animation:load 1.65s .6s cubic-bezier(.65,0,.35,1) forwards;
}
@keyframes load{to{transform:scaleX(1)}}
.hint{margin-top:20px;font-size:11px;color:#8a8fa3;letter-spacing:2px;opacity:0;animation:fadeIn .8s 1.1s ease both}
.dot{display:inline-block;animation:blink 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.18s}.dot:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.15}30%{opacity:1}}
@media (max-width:480px){
  .title{font-size:26px;letter-spacing:5px}
  .logo{width:70px;height:70px;font-size:36px}
  .sub{font-size:11px;letter-spacing:2px}
}
</style>
