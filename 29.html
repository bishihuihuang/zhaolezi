<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 修复问题 5：添加 favicon -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
<title>找乐子——反馈渠道</title>
<style>
    *,
    *::before,
    *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body {
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        min-height: 100vh;
        background: #0a0e27;
        color: #fff;
        overflow-x: hidden;
        position: relative;
    }
    /* 背景流光层（20秒无缝循环） */
    .bg-animation {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
    }
    .bg-flow-1 {
        position: absolute;
        top: -100%;
        left: -100%;
        width: 300%;
        height: 300%;
        background: linear-gradient(125deg, #0a0e27, #161a3d, #1f1652, #331d6e, #1d1b4b, #0f122f, #241a54);
        background-size: 400% 400%;
        animation: flowGradient 20s ease-in-out infinite;
        will-change: background-position;
    }
    .bg-flow-2 {
        position: absolute;
        top: -60%;
        left: -40%;
        width: 220%;
        height: 220%;
        background: radial-gradient(ellipse at 30% 70%, rgba(255,140,100,.35), transparent 50%),
            radial-gradient(ellipse at 65% 35%, rgba(120,180,255,.3), transparent 45%),
            radial-gradient(ellipse at 80% 80%, rgba(220,130,250,.25), transparent 40%);
        animation: flowDrift 20s ease-in-out infinite alternate;
        will-change: transform;
    }
    .bg-flow-3 {
        position: absolute;
        top: -30%;
        left: -20%;
        width: 180%;
        height: 180%;
        background: radial-gradient(circle at 50% 50%, rgba(255,200,130,.15), transparent 60%),
            radial-gradient(circle at 20% 80%, rgba(80,220,200,.2), transparent 50%);
        animation: flowRotate 20s linear infinite;
        will-change: transform;
    }
    @keyframes flowGradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    @keyframes flowDrift {
        0% { transform: translate(0, 0) scale(1) rotate(0deg); }
        50% { transform: translate(3%, -4%) scale(1.05) rotate(5deg); }
        100% { transform: translate(-2%, 3%) scale(.97) rotate(-5deg); }
    }
    @keyframes flowRotate {
        0% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(180deg) scale(1.08); }
        100% { transform: rotate(360deg) scale(1); }
    }
    /* 透明悬浮球 */
    .orb {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, rgba(255,255,255,.3), rgba(255,255,255,.1) 50%, transparent 70%);
        box-shadow: 0 0 60px rgba(255,255,255,.08), inset 0 0 30px rgba(255,255,255,.04);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        pointer-events: none;
        will-change: transform, opacity;
    }
    .orb-1 { width: 260px; height: 260px; top: 12%; left: 8%; animation: orbFloatA 18s ease-in-out infinite, orbSpin 40s linear infinite; }
    .orb-2 { width: 160px; height: 160px; top: 55%; left: 75%; animation: orbFloatB 22s ease-in-out infinite, orbSpin 55s linear infinite; }
    .orb-3 { width: 110px; height: 110px; top: 68%; left: 20%; animation: orbFloatA 16s ease-in-out infinite reverse, orbSpin 35s linear infinite; }
    .orb-4 { width: 220px; height: 220px; top: 28%; left: 60%; animation: orbFloatB 20s ease-in-out infinite reverse, orbSpin 50s linear infinite; }
    .orb-5 { width: 80px; height: 80px; top: 80%; left: 45%; animation: orbFloatA 14s ease-in-out infinite, orbSpin 30s linear infinite; }
    @keyframes orbFloatA {
        0% { transform: translate(0,0) scale(1); opacity:.6; }
        30% { transform: translate(18px,-22px) scale(1.04); opacity:.8; }
        60% { transform: translate(-12px,10px) scale(.96); opacity:.5; }
        100% { transform: translate(0,0) scale(1); opacity:.6; }
    }
    @keyframes orbFloatB {
        0% { transform: translate(0,0) scale(1); opacity:.5; }
        35% { transform: translate(-20px,12px) scale(1.06); opacity:.7; }
        70% { transform: translate(14px,-15px) scale(.94); opacity:.4; }
        100% { transform: translate(0,0) scale(1); opacity:.5; }
    }
    @keyframes orbSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    /* 主体布局 */
    main {
        position: relative;
        z-index: 10;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 60px 20px 40px;
    }
    .container {
        width: 80%;
        max-width: 1200px;
        background: rgba(245,247,255,.96);
        border-radius: 24px;
        box-shadow: 0 25px 70px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.3), inset 0 1px 0 rgba(255,255,255,.6);
        max-height: calc(100vh - 100px);
        overflow-y: auto;
        padding: 20px;
        color: #333;
    }
    .container::-webkit-scrollbar { width: 10px; }
    .container::-webkit-scrollbar-track { background: rgba(0,0,0,.04); border-radius: 12px; }
    .container::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #667eea, #764ba2); border-radius: 12px; border: 2px solid rgba(255,255,255,.4); }
    /* 网格布局（6列8行） */
    .grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        grid-template-rows: repeat(8, minmax(80px, auto));
        gap: 12px;
    }
    /* 标题区（前2行前4列） */
    .title-area {
        grid-column: 1 / 5;
        grid-row: 1 / 3;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #ff6b6b, #ffa500, #ffd700, #ff6b6b);
        background-size: 300% 300%;
        animation: titleGradient 6s ease infinite;
        border-radius: 20px;
        box-shadow: 0 12px 40px rgba(255,150,50,.35), inset 0 1px 0 rgba(255,255,255,.2);
    }
    .title-area h2 {
        font-size: 42px;
        font-weight: 900;
        letter-spacing: 4px;
        color: #fff;
        text-shadow: 2px 2px 10px rgba(0,0,0,.3);
    }
    @keyframes titleGradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    /* 返回主页（前2行5-6列） */
    .back-area {
        grid-column: 5 / 7;
        grid-row: 1 / 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #11998e, #38ef7d);
        border-radius: 20px;
        box-shadow: 0 12px 40px rgba(17,153,142,.4), inset 0 1px 0 rgba(255,255,255,.2);
        text-decoration: none;
        color: #fff;
        font-size: 22px;
        font-weight: 800;
        cursor: pointer;
        transition: transform .3s, box-shadow .3s;
    }
    .back-area:hover {
        transform: translateY(-5px);
        box-shadow: 0 18px 50px rgba(17,153,142,.5);
    }
    .back-area:active {
        transform: translateY(-2px) scale(.96);
    }
    /* 内容区：邮箱展示框（3行1列） */
    .email-display {
        grid-column: 1 / 2;
        grid-row: 3;
        background: linear-gradient(135deg, #f0f4ff, #fafbff);
        border: 2px solid #d0d0e0;
        border-radius: 12px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 16px;
        font-weight: 600;
        color: #333;
        box-shadow: 0 4px 12px rgba(0,0,0,.06);
        transition: all .3s;
    }
    .email-display:hover {
        box-shadow: 0 8px 20px rgba(0,0,0,.12);
        transform: translateY(-2px);
    }
    .email-display .label {
        margin: 0 0 5px 0;
    }
    .email-display .address {
        color: #667eea;
        font-size: 18px;
        font-weight: 800;
    }
    /* 内容区：邮箱操作框（3行2列） */
    .email-actions {
        grid-column: 2 / 3;
        grid-row: 3;
        background: linear-gradient(135deg, #f0f4ff, #fafbff);
        border: 2px solid #d0d0e0;
        border-radius: 12px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 4px 12px rgba(0,0,0,.06);
    }
    .email-actions .btn {
        width: 100%;
        padding: 8px 16px;
        border: none;
        border-radius: 20px;
        background: #667eea;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
        transition: all .2s;
    }
    .email-actions .btn:hover {
        transform: translateY(-2px);
        background: #764ba2;
    }
    .email-actions .btn:active {
        transform: scale(.95);
    }
    .email-actions .btn-secondary {
        background: linear-gradient(135deg, #f093fb, #f5576c);
    }
    .email-actions .btn-secondary:hover {
        background: #f5576c;
    }
    /* 文本展示框（4-8行1-2列）彩边纯白 */
    .text-display {
        grid-column: 1 / 3;
        grid-row: 4 / 9;
        background: #fff;
        border: 4px solid transparent;
        border-image: linear-gradient(45deg, #ff6b6b, #ffa500, #ffd700, #667eea, #764ba2) 1;
        border-radius: 12px;
        padding: 20px;
        overflow-y: auto;
        color: #000;
        font-size: 20px;
        font-weight: 700;
        line-height: 1.8;
        box-shadow: 0 6px 20px rgba(0,0,0,.1);
        transition: all .3s;
        text-align: left;
    }
    .text-display:hover {
        box-shadow: 0 12px 30px rgba(0,0,0,.15);
        transform: translateY(-2px);
    }
    .text-display p {
        margin: 0 0 8px 0;
    }
    .text-display .last-line {
        letter-spacing: -1px; /* 微缩左右距 */
        margin-bottom: 0;
    }
    /* 图片展示框（3-8行3-6列）占满剩余空间 */
    .image-display {
        grid-column: 3 / 7;
        grid-row: 3 / 9;
        background: #f8f9ff;
        border: 2px dashed #d0d0e0;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        box-shadow: 0 6px 20px rgba(0,0,0,.08);
        transition: all .3s;
        position: relative;
    }
    .image-display:hover {
        box-shadow: 0 12px 30px rgba(0,0,0,.12);
        border-color: #667eea;
    }
    .image-display img {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }
    /* 转场遮罩 */
    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(8,10,25,.72);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        opacity: 0;
        visibility: hidden;
        transition: opacity .4s ease, visibility .4s ease;
        pointer-events: none;
    }
    .overlay.active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }
    .loader-wrap {
        position: relative;
        width: 180px;
        height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .loader-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 3px solid rgba(255,255,255,.1);
        border-top-color: #f6d365;
        border-right-color: #fda085;
        animation: ringSpin .8s linear infinite;
    }
    .loader-ring::before {
        content: '';
        position: absolute;
        top: 12px;
        left: 12px;
        right: 12px;
        bottom: 12px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-bottom-color: #a78bfa;
        border-left-color: #667eea;
        animation: ringSpin 1.4s linear infinite reverse;
    }
    .loader-ring::after {
        content: '';
        position: absolute;
        top: 28px;
        left: 28px;
        right: 28px;
        bottom: 28px;
        border-radius: 50%;
        border: 1px solid transparent;
        border-top-color: #fb7185;
        border-right-color: #2dd4bf;
        animation: ringSpin 2s linear infinite;
    }
    .loader-text {
        position: relative;
        z-index: 5;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 4px;
        background: linear-gradient(90deg, #f6d365, #fda085, #f6d365);
        background-size: 200% 100%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: textShine 1.5s linear infinite;
    }
    @keyframes ringSpin { to { transform: rotate(360deg); } }
    @keyframes textShine {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
    }
    /* 响应式 */
    @media (max-width: 900px) {
        .container { width: 95%; padding: 12px; }
        .grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: auto; }
        .title-area { grid-column: 1/3; grid-row: auto; min-height: 100px; }
        .back-area { grid-column: 1/3; grid-row: auto; min-height: 80px; }
        .email-display { grid-column: 1/3; grid-row: auto; }
        .email-actions { grid-column: 1/3; grid-row: auto; }
        .text-display { grid-column: 1/3; grid-row: auto; min-height: 250px; }
        .image-display { grid-column: 1/3; grid-row: auto; min-height: 250px; }
    }
</style>
</head>
<body>
    <!-- 背景 -->
    <div class="bg-animation">
        <div class="bg-flow-1"></div>
        <div class="bg-flow-2"></div>
        <div class="bg-flow-3"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
        <div class="orb orb-5"></div>
    </div>

    <main>
        <div class="container">
            <div class="grid">
                <!-- 标题区 -->
                <div class="title-area">
                    <h2>找乐子——反馈渠道</h2>
                </div>
                <!-- 返回主页 -->
                <a href="index.html" class="back-area" id="backHome">
                    <span style="font-size:32px;">🏠</span>
                    返回主页
                </a>

                <!-- 邮箱展示框（3行1列） -->
                <div class="email-display">
                    <span class="label">网易邮箱地址：</span>
                    <span class="address" id="emailAddr">w550w550c@163.com</span>
                </div>

                <!-- 邮箱操作框（3行2列） -->
                <div class="email-actions">
                    <button class="btn" id="copyEmail">复制</button>
                    <button class="btn btn-secondary" id="gotoEmail" title="跳转网易邮箱官网">跳转</button>
                </div>

                <!-- 文本展示框（4-8行1-2列） -->
                <div class="text-display" id="textDisplay">
                    <p>找乐子官方会持续</p>
                    <p>优化此网页。</p>
                    <p>感谢您的浏览与使用，</p>
                    <p>欢迎您提出</p>
                    <p>您的方案与建议</p>
                    <p>如：您希望增加的功能，</p>
                    <p>本网站使用时的不足与漏洞。</p>
                    <p></p>
                    <p class="last-line">我们倾听您的声音！</p>
                </div>

                <!-- 图片展示框（3-8行3-6列，占满剩余空间） -->
                <div class="image-display" id="imageDisplay">
                    <!-- 修复问题 1：添加 alt 文本描述，并添加 onerror 回调防止图片缺失显示破损图标 -->
                    <img src="abhafvg.jpg" alt="反馈渠道图片" onerror="this.style.display='none'; this.parentElement.style.background='linear-gradient(135deg, #f0f4ff, #fafbff)'; this.parentElement.innerHTML='<p style=\'color:#667eea; font-weight:bold;\'>反馈图片暂不可用</p>';">
                </div>
            </div>
        </div>
    </main>

    <!-- 转场遮罩 -->
    <div class="overlay" id="overlay">
        <div class="loader-wrap">
            <div class="loader-ring"></div>
            <div class="loader-text">找乐子～</div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // 返回主页转场
            var backHome = document.getElementById('backHome');
            var overlay = document.getElementById('overlay');
            var isTransitioning = false;

            backHome.addEventListener('click', function(e) {
                e.preventDefault();
                if (isTransitioning) return;
                isTransitioning = true;
                overlay.classList.add('active');
                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 1000);
            });

            // Esc 关闭转场遮罩
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && overlay.classList.contains('active')) {
                    overlay.classList.remove('active');
                    isTransitioning = false;
                }
            });

            // 复制邮箱地址
            var copyEmailBtn = document.getElementById('copyEmail');
            copyEmailBtn.addEventListener('click', function() {
                var email = document.getElementById('emailAddr').textContent;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(email).then(function() {
                        alert('邮箱地址已复制！');
                    }).catch(function() {
                        fallbackCopy(email);
                    });
                } else {
                    fallbackCopy(email);
                }
            });

            function fallbackCopy(text) {
                var temp = document.createElement('textarea');
                temp.value = text;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                document.body.removeChild(temp);
                alert('邮箱地址已复制！');
            }

            // 跳转到网易邮箱官网
            var gotoEmailBtn = document.getElementById('gotoEmail');
            gotoEmailBtn.addEventListener('click', function() {
                window.location.href = 'https://mail.163.com';
            });

            // 预留后期接口：设置文本内容
            window.setFeedbackText = function(html) {
                var el = document.getElementById('textDisplay');
                if (el) el.innerHTML = html;
            };

            // 预留后期接口：设置图片
            window.setFeedbackImage = function(src) {
                var img = document.querySelector('.image-display img');
                if (img && src) img.src = src;
            };

            // 预留后期接口：清空图片
            window.clearFeedbackImage = function() {
                var img = document.querySelector('.image-display img');
                if (img) img.src = '';
            };

            // 预留后期接口：清空文本
            window.clearFeedbackText = function() {
                var el = document.getElementById('textDisplay');
                if (el) el.innerHTML = '';
            };
        })();
    </script>
</body>
</html>
