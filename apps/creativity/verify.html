<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全站自检｜创意引擎</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon-48.png">
    <link rel="canonical" href="https://your-name.github.io/creativity/verify.html">
    <style>
        .check-item { border: 1px solid var(--zl-border); border-radius: 10px; padding: 10px 14px; margin-top: 8px; display: flex; align-items: center; gap: 10px; }
        .check-item .ic { font-size: 18px; }
        .check-item .nm { flex: 1; font-size: 13px; color: var(--zl-text); }
        .check-item .st { font-size: 12px; font-weight: 700; }
        .st-ok { color: #16a34a; }
        .st-fail { color: #ef4444; }
        .st-run { color: var(--zl-accent); }
        .page-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px; margin-top: 10px; }
        .page-cell { border: 1px solid var(--zl-border); border-radius: 8px; padding: 8px; text-align: center; font-size: 12px; background: var(--zl-card-2); }
        .page-cell.ok { border-color: #16a34a; color: #16a34a; }
        .page-cell.fail { border-color: #ef4444; color: #ef4444; }
        .page-cell .pf { font-weight: 700; }
        .page-cell .pt { font-size: 10px; color: var(--zl-dim); margin-top: 2px; word-break: break-all; }
    </style>

    <link rel="stylesheet" href="common.css">
    <script src="theme-init.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="创意引擎">
    <meta name="description" content="创意引擎全站自检：存储、离线缓存、主题变量、页面可达性一键体检，生成诊断报告。">
    <link rel="stylesheet" href="common.css">
    <script defer src="common.js"></script>
    <script defer src="theme.js"></script>
    <script defer src="cy-features.js"></script>
</head>
<body>

    <div class="bg-animation">
        <div class="bg-flow-1"></div>
        <div class="bg-flow-2"></div>
        <div class="bg-flow-3"></div>
    </div>

    <header class="cy-shell">
        <h1>创意引擎 · 全站自检</h1>
    </header>

    <main class="cy-page">
        <div class="cy-card">
            <h2>🩺 自检报告</h2>
            <div class="sub">检测存储、离线缓存、主题系统与全部页面可达性。结果仅用于诊断，不影响任何数据。</div>
            <div class="cy-toolbar" style="margin-top:10px;">
                <button class="cy-btn" id="btnRun">🚀 开始自检</button>
                <button class="cy-btn cy-btn-ghost" id="btnReport">📄 导出报告</button>
            </div>
            <div id="checkBox" style="margin-top:6px;"></div>
        </div>

        <div class="cy-card">
            <h2>🗺 页面可达性</h2>
            <div id="pageGrid" class="page-grid"></div>
        </div>
    </main>

    <script>
    /* ========== 全站自检引擎 ========== */
    var results = []; // {name, ok, detail}
    var pageResults = [];

    function add(name, ok, detail) {
        results.push({ name: name, ok: ok, detail: detail || '' });
        renderChecks();
    }
    function renderChecks() {
        var box = document.getElementById('checkBox');
        box.innerHTML = '';
        results.forEach(function (result) {
            var itemDiv = document.createElement('div');
            itemDiv.className = 'check-item';
            itemDiv.innerHTML = '<span class="ic">' + (result.ok ? '✅' : '❌') + '</span><span class="nm">' + result.name + '</span>' +
                '<span class="st ' + (result.ok ? 'st-ok' : 'st-fail') + '">' + (result.ok ? '通过' : '异常') + '</span>';
            if (result.detail) {
                var det = document.createElement('div');
                det.style.cssText = 'width:100%;font-size:12px;color:var(--zl-dim);padding:2px 0 0 28px;line-height:1.6;';
                det.textContent = result.detail;
                itemDiv.appendChild(det);
            }
            box.appendChild(itemDiv);
        });
    }
    function renderPages() {
        var grid = document.getElementById('pageGrid');
        grid.innerHTML = '';
        pageResults.forEach(function (pageItem) {
            var itemDiv = document.createElement('div');
            itemDiv.className = 'page-cell ' + (pageItem.ok ? 'ok' : 'fail');
            itemDiv.innerHTML = '<div class="pf">' + (pageItem.ok ? '✓' : '✗') + ' ' + pageItem.f + '</div><div class="pt">' + (pageItem.title || '') + '</div>';
            grid.appendChild(itemDiv);
        });
    }

    /* 检测页面可达性：fetch 页面文本并检查 <title> 与关键词 */
    function checkPage(filePath, title, kw) {
        return fetch(filePath, { cache: 'no-cache' }).then(function (res) {
            if (!res.ok) { pageResults.push({ f: filePath, ok: false, title: 'HTTP ' + res.status }); return false; }
            return res.text().then(function (text) {
                var pageTitle = (text.match(/<title>([^<]*)<\/title>/) || [])[1] || '';
                var ok = pageTitle.indexOf(title) >= 0;
                pageResults.push({ f: filePath, ok: ok, title: ok ? pageTitle : '标题不匹配' });
                return ok;
            });
        }).catch(function () {
            pageResults.push({ f: filePath, ok: false, title: '网络错误' });
            return false;
        });
    }

    /* 专项检查拆开，run() 只负责重置与编排 */
    function checkLocalStorage() {
        try {
            var key = 'cy_verify_probe';
            localStorage.setItem(key, '1');
            localStorage.removeItem(key);
            add('本地存储 localStorage', true, '读写正常');
        } catch (err) {
            add('本地存储 localStorage', false, String(err));
        }
    }
    function checkThemeVariables() {
        try {
            var cssText = document.querySelector('link[href="common.css"]') ? 'common.css' : '检查不到';
            var themes = ['zhaolezi', 'blue', 'gold', 'light', 'snowsun', 'aurora'];
            var missing = [];
            themes.forEach(function (theme) {
                document.documentElement.setAttribute('data-theme', theme);
                var bgValue = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
                if (!bgValue) missing.push(theme);
            });
            document.documentElement.setAttribute('data-theme', localStorage.getItem('cy_theme') || 'zhaolezi');
            add('主题变量', missing.length === 0, missing.length ? '缺失主题：' + missing.join('、') : '6 个主题的 --bg 均可读取（via ' + cssText + '）');
        } catch (err) {
            add('主题变量', false, String(err));
        }
    }
    function checkServiceWorker() {
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistration().then(function (reg) {
                add('Service Worker 注册', !!reg, reg ? '已注册（' + (reg.active ? 'active' : 'pending/installing') + '）' : '未注册——部署到 HTTPS 或 localhost 后自动注册');
            }).catch(function (err) {
                add('Service Worker 注册', false, String(err));
            });
        } else {
            add('Service Worker 注册', false, '当前浏览器不支持');
        }
    }
    function checkGlobals() {
        var cyOk = typeof window.CY === 'object' && Array.isArray(window.CY.PAGES);
        add('全局库 CY.PAGES 数据源', cyOk, cyOk ? '包含 ' + window.CY.PAGES.length + ' 个页面' : 'cy-features.js 未加载');
        var achOk = typeof window.CY === 'object' && Array.isArray(window.CY.ACHIEVEMENTS);
        add('成就系统 CY.ACHIEVEMENTS', achOk, achOk ? '包含 ' + window.CY.ACHIEVEMENTS.length + ' 个成就' : '未加载');
    }
    function checkPageReach() {
        var pages = (typeof window.CY === 'object' && window.CY.PAGES) ? window.CY.PAGES : [];
        var all = [];
        pages.forEach(function (p) {
            all.push(checkPage(p.f, p.t.split('·')[1] ? p.t.split('·')[1] : p.t, p.k));
        });
        Promise.all(all).then(function (oks) {
            var failCount = oks.filter(function (isOk) { return !isOk; }).length;
            add('页面可达性 ' + pages.length + ' 个页面', failCount === 0, failCount ? failCount + ' 个页面异常，见下方网格' : '全部页面可访问且标题匹配');
            renderPages();
        });
    }

    function run() {
        results = [];
        pageResults = [];
        renderChecks();
        renderPages();
        checkLocalStorage();
        checkThemeVariables();
        checkServiceWorker();
        checkGlobals();
        checkPageReach();
    }

    /* 导出报告 */
    function exportReport() {
        var lines = ['# 创意引擎 · 全站自检报告', '', '时间：' + new Date().toLocaleString(), ''];
        lines.push('## 检测项', '');
        results.forEach(function (result) { lines.push('- [' + (result.ok ? 'x' : ' ') + '] ' + result.name + (result.detail ? '（' + result.detail + '）' : '')); });
        lines.push('', '## 页面可达性', '');
        pageResults.forEach(function (pageItem) { lines.push('- [' + (pageItem.ok ? 'x' : ' ') + '] ' + pageItem.f + ' —— ' + pageItem.title); });
        var text = lines.join('\n');
        try {
            navigator.clipboard.writeText(text).then(function () { CY.showToast('📄 报告已复制'); }).catch(function () { CY.download('verify-report.md', text, 'text/markdown'); });
        } catch (e) { CY.download('verify-report.md', text, 'text/markdown'); }
    }

    document.getElementById('btnRun').onclick = run;
    document.getElementById('btnReport').onclick = function () {
        if (!results.length) { CY.showToast('先点「🚀 开始自检」'); return; }
        exportReport();
    };

    run();
    </script>
</body>
</html>
