<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面走丢了｜创意引擎</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon-48.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="description" content="你要找的页面不存在，5 秒后返回创意引擎首页。">
    <!-- 404 页不参与权重：不带 canonical（会误导搜索引擎），改由 noindex 排除 -->
    <meta name="robots" content="noindex,follow">
    <script src="theme-init.js"></script>
    <style>
        html, body { height: 100%; margin: 0; }
        body {
            display: flex; align-items: center; justify-content: center;
            font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, sans-serif;
            background: #0a0e1f; color: #e7e9f4; text-align: center;
            overflow: hidden;
        }
        [data-theme="light"] body { background: #f6f7fb; color: #1b1e2c; }
        [data-theme="zhaolezi"] body { background: #f6f7fd; color: #23263a; }
        [data-theme="light"] .wrap { box-shadow: 0 20px 60px rgba(99,102,241,.12); }
        .wrap {
            position: relative; z-index: 2;
            max-width: 520px; padding: 56px 40px;
            background: rgba(255,255,255,.045);
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 22px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 24px 70px rgba(0,0,0,.45);
        }
        [data-theme="light"] .wrap { background: #fff; border-color: #eceef6; }
        .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .5; z-index: 1; pointer-events: none; }
        .orb.a { width: 340px; height: 340px; background: #6366f1; top: -120px; left: -100px; }
        .orb.b { width: 300px; height: 300px; background: #a855f7; bottom: -110px; right: -80px; }
        .orb.c { width: 240px; height: 240px; background: #22d3ee; bottom: 10%; left: 30%; opacity: .28; }
        .emoji { font-size: 68px; line-height: 1; margin-bottom: 18px; }
        .code {
            font-size: 84px; font-weight: 800; letter-spacing: -3px; margin: 0 0 6px;
            background: linear-gradient(120deg, #6366f1, #a855f7 55%, #22d3ee);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        h1 { font-size: 21px; font-weight: 700; margin: 0 0 12px; }
        p { font-size: 14.5px; line-height: 1.9; margin: 0 0 26px; opacity: .82; }
        a.go {
            display: inline-block; padding: 13px 30px; border-radius: 999px; text-decoration: none;
            font-size: 15px; font-weight: 700; color: #fff;
            background: linear-gradient(120deg, #6366f1, #a855f7);
            box-shadow: 0 10px 30px rgba(99,102,241,.45);
            transition: transform .18s ease, box-shadow .18s ease;
        }
        a.go:hover { transform: translateY(-2px); box-shadow: 0 16px 40px rgba(99,102,241,.55); }
        .tip { margin-top: 20px; font-size: 12px; opacity: .5; }
        .tip b { color: #22d3ee; opacity: 1; }
        .foot {
            position: fixed; bottom: 22px; left: 0; right: 0; text-align: center;
            font-size: 11.5px; opacity: .42; letter-spacing: .5px;
        }
        @media (max-width: 520px) {
            .wrap { padding: 44px 26px; margin: 0 16px; }
            .code { font-size: 68px; }
        }
    </style>
</head>
<body>
    <div class="orb a"></div>
    <div class="orb b"></div>
    <div class="orb c"></div>

    <div class="wrap">
        <div class="emoji">🔭</div>
        <div class="code">404</div>
        <h1>这片星际上没有你要的页面</h1>
        <p>它可能已经改名、搬走，或者从未被创造过。<br>别担心 —— 灵感引擎的 12 件工具箱全都还在原位。</p>
        <a class="go" href="index.html">✨ 回到首页</a>
        <div class="tip">本页将在 <b id="cnt">5</b> 秒后自动返回首页</div>
    </div>

    <div class="foot">创意引擎 · Muse</div>

    <script>
        (function () {
            var countdown = 5, el = document.getElementById('cnt');
            var intervalId = setInterval(function () {
                countdown--;
                if (el) el.textContent = countdown;
                if (countdown <= 0) { clearInterval(intervalId); location.replace('index.html'); }
            }, 1000);
        })();
    </script>
</body>
</html>
