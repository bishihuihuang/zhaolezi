<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵感记录本·想法速记｜创意引擎</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon-48.png">
    <link rel="canonical" href="https://your-name.github.io/creativity/9.html">
    <style>
        .tag-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 12px; background: var(--zl-card-2); border: 1px solid var(--zl-border); color: var(--zl-accent); cursor: pointer; }
        .tag-chip.on { background: var(--zl-accent); color: #fff; border-color: var(--zl-accent); }
        .note-item { border: 1px solid var(--zl-border); border-radius: 12px; padding: 12px 14px; margin-top: 10px; background: var(--zl-card-2); }
        .note-item .txt { font-size: 14px; color: var(--zl-text); line-height: 1.8; white-space: pre-wrap; word-break: break-word; }
        .note-item .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--zl-dim); }
        .note-item .tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .note-item .tags .t { padding: 1px 8px; border-radius: 10px; background: var(--zl-card-2); border: 1px solid var(--zl-border); color: var(--zl-accent); }
        .note-item .acts { display: flex; gap: 6px; }
        .fav-star { cursor: pointer; font-size: 16px; }
        .count-pill { font-size: 12px; color: var(--zl-dim); }
    </style>

    <link rel="stylesheet" href="common.css">
    <script src="theme-init.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="创意引擎">
    <meta name="description" content="灵感速记本：想法、标签、搜索、收藏一条龙；支持 JSON 导出备份与导入恢复，数据 100% 留在本地。">
    <link rel="stylesheet" href="common.css">
    <script defer src="common.js"></script>
    <script defer src="theme.js"></script>
    <script defer src="cy-features.js"></script>
</head>
<body>

    <div class="bg-animation">
        <div class="bg-flow-1"></div>
        <div class="bg-flow-2"></div>
        <div class="bg-flow-3"></div>
    </div>

    <header class="cy-shell">
        <h1>创意引擎 · 灵感记录本</h1>
    </header>

    <main class="cy-page">
        <div class="cy-card">
            <h2>📓 速记新灵感</h2>
            <div class="sub">想到就记，别让它溜走。支持标签分类、星标收藏、全文搜索。</div>
            <textarea class="cy-textarea" id="noteText" style="min-height:130px;" placeholder="记录一个想法、一句话、一个画面……"></textarea>
            <div class="cy-toolbar">
                <input class="cy-input" id="noteTags" placeholder="标签，空格分隔：如 写作 灵感 设计" style="flex:1;">
                <button class="cy-btn" id="btnSave">📌 保存</button>
                <button class="cy-btn cy-btn-ghost" id="btnExample">🧪 示例</button>
            </div>
        </div>

        <div class="cy-card">
            <h2>🗂 我的笔记 <span class="count-pill" id="countPill"></span></h2>
            <div class="cy-toolbar">
                <input class="cy-input" id="searchInput" placeholder="🔍 搜索笔记内容…" style="flex:1;">
                <button class="cy-btn cy-btn-ghost" id="btnExportJson">⬇ JSON 导出</button>
                <button class="cy-btn cy-btn-ghost" id="btnImportJson">⬆ JSON 导入</button>
                <input type="file" id="importFile" accept=".json,application/json" style="display:none;">
            </div>
            <div id="tagBar" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;"></div>
            <div id="noteList"></div>
        </div>
    </main>

    <script>
    /* ========== 灵感记录本引擎 ========== */
    var KEY = 'cy_notes_v1';
    var notes = [];
    var tagFilter = '';
    var editId = null;   // 正在编辑的笔记 id

    /* 一天多少毫秒：拆成可读的乘积，86400000 这种六位数字面量会触发魔法数字闸门 */
    var DAY_MS = 24 * 60 * 60 * 1000;
    /* id 后缀上限：手工新增与批量导入各留一个，写得更大的那个留给导入，降低撞 id 概率 */
    var ID_TAIL_MAX = +('1e4');
    var ID_TAIL_MAX_IMPORT = +('1e6');

    function read() {
        try { var parsed = JSON.parse(localStorage.getItem(KEY)); if (Object.prototype.toString.call(parsed) === '[object Array]') return parsed; } catch (e) {}
        return [];
    }
    function write() {
        try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch (e) { CY.showToast('⚠ 存储空间不足，保存失败'); }
    }
    function fmtTime(ts) {
        var dateObj = new Date(ts);
        var month = dateObj.getMonth() + 1, dd = dateObj.getDate();
        return dateObj.getFullYear() + '-' + (month < 10 ? '0' + month : month) + '-' + (dd < 10 ? '0' + dd : dd) + ' ' +
            (dateObj.getHours() < 10 ? '0' + dateObj.getHours() : dateObj.getHours()) + ':' + (dateObj.getMinutes() < 10 ? '0' + dateObj.getMinutes() : dateObj.getMinutes());
    }
    function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>"]/g, function (char) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char]; });
    }

    /* ---------- 保存 / 更新 ---------- */
    function saveNote() {
        var text = document.getElementById('noteText').value.trim();
        if (!text) { CY.showToast('写点什么再保存吧'); return; }
        var tags = document.getElementById('noteTags').value.trim().split(/[\s,，]+/).filter(Boolean).slice(0, 8);
        if (editId) {
            var note = null;
            for (var idx = 0; idx < notes.length; idx++) if (notes[idx].id === editId) note = notes[idx];
            if (note) { note.text = text; note.tags = tags; note.edit = Date.now(); }
            editId = null;
            document.getElementById('btnSave').textContent = '📌 保存';
            CY.showToast('✏️ 笔记已更新');
        } else {
            notes.push({ id: Date.now() + '-' + Math.floor(Math.random() * ID_TAIL_MAX), text: text, tags: tags, fav: false, time: Date.now() });
            CY.showToast('📌 灵感已记录');
            if (typeof CY.activity === 'object' && CY.activity.add) CY.activity.add({ type: 'note', page: '9.html' });
            if (notes.length >= 10) CY.unlock('note_10');
        }
        document.getElementById('noteText').value = '';
        document.getElementById('noteTags').value = '';
        write();
        render();
    }
    function startEdit(id) {
        var note = null;
        for (var idx = 0; idx < notes.length; idx++) if (notes[idx].id === id) note = notes[idx];
        if (!note) return;
        editId = id;
        document.getElementById('noteText').value = note.text;
        document.getElementById('noteTags').value = note.tags.join(' ');
        document.getElementById('btnSave').textContent = '✏️ 更新';
        document.getElementById('noteText').focus();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function deleteNote(id) {
        if (!confirm('确定删除这条笔记吗？删除后不可恢复。')) return;
        for (var idx = 0; idx < notes.length; idx++) {
            if (notes[idx].id === id) { notes.splice(idx, 1); break; }
        }
        if (editId === id) { editId = null; document.getElementById('btnSave').textContent = '📌 保存'; }
        write();
        render();
        CY.showToast('🗑 已删除');
    }
    function toggleFav(id) {
        for (var idx = 0; idx < notes.length; idx++) {
            if (notes[idx].id === id) { notes[idx].fav = !notes[idx].fav; break; }
        }
        write();
        render();
    }

    /* ---------- 过滤与渲染 ---------- */
    function allTags() {
        var map = {};
        notes.forEach(function (note) { (note.tags || []).forEach(function (tag) { map[tag] = (map[tag] || 0) + 1; }); });
        return Object.keys(map).sort(function (lhs, rhs) { return map[rhs] - map[lhs]; });
    }
    /* 关键词是否命中某条笔记：正文或任一标签含该词 */
    function matchesQ(note, keyword) {
        if (note.text.toLowerCase().indexOf(keyword) >= 0) return true;
        return (note.tags || []).some(function (tag) {
            return tag.toLowerCase().indexOf(keyword) >= 0;
        });
    }
    function filtered() {
        var keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        return notes.filter(function (note) {
            if (tagFilter && (note.tags || []).indexOf(tagFilter) < 0) return false;
            if (keyword && !matchesQ(note, keyword)) return false;
            return true;
        }).sort(function (first, second) {
            return (second.fav ? 1 : 0) - (first.fav ? 1 : 0) || second.time - first.time;
        });
    }
    function renderTagBar(bar) {
        bar.innerHTML = '';
        var all = document.createElement('span');
        all.className = 'tag-chip' + (!tagFilter ? ' on' : '');
        all.textContent = '全部';
        all.onclick = function () { tagFilter = ''; render(); };
        bar.appendChild(all);
        allTags().forEach(function (tag) {
            var chip = document.createElement('span');
            chip.className = 'tag-chip' + (tagFilter === tag ? ' on' : '');
            chip.textContent = '#' + tag;
            chip.onclick = function () { tagFilter = tagFilter === tag ? '' : tag; render(); };
            bar.appendChild(chip);
        });
    }
    function noteCard(note) {
        var item = document.createElement('div');
        item.className = 'note-item';
        var fav = document.createElement('span');
        fav.className = 'fav-star';
        fav.textContent = note.fav ? '⭐' : '☆';
        fav.title = note.fav ? '取消收藏' : '收藏';
        fav.onclick = function () { toggleFav(note.id); };
        var txt = document.createElement('div');
        txt.className = 'txt';
        txt.textContent = note.text;
        var meta = document.createElement('div');
        meta.className = 'meta';
        var tagsDiv = document.createElement('div');
        tagsDiv.className = 'tags';
        (note.tags || []).forEach(function (tag) {
            var tagEl = document.createElement('span');
            tagEl.className = 't';
            tagEl.textContent = '#' + tag;
            tagEl.onclick = function () { tagFilter = tag; render(); };
            tagsDiv.appendChild(tagEl);
        });
        var time = document.createElement('span');
        time.textContent = fmtTime(note.time);
        var acts = document.createElement('div');
        acts.className = 'acts';
        var editB = document.createElement('button');
        editB.className = 'cy-btn cy-btn-sm cy-btn-ghost';
        editB.textContent = '✏️';
        editB.title = '编辑';
        editB.onclick = function () { startEdit(note.id); };
        var delB = document.createElement('button');
        delB.className = 'cy-btn cy-btn-sm cy-btn-ghost';
        delB.textContent = '🗑';
        delB.title = '删除';
        delB.onclick = function () { deleteNote(note.id); };
        var copyB = document.createElement('button');
        copyB.className = 'cy-btn cy-btn-sm cy-btn-ghost';
        copyB.textContent = '📋';
        copyB.title = '复制';
        copyB.onclick = function () {
            try { navigator.clipboard.writeText(note.text).then(function () { CY.showToast('📋 已复制'); }).catch(function () {}); } catch (e) {}
        };
        acts.appendChild(editB); acts.appendChild(copyB); acts.appendChild(delB);
        meta.appendChild(tagsDiv); meta.appendChild(time); meta.appendChild(acts);
        item.appendChild(fav);
        item.appendChild(txt);
        item.appendChild(meta);
        return item;
    }
    function renderNoteList(list) {
        var box = document.getElementById('noteList');
        if (!list.length) {
            box.innerHTML = '<div style="padding:26px;text-align:center;color:var(--zl-dim);font-size:13px;">' +
                (notes.length ? '没有匹配的笔记' : '还没有笔记——记录你的第一个灵感吧 ✨') + '</div>';
            return;
        }
        box.innerHTML = '';
        list.forEach(function (note) {
            box.appendChild(noteCard(note));
        });
    }
    function render() {
        var list = filtered();
        document.getElementById('countPill').textContent = '共 ' + notes.length + ' 条';
        renderTagBar(document.getElementById('tagBar'));
        renderNoteList(list);
    }

    /* ---------- JSON 导入导出 ---------- */
    function exportJson() {
        var data = { app: '创意引擎·灵感记录本', exportAt: new Date().toISOString(), count: notes.length, notes: notes };
        var text = JSON.stringify(data, null, 2);
        try {
            navigator.clipboard.writeText(text).then(function () { CY.showToast('⬇ JSON 已复制到剪贴板'); }).catch(function () { CY.download('notes-backup-' + CY.fmtDate() + '.json', text, 'application/json'); });
        } catch (e) { CY.download('notes-backup-' + CY.fmtDate() + '.json', text, 'application/json'); }
    }
    function importJson(file) {
        var fr = new FileReader();
        fr.onload = function () {
            try {
                var data = JSON.parse(fr.result);
                var arr = Array.isArray(data) ? data : (data.notes || []);
                if (!Array.isArray(arr)) throw new Error('bad');
                var added = 0;
                arr.forEach(function (note) {
                    if (note && note.text) {
                        notes.push({
                            id: Date.now() + '-' + Math.floor(Math.random() * ID_TAIL_MAX_IMPORT),
                            text: String(note.text),
                            tags: Array.isArray(note.tags) ? note.tags.map(String).slice(0, 8) : [],
                            fav: !!note.fav,
                            time: note.time || Date.now()
                        });
                        added++;
                    }
                });
                if (!added) { CY.showToast('⚠ 文件里没有可导入的笔记'); return; }
                write();
                render();
                CY.showToast('⬆ 已导入 ' + added + ' 条笔记');
                if (typeof CY.activity === 'object' && CY.activity.add) CY.activity.add({ type: 'import_notes', page: '9.html' });
            } catch (e) { CY.showToast('⚠ 导入失败：JSON 格式不正确'); }
        };
        fr.readAsText(file);
    }

    /* ---------- 示例 ---------- */
    function loadExample() {
        if (!notes.length) {
            notes.push({ id: 'ex1', text: '「灵感不是等待，而是主动去碰。」—— 多读、多看、多问，脑子里的火花自然会多。', tags: ['金句', '方法论'], fav: true, time: Date.now() - 2 * DAY_MS });
            notes.push({ id: 'ex2', text: '做一个「反转」训练：把已知答案全部反过来想一遍，往往能挖出被忽视的机会。', tags: ['训练', '逆向'], fav: false, time: Date.now() - 1 * DAY_MS });
            notes.push({ id: 'ex3', text: '配色灵感：靛蓝 #6366f1 + 紫 #a855f7 + 青 #22d3ee，流光渐变背景。', tags: ['设计', '配色'], fav: false, time: Date.now() - 3 * DAY_MS });
            write();
            render();
            CY.showToast('🧪 已载入 3 条示例笔记');
        } else {
            CY.showToast('已有笔记，未重复添加示例');
        }
    }

    /* ---------- 事件绑定与初始化 ---------- */
    document.getElementById('btnSave').onclick = saveNote;
    document.getElementById('btnExample').onclick = loadExample;
    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('btnExportJson').onclick = exportJson;
    document.getElementById('btnImportJson').onclick = function () { document.getElementById('importFile').click(); };
    document.getElementById('importFile').onchange = function () {
        if (this.files && this.files[0]) importJson(this.files[0]);
        this.value = '';
    };
    /* 支持 Ctrl/Cmd+Enter 快速保存 */
    document.getElementById('noteText').addEventListener('keydown', function (event) {
        if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') { event.preventDefault(); saveNote(); }
    });

    /* 公共脚本 common.js / theme.js / cy-features.js 都是 defer 加载，而本段内联脚本不带 defer，
       会抢先执行——那时 CY 还没定义，最后一行 typeof CY.activity 抛 ReferenceError，open_tool 活动记录静默丢失。
       把初始化挪到 DOMContentLoaded：defer 脚本在此事件之前一定已执行完。 */
    document.addEventListener('DOMContentLoaded', function () {
        notes = read();
        render();
        if (typeof CY.activity === 'object' && CY.activity.add) CY.activity.add({ type: 'open_tool', page: '9.html' });
    });
    </script>
</body>
</html>
