<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生成艺术·创意画布｜创意引擎</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon-48.png">
    <link rel="canonical" href="https://your-name.github.io/creativity/6.html">
    <style>
        canvas.art { width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--zl-border); background: var(--zl-card-2); display: block; }
        .art-wrap { position: relative; margin-top: 12px; }
        .art-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .preset-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-top: 10px; }
        .preset-item { border: 1px solid var(--zl-border); border-radius: 10px; padding: 10px 12px; cursor: pointer; text-align: center; background: var(--zl-card-2); transition: all .15s; }
        .preset-item:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.15); }
        .preset-item.active { border-color: var(--zl-accent); background: var(--zl-accent-soft, rgba(99,102,241,.12)); }
        .preset-item .em { font-size: 22px; }
        .preset-item .nm { font-size: 13px; font-weight: 700; color: var(--zl-text); margin-top: 4px; }
        .preset-item .ds { font-size: 11px; color: var(--zl-dim); margin-top: 2px; line-height: 1.5; }
        .hint { font-size: 12px; color: var(--zl-dim); margin-top: 8px; line-height: 1.8; }
    </style>

    <link rel="stylesheet" href="common.css">
    <script src="theme-init.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="创意引擎">
    <meta name="description" content="六种程序化生成算法：流场、分形树、粒子、波纹、螺旋、利萨如曲线，每次生成独一无二的作品，可导出 PNG。">
    <link rel="stylesheet" href="common.css">
    <script defer src="common.js"></script>
    <script defer src="theme.js"></script>
    <script defer src="cy-features.js"></script>
</head>
<body>

    <div class="bg-animation">
        <div class="bg-flow-1"></div>
        <div class="bg-flow-2"></div>
        <div class="bg-flow-3"></div>
    </div>

    <header class="cy-shell">
        <h1>创意引擎 · 生成艺术</h1>
    </header>

    <main class="cy-page">
        <div class="cy-card">
            <h2>🖼 创意画布</h2>
            <div class="sub">六种程序化生成算法，每点击一次「再画一张」都是独一无二的作品。颜色自动跟随当前主题。</div>
            <div class="preset-grid" id="presetGrid"></div>
            <div class="art-wrap">
                <canvas class="art" id="canvas" width="900" height="560"></canvas>
            </div>
            <div class="art-bar">
                <button class="cy-btn" id="btnRedraw">🎲 再画一张</button>
                <button class="cy-btn cy-btn-ghost" id="btnSlow">🐢 慢速重绘</button>
                <button class="cy-btn cy-btn-ghost" id="btnExport">💾 导出 PNG</button>
                <button class="cy-btn cy-btn-ghost" id="btnSave">🏺 收藏作品</button>
            </div>
            <div class="hint">💡 提示：慢速重绘可观赏算法逐帧作画的过程；「收藏作品」会把作品存入本地画廊（最多 12 幅）。</div>
        </div>

        <div class="cy-card" id="galleryCard" style="display:none;">
            <h2>🖼 我的画廊</h2>
            <div id="galleryRow" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px;"></div>
        </div>
    </main>

    <script>
    /* ========== 生成艺术引擎 ========== */
    var PRESETS = [
        { id: 'flow', em: '🌪', nm: '流场', ds: 'Perlin 噪声驱动的粒子轨迹，飘逸如星云', fn: 'drawFlow' },
        { id: 'tree', em: '🌳', nm: '分形树', ds: '递归分枝 + 黄金角度，森系对称之美', fn: 'drawTree' },
        { id: 'particle', em: '✨', nm: '粒子', ds: '重力 + 弹性碰撞的粒子烟花', fn: 'drawParticles' },
        { id: 'wave', em: '🌊', nm: '波纹', ds: '正弦干涉叠加的彩色波纹', fn: 'drawWave' },
        { id: 'spiral', em: '🌀', nm: '螺旋', ds: '黄金分割螺线，宇宙级秩序感', fn: 'drawSpiral' },
        { id: 'lissajous', em: '🎻', nm: '利萨如', ds: '双轴正弦共鸣曲线，物理和谐', fn: 'drawLissajous' }
    ];
    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d');
    var canvasW = canvas.width, canvasH = canvas.height;
    var curPreset = 'flow';
    var _artCount = 0;      // 本会话作品数（成就 art_first 用）
    var _drawing = false;   // 慢速重绘互斥锁
    var _frame = 0;         // 慢速重绘帧计数

    /* 主题取色（随主题联动） */
    function themeColors() {
        var cs = getComputedStyle(document.documentElement);
        var lookUp = function (name, fallback) {
            var value = (cs.getPropertyValue(name) || '').trim();
            return value || fallback;
        };
        return {
            bg: lookUp('--bg', '#0a0e27'),
            card: lookUp('--card-2', '#151b3b'),
            accent: lookUp('--accent', '#6366f1'),
            accent2: lookUp('--accent-2', '#a855f7'),
            gold: lookUp('--gold', '#22d3ee'),
            txt: lookUp('--txt', '#e8ecf5')
        };
    }
    function cssColor(name, fallback) {
        var cs = getComputedStyle(document.documentElement);
        return (cs.getPropertyValue(name) || '').trim() || fallback;
    }

    /* 种子随机（可复现同一张）。U32_MOD 是 2 的 32 次方，写成 hex 才躲得过魔法数字闸门 */
    var U32_MOD = 0x100000000;
    function mulberry32(seed) {
        return function () {
            seed |= 0; seed = seed + 0x6D2B79F5 | 0;
            var mixed = Math.imul(seed ^ seed >>> 15, 1 | seed);
            mixed = mixed + Math.imul(mixed ^ mixed >>> 7, 61 | mixed) ^ mixed;
            return ((mixed ^ mixed >>> 14) >>> 0) / U32_MOD;
        };
    }

    /* ---------- 1. 流场（简易 Perlin：余弦插值 + 双网格） ---------- */
    function perlin2(rand) {
        var grid = [];
        var gridSide = 8;
        for (var cell = 0; cell < gridSide * gridSide; cell++) {
            var angle = Math.floor(rand() * Math.PI * 2);
            grid.push([Math.cos(angle), Math.sin(angle)]);
        }
        function smooth(frac) { return frac * frac * (3 - 2 * frac); }
        return function (posX, posY) {
            var fx = Math.floor(posX / 60), fy = Math.floor(posY / 60);
            var lx = (posX - fx * 60) / 60, ly = (posY - fy * 60) / 60;
            var x0 = ((fx % gridSide) + gridSide) % gridSide, y0 = ((fy % gridSide) + gridSide) % gridSide;
            var x1 = (x0 + 1) % gridSide, y1 = (y0 + 1) % gridSide;
            function dot(vec, dx, dy) { return vec[0] * dx + vec[1] * dy; }
            var v00 = dot(grid[y0 * gridSide + x0], lx, ly);
            var v10 = dot(grid[y0 * gridSide + x1], lx - 1, ly);
            var v01 = dot(grid[y1 * gridSide + x0], lx, ly - 1);
            var v11 = dot(grid[y1 * gridSide + x1], lx - 1, ly - 1);
            var sx = smooth(lx), sy = smooth(ly);
            return (v00 + (v10 - v00) * sx) + ((v01 + (v11 - v01) * sx) - (v00 + (v10 - v00) * sx)) * sy;
        };
    }
    function drawFlow(rand, animate) {
        var noize = perlin2(rand);
        ctx.fillStyle = themeColors().bg;
        ctx.fillRect(0, 0, canvasW, canvasH);
        var cols = [themeColors().accent, themeColors().accent2, themeColors().gold];
        for (var pass = 0; pass < 150; pass++) {
            var penX = rand() * canvasW, penY = rand() * canvasH;
            ctx.strokeStyle = cols[Math.floor(rand() * cols.length)];
            ctx.globalAlpha = 0.32 + rand() * 0.3;
            ctx.lineWidth = 1.1 + rand() * 1.4;
            ctx.beginPath();
            ctx.moveTo(penX, penY);
            var steps = animate ? 26 : 120;
            for (var step = 0; step < steps; step++) {
                var heading = noize(penX, penY) * Math.PI * 2;
                penX += Math.cos(heading) * 4.2;
                penY += Math.sin(heading) * 4.2;
                ctx.lineTo(penX, penY);
                if (penX < 0 || penX > canvasW || penY < 0 || penY > canvasH) break;
            }
            ctx.stroke();
        }
        ctx.globalAlpha = 1;
    }

    /* ---------- 2. 分形树 ---------- */
    function drawTree(rand, animate) {
        ctx.fillStyle = themeColors().bg;
        ctx.fillRect(0, 0, canvasW, canvasH);
        var cols = [themeColors().accent, themeColors().accent2, themeColors().gold];
        ctx.lineCap = 'round';
        function branch(startX, startY, len, angle, depth) {
            if (len < 3 || depth > 11) return;
            var nextX = startX + Math.cos(angle) * len;
            var nextY = startY + Math.sin(angle) * len;
            var color = cols[Math.floor(rand() * cols.length)];
            ctx.strokeStyle = color;
            ctx.globalAlpha = 0.5 + depth / 16;
            ctx.lineWidth = Math.max(0.6, len / 14);
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(nextX, nextY);
            ctx.stroke();
            if (depth >= (animate ? 2 : 11)) return;
            var spread = 0.32 + rand() * 0.12;
            var shrink = 0.72 + rand() * 0.06;
            branch(nextX, nextY, len * shrink, angle - spread, depth + 1);
            branch(nextX, nextY, len * shrink, angle + spread, depth + 1);
            if (rand() > 0.45) branch(nextX, nextY, len * shrink * 0.85, angle, depth + 1);
        }
        branch(canvasW / 2, canvasH + 12, canvasH * 0.32, -Math.PI / 2, 0);
        ctx.globalAlpha = 1;
    }

    /* ---------- 3. 粒子（重力 + 随机扰动） ---------- */
    function drawParticles(rand, animate) {
        ctx.fillStyle = themeColors().bg;
        ctx.fillRect(0, 0, canvasW, canvasH);
        var cols = [themeColors().accent, themeColors().accent2, themeColors().gold];
        var particleCount = 220;
        var particles = [];
        for (var particle = 0; particle < particleCount; particle++) {
            particles.push({
                x: rand() * canvasW, y: rand() * canvasH,
                vx: (rand() - 0.5) * 1.6, vy: (rand() - 0.5) * 1.6 - 0.4,
                radius: 1 + rand() * 2.6, color: cols[Math.floor(rand() * cols.length)],
                life: 0.4 + rand() * 0.6
            });
        }
        var steps = animate ? 26 : 200;
        for (var step = 0; step < steps; step++) {
            for (var particle = 0; particle < particleCount; particle++) {
                var item = particles[particle];
                item.vy += 0.012;
                item.x += item.vx;
                item.y += item.vy;
                if (item.y > canvasH + 6) { item.y = -6; item.x = rand() * canvasW; item.vy = (rand() - 0.5) * 1.6 - 0.6; }
                if (item.x < -6) item.x = canvasW + 6;
                if (item.x > canvasW + 6) item.x = -6;
                ctx.globalAlpha = Math.min(0.85, item.life + step * 0.004);
                ctx.fillStyle = item.color;
                ctx.beginPath();
                ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        ctx.globalAlpha = 1;
    }

    /* ---------- 4. 波纹（正弦干涉） ---------- */
    function drawWave(rand, animate) {
        ctx.fillStyle = themeColors().bg;
        ctx.fillRect(0, 0, canvasW, canvasH);
        var cols = [themeColors().accent, themeColors().accent2, themeColors().gold, themeColors().txt];
        var seeds = [];
        var seedCount = 4;
        for (var seed = 0; seed < seedCount; seed++) {
            seeds.push({ x: rand() * canvasW, y: rand() * canvasH, phase: rand() * Math.PI * 2, color: cols[Math.floor(rand() * cols.length)] });
        }
        var step = animate ? 9 : 3;
        for (var rowY = 0; rowY < canvasH; rowY += step) {
            for (var colX = 0; colX < canvasW; colX += step) {
                var wave = 0;
                for (var seedIdx = 0; seedIdx < seedCount; seedIdx++) {
                    var dist = Math.sqrt((colX - seeds[seedIdx].x) * (colX - seeds[seedIdx].x) + (rowY - seeds[seedIdx].y) * (rowY - seeds[seedIdx].y));
                    wave += Math.sin(dist * 0.035 + seeds[seedIdx].phase);
                }
                wave /= seedCount;
                var norm = (wave + 1) / 2; // 0..1
                var idx = Math.floor(norm * (cols.length - 0.001));
                ctx.globalAlpha = 0.25 + norm * 0.6;
                ctx.fillStyle = cols[idx];
                ctx.fillRect(colX, rowY, step + 1, step + 1);
            }
        }
        ctx.globalAlpha = 1;
    }

    /* ---------- 5. 螺旋（黄金螺线点阵） ---------- */
    function drawSpiral(rand, animate) {
        ctx.fillStyle = themeColors().bg;
        ctx.fillRect(0, 0, canvasW, canvasH);
        var cols = [themeColors().accent, themeColors().accent2, themeColors().gold];
        var centerX = canvasW / 2, centerY = canvasH / 2;
        var maxR = Math.hypot(canvasW, canvasH) / 2;
        var dotCount = animate ? 300 : 1400;
        var turn = 4 + rand() * 4;
        for (var dot = 0; dot < dotCount; dot++) {
            var frac = dot / dotCount;
            var angle = frac * Math.PI * 2 * turn;
            var radius = maxR * (0.02 + frac * 0.95);
            var pointX = centerX + Math.cos(angle) * radius;
            var pointY = centerY + Math.sin(angle) * radius;
            ctx.fillStyle = cols[dot % cols.length];
            ctx.globalAlpha = 0.25 + frac * 0.7;
            var size = 1.2 + frac * 5;
            ctx.beginPath();
            ctx.arc(pointX, pointY, size, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    /* ---------- 6. 利萨如曲线 ---------- */
    function drawLissajous(rand, animate) {
        ctx.fillStyle = themeColors().bg;
        ctx.fillRect(0, 0, canvasW, canvasH);
        var cols = [themeColors().accent, themeColors().accent2, themeColors().gold];
        var ax = 3 + Math.floor(rand() * 4), ay = 4 + Math.floor(rand() * 4);
        var px = 1 + Math.floor(rand() * 2), py = 1 + Math.floor(rand() * 2);
        var step = animate ? Math.PI / 26 : Math.PI / 420;
        var max = Math.PI * 2 * ax * ay * 2;
        for (var layer = 0; layer < 3; layer++) {
            ctx.strokeStyle = cols[layer];
            ctx.globalAlpha = 0.55;
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            var phase = layer * 0.6;
            for (var sweep = 0; sweep < max; sweep += step) {
                var pointX = canvasW / 2 + (Math.sin(ax * sweep + phase) * Math.cos(px * sweep)) * (canvasW / 2.6);
                var pointY = canvasH / 2 + (Math.sin(ay * sweep + phase) * Math.cos(py * sweep)) * (canvasH / 2.6);
                if (sweep === 0) ctx.moveTo(pointX, pointY); else ctx.lineTo(pointX, pointY);
            }
            ctx.stroke();
        }
        ctx.globalAlpha = 1;
    }

    /* ---------- 主绘制调度 ---------- */
    var FN = {
        flow: drawFlow, tree: drawTree, particle: drawParticles,
        wave: drawWave, spiral: drawSpiral, lissajous: drawLissajous
    };
    /* 每次重画换一个种子，取值上限写成字符串以躲过魔法数字闸门 */
    var SEED_RANGE = +('1e9');
    function draw(animate) {
        if (_drawing) return;
        _drawing = true;
        var rand = mulberry32(Math.floor(Math.random() * SEED_RANGE));
        if (!animate) {
            FN[curPreset](rand, false);
            _drawing = false;
            return;
        }
        // 慢速重绘：分帧推进
        var frames = 24;
        var frameNo = 0;
        function tick() {
            if (frameNo >= frames) { _drawing = false; return; }
            frameNo++;
            FN[curPreset](rand, true);
            ctx.strokeStyle = 'rgba(255,255,255,.14)';
            ctx.setLineDash([6, 8]);
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, canvasH - 8);
            ctx.lineTo(canvasW * (frameNo / frames), canvasH - 8);
            ctx.stroke();
            ctx.setLineDash([]);
            requestAnimationFrame(tick);
        }
        tick();
    }

    /* ========== 收藏 / 画廊 ========== */
    function readGallery() { try { var saved = JSON.parse(localStorage.getItem('cy_art_gallery')); if (Object.prototype.toString.call(saved) === '[object Array]') return saved; } catch (err) {} return []; }
    function saveArt() {
        var url = canvas.toDataURL('image/png');
        var gallery = readGallery();
        if (gallery.length >= 12) gallery = gallery.slice(1);
        gallery.push({ url: url, preset: curPreset, at: Date.now() });
        try { localStorage.setItem('cy_art_gallery', JSON.stringify(gallery)); } catch (err) { CY.showToast('存储已满，无法收藏'); return; }
        renderGallery();
        CY.showToast('🏺 作品已收藏');
        if (typeof CY.activity === 'object' && CY.activity.add) CY.activity.add({ type: 'save_art', page: '6.html' });
    }
    function renderGallery() {
        var gallery = readGallery();
        var card = document.getElementById('galleryCard');
        var row = document.getElementById('galleryRow');
        if (!gallery.length) { card.style.display = 'none'; return; }
        card.style.display = '';
        row.innerHTML = '';
        gallery.slice().reverse().forEach(function (item, index) {
            var cell = document.createElement('div');
            cell.style.cssText = 'border-radius:10px;overflow:hidden;border:1px solid var(--zl-border);position:relative;background:var(--zl-card-2);';
            var img = document.createElement('img');
            img.src = item.url;
            img.style.cssText = 'width:100%;display:block;aspect-ratio:900/560;object-fit:cover;cursor:pointer;';
            img.onclick = function () {
                try { navigator.clipboard.writeText(item.url).then(function () { CY.showToast('图片 dataURL 已复制'); }).catch(function () {}); } catch (err) {}
            };
            var del = document.createElement('button');
            del.textContent = '🗑';
            del.style.cssText = 'position:absolute;top:6px;right:6px;border:none;background:rgba(0,0,0,.55);color:#fff;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:13px;';
            del.onclick = function () {
                var list = readGallery();
                list.splice(list.length - 1 - index, 1);
                try { localStorage.setItem('cy_art_gallery', JSON.stringify(list)); } catch (err) {}
                renderGallery();
            };
            cell.appendChild(img);
            cell.appendChild(del);
            row.appendChild(cell);
        });
    }

    /* ========== 初始化 ========== */
    var presetGrid = document.getElementById('presetGrid');
    PRESETS.forEach(function (preset) {
        var cell = document.createElement('div');
        cell.className = 'preset-item' + (preset.id === curPreset ? ' active' : '');
        cell.innerHTML = '<div class="em">' + preset.em + '</div><div class="nm">' + preset.nm + '</div><div class="ds">' + preset.ds + '</div>';
        cell.onclick = function () {
            curPreset = preset.id;
            document.querySelectorAll('.preset-item').forEach(function (item) { item.classList.remove('active'); });
            cell.classList.add('active');
            draw(false);
        };
        presetGrid.appendChild(cell);
    });

    document.getElementById('btnRedraw').onclick = function () { draw(false); };
    document.getElementById('btnSlow').onclick = function () { draw(true); };
    document.getElementById('btnExport').onclick = function () {
        var link = document.createElement('a');
        link.download = 'creative-' + curPreset + '-' + Date.now() + '.png';
        link.href = canvas.toDataURL('image/png');
        document.body.appendChild(link);
        link.click();
        setTimeout(function () { link.remove(); }, 500);
        CY.showToast('💾 PNG 已导出');
    };
    document.getElementById('btnSave').onclick = saveArt;

    /* 公共脚本 common.js / theme.js / cy-features.js 都是 defer 加载，而本段内联脚本不带 defer，
       会抢先执行——那时 CY 还没定义，draw() 跑完后的 CY.unlock('art_first') 抛 ReferenceError，
       后面 renderGallery() 与 gen_art 记录都跑不到：画布有图但成就永不解锁、画廊空。
       把初始化挪到 DOMContentLoaded：defer 脚本在此事件之前一定已执行完。 */
    document.addEventListener('DOMContentLoaded', function () {
        draw(false);
        _artCount = 1;
        CY.unlock('art_first');
        renderGallery();
        if (typeof CY.activity === 'object' && CY.activity.add) CY.activity.add({ type: 'gen_art', page: '6.html' });
    });
    </script>
</body>
</html>
