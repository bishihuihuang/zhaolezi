    <style>
        .slot-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .slot-chip {
            padding: 7px 12px; border-radius: 10px; font-size: 13px; cursor: pointer;
            background: var(--zl-card-2); border: 1px solid var(--zl-border); color: var(--zl-text);
            transition: all .2s; user-select: none; display: inline-flex; align-items: center; gap: 6px;
        }
        .slot-chip:hover { border-color: var(--zl-accent); }
        .slot-chip .lk { font-size: 11px; opacity: .55; }
        .slot-chip.locked { border-style: dashed; border-color: var(--zl-accent); background: var(--zl-accent); color: var(--zl-btn-text); }
        .idea-main {
            font-size: 17px; line-height: 1.9; color: var(--zl-text);
            background: var(--zl-card-2); border: 1px solid var(--zl-border);
            border-radius: 14px; padding: 16px 18px; margin-bottom: 8px;
            min-height: 96px;
        }
        .gen-list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
        .gen-item {
            background: var(--zl-card-2); border: 1px solid var(--zl-border); border-radius: 12px;
            padding: 12px 14px; font-size: 14px; line-height: 1.8; color: var(--zl-text);
            display: flex; gap: 10px; align-items: flex-start;
        }
        .gen-item .txt { flex: 1; }
        .tag-pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--zl-accent); color: var(--zl-btn-text); margin-right: 6px; }
    </style>

        ], slots: {

            subject: ['鲸鱼', '灯塔', '少女', '旧钟', '老树', '纸飞机', '猫', '城市剪影', '宇航员', '邮筒'],
            env: ['雾中', '极光下', '海底', '废墟', '云端', '雪夜', '黄昏街头', '星空下', '雨中巷口', '沙漠'],
            emotion: ['孤独', '希望', '静谧', '躁动', '怀旧', '自由', '释然', '期待']
        } },
        { id: 'startup', name: '🚀 创业机会', templates: [
            '针对{people}的{pain}，结合{resource}，用{model}模式做成一个轻项目。',
            '发现{people}在{scene}常为{pain}烦恼——如果利用{resource}做服务，走{model}路线，会怎样？',
            '一个面向{people}的小生意：切入{pain}，靠{resource}获客，盈利方式是{model}。'
        ], slots: {
            people: ['银发族', '独居青年', '新手宝妈', '宠物主', '自由职业者', '小镇青年', '大学生', '双职工家庭'],
            pain: ['没人陪着聊天', '不会做饭', '信息过载', '物品闲置', '技能焦虑', '出行不便', '整理收纳难', '节日送礼选择困难'],
            resource: ['社区闲置空间', '本地供应链', 'AI 工具', '二手平台', '邻里互助网络', '共享技能', '短视频流量', '校园社团'],

        } },
        { id: 'game', name: '🎮 游戏玩法', templates: [

            '如果把「{theme}」做成{genre}：机制用{mech}，玩家每天沉迷的点是{fun}。',
            '独立小游戏提案：{genre} × 主题「{theme}」，机制{mech}，关卡围绕{fun}展开。'
        ], slots: {
            genre: ['解谜', 'Roguelike', '模拟经营', '塔防', '跑酷', '卡牌构筑', '放置养成', '双人合作'],

            mech: ['资源循环', '因果倒置', '昼夜切换', '重力翻转', '声控指令', '连锁消除', '时间回溯', '共生操控'],
            fun: ['连锁消除爽感', '随机掉落惊喜', '剧情分支选择', '排行榜攀爬', '收集图鉴', '无限组合实验', '隐藏彩蛋探索']
        } }
    ];

    /* ========== 状态 ========== */
    let cur = null; // {catIdx, tplIdx, picks, locks}

    const ideaBox = document.getElementById('ideaBox');
    const batchList = document.getElementById('batchList');

    function randItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function renderText(cat, tpl, picks) {
        return tpl.replace(/\{(\w+)\}/g, function (_, slotKey) { return picks[slotKey] || '【' + slotKey + '】'; });
    }

    function newIdea() {
        const catIdx = parseInt(ideaBox.dataset.cat || '0');
        const cat = CATS[catIdx];
        const tplIdx = Math.floor(Math.random() * cat.templates.length);
        const tpl = cat.templates[tplIdx];
        const keys = tpl.match(/\{(\w+)\}/g).map(s => s.slice(1, -1));
        const picks = {}, locks = {};
        keys.forEach(slotKey => { picks[slotKey] = randItem(cat.slots[slotKey]); locks[slotKey] = false; });
        cur = { catIdx: catIdx, tplIdx: tplIdx, picks: picks, locks: locks };
        draw();
    }

    function rerollUnlocked() {
        if (!cur) return;
        const cat = CATS[cur.catIdx];
        const keys = Object.keys(cur.picks);
        keys.forEach(slotKey => { if (!cur.locks[slotKey]) cur.picks[slotKey] = randItem(cat.slots[slotKey]); });
        draw();
    }

    function draw() {
        if (!cur) { ideaBox.innerHTML = '<div class="cy-empty">选择一个领域，然后点击下方按钮开始</div>'; return; }
        const cat = CATS[cur.catIdx];
        const tpl = cat.templates[cur.tplIdx];
        const keys = Object.keys(cur.picks);
        const text = renderText(cat, tpl, cur.picks);

        let chips = '';
        keys.forEach(slotKey => {
            const locked = cur.locks[slotKey];
            chips += '<span class="slot-chip' + (locked ? ' locked' : '') + '" data-k="' + slotKey + '">' +
                '<span class="lk">' + (locked ? '🔒' : '🔓') + '</span>' + CY.escapeHtml(cur.picks[slotKey]) + '</span>';
        });

        ideaBox.dataset.cat = cur.catIdx;
        ideaBox.innerHTML =
            '<div class="idea-main">' + CY.escapeHtml(text) + '</div>' +
            '<div class="slot-chips">' + chips + '</div>' +
            '<div class="sub" style="margin-top:8px;">点击槽位 🔒 锁定，再点「重掷未锁定」只换其余部分</div>';
    }

    function batch(count) {
        const catIdx = parseInt(ideaBox.dataset.cat || '0');
        const cat = CATS[catIdx];
        const arr = [];
        for (let idx = 0; idx < count; idx++) {
            const tpl = randItem(cat.templates);
            const keys = tpl.match(/\{(\w+)\}/g).map(s => s.slice(1, -1));
            const picks = {};
            keys.forEach(slotKey => { picks[slotKey] = randItem(cat.slots[slotKey]); });
            arr.push({ cat: cat.name, text: renderText(cat, tpl, picks) });
        }
        batchList.innerHTML = arr.map((it, idx) =>
            '<div class="gen-item"><span class="txt"><span class="tag-pill">' + CY.escapeHtml(it.cat.replace(/^[^\s]+\s/, '')) + '</span>' + CY.escapeHtml(it.text) +
            '</span><span class="ops"><button class="cy-icon-btn fav" title="收藏" data-i="' + idx + '" data-t="' + CY.escapeHtml(it.text).replace(/"/g, '&quot;') + '">♥</button></span></div>'
        ).join('');
        batchList.querySelectorAll('button.fav').forEach(btn => {
            btn.onclick = function () { addFav(this.dataset.t); };
        });
        if (count > 0) {
            if (window.CY && CY.activity) CY.activity.add({ type: 'gen_idea', page: '1.html' });
            if (window.CY && CY.unlock) CY.unlock('idea_first');
        }
    }

    function addFav(text) {
        const list = JSON.parse(localStorage.getItem('cy_fav_ideas') || '[]');
        if (list.indexOf(text) >= 0) { CY.showToast('已在收藏中'); return; }
        list.unshift(text);
        localStorage.setItem('cy_fav_ideas', JSON.stringify(list.slice(0, 60)));
        updateFavCount();
        CY.showToast('♥ 已收藏，可在「我的收藏」查看');
    }

    function updateFavCount() {
        const list = JSON.parse(localStorage.getItem('cy_fav_ideas') || '[]');
        document.getElementById('favCount').textContent = list.length;
    }

    /* ========== 收藏面板 ========== */
    function showFav() {
        const list = JSON.parse(localStorage.getItem('cy_fav_ideas') || '[]');
        const panel = document.createElement('div');
        panel.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:2147483646;background:rgba(8,10,30,.6);display:flex;align-items:flex-start;justify-content:center;padding-top:10vh;';
        panel.innerHTML = '<div style="width:min(640px,94%);background:var(--card);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:hidden;max-height:78vh;display:flex;flex-direction:column;">' +
            '<div style="display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);color:var(--txt);font-weight:700;">📥 我的收藏（' + list.length + '）' +
            '<span style="cursor:pointer;color:var(--dim);" id="favClose">✕</span></div>' +
            '<div style="overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;" id="favBody">' +
            (list.length ? '' : '<div style="text-align:center;color:var(--dim);padding:30px;">还没有收藏，快去生成几条吧</div>') +
            '</div>' +
            (list.length ? '<div style="padding:12px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:center;">' +
            '<button class="cy-btn cy-btn-sm" id="favExport">导出 .txt</button>' +
            '<button class="cy-btn cy-btn-sm cy-btn-danger" id="favClear">清空</button></div>' : '') + '</div>';
        document.body.appendChild(panel);
        const body = panel.querySelector('#favBody');
        list.forEach((text, idx) => {
            const row = document.createElement('div');
            row.style.cssText = 'background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--txt);line-height:1.8;display:flex;gap:8px;align-items:flex-start;';
            row.innerHTML = '<span style="flex:1;">' + CY.escapeHtml(text) + '</span><button class="cy-icon-btn" data-i="' + idx + '">🗑️</button>';
            body.appendChild(row);
        });
        body.querySelectorAll('button').forEach(btn => {
            btn.onclick = function () {
                const li = JSON.parse(localStorage.getItem('cy_fav_ideas') || '[]');
                li.splice(parseInt(this.dataset.i), 1);
                localStorage.setItem('cy_fav_ideas', JSON.stringify(li));
                panel.remove();
                showFav();
                updateFavCount();
            };
        });
        const ex = document.getElementById('favExport');
        if (ex) ex.onclick = function () { CY.download('灵感收藏.txt', list.join('\n\n'), 'text/plain;charset=utf-8'); };
        const cl = document.getElementById('favClear');
        if (cl) cl.onclick = function () {
            if (confirm('确定清空全部收藏吗？')) {
                localStorage.setItem('cy_fav_ideas', '[]');
                panel.remove();
                updateFavCount();
            }
        };
        document.getElementById('favClose').onclick = function () { panel.remove(); };
        panel.onclick = function (event) { if (event.target === panel) panel.remove(); };
    }

    /* ========== 事件绑定 ========== */
    document.getElementById('catRow').innerHTML = CATS.map((cat, idx) =>
        '<span class="cy-tab' + (idx === 0 ? ' active' : '') + '" data-i="' + idx + '">' + cat.name + '</span>'
    ).join('');

    document.getElementById('catRow').querySelectorAll('.cy-tab').forEach(tab => {
        tab.onclick = function () {
            document.getElementById('catRow').querySelectorAll('.cy-tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            ideaBox.dataset.cat = this.dataset.i;
            newIdea();
        };
    });

    document.getElementById('btnReroll').onclick = function () { if (cur) { rerollUnlocked(); } else { newIdea(); } };
    document.getElementById('btnBatch').onclick = function () { batch(5); };
    document.getElementById('btnFav').onclick = function () {
        if (!cur) return;
        const cat = CATS[cur.catIdx];
        addFav(renderText(cat, cat.templates[cur.tplIdx], cur.picks));
    };
    document.getElementById('btnCopy').onclick = function () {
        if (!cur) return;
        const cat = CATS[cur.catIdx];
        const text = renderText(cat, cat.templates[cur.tplIdx], cur.picks);
        navigator.clipboard.writeText(text).then(function () {
            CY.showToast('已复制到剪贴板');
            if (window.CY && CY.saveRecent) CY.saveRecent('cy_recent_ideas', text);
        }).catch(function () {});
    };
    document.getElementById('btnShowFav').onclick = showFav;

    /* 槽位点击：锁定切换 */
    ideaBox.addEventListener('click', function (event) {
        const chip = event.target.closest('.slot-chip');
        if (!chip || !cur) return;
        const slotKey = chip.dataset.k;
        cur.locks[slotKey] = !cur.locks[slotKey];
        draw();
    });

    /* 公共脚本 common.js / theme.js / cy-features.js 都是 defer 加载，而本段内联脚本不带 defer，
       会抢先执行——那时 CY 还没定义，newIdea() 里的 draw() 用 CY.escapeHtml 抛 ReferenceError，灵感卡片全空。
       把初始化挪到 DOMContentLoaded：defer 脚本在此事件之前一定已执行完。 */
    document.addEventListener('DOMContentLoaded', function () {
        newIdea();
        updateFavCount();
    });
    </script>
</body>
</html>
