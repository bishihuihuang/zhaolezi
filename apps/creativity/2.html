<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文案工坊·标语金句生成｜创意引擎</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon-48.png">
    <link rel="canonical" href="https://your-name.github.io/creativity/2.html">
    <style>
        .line {
            font-size: 16px; line-height: 1.9; color: var(--zl-text);
            background: var(--zl-card-2); border: 1px solid var(--zl-border);
            border-radius: 12px; padding: 13px 16px; margin-bottom: 8px;
            display: flex; gap: 10px; align-items: flex-start;
        }
        .line .txt { flex: 1; }
        .mode-desc { font-size: 13px; color: var(--zl-muted); margin: 6px 0 12px; line-height: 1.7; }
    </style>

    <link rel="stylesheet" href="common.css">
    <script src="theme-init.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="创意引擎">
    <meta name="description" content="品牌标语、广告标题、社交金句、祝福文案、励志短句 5 种模式，模板 × 词池随机组合，一键产出、收藏、复制。">
    <link rel="stylesheet" href="common.css">
    <script defer src="common.js"></script>
    <script defer src="theme.js"></script>
    <script defer src="cy-features.js"></script>
</head>
<body>

    <div class="bg-animation">
        <div class="bg-flow-1"></div>
        <div class="bg-flow-2"></div>
        <div class="bg-flow-3"></div>
    </div>

    <header class="cy-shell">
        <h1>创意引擎 · 文案工坊</h1>
    </header>

    <main class="cy-page">
        <div class="cy-card">
            <h2>✍️ 文案工坊</h2>
            <div class="sub">5 种文案模式：模板 × 词池随机组合，不满意就换，满意就收。</div>
            <div class="cy-tab-row" id="modeRow"></div>
            <div class="mode-desc" id="modeDesc"></div>
            <div class="cy-toolbar">
                <button class="cy-btn" id="btnGen">✨ 生成 6 条</button>
                <button class="cy-btn cy-btn-ghost" id="btnMore">➕ 再加 3 条</button>
                <button class="cy-btn cy-btn-ghost" id="btnClear">🗑️ 清空</button>
                <button class="cy-btn cy-btn-ghost" id="btnExport">💾 导出全部</button>
            </div>
            <div id="outList"></div>
        </div>
    </main>

    <script>
    /* ========== 5 种文案模式 ========== */
    const MODES = [
        {
            id: 'slogan', name: '🏷️ 品牌标语', desc: '一句话立住品牌人设。结构：「品牌名」+「动宾承诺」或「不止是…更是…」升华。',
            tpls: [
                ['{brand}，{promise}。'],
                ['不止是{cat}，更是{upgrade}。'],
                ['{brand}，让{who}的{pain}不再是{pain2}。'],
                ['把{cat}，做成{upgrade}。'],
                ['{brand}——{emotion}的选择。']
            ],
            slots: {
                brand: ['晨光里', '山与海', '木知', '云栖', '拾光', '半岛', '星野', '微澜', '初桅', '禾风'],
                promise: ['让生活更轻盈', '好产品会说话', '把美好带回家', '为热爱而生', '认真生活每一天', '陪你走过四季', '把复杂留给我们', '让每一个明天更简单'],
                cat: ['一杯茶', '一盏灯', '一件衣服', '一本书', '一双鞋', '一张床垫', '一支笔', '一块表'],
                upgrade: ['一种生活态度', '一种陪伴', '一个开始', '一份底气', '一种仪式感', '对明天的期待', '与自己和解', '一场慢旅行'],
                who: ['独居的人', '赶路的人', '晚睡的人', '初为人母的她', '刚毕业的你', '热爱生活的家'],
                pain: ['将就', '匆忙', '焦虑', '孤单', '内卷', '疲惫'],
                pain2: ['妥协', '将就', '凑合', '慌张', '迷茫'],
                emotion: ['安心', '自由', '高级', '温暖', '可靠', '松弛']
            }
        },
        {
            id: 'ad', name: '📣 广告标题', desc: '数字 + 悬念 + 人群的钩子标题，专为信息流和海报而生。',
            tpls: [
                ['「{num}{verb}」？{who}的秘密都在这', '（{cat}）'],
                ['为什么{who}都在{verb}？答案{twist}'],
                ['{num}天，让{who}{verb}到{target}。'],
                ['别急着{verb}，先看看这个｜{cat}'],
                ['{who}最怕的{pain}，{num}就解决了。'],
                ['实测有效：{who}的{cat}，{twist}']
            ],
            slots: {
                num: ['3 个', '10 天', '99 元', '1 分钟', '第 7 天', '365 天', '5 步'],
                verb: ['变瘦', '学会', '省下', '戒掉', '赚到', '睡好', '逆袭', '过稿'],
                who: ['学生党', '上班族', '宝妈', '健身党', '程序员', '熬夜党', '手残党', '穷游党'],
                twist: ['根本不需要天赋', '只差这一个习惯', '老板看了都沉默', '方法其实很简单', '试过的人都回不去了'],
                target: ['理想体重', '写作自由', '财务自由', '八小时睡眠', '副业第一单', '高分上岸'],
                pain: ['拖延', '加班', '失眠', '发胖', '迷茫', '穷'],
                cat: ['减脂餐', '时间管理', '写作课', '睡眠枕', '记账 App', '备考计划']
            }
        },
        {
            id: 'quote', name: '💬 社交金句', desc: '半成品金句填空，关于热爱、努力、孤独、友谊与时间。',
            tpls: [
                ['热爱不是{resA}，而是{resB}。', '（关于热爱）'],
                ['真正的努力，是{resA}，不是{resB}。', '（关于努力）'],
                ['孤独不是{pain}，是{resB}。', '（关于孤独）'],
                ['好的友谊，{resA}，{resB}。', '（关于友谊）'],
                ['时间不会{resB}，但会{resA}。', '（关于时间）'],
                ['生活没你想的那么{pain}，{resB}就好。', '（关于生活）']
            ],
            slots: {
                resA: ['抵达', '成功', '拥有', '等待', '结果', '记录', '长大', '催人成熟'],
                resB: ['出发', '在路上', '选择', '开始', '过程', '感受', '变温柔', '把答案交给你', '筛选出对的人'],
                pain: ['难', '糟', '累', '远', '苦', '重']
            }
        },
        {
            id: 'bless', name: '🎁 祝福文案', desc: '新年 / 生日 / 升职 / 乔迁 / 新婚 / 毕业，6 大场景祝福。',
            tpls: [
                ['{scene}快乐！愿你在新岁里，{wish}。'],
                ['{scene}，愿{wish}，也愿{more}。'],
                ['把{good}送给你：{wish}。{scene}安好！'],
                ['{scene}——最好的祝福是{wish}。'],
                ['愿你{more}；祝你{wish}。{scene}！']
            ],
            slots: {
                scene: ['新年', '生日', '升职', '乔迁', '新婚', '毕业'],
                wish: ['所念皆回响', '步履不停', '心想事成', '有光可追', '万事胜意', '奔赴山海', '岁岁常欢愉', '好运连连'],
                more: ['有热汤暖胃', '有人与你立黄昏', '有梦可做', '前路有知己', '日子有趣有盼', '眼里有星辰', '银行卡余额安心'],
                good: ['一杯热茶', '一束光', '一句良言', '一个小确幸', '四季的温柔']
            }
        },
        {
            id: 'motivate', name: '💪 励志短句', desc: '「不是…而是…」结构 + 通用金句池，发朋友圈 / 做壁纸 / 写进方案都合适。',
            tpls: [
                ['不是{negA}，而是{posB}。'],
                ['你缺的不是{negA}，是{posB}。'],
                ['{posB}，从{start}开始。'],
                ['别怕{pain}，怕的是{negA}。']
            ],
            slots: {
                negA: ['等待', '逃避', '放弃', '天赋', '运气', '时间', '完美', '别人认可'],
                posB: ['出发', '直面', '坚持', '重复', '选择', '行动', '完成', '自我信任'],
                start: ['今天', '这一秒', '最小的一步', '写完第一行', '跑完第一公里'],
                pain: ['慢', '笨', '输', '犯错', '重来']
            }
        }
    ];

    let modeIdx = 0;

    const outList = document.getElementById('outList');

    function randItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function renderTpl(tpl, slots) {
        return tpl.replace(/\{(\w+)\}/g, function (_, slotKey) {
            const pool = slots[slotKey];
            if (!pool) return '【' + slotKey + '】';
            if (Array.isArray(pool)) return randItem(pool);
            return pool;
        });
    }

    function gen(count) {
        const mode = MODES[modeIdx];
        const items = [];
        for (let idx = 0; idx < count; idx++) {
            // 每条模板是「正文 + 可选分类标签」的数组，先拼回一句再填槽
            const parts = randItem(mode.tpls);
            items.push(renderTpl(parts.join(''), mode.slots));
        }
        outList.insertAdjacentHTML('beforeend', items.map((text, idx) =>
            '<div class="line"><span class="txt">' + CY.escapeHtml(text) +
            '</span><span class="ops"><button class="cy-icon-btn fav" data-t="' + CY.escapeHtml(text).replace(/"/g, '&quot;') + '" title="收藏">♥</button>' +
            '<button class="cy-icon-btn" data-c="' + CY.escapeHtml(text).replace(/"/g, '&quot;') + '" title="复制">📋</button></span></div>'
        ).join(''));
        bindLineBtns();
        // 成就/记录
        if (window.CY && CY.activity) CY.activity.add({ type: 'gen_copy', page: '2.html' });
        if (window.CY && CY.unlock) CY.unlock('copy_first');
    }

    function bindLineBtns() {
        outList.querySelectorAll('.line .ops .cy-icon-btn').forEach(btn => {
            if (btn.dataset.t) {
                btn.onclick = function () {
                    const list = JSON.parse(localStorage.getItem('cy_fav_copy') || '[]');
                    if (list.indexOf(this.dataset.t) >= 0) { CY.showToast('已在收藏中'); return; }
                    list.unshift(this.dataset.t);
                    localStorage.setItem('cy_fav_copy', JSON.stringify(list.slice(0, 80)));
                    CY.showToast('♥ 已收藏');
                };
            } else if (btn.dataset.c) {
                btn.onclick = function () {
                    navigator.clipboard.writeText(this.dataset.c).then(function () {
                        CY.showToast('已复制');
                        if (window.CY && CY.saveRecent) CY.saveRecent('cy_recent_copy', btn.dataset.c);
                    }).catch(function () {});
                };
            }
        });
    }

    function switchMode(i) {
        modeIdx = i;
        const tabs = document.getElementById('modeRow').querySelectorAll('.cy-tab');
        tabs.forEach(t => t.classList.remove('active'));
        tabs[i].classList.add('active');
        document.getElementById('modeDesc').textContent = MODES[i].desc;
        outList.innerHTML = '';
    }

    document.getElementById('modeRow').innerHTML = MODES.map((mode, idx) =>
        '<span class="cy-tab' + (idx === 0 ? ' active' : '') + '" data-i="' + idx + '">' + mode.name + '</span>'
    ).join('');
    document.getElementById('modeRow').querySelectorAll('.cy-tab').forEach(tab => {
        tab.onclick = function () { switchMode(parseInt(this.dataset.i)); };
    });

    document.getElementById('btnGen').onclick = function () { outList.innerHTML = ''; gen(6); };
    document.getElementById('btnMore').onclick = function () { gen(3); };
    document.getElementById('btnClear').onclick = function () { outList.innerHTML = ''; };
    document.getElementById('btnExport').onclick = function () {
        const texts = [];
        outList.querySelectorAll('.line .txt').forEach(el => texts.push(el.textContent));
        if (!texts.length) { CY.showToast('还没有生成内容'); return; }
        CY.download('文案工坊_' + Date.now() + '.txt', texts.join('\n\n'), 'text/plain;charset=utf-8');
        CY.showToast('已导出 ' + texts.length + ' 条');
    };

    /* 公共脚本 common.js / theme.js / cy-features.js 都是 defer 加载，而本段内联脚本不带 defer，
       会抢先执行——那时 CY 还没定义，gen() 里 CY.escapeHtml 抛 ReferenceError，首屏 6 条文案全是空的。
       把初始化挪到 DOMContentLoaded：defer 脚本在此事件之前一定已执行完。 */
    document.addEventListener('DOMContentLoaded', function () {
        switchMode(0);
        gen(6);
    });
    </script>
</body>
</html>
