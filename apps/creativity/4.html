<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本体检·深度文本分析｜创意引擎</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon-48.png">
    <link rel="canonical" href="https://your-name.github.io/creativity/4.html">
    <style>
        canvas.cloud { width: 100%; height: 260px; border-radius: 12px; border: 1px solid var(--zl-border); background: var(--zl-card-2); margin-top: 10px; }
        .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
    </style>

    <link rel="stylesheet" href="common.css">
    <script src="theme-init.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="创意引擎">
    <meta name="description" content="全方位文本体检：字数、词频、词云、阅读时长、朗读时长、情感倾向、可读性估算，一键导出体检报告。">
    <link rel="stylesheet" href="common.css">
    <script defer src="common.js"></script>
    <script defer src="theme.js"></script>
    <script defer src="cy-features.js"></script>
</head>
<body>

    <div class="bg-animation">
        <div class="bg-flow-1"></div>
        <div class="bg-flow-2"></div>
        <div class="bg-flow-3"></div>
    </div>

    <header class="cy-shell">
        <h1>创意引擎 · 文本体检</h1>
    </header>

    <main class="cy-page">
        <div class="cy-card">
            <h2>🔍 文本体检</h2>
            <div class="sub">粘贴任意文本，获得一套完整体检报告：规模、结构、高频词、情绪与可读性。所有分析都在本地完成。</div>
            <textarea class="cy-textarea" id="ta" style="min-height:170px;" placeholder="粘贴要分析的文本……"></textarea>
            <div class="cy-toolbar">
                <button class="cy-btn" id="btnRun">🩺 开始体检</button>
                <button class="cy-btn cy-btn-ghost" id="btnExample">📄 示例</button>
                <button class="cy-btn cy-btn-ghost" id="btnReport">💾 导出报告</button>
            </div>
        </div>

        <div class="cy-card" id="resCard" style="display:none;">
            <h2>📊 体检报告</h2>
            <div class="stat-row">
                <div class="cy-stat"><b id="sChar">0</b><span>总字符</span></div>
                <div class="cy-stat"><b id="sCjk">0</b><span>中文字数</span></div>
                <div class="cy-stat"><b id="sWord">0</b><span>英文单词</span></div>
                <div class="cy-stat"><b id="sLine">0</b><span>行数</span></div>
                <div class="cy-stat"><b id="sPara">0</b><span>段落</span></div>
                <div class="cy-stat"><b id="sRead">0</b><span>阅读时长</span></div>
                <div class="cy-stat"><b id="sSpeak">0</b><span>朗读时长</span></div>
                <div class="cy-stat"><b id="sDensity">0%</b><span>信息密度</span></div>
            </div>
            <h2 style="margin-top:20px;">📈 高频词 Top 8</h2>
            <div id="kwBox" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;"></div>
            <h2 style="margin-top:20px;">☁️ 词云</h2>
            <canvas class="cloud" id="cloud"></canvas>
            <h2 style="margin-top:20px;">🧭 情感与可读性</h2>
            <div id="senseBox" style="font-size:14px;line-height:2;color:var(--zl-text);margin-top:8px;"></div>
        </div>
    </main>

    <script>
    /* ========== 分析引擎 ========== */
    const POS_WORDS = ['喜欢', '热爱', '美好', '幸福', '快乐', '开心', '期待', '希望', '感谢', '温暖', '成功', '进步', '轻松', '健康', '满意', '惊喜', '赞', '优秀', '出色', '祝福', '顺利', '安心'];
    const NEG_WORDS = ['讨厌', '痛苦', '难过', '焦虑', '害怕', '愤怒', '失望', '失败', '糟糕', '困难', '危险', '压力', '孤独', '悲伤', '沮丧', '抱怨', '担心', '忧愁', '遗憾', '批评', '问题', '麻烦', '苦', '差'];

    function analyze(text) {
        const chars = text.length;
        const cjk = (text.match(/[\u4e00-\u9fff]/g) || []).length;
        const enWords = (text.match(/[a-zA-Z]+/g) || []).length;
        const lines = text.split('\n').filter(l => l.trim()).length;
        const paras = text.split(/\n\s*\n/).filter(p => p.trim()).length;
        // 阅读时长（中英混排：中文按 400 字/分钟，英文按 200 词/分钟）
        const readMin = (cjk / 400 + enWords / 200);
        const speakMin = (cjk / 260 + enWords / 130);
        // 词频（双字 + 单字，去停用字）
        const STOP = '的了是在和有都就着也还又而或与及把被但虽然而若则且因故于此其为从对向位于以上中之内的外间以'.split('');
        const freq = {};
        const cjkStr = text.replace(/[^\u4e00-\u9fff]/g, '');
        for (let idx = 0; idx < cjkStr.length - 1; idx++) {
            const big = cjkStr[idx] + cjkStr[idx + 1];
            if (!['我们','你们','他们','她们','它们','这个','那个','这些','那些','自己','一个','一种','可以','没有','不是','已经','但是','因为','所以','如果','虽然','而且','并且','或者','只是','就是','还是','通过','对于','关于','由于','其中','以及','例如','比如','随着','同时','此外','然后','之后','之前','今天','现在','目前'].includes(big)) {
                freq[big] = (freq[big] || 0) + 1;
            }
        }
        for (let idx = 0; idx < cjkStr.length; idx++) {
            const char = cjkStr[idx];
            if (STOP.indexOf(char) < 0) freq[char] = (freq[char] || 0) + 0.6;
        }
        const words = Object.keys(freq).sort((lhs, rhs) => freq[rhs] - freq[lhs]).filter(k => k.length > 1 || !/[\d]/.test(k));
        // 信息密度：非停用字占比
        const meaningful = cjkStr.split('').filter(char => STOP.indexOf(char) < 0).length;
        const density = cjk > 0 ? Math.round(meaningful / cjk * 100) : 0;
        // 情感
        let pos = 0, neg = 0;
        POS_WORDS.forEach(word => { pos += (text.match(new RegExp(word, 'g')) || []).length; });
        NEG_WORDS.forEach(word => { neg += (text.match(new RegExp(word, 'g')) || []).length; });
        let mood = '中性';
        if (pos > neg) mood = '偏积极 🙂';
        if (neg > pos) mood = '偏消极 😔';
        if (pos > neg * 2) mood = '积极向上 🌞';
        if (neg > pos * 2) mood = '低落沉重 🌧️';
        // 可读性：平均句长
        const sents = text.split(/[。！？!?…\n]+/).filter(s => s.trim());
        const avgLen = sents.length ? Math.round(text.length / sents.length) : 0;
        let level = '适中';
        if (avgLen > 60) level = '偏难（长句多，建议拆分）';
        if (avgLen < 20) level = '偏简单（短句为主，阅读轻快）';
        return {
            chars, cjk, enWords, lines, paras,
            readMin, speakMin, density, words: words.slice(0, 12), freq,
            mood, pos, neg, avgLen, level
        };
    }

    function fmtMin(minutes) {
        if (minutes < 0.5) return '不足 1 分钟';
        if (minutes < 60) return Math.round(minutes) + ' 分钟';
        return Math.floor(minutes / 60) + ' 小时 ' + Math.round(minutes % 60) + ' 分钟';
    }

    /* ========== 词云（Canvas） ========== */
    function drawCloud(words, freq) {
        const cv = document.getElementById('cloud');
        const dpr = window.devicePixelRatio || 1;
        const width = cv.clientWidth || 600, h = 260;
        cv.width = width * dpr; cv.height = h * dpr;
        cv.style.width = width + 'px'; cv.style.height = h + 'px';
        const ctx = cv.getContext('2d');
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, width, h);
        // 从主题取强调色
        const cs = getComputedStyle(document.documentElement);
        const accent = cs.getPropertyValue('--zl-accent').trim() || '#6366f1';
        const accent2 = cs.getPropertyValue('--zl-accent-2').trim() || '#22d3ee';
        const items = words.slice(0, 12).map(k => ({ k, f: freq[k] }));
        const max = Math.max.apply(null, items.map(item => item.f)) || 1;
        const placed = [];
        items.forEach((item, idx) => {
            let size = 14 + (item.f / max) * 26;
            let xPos = Math.random() * width * 0.8 + width * 0.1, y = Math.random() * h * 0.8 + h * 0.1;
            ctx.font = '900 ' + size + 'px "Microsoft YaHei","PingFang SC",sans-serif';
            const tw = ctx.measureText(item.k).width;
            // 简单碰撞：重试几次
            for (let attempt = 0; attempt < 40; attempt++) {
                let ok = true;
                for (const point of placed) {
                    if (Math.abs(point.x - xPos) < (point.w + tw) / 2 + 4 && Math.abs(point.y - y) < (point.h + size) / 2 + 4) { ok = false; break; }
                }
                if (ok) break;
                xPos = Math.random() * width * 0.8 + width * 0.1; y = Math.random() * h * 0.8 + h * 0.1;
            }
            placed.push({ x: xPos, y, w: tw, h: size });
            const hue = (idx * 37 + 230) % 360;
            ctx.fillStyle = 'hsl(' + hue + ', 70%, 60%)';
            if (idx % 3 === 0) ctx.fillStyle = accent;
            if (idx % 3 === 1) ctx.fillStyle = accent2;
            ctx.fillText(item.k, xPos, y);
        });
    }

    /* ========== 主流程 ========== */
    const EXAMPLE = '人工智能正在深刻改变我们的生活方式。据统计，超过六成的企业已经在业务流程中引入智能技术，而三年前这个数字还不到两成。智能客服让服务响应时间从平均五分钟缩短到三十秒，显著提升了用户体验。\n\n在教育领域，自适应学习系统能够根据答题情况动态调整题目难度，真正实现因材施教。偏远地区的学校通过远程课堂，第一次享受到了名师资源。\n\n但技术发展也带来挑战。数据隐私问题日益突出，算法歧视的风险不容忽视，部分岗位面临被替代的压力。专家建议在拥抱技术的同时加快完善法规，加强公民数字素养教育。\n\n未来十年，人工智能将与医疗、制造、农业深度融合。谁先掌握人与技术协同的能力，谁就将在下一轮竞争中占据先机。';

    const ta = document.getElementById('ta');
    let lastRes = null;

    function run() {
        const text = ta.value.trim();
        if (!text) { CY.showToast('请先粘贴文本'); return; }
        const result = analyze(text);
        lastRes = result;
        document.getElementById('sChar').textContent = result.chars;
        document.getElementById('sCjk').textContent = result.cjk;
        document.getElementById('sWord').textContent = result.enWords;
        document.getElementById('sLine').textContent = result.lines;
        document.getElementById('sPara').textContent = result.paras;
        document.getElementById('sRead').textContent = fmtMin(result.readMin);
        document.getElementById('sSpeak').textContent = fmtMin(result.speakMin);
        document.getElementById('sDensity').textContent = result.density + '%';
        document.getElementById('kwBox').innerHTML = result.words.slice(0, 8).map(k =>
            '<span class="kw"><b>' + Math.round(result.freq[k] * 10) / 10 + '</b>' + CY.escapeHtml(k) + '</span>'
        ).join('');
        document.getElementById('senseBox').innerHTML =
            '情感倾向：<b style="color:var(--zl-accent);">' + result.mood + '</b>（积极词 ' + result.pos + ' · 消极词 ' + result.neg + '）<br>' +
            '平均句长：约 ' + result.avgLen + ' 字/句 → 阅读难度：' + result.level + '<br>' +
            '信息密度：' + result.density + '%（去掉「的、了、是」等虚字后实词占比，越高越干货）';
        document.getElementById('resCard').style.display = '';
        drawCloud(result.words, result.freq);
        if (window.CY && CY.activity) CY.activity.add({ type: 'text_check', page: '4.html' });
        CY.showToast('体检完成');
    }

    function buildReport() {
        if (!lastRes) return;
        const result = lastRes;
        return ['【文本体检报告】',
            '生成时间：' + new Date().toLocaleString(),
            '',
            '—— 规模 ——',
            '总字符：' + result.chars,
            '中文字数：' + result.cjk,
            '英文单词：' + result.enWords,
            '行数：' + result.lines,
            '段落数：' + result.paras,
            '',
            '—— 时长 ——',
            '预计阅读：' + fmtMin(result.readMin),
            '预计朗读：' + fmtMin(result.speakMin),
            '',
            '—— 高频词 ——',
            result.words.slice(0, 8).map(k => k + '（' + Math.round(result.freq[k] * 10) / 10 + '）').join('、'),
            '',
            '—— 情感 ——',
            '倾向：' + result.mood,
            '积极词：' + result.pos + ' / 消极词：' + result.neg,
            '',
            '—— 可读性 ——',
            '平均句长：' + result.avgLen + ' 字/句',
            '难度：' + result.level,
            '信息密度：' + result.density + '%'
        ].join('\n');
    }

    document.getElementById('btnRun').onclick = run;
    document.getElementById('btnExample').onclick = function () { ta.value = EXAMPLE; ta.focus(); run(); };
    document.getElementById('btnReport').onclick = function () {
        const rep = buildReport();
        if (!rep) { CY.showToast('先体检一次再导出'); return; }
        CY.download('文本体检报告.txt', rep, 'text/plain;charset=utf-8');
        CY.showToast('报告已导出');
    };

    /* 冒烟辅助 */
    if (!('analyze' in window)) window.analyze = analyze;
    if (!('drawCloud' in window)) window.drawCloud = drawCloud;
    </script>
</body>
</html>
