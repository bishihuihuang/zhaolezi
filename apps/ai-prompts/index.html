<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 提示词库</title>
<link rel="icon" href="./favicon.svg">
<link rel="manifest" href="./manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6f7fd">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:radial-gradient(ellipse 70% 45% at 50% -6%, rgba(255,107,107,.10), rgba(124,92,255,.08), transparent 72%), radial-gradient(ellipse 34% 28% at 14% 20%, rgba(255,107,107,.16), transparent 70%), radial-gradient(ellipse 30% 26% at 84% 16%, rgba(246,211,101,.18), transparent 70%), radial-gradient(ellipse 32% 26% at 78% 80%, rgba(56,239,125,.13), transparent 70%), radial-gradient(ellipse 36% 28% at 16% 78%, rgba(124,92,255,.15), transparent 70%), #f6f7fd;
  display:flex;align-items:center;justify-content:center;
  font-family:"Segoe UI","Microsoft YaHei",sans-serif;
  color:#23263a;-webkit-font-smoothing:antialiased;
}
#stars{position:fixed;inset:0;z-index:0}
.wrap{position:relative;z-index:1;text-align:center;transform:translateY(-5vh);padding:0 20px}
.logo{
  width:86px;height:86px;margin:0 auto 28px;border-radius:24px;
  background:linear-gradient(135deg,#fbe08b 0%,#f6c453 40%,#d99a2b 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:44px;box-shadow:0 16px 46px rgba(240,170,60,.38),inset 0 1px 0 rgba(255,255,255,.4);
  animation:logoIn .95s cubic-bezier(.2,1.5,.4,1) both;
}
@keyframes logoIn{0%{transform:scale(.35) rotate(-14deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.title{
  font-size:34px;font-weight:700;letter-spacing:7px;
  background:linear-gradient(90deg,#ff6b6b 0%,#f6d365 30%,#38ef7d 60%,#7c5cff 100%);
  background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:titleIn 1.05s .18s ease both,shimmer 3.4s 1.3s ease-in-out infinite;
}
@keyframes titleIn{0%{opacity:0;transform:translateY(24px);filter:blur(9px)}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes shimmer{0%,100%{background-position:0% 0}50%{background-position:-220% 0}}
.sub{
  margin-top:15px;font-size:13px;letter-spacing:3px;color:#6b7086;opacity:0;
  animation:fadeIn .9s .55s ease both;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bar-wrap{
  margin:38px auto 0;width:210px;height:3px;border-radius:2px;
  background:rgba(110,110,180,.18);overflow:hidden;
}
.bar{
  height:100%;width:100%;border-radius:2px;
  background:linear-gradient(90deg,#f6d365,#e0b13c);
  transform:scaleX(0);transform-origin:left;
  animation:load 1.65s .6s cubic-bezier(.65,0,.35,1) forwards;
}
@keyframes load{to{transform:scaleX(1)}}
.hint{margin-top:20px;font-size:11px;color:#8a8fa3;letter-spacing:2px;opacity:0;animation:fadeIn .8s 1.1s ease both}
.dot{display:inline-block;animation:blink 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.18s}.dot:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.15}30%{opacity:1}}
@media (max-width:480px){
  .title{font-size:26px;letter-spacing:5px}
  .logo{width:70px;height:70px;font-size:36px}
  .sub{font-size:11px;letter-spacing:2px}
}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="wrap">
  <div class="logo">✨</div>
  <div class="title">AI 提示词库</div>
  <div class="sub">集中管理 · 标签分类 · 状态标记 · 导出备份</div>
  <div class="bar-wrap"><div class="bar"></div></div>
  <div class="hint">正在进入<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
</div>
<script>
(function(){
  var c=document.getElementById('stars'),x=c.getContext('2d'),w,h,pts=[];
  function rs(){
    w=c.width=innerWidth;h=c.height=innerHeight;
    pts=Array.from({length:Math.min(90,Math.round(w*h/26000))},function(){
      return{x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.7+.4,v:Math.random()*.5+.25,o:Math.random()};
    });
  }
  addEventListener('resize',rs);rs();
  (function dr(){
    x.clearRect(0,0,w,h);
    for(var i=0;i<pts.length;i++){
      var p=pts[i];p.y-=p.v;
      if(p.y<-4){p.y=h+4;p.x=Math.random()*w;}
      x.beginPath();x.arc(p.x,p.y,p.r,0,7);
      var starColors=[[255,107,107],[246,211,101],[56,239,125],[124,92,255],[56,189,248]];x.fillStyle='rgba('+starColors[i%starColors.length][0]+','+starColors[i%starColors.length][1]+','+starColors[i%starColors.length][2]+','+(0.30+0.5*p.o).toFixed(2)+')';
      x.fill();
    }
    requestAnimationFrame(dr);
  })();
  // 修缮 2026-10-04：注册 Service Worker（须在会话判断之前，保证每次入口访问都注册）
  if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){navigator.serviceWorker.register("./sw.js").catch(function(){});}
  // 修缮 2026-10-04：本次会话已看过开场动画则直接进入，不再重复等待
  var seen=false;try{seen=!!sessionStorage.getItem('splashShown');sessionStorage.setItem('splashShown','1');}catch(e){}
  if(seen){location.replace('./AI提示词系统/AI提示词管理.html');return;}
  setTimeout(function(){document.body.style.transition='opacity .75s ease';document.body.style.opacity='0';},2100);
  setTimeout(function(){location.replace('./AI提示词系统/AI提示词管理.html');},2950);
})();
</script>

<script>
/* ========== 全站统一跳转动画（跨 5 站共享，2026-10-11） ==========
 * 用户点击"跳向本站任意 HTML"的按键时，统一显示 zhaolezi 圆环转圈动画。
 * 中心文字规则：
 *   - 跳 index.html → 按当前站点品牌显示（zhaolezi=找乐子 / creativity=创意引擎 /
 *                     xiandaihua=现代化 / all-file-saver=全能文件保存 / ai-prompts=AI 提示词库）
 *   - 其他跳转 → 目标 HTML 的 <title> 剥离品牌名后取最长段
 * 实现方式：全局 click 捕获阶段拦截 <a href="*.html"> 和 onclick="location.*='***.html'>"。
 * 不改 HTML、不删旧动画代码，纯增量 hook。启动屏自动跳转（setTimeout 内）不拦截。 */
(function(){
    if(window.__JUMP_ANIM_INIT__) return;
    window.__JUMP_ANIM_INIT__ = true;
    var STYLE_ID = 'zl-jump-anim-style';
    var OVERLAY_ID = 'zl-jump-overlay';
    var jumpLocked = false;

    function ensureStyle(){
        if(document.getElementById(STYLE_ID)) return;
        var s = document.createElement('style');
        s.id = STYLE_ID;
        s.textContent = '#'+OVERLAY_ID+'{position:fixed;inset:0;z-index:2147483647;background:rgba(6,8,24,.72);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;pointer-events:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;}'
            +'#'+OVERLAY_ID+'.active{opacity:1;visibility:visible;pointer-events:auto;}'
            +'.zl-jump-wrap{position:relative;width:180px;height:180px;display:flex;align-items:center;justify-content:center;flex-direction:column;}'
            +'.zl-jump-ring{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;border:3px solid rgba(255,255,255,.14);border-top-color:#38ef7d;animation:zlJumpSpin .9s linear infinite;box-shadow:0 0 32px rgba(56,239,125,.25);}'
            +'@keyframes zlJumpSpin{to{transform:rotate(360deg)}}'
            +'.zl-jump-label{margin-top:26px;font-size:16px;color:#fff;letter-spacing:.05em;font-weight:500;text-align:center;max-width:280px;word-break:break-word;line-height:1.4;}'
            +'@media (prefers-reduced-motion:reduce){.zl-jump-ring{animation-duration:2s}}';
        document.head.appendChild(s);
    }
    function ensureOverlay(){
        var o = document.getElementById(OVERLAY_ID);
        if(!o){
            o = document.createElement('div');
            o.id = OVERLAY_ID;
            o.innerHTML = '<div class="zl-jump-wrap"><div class="zl-jump-ring"></div><div class="zl-jump-label">跳转中...</div></div>';
            (document.body||document.documentElement).appendChild(o);
        }
        return o;
    }
    function pickBrandForIndex(){
        var p = (window.location.pathname||'').toLowerCase();
        if(p.indexOf('zhaolezi') >= 0) return '找乐子';
        if(p.indexOf('creativity') >= 0) return '创意引擎';
        if(p.indexOf('xiandaihua') >= 0) return '现代化';
        if(p.indexOf('all-file-saver') >= 0) return '全能文件保存';
        if(p.indexOf('ai-prompts') >= 0) return 'AI 提示词库';
        return '找乐子';
    }
    function extractTitle(text){
        var m = text.match(/<title[^>]*>([^<]+)<\/title>/i);
        return m ? m[1].trim() : '';
    }
    function cleanTitleForLabel(title, fallback){
        var brands = ['找乐子','现代化·知识学习站','AI 提示词库','AI提示词库','创意引擎','全能文件保存','现代化','创意'];
        var t = title;
        for(var i=0;i<brands.length;i++){ t = t.split(brands[i]).join(' '); }
        var segs = t.split(/[\-|｜·•—–]+|\s{2,}/).map(function(s){return s.trim();}).filter(Boolean);
        segs.sort(function(a,b){return b.length - a.length;});
        return segs[0] || fallback;
    }
    function showJump(target){
        if(jumpLocked) return;
        jumpLocked = true;
        ensureStyle();
        var o = ensureOverlay();
        var labelEl = o.querySelector('.zl-jump-label');
        var fallback = target.replace(/\?.*$/,'').replace(/\.html$/,'');
        if(/(^|\/)index\.html(\?|$)/i.test(target)){
            labelEl.textContent = pickBrandForIndex();
        } else {
            labelEl.textContent = '跳转中...';
            fetch(target, {cache:'force-cache'}).then(function(r){ return r.text(); })
                .then(function(html){
                    var t = extractTitle(html);
                    if(t) labelEl.textContent = cleanTitleForLabel(t, fallback);
                })
                .catch(function(){ /* 保留"跳转中..." */ });
        }
        o.classList.add('active');
        setTimeout(function(){
            jumpLocked = false;
            window.location.href = target;
        }, 900);
    }
    document.addEventListener('click', function(e){
        if(jumpLocked) return;
        // 1. 拦截 <a href="*.html">
        var a = e.target.closest && e.target.closest('a[href]');
        if(a){
            var href = a.getAttribute('href') || '';
            if(/\.(html|htm)(\?|$)/i.test(href) && !/^https?:\/\//i.test(href) && !href.startsWith('/') && !href.startsWith('#') && !href.startsWith('mailto:')){
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                showJump(href);
                return;
            }
        }
        // 2. 拦截 onclick 里含 location.*= 或 location.replace()/assign() 的按钮
        var btn = e.target.closest && e.target.closest('[onclick]');
        if(btn){
            var oc = btn.getAttribute('onclick') || '';
            var m = oc.match(/(?:location\.href\s*=\s*["']([^"']+\.html[^"']*)["']|location\.replace\(\s*["']([^"']+\.html[^"']*)["']\s*\)|location\.assign\(\s*["']([^"']+\.html[^"']*)["']\s*\)|window\.location\s*=\s*["']([^"']+\.html[^"']*)["'])/i);
            if(m){
                var t = (m[1]||m[2]||m[3]||m[4]||'');
                if(t && !/^https?:\/\//i.test(t) && !t.startsWith('/')){
                    e.preventDefault();
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                    showJump(t);
                }
            }
        }
    }, true);
})();
/* ========== 全站统一跳转动画 结束 ========== */

</script>
</body>
</html>
