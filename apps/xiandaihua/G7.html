<script>
/* ============================================================
 * 模块G结业测验（页面内联脚本，借 XD.quiz 引擎统一渲染/评分）
 * 题目数据即文案：q / opts / a / exp 逐字保留；错题自动入错题本
 * ============================================================ */
document.addEventListener('DOMContentLoaded', function () {
    if (!window.XD || !XD.quiz) return;
    XD.quiz.run('quiz', {
        id: 'G',
        title: '模块G测验：怎么开发网页',

        /* ---- 题目清单（10 题，q/opts/a/exp 逐字保留） ---- */
        questions: [
            {
                q: 'HTML、CSS、JavaScript 三件套的分工是？',
                opts: ['HTML 样式、CSS 结构、JS 内容', 'HTML 结构、CSS 样式、JS 行为', 'HTML 行为、CSS 内容、JS 结构', '三者都可以互相替代'],
                a: 1,
                exp: '骨架/皮肤/肌肉：HTML 摆结构，CSS 做样式，JS 管交互。'
            },
            {
                q: 'HTML 文档中，保证中文不乱码的关键标签是？',
                opts: ['<title>网页标题</title>', '<meta charset="UTF-8">', '<h1>标题</h1>', '<br>'],
                a: 1,
                exp: 'charset="UTF-8" 声明字符编码，中文显示不乱码（A4 编码课也讲过）。'
            },
            {
                q: '要在页面显示一张图片，正确的写法是？',
                opts: ['<img src="a.png" alt="说明">', '<image src="a.png">', '<pic>a.png</pic>', '<img href="a.png">'],
                a: 0,
                exp: 'img 用 src 指定图片地址，alt 是备选文字；href 是链接用的属性。'
            },
            {
                q: 'CSS 中，class="card" 的元素该用什么选择器？',
                opts: ['#card', 'card', '.card', '*card*'],
                a: 2,
                exp: '类选择器用 . 开头（.card）；id 选择器用 # 开头。'
            },
            {
                q: '盒模型从外到内的顺序是？',
                opts: ['内容 → padding → border → margin', 'margin → border → padding → 内容', 'border → margin → 内容 → padding', 'padding → margin → border → 内容'],
                a: 1,
                exp: '外到内：margin（外边距）→ border（边框）→ padding（内边距）→ 内容。'
            },
            {
                q: '把几个元素水平排成一行，最常用的 CSS 方案是？',
                opts: ['display: flex', 'display: block', 'font-size: 0', 'float: center'],
                a: 0,
                exp: 'Flex（display: flex）配合 justify-content / gap 等，是现代网页排布局的主流方案。'
            },
            {
                q: '让按钮点击后弹出提示框，正确的 JS 写法是？',
                opts: ['btn.onClick = alert()', 'btn.addEventListener("click", function(){ alert("你好"); })', 'btn.click(alert)', '<button event="alert()">'],
                a: 1,
                exp: '用 addEventListener 绑定 click 事件，回调里执行 alert。'
            },
            {
                q: '用 JS 修改 id 为 myBox 的元素文字，正确的是？',
                opts: ['getElementById("myBox").textContent = "新内容"', 'getElementById(myBox) = "新内容"', 'document.write(myBox) = "新内容"', 'myBox.innerHTML = 新内容'],
                a: 0,
                exp: 'document.getElementById("myBox") 取到元素，再用 textContent 改文字。'
            },
            {
                q: '网页图片显示"裂图"，最可能的原因是？',
                opts: ['CSS 选择器写错', 'img 的 src 路径错误或文件不存在', 'JS 代码有语法错误', '浏览器版本太旧'],
                a: 1,
                exp: '裂图=图片没加载到。打开 F12 → Network，红色 404 条目就是原因。'
            },
            {
                q: '把本地写好的网页发布到 GitHub Pages，最后一步是？',
                opts: ['git init', '仓库 Settings → Pages 选择分支 main 并保存', 'git config --global', '重装浏览器'],
                a: 1,
                exp: '推送完成后，去 Settings → Pages 开启部署（branch: main, /(root)），等 1-2 分钟就上线。'
            }
        ]
    });
});
</script>
