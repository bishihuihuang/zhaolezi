    .term-input-row { display: flex; gap: 8px; align-items: center; background: #101423; border-radius: 0 0 12px 12px; padding: 10px 14px; margin-top: -14px; margin-bottom: 14px; border: 1px solid rgba(255,255,255,.08); border-top: none; }

    <article class="lesson container">

        <div class="callout info">
            <b>怎么玩</b>
            这是一个<strong>模拟终端</strong>：按提示在下方输入真实的 git 命令（如 <code>git init</code>），回车"执行"。完成全部 7 关即练熟核心命令。提示词里带 <code>？</code> 的地方可以用任意内容，比如 <code>git commit -m "第一版"</code>。
        </div>

                <span id="stageTitle">第 1 关 / 7</span>

            <div class="term-input-row">
                <span class="ps">$&nbsp;</span>

<script>
/* ============================================================
 * Git 命令演练场（页面内联脚本，立即执行）
 * 模拟终端闯关：init/status/add/commit/log/remote/push 七关，
 * 进度存 localStorage（xd_git_lab_v1），通关即记录一次练习
 * ============================================================ */
(function () {
    var termOut = document.getElementById('termOut');
    var cmdInput = document.getElementById('cmdInput');
    var stageTitle = document.getElementById('stageTitle');
    var stageTag = document.getElementById('stageTag');
    var stageHint = document.getElementById('stageHint');
    var resetBtn = document.getElementById('resetBtn');
    var skipBtn = document.getElementById('skipBtn');

    /* 关卡定义：match 是正则，允许用户自由发挥的部分用 .* */
    var LEVELS = [
        { hint: '把当前目录变成一个 Git 仓库（第 2 课讲过）。', match: /^git init$/, ans: 'git init', echo: 'Initialized empty Git repository in /my-site/.git/' },
        { hint: '看看当前仓库的状态（哪个文件改了、还没提交）。', match: /^git status$/, ans: 'git status', echo: 'On branch main\nnothing to commit, working tree clean' },
        { hint: '把改动的文件放进"购物车"（暂存区）。试过 add 某个文件或 add . 吗？', match: /^git add (\.|[^ ]+)$/, ans: 'git add .', echo: '  1 file changed, 5 insertions(+)' },
        { hint: '给暂存的内容拍一张快照，记得带说明，例如 -m "第一版"。', match: /^git commit -m "?.*"?$/, ans: 'git commit -m "第一版"', echo: '[main 4f3a2b1] 第一版\n 1 file changed, 5 insertions(+)' },
        { hint: '看一眼提交历史，精简模式试试 --oneline。', match: /^git log( --oneline)?$/, ans: 'git log --oneline', echo: '4f3a2b1 第一版 (HEAD -> main)' },
        { hint: '关联远程仓库 origin，地址是 https://github.com/bishihuihuang/xiandaihua.git（第 4、5 课）。', match: /^git remote add origin https:\/\/github\.com\/[^ ]+\/[^ ]+\.git$/, ans: 'git remote add origin https://github.com/bishihuihuang/xiandaihua.git', echo: '（无输出，表示成功）' },
        { hint: '最后把本地提交推送到远程，-u 记住分支。', match: /^git push( -u origin main)?$/, ans: 'git push -u origin main', echo: 'To https://github.com/bishihuihuang/xiandaihua.git\n * [new branch] main -> main' }
    ];

    var KEY = 'xd_git_lab_v1';
    var step = 0;
    var log = [];

    function save() { try { localStorage.setItem(KEY, String(step)); } catch (e) {} }
    function load() { try { var v = localStorage.getItem(KEY); step = v ? parseInt(v, 10) || 0 : 0; } catch (e) { step = 0; } }
    function render() {
        if (step >= LEVELS.length) {
            stageTitle.textContent = '🎉 全部通关！';
            stageHint.innerHTML = '你已经练熟 init / status / add / commit / log / remote / push 七大命令。去 <a href="F5.html">F5 上传网页全流程</a> 实战一次，或重玩巩固肌肉记忆。';
            termOut.innerHTML = log.join('\n') + (log.length ? '\n' : '') + '<span class="done-line">✔ 恭喜完成 Git 命令演练场！</span>';
            if (window.XD && XD.studyLog) XD.studyLog.add({ type: 'practice', itemId: 'F6', mod: 'F' });
            stageTag.textContent = '已通关 🏆';
            return;
        }
        var lv = LEVELS[step];
        stageTitle.textContent = '第 ' + (step + 1) + ' 关 / ' + LEVELS.length;
        stageTag.textContent = '进度 ' + Math.round(step / LEVELS.length * 100) + '%';
        stageHint.innerHTML = lv.hint;
        termOut.innerHTML = log.join('\n') + (log.length ? '\n' : '') + '<span class="t-dim">— 等你在下方输入命令 —</span>';
        cmdInput.value = '';
        cmdInput.focus();
    }
    function printLine(html) { log.push(html); }
    function resetAll() {
        log = [];
        step = 0;
        try { localStorage.removeItem(KEY); } catch (e) {}
        render();
    }
    function doCommand(raw) {
        var v = (raw || '').trim();
        if (!v) return;
        printLine('<span class="t-in">$ ' + XD.escapeHtml(v) + '</span>');
        var lv = LEVELS[step];
        if (lv && lv.match.test(v)) {
            printLine(XD.escapeHtml(lv.echo));
            step++;
            save();
            render();
        } else {
            var msg = 'bash: ' + XD.escapeHtml(v.split(' ')[0]) + ': command not found';
            if (/^git [a-z]+/.test(v)) msg = '😅 命令不对，看看提示：需要的是「' + XD.escapeHtml(lv.ans) + '」';
            printLine('<span class="t-err">' + msg + '</span>');
            render();
        }
    }

    cmdInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); doCommand(cmdInput.value); }
    });
    resetBtn.addEventListener('click', resetAll);
    skipBtn.addEventListener('click', function () {
        var lv = LEVELS[step];
        if (!lv) return;
        printLine('<span class="t-in">$ ' + XD.escapeHtml(lv.ans) + '</span>');
        printLine(XD.escapeHtml(lv.echo));
        step++;
        save();
        render();
    });

    load();
    render();
})();
</script>
</body>
