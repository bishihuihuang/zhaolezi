    ];
    var CATS = ['全部', '硬件', '软件', '网络', '手机', '安全', 'AI', '办公'];
    var curCat = '全部', kw = '';

    var grid = document.getElementById('termGrid');
    var chips = document.getElementById('termChips');
    var input = document.getElementById('termSearch');
    var hint = document.getElementById('termCount');
    var emptyBox = document.getElementById('termEmpty');
    document.getElementById('termTotal').textContent = TERMS.length;

    function renderChips() {
        var h = '';
        for (var i = 0; i < CATS.length; i++) {
            h += '<button type="button" class="term-chip' + (CATS[i] === curCat ? ' on' : '') + '" data-c="' + CATS[i] + '">' + CATS[i] + '</button>';
        }
        chips.innerHTML = h;
        chips.querySelectorAll('.term-chip').forEach(function (b) {
            b.addEventListener('click', function () {
                curCat = b.getAttribute('data-c');
                renderChips();
                renderGrid();
            });
        });
    }
    function renderGrid() {
        var k = kw.toLowerCase();
        var list = TERMS.filter(function (t) {
            if (curCat !== '全部' && t.c !== curCat) return false;
            if (!k) return true;
            return (t.t + ' ' + t.d + ' ' + t.c).toLowerCase().indexOf(k) >= 0;
        });
        hint.textContent = list.length;
        if (!list.length) {
            grid.innerHTML = '';
            emptyBox.style.display = '';
            return;
        }
        emptyBox.style.display = 'none';
        var h = '';
        for (var i = 0; i < list.length; i++) {
            var t = list[i];
            h += '<div class="term-card"><b><span class="term-ic">' + t.ic + '</span>' + XD.escapeHtml(t.t) + '</b>' +
                '<p>' + XD.escapeHtml(t.d) + '</p>' +
                '<span class="t-cat">' + t.c + '</span></div>';
        }
        grid.innerHTML = h;
    }
