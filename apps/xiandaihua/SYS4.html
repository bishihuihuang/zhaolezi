    ];

    var grid = document.getElementById('sceneGrid');
    var search = document.getElementById('sceneSearch');
    var empty = document.getElementById('sceneEmpty');
    var count = document.getElementById('sceneCount');
    var allBtn = document.getElementById('sceneAll');
    var lastQ = '';

    function render(q) {
        q = (q || '').trim().toLowerCase();
        var list = SCENES;
        if (q) {
            list = [];
            for (var i = 0; i < SCENES.length; i++) {
                var s = SCENES[i];
                var hay = (s.n + ' ' + s.k).toLowerCase();
                if (hay.indexOf(q) >= 0) list.push(s);
            }
        }
        var h = '';
        for (var j = 0; j < list.length; j++) {
            var sc = list[j];
            h += '<div class="scene-card"><b><span class="scene-ic">' + sc.ic + '</span>' + XD.escapeHtml(sc.n) + '</b><div class="scene-links">';
            for (var m = 0; m < sc.links.length; m++) {
                h += '<a class="scene-link" href="' + sc.links[m][0] + '">' + XD.escapeHtml(sc.links[m][1]) + '</a>';
            }
            h += '</div></div>';
        }
        grid.innerHTML = h;
        count.textContent = list.length;
        empty.style.display = q && !list.length ? '' : 'none';
    }

    search.addEventListener('input', function () { render(search.value); });
    if (allBtn) allBtn.addEventListener('click', function () { if (window.XD && XD.search) XD.search.open(); });
    render('');
});
