<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="description" content="成就徽章墙：26 枚徽章记录你的学习里程碑——读完第一课、完成模块、测验满分、打字提速、连续三天……">
<link rel="icon" href="favicon.svg">

<link rel="stylesheet" href="common.css">

<style>
    .ach-summary { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 16px 0 20px; }
    .ach-ring { width: 74px; height: 74px; border-radius: 50%; background: conic-gradient(var(--btn-grad) var(--ring-p, 0%), var(--card-2) 0); display: flex; align-items: center; justify-content: center; position: relative; flex: none; }
    .ach-ring::after { content: ''; position: absolute; inset: 8px; background: var(--card); border-radius: 50%; }
    .ach-ring b { position: relative; z-index: 1; font-size: 17px; color: var(--txt); }
    .ach-sum-text b { font-size: 17px; color: var(--blue); }
    .ach-sum-text span { font-size: 13px; color: var(--dim); display: block; }
    .ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
    .ach-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 14px; text-align: center; transition: transform .15s ease, box-shadow .15s ease; }
    .ach-card.locked { opacity: .55; filter: grayscale(.85); }
    .ach-card .ico { font-size: 30px; display: block; margin-bottom: 6px; }
    .ach-card b { display: block; font-size: 14.5px; color: var(--txt); }
    .ach-card span { font-size: 12px; color: var(--dim); display: block; margin-top: 4px; line-height: 1.5; }
    .ach-card .date { font-size: 11.5px; color: var(--green); margin-top: 6px; }
    .ach-card.locked .date { color: var(--dim); }
    .ach-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0, 0, 0, .12); }
</style>
</head>
<body data-page="42.html" data-kind="doc">
<div class="bg-animation">
    <div class="bg-flow-1"></div><div class="bg-flow-2"></div><div class="bg-flow-3"></div>
    <div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div><div class="orb orb-4"></div><div class="orb orb-5"></div>
</div>

<header class="site-header">
    <a class="home-link" href="index.html">🏠 首页</a>
    <span class="site-title">现代化·知识学习站</span>
    <span class="mod-badge">学习系统 · 成就</span>
</header>

<main>
    <article class="lesson container">
        <h1 class="lesson-title">🏅 成就徽章墙</h1>
        <p class="lesson-sub">学习路上的小里程碑，点亮它们吧</p>

        <div class="callout tip">
            <b>💡 怎么解锁？</b>
            读完第一课、学完整个模块、测验满分、快捷键答对 50 题、打字到 80 字/分钟、连续学习 3 天……<strong>该做的做完了，徽章自动点亮</strong>，不需要任何额外操作。
        </div>

        <div class="ach-summary" id="achSummary"></div>
        <div class="ach-grid" id="achGrid"></div>

        <div class="lesson-footer" style="margin-top:24px;padding-top:14px;border-top:1px solid var(--line);color:var(--dim);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
            <span>🏅 解锁即自动保存</span>
            <span>仪表盘：<a href="41.html">看进度</a> · 测验中心：<a href="43.html">去刷题</a></span>
        </div>
        <nav class="lesson-nav" id="xdPrevNext" style="margin-top:14px;"><!-- JS 渲染前后页 --></nav>
    </article>
</main>

<script>
/* ============================================================
 * 成就徽章墙（页面内联脚本）
 * 汇总环 + 徽章卡片墙，解锁即自动记录时间并实时刷新
 * ============================================================ */
document.addEventListener('DOMContentLoaded', function () {
    if (!window.XD || !XD.achieve) return;
    function render() {
        var list = XD.achieve.list();
        var got = 0;
        for (var i = 0; i < list.length; i++) if (list[i].at) got++;
        var ring = document.getElementById('achSummary');
        var pct = Math.round(got / list.length * 100);
        ring.innerHTML = '<div class="ach-ring" style="--ring-p:' + pct + '%;"><b>' + got + '/' + list.length + '</b></div>' +
            '<div class="ach-sum-text"><b>' + pct + '% 已点亮</b>' +
            '<span>解锁徽章会在右下角弹出提示，并自动记录时间。</span></div>';

        var box = document.getElementById('achGrid');
        var html = '';
        for (var k = 0; k < list.length; k++) {
            var a = list[k];
            html += '<div class="ach-card' + (a.at ? '' : ' locked') + '">' +
                '<span class="ico">' + (a.at ? a.icon : '🔒') + '</span>' +
                '<b>' + XD.escapeHtml(a.t) + '</b>' +
                '<span>' + XD.escapeHtml(a.d) + '</span>' +
                '<span class="date">' + (a.at ? '✅ ' + XD.fmtDate(new Date(a.at)) : '未解锁') + '</span></div>';
        }
        box.innerHTML = html;
    }
    render();
    if (XD.on) XD.on('achieve.unlocked', render);
});
</script>
</body>
</html>
