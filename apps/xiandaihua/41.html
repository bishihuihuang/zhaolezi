<style>
    .dash-stat { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 18px 0; }
    .stat-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; text-align: center; }
    .stat-card b { display: block; font-size: 26px; color: var(--blue); margin: 4px 0 2px; }
    .stat-card span { font-size: 12.5px; color: var(--dim); }
    .stat-card .big-num { font-size: 30px; }
    .mod-prog { margin: 10px 0; }
    .mod-prog .mp-top { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
    .mod-prog .mp-top b { color: var(--txt); }
    .mod-prog .mp-top a { text-decoration: none; }
    .mod-prog .mp-top .pct { color: var(--dim); font-weight: 700; }
    .prog-track { height: 10px; background: var(--card-2); border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
    .prog-fill { height: 100%; background: var(--btn-grad); border-radius: 6px; transition: width .6s ease; }
    .quiz-table { width: 100%; }
    .quiz-table th, .quiz-table td { padding: 10px 12px; }
    .recent-list { margin: 0; padding: 0; list-style: none; }
    .recent-list li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
    .recent-list li:last-child { border-bottom: none; }
    .recent-list .t { color: var(--dim); flex: none; }
    .recent-list .badge-type { flex: none; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: rgba(102, 126, 234, .12); color: var(--blue); }
    .recent-list a { color: var(--txt); text-decoration: none; }
    .recent-list a:hover { color: var(--blue); text-decoration: underline; }
    .fav-del { flex: none; border: none; background: rgba(229, 57, 53, .1); color: var(--red); width: 26px; height: 26px;
        border-radius: 50%; cursor: pointer; font-size: 12px; line-height: 1; transition: background .15s; }
    .fav-del:hover { background: rgba(229, 57, 53, .22); }
    .empty-hint { color: var(--dim); font-size: 13.5px; padding: 12px 0; }
    .dash-section h2 { font-size: 17px; margin: 26px 0 6px; }
    .t-green { color: var(--green); font-weight: 700; }
    .t-red { color: var(--red); font-weight: 700; }
    .t-dim { color: var(--dim); }
    .task-goal { margin-bottom: 12px; padding: 10px 12px; background: var(--card-2); border: 1.5px solid var(--line); border-radius: 12px; }
    .task-goal-top { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
    .task-goal-top b { color: var(--gold); }
    .task-goal-top span { color: var(--dim); font-weight: 700; }
    .hm-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 12px 0 8px; }
    .hm-cell { background: var(--card-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 4px; text-align: center; cursor: pointer; transition: transform .15s, border-color .2s; }
    .hm-cell:hover { transform: translateY(-2px); border-color: var(--gold); }
    .hm-cell span { display: block; font-size: 10.5px; color: var(--dim); }
    .hm-cell b { font-size: 14px; font-weight: 900; color: var(--txt); }
    .hm-cell.lv1 { background: rgba(102, 126, 234, .14); }
    .hm-cell.lv1 b { color: var(--blue); }
    .hm-cell.lv2 { background: rgba(102, 126, 234, .32); }
    .hm-cell.lv2 b { color: #fff; }
    .hm-cell.lv3 { background: rgba(102, 126, 234, .55); }
    .hm-cell.lv3 b { color: #fff; }
    .hm-cell.lv4 { background: var(--btn-grad); }
    .hm-cell.lv4 b { color: #fff; }
    .hm-tip { min-height: 22px; font-size: 13px; color: var(--dim); margin-top: 4px; line-height: 1.8; }
    .hm-tip b { color: var(--gold); }
    .hm-tip span { margin-right: 12px; }
</style>

<script>
/* ============================================================
 * 学习仪表盘（页面内联脚本）
 * 等级经验 / 学习统计 / 每日任务 / 错题弱项 / 各模块进度 /
 * 测验成绩 / 收藏 / 热力日历 / 最近动态 一处汇总
 * 数据全在 XD 本地存储，防御式启动：XD 缺失时静默退出
 * ============================================================ */
document.addEventListener('DOMContentLoaded', function () {
    if (!window.XD) return;

    /* ---- 学习系统卡片：等级经验 / 每日任务 / 热力日历 / 错题弱项 ---- */
    function renderLevel() {
        var lv = XD.game.level();
        document.getElementById('levelCard').innerHTML =
            '<div class="lv-card"><div class="lv-head">' +
            '<span class="lv-badge">Lv' + lv.lv + ' · ' + XD.escapeHtml(lv.t) + '</span>' +
            '<span class="lv-xp">' + lv.xp + ' XP</span></div>' +
            '<div class="xp-bar"><i style="width:' + lv.pct + '%;"></i></div>' +
            '<div class="lv-next">' + (lv.nextT ? '距「' + XD.escapeHtml(lv.nextT) + '」还差 ' + (lv.next - lv.xp) + ' XP' : '🎉 已达最高等级') + '</div></div>' +
            '<p style="font-size:12.5px;color:var(--dim);margin-top:8px;">首次读完一页 +5 · 完成测验 +25（及格 +10 / 满分再 +15）· 完成每日任务 +10</p>';
    }
    function renderTasks() {
        var tasks = XD.game.dailyTasks();
        var done = 0;
        for (var i = 0; i < tasks.length; i++) if (tasks[i].done) done++;
        var box = document.getElementById('dailyTasks');
        var pct = tasks.length ? Math.round(done / tasks.length * 100) : 0;
        var h = '<div class="task-goal"><div class="task-goal-top">' +
            '<b>🎯 今日目标：完成 ' + done + '/' + tasks.length + ' 项</b><span>' + pct + '%</span></div>' +
            '<div class="prog-track"><div class="prog-fill" style="width:' + pct + '%;"></div></div></div>';
        for (var j = 0; j < tasks.length; j++) {
            var t = tasks[j];
            var side;
            if (t.claimed) side = '<span class="task-claimed">已领 +' + t.xp + ' XP</span>';
            else if (t.done) side = '<button class="task-claim" data-task="' + t.id + '" type="button">领取 +' + t.xp + '</button>';
            else side = '<span class="task-xp">+' + t.xp + ' XP</span>';
            h += '<div class="task-card' + (t.done ? ' done' : '') + '">' +
                '<div class="task-ic">' + (t.claimed ? '✅' : t.done ? '🏁' : '🔒') + '</div>' +
                '<div class="task-mid"><b>' + XD.escapeHtml(t.t) + '</b><span>' + XD.escapeHtml(t.d) + '</span></div>' +
                '<div class="task-side">' + side + '</div></div>';
        }
        box.innerHTML = h;
    }
    function renderHeatmap() {
        var box = document.getElementById('heatmap');
        if (!box) return;
        var data = XD.studyLog.heatmap(35);
        var max = 1;
        for (var i = 0; i < data.length; i++) if (data[i].c > max) max = data[i].c;
        var html = '<div class="hm-grid">';
        for (var j = 0; j < data.length; j++) {
            var d = data[j];
            var day = d.d.split('-');
            var lvl = d.c === 0 ? 0 : Math.max(1, Math.min(4, Math.ceil(d.c / max * 4)));
            html += '<div class="hm-cell lv' + lvl + '" data-d="' + d.d + '" title="' + d.d + ' 学习 ' + d.c + ' 次">' +
                '<span>' + day[1] + '/' + day[2] + '</span>' +
                '<b>' + (d.c || '') + '</b></div>';
        }
        html += '</div><div class="hm-tip" id="hmTip"></div>';
        box.innerHTML = html;
        var TYPE = { read: '阅读', quiz: '测验', practice: '练习' };
        box.addEventListener('click', function (e) {
            var cell = e.target.closest('.hm-cell');
            if (!cell) return;
            var d = cell.getAttribute('data-d');
            var tip = document.getElementById('hmTip');
            var a = XD.studyLog.recent();
            var lis = [];
            for (var i = 0; i < a.length; i++) {
                var at = new Date(a[i].at);
                var k = at.getFullYear() + '-' + (at.getMonth() + 1) + '-' + at.getDate();
                if (k === d) lis.push(a[i]);
            }
            if (!lis.length) { tip.innerHTML = '<span class="t-dim">这一天还没有学习记录</span>'; return; }
            var h = '<b>' + d + ' 共 ' + lis.length + ' 次：</b>';
            for (var j = 0; j < Math.min(lis.length, 8); j++) {
                var e2 = lis[j];
                h += '<span>' + (TYPE[e2.type] || e2.type) + ' ' + XD.escapeHtml(e2.itemId || e2.mod || '') + '</span>';
            }
            tip.innerHTML = h;
        });
    }
    function renderWeak() {
        var box = document.getElementById('weakAnalysis');
        var errs = XD.quiz.errItems();
        if (!errs.length) {
            box.innerHTML = '<p class="empty-hint">还没有错题，继续保持！做完测验后，这里会自动帮你找出最该复习的模块。</p>';
            return;
        }
        var groups = {};
        for (var i = 0; i < errs.length; i++) {
            var e = errs[i];
            var k = e.quizId || '其他';
            if (!groups[k]) groups[k] = { n: 0, title: e.quizTitle || '' };
            groups[k].n++;
        }
        var h = '';
        var ks = Object.keys(groups);
        for (var j = 0; j < ks.length; j++) {
            var g = groups[ks[j]];
            var nd = XD.node(ks[j]);
            var label = nd ? XD.escapeHtml(nd.n) + '测验' : (g.title || ks[j]);
            var dirLink = (nd && nd.f) ? nd.f : '43.html';
            h += '<div class="weak-item"><b>📕 「' + label + '」有 ' + g.n + ' 道错题</b>' +
                '<p>先重读对应章节把概念理清，再回测验中心重做；做对了的题会自动从错题本划掉。</p>' +
                '<a class="btn ghost" href="' + dirLink + '">复习该模块</a>' +
                '<a class="btn" href="43.html">去错题本</a></div>';
        }
        box.innerHTML = h;
    }

    /* ---------- 水滴分裂筛选：学习统计（今天/本周/本月/全年） ---------- */
    var RANGES = [['today', '今天'], ['week', '本周'], ['month', '本月'], ['year', '全年']];
    var curRange = 'today';
    function rangeLabel(r) {
        for (var i = 0; i < RANGES.length; i++) if (RANGES[i][0] === r) return RANGES[i][1];
        return r;
    }
    /* 时间档 → 起始时间戳：今天零点 / 本周一 / 本月 1 号 / 今年 1 月 1 日 */
    function rangeStart(range, now) {
        var d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        if (range === 'today') return d0.getTime();
        if (range === 'week') return d0.getTime() - ((d0.getDay() + 6) % 7) * 86400000;
        if (range === 'month') return new Date(now.getFullYear(), now.getMonth(), 1).getTime();
        return new Date(now.getFullYear(), 0, 1).getTime();
    }
    /* 区间统计：学习次数 / 阅读页数 / 完成测验 / 学习天数 */
    function rangeStats(range) {
        var a = XD.studyLog.recent();
        var start = rangeStart(range, new Date());
        var times = 0, reads = {}, quizes = 0, days = {};
        for (var i = 0; i < a.length; i++) {
            var e = a[i];
            if (e.at < start) continue;
            times++;
            var d = new Date(e.at);
            days[d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate()] = 1;
            if (e.type === 'read') reads[e.itemId] = 1;
            else if (e.type === 'quiz') quizes++;
        }
        return { times: times, readPages: Object.keys(reads).length, quizes: quizes, days: Object.keys(days).length };
    }
    function metricHtml(range) {
        var s = rangeStats(range);
        return '<div class="drop-metric"><span>学习次数</span><b data-v="0">' + s.times + '</b></div>' +
            '<div class="drop-metric"><span>阅读页数</span><b data-v="0">' + s.readPages + '</b></div>' +
            '<div class="drop-metric"><span>完成测验</span><b data-v="0">' + s.quizes + '</b></div>' +
            '<div class="drop-metric"><span>学习天数</span><b data-v="0">' + s.days + '</b></div>';
    }
    /* 数字滚动：从 data-v 旧值按 20 步左右滚到新值 */
    function rollNum(el, to) {
        var from = parseInt(el.getAttribute('data-v') || '0', 10);
        if (from === to) { el.textContent = to; return; }
        el.setAttribute('data-v', to);
        var step = Math.max(1, Math.round(Math.abs(to - from) / 20));
        var cur = from, dir = to > from ? 1 : -1;
        var timer = setInterval(function () {
            cur += step * dir;
            if ((dir > 0 && cur >= to) || (dir < 0 && cur <= to)) { cur = to; clearInterval(timer); }
            el.textContent = cur;
        }, 20);
    }
    function collapseDrop() {
        var opts = document.getElementById('dropOpts');
        var o = opts.querySelectorAll('.drop-opt');
        for (var i = 0; i < o.length; i++) o[i].classList.add('hide');
        setTimeout(function () {
            opts.style.display = 'none';
            var o2 = opts.querySelectorAll('.drop-opt');
            for (var j = 0; j < o2.length; j++) o2[j].classList.remove('show', 'hide', 'on');
        }, 300);
    }
    function renderDrop() {
        var box = document.getElementById('statRange');
        if (!box) return;
        var h = '<div class="drop-filter">' +
            '<button type="button" class="drop-pill">💧 ' + rangeLabel(curRange) + ' ▾</button>' +
            '<div class="drop-opts" id="dropOpts" style="display:none;">';
        for (var i = 0; i < RANGES.length; i++) {
            h += '<button type="button" class="drop-opt' + (RANGES[i][0] === curRange ? ' on' : '') + '" data-range="' + RANGES[i][0] + '">' + RANGES[i][1] + '</button>';
        }
        h += '</div></div><div class="drop-metrics" id="dropMetrics">' + metricHtml(curRange) + '</div>';
        box.innerHTML = h;

        /* 水滴胶囊：展开时选项逐颗浮出（40 + idx*45 错峰），已展开则收起 */
        box.querySelector('.drop-pill').addEventListener('click', function () {
            var opts = document.getElementById('dropOpts');
            if (opts.style.display !== 'none') { collapseDrop(); return; }
            opts.style.display = '';
            var o = opts.querySelectorAll('.drop-opt');
            for (var i = 0; i < o.length; i++) {
                (function (el, idx) { setTimeout(function () { el.classList.add('show'); }, 40 + idx * 45); })(o[i], i);
            }
        });
        /* 选项：切档 → 高亮 + 收拢水滴 + 指标数字滚动 */
        box.querySelectorAll('.drop-opt').forEach(function (opt) {
            opt.addEventListener('click', function () {
                var nr = opt.getAttribute('data-range');
                if (nr === curRange) { collapseDrop(); return; }
                curRange = nr;
                var pill = box.querySelector('.drop-pill');
                pill.textContent = '💧 ' + rangeLabel(nr) + ' ▾';
                var all = document.getElementById('dropOpts').querySelectorAll('.drop-opt');
                for (var j = 0; j < all.length; j++) {
                    if (all[j].getAttribute('data-range') !== nr) all[j].classList.add('hide');
                    else { all[j].classList.add('on'); all[j].classList.remove('show'); }
                }
                setTimeout(function () {
                    document.getElementById('dropOpts').style.display = 'none';
                    var o2 = document.getElementById('dropOpts').querySelectorAll('.drop-opt');
                    for (var k = 0; k < o2.length; k++) o2[k].classList.remove('show', 'hide', 'on');
                    var s = rangeStats(nr);
                    var bs = document.getElementById('dropMetrics').querySelectorAll('b');
                    var vals = [s.times, s.readPages, s.quizes, s.days];
                    for (var m = 0; m < bs.length; m++) rollNum(bs[m], vals[m]);
                }, 430);
            });
        });
    }
    document.getElementById('dailyTasks').addEventListener('click', function (e) {
        var b = e.target.closest('.task-claim');
        if (!b) return;
        var ok = XD.game.claimDaily(b.getAttribute('data-task'));
        if (ok) {
            XD.showToast('🎁 每日任务完成 +10 XP');
            renderLevel();
            renderTasks();
        }
    });

    /* ---- 数据汇总区：统计卡 / 模块进度 / 测验成绩 / 最近动态 ---- */
    var totalLeaf = XD.PAGES ? XD.PAGES.length : 0;
    var doneCount = XD.progress.count();
    var pct = XD.progress.overall();
    var ach = XD.achieve.list();
    var achGot = 0;
    for (var i = 0; i < ach.length; i++) if (ach[i].at) achGot++;

    document.getElementById('statCards').innerHTML =
        '<div class="stat-card"><span>总进度</span><b class="big-num">' + pct + '%</b><span>按内容页计算</span></div>' +
        '<div class="stat-card"><span>已读页面</span><b>' + doneCount + '<small style="font-size:13px;"> / ' + totalLeaf + '</small></b><span>打开即记录</span></div>' +
        '<div class="stat-card"><span>今日学习</span><b>' + XD.studyLog.todayCount() + '</b><span>次记录</span></div>' +
        '<div class="stat-card"><span>连续天数</span><b>' + XD.studyLog.streakDays() + ' 天</b><span>🔥 别断签</span></div>' +
        '<div class="stat-card"><span>成就徽章</span><b>' + achGot + ' / ' + ach.length + '</b><span>继续解锁</span></div>';

    var mp = document.getElementById('modProgress');
    var MOD_TAB = { A: '🖥️', B: '🖱️', C: '🌐', D: '⌨️', E: '🤖', F: '🐙', G: '🛠️', H: '📱', I: '💬', J: '🛡️', K: '📄', L: '🛒', M: '🏠', N: '🧳' };
    var html = '';
    for (var m = 0; m < XD.modIds.length; m++) {
        var mod = XD.modIds[m];
        var nd = XD.node(mod);
        if (!nd) continue;
        var mpct = XD.progress.nodeProgress(mod);
        html += '<div class="mod-prog"><div class="mp-top">' +
            '<span><b>' + (MOD_TAB[mod] || '📖') + ' <a href="' + mod + '.html">' + XD.escapeHtml(nd.n) + '</a></b></span>' +
            '<span class="pct">' + mpct + '%</span></div>' +
            '<div class="prog-track"><div class="prog-fill" style="width:' + mpct + '%;"></div></div></div>';
    }
    mp.innerHTML = html;

    var qs = document.getElementById('quizScores');
    var QUIZ_MAP = [
        { id: 'A', f: 'A5.html', n: '计算机基础' },
        { id: 'B', f: 'B7.html', n: '电脑使用' },
        { id: 'C', f: 'C6.html', n: '网络与服务器' },
        { id: 'E', f: 'E5.html', n: '如何使用 AI' },
        { id: 'F', f: 'F7.html', n: 'Git 与 GitHub' },
        { id: 'G', f: 'G7.html', n: '怎么开发网页' },
        { id: 'H', f: 'H6.html', n: '手机与平板' },
        { id: 'I', f: 'I6.html', n: '微信与生活服务' },
        { id: 'J', f: 'J7.html', n: '网络安全与防诈骗' },
        { id: 'K', f: 'K6.html', n: '办公与文档' },
        { id: 'L', f: 'L6.html', n: '网上购物与现代消费' },
        { id: 'M', f: 'M7.html', n: '数字生活进阶' },
        { id: 'N', f: 'N7.html', n: '旅游与出行' }
    ];
    var all = XD.quiz.results();
    var rows = '<table class="xd-table quiz-table"><thead><tr><th>模块测验</th><th>分数</th><th>答对</th><th>状态</th></tr></thead><tbody>';
    for (var q = 0; q < QUIZ_MAP.length; q++) {
        var r = all[QUIZ_MAP[q].id] || null;
        rows += '<tr><td><a href="' + QUIZ_MAP[q].f + '">' + QUIZ_MAP[q].n + '</a></td>' +
            '<td>' + (r ? r.score + ' 分' : '—') + '</td>' +
            '<td>' + (r ? r.right + ' / ' + r.total : '—') + '</td>' +
            '<td>' + (r ? (r.score >= 60 ? '<span class="t-green">✅ 通过</span>' : '<span class="t-red">未通过</span>') : '<span class="t-dim">未开始</span>') + '</td></tr>';
    }
    rows += '</tbody></table>';
    qs.innerHTML = rows;

    var log = XD.studyLog.recent(8);
    var rl = document.getElementById('recentLog');
    var TYPE_TAB = { read: '阅读', quiz: '测验', practice: '练习' };
    if (!log.length) {
        rl.innerHTML = '<p class="empty-hint">还没有学习记录。去 <a href="index.html">首页</a> 挑一门课开始吧！</p>';
    } else {
        var lis = '<ul class="recent-list">';
        for (var l = 0; l < log.length; l++) {
            var e = log[l];
            var label = e.itemId;
            var top = (e.mod || e.itemId || '').charAt(0);
            var nd2 = top ? XD.node(top) : null;
            if (nd2) label = nd2.n + ' · ' + (e.itemId || '');
            lis += '<li><span class="badge-type">' + (TYPE_TAB[e.type] || e.type) + '</span>' +
                '<span style="flex:1;">' + XD.escapeHtml(label) + '</span>' +
                '<span class="t">' + XD.fmtDate(new Date(e.at)) + '</span></li>';
        }
        lis += '</ul>';
        rl.innerHTML = lis;
    }

    /* ---- 我的收藏：列表展示 + 逐条取消收藏 ---- */
    function renderFav() {
        var box = document.getElementById('favList');
        if (!box || !XD.fav) return;
        var favs = XD.fav.list();
        if (!favs.length) {
            box.innerHTML = '<p class="empty-hint">还没有收藏。在任意一课右上角点 <b>☆</b>，重要的页面就会收在这里，下次一键直达。</p>';
            return;
        }
        var h = '<ul class="recent-list">';
        for (var i = 0; i < favs.length; i++) {
            var it = favs[i];
            var mod = it.m ? XD.node(it.m) : null;
            var label = it.t + (mod ? ' · ' + mod.n : '');
            h += '<li><span class="badge-type">⭐</span>' +
                '<a style="flex:1;" href="' + it.f + '">' + XD.escapeHtml(label) + '</a>' +
                '<button class="fav-del" data-fav="' + it.f + '" type="button" title="取消收藏">✕</button></li>';
        }
        h += '</ul>';
        box.innerHTML = h;
        box.querySelectorAll('.fav-del').forEach(function (btn) {
            btn.addEventListener('click', function () {
                XD.fav.remove(btn.getAttribute('data-fav'));
            });
        });
    }

    /* ---- 启动渲染序列：各区块就位后依次点亮 ---- */
    renderLevel();
    renderTasks();
    renderWeak();
    renderDrop();
    renderHeatmap();
    renderFav();
    if (XD.on) XD.on('fav.changed', renderFav);
});
</script>
</body>
</html>
