<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>毕业证书 - 现代化·知识学习站</title>
<meta name="description" content="毕业证书：学完十四大模块后在这里领取你的毕业证书，可打印留念——看看你离毕业还差几步。">
<link rel="icon" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#667eea">
<link rel="stylesheet" href="common.css">
<script defer src="common.js"></script>
<script defer src="theme.js"></script>
<script defer src="xd-features.js"></script>
<style>
    .cert { background: var(--card); border: 3px double var(--gold); border-radius: 20px; padding: 34px 26px; text-align: center; margin: 18px 0; position: relative; }
    .cert .c-crown { font-size: 46px; }
    .cert h2 { font-size: 26px; letter-spacing: 6px; color: var(--gold); margin: 8px 0 4px; }
    .cert .c-sub { font-size: 13px; color: var(--dim); letter-spacing: 3px; }
    .cert .c-name { font-size: 30px; font-weight: 900; color: var(--txt); border-bottom: 2px solid var(--gold); display: inline-block; padding: 0 22px 6px; margin: 14px 0 6px; }
    .cert p { font-size: 14.5px; color: var(--dim); line-height: 1.9; max-width: 560px; margin: 6px auto; }
    .cert .c-meta { display: flex; justify-content: center; gap: 26px; margin-top: 16px; font-size: 13.5px; color: var(--dim); flex-wrap: wrap; }
    .cert .c-meta b { color: var(--gold); font-size: 15px; }
    .cert .c-stamp { position: absolute; right: 26px; bottom: 26px; width: 88px; height: 88px; border: 3px solid var(--red); color: var(--red); border-radius: 50%;
        display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; transform: rotate(-18deg); opacity: .8; }
    .cert-name-row { display: flex; align-items: center; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
    .cert-name-row input { padding: 9px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card-2); color: var(--txt); font-size: 14px; font-family: inherit; outline: none; }
    .cert-name-row input:focus { border-color: var(--gold); }
    .grad-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin: 14px 0; }
    .grad-item { background: var(--card-2); border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 13px; font-size: 13.5px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .grad-item.done { border-color: var(--green); }
    .grad-item .g-name { color: var(--txt); font-weight: 700; }
    .grad-item .g-p { color: var(--dim); flex: none; }
    .grad-item.done .g-p { color: var(--green); font-weight: 800; }
    @media print {
        .cert { border: 3px double #000 !important; background: #fff !important; box-shadow: none !important; }
        .cert h2, .cert .c-sub, .cert .c-name, .cert .c-meta b { color: #000 !important; }
        .cert p { color: #000 !important; }
        .cert .c-stamp { border-color: #000; color: #000; opacity: .75; }
        .cert-name-row { display: none !important; }
    }
</style>
</head>
<body data-page="SYS6.html" data-kind="tool">
<div class="bg-animation">
    <div class="bg-flow-1"></div><div class="bg-flow-2"></div><div class="bg-flow-3"></div>
    <div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div><div class="orb orb-4"></div><div class="orb orb-5"></div>
</div>

<header class="site-header">
    <a class="home-link" href="index.html">🏠 首页</a>
    <span class="site-title">现代化·知识学习站</span>
    <span class="mod-badge">学习系统 · 证书</span>
</header>

<main>
    <article class="lesson container">
        <h1 class="lesson-title">🎓 毕业证书</h1>
        <p class="lesson-sub">学完十四大模块，领取你的毕业证书，可打印留念</p>

        <div class="callout info">
            <b>怎样才算毕业？</b>
            把 <b>A 到 N 十四个模块</b>的内容页全部读过一遍（进度到 100%）即可领取证书。证书上可以写上你的称呼，一键打印贴在墙上、发给家人朋友——学了就值得骄傲。
        </div>

        <div id="certBox"><!-- JS 渲染毕业判断 --></div>

        <div class="lesson-footer" style="margin-top:24px;padding-top:14px;border-top:1px solid var(--line);color:var(--dim);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
            <span>🎉 学无止境，毕业不是终点</span>
            <span>成就墙：<a href="42.html">看看徽章</a> · 仪表盘：<a href="41.html">看进度</a></span>
        </div>
        <nav class="lesson-nav" id="xdPrevNext" style="margin-top:14px;"><!-- JS 渲染前后页 --></nav>
    </article>
</main>

<script>
/* ============================================================
 * 毕业证书（页面内联脚本）
 * 十四模块全 100% 即颁发证书：可写称呼、可打印；未毕业时
 * 展示各模块完成清单与实时进度
 * ============================================================ */
document.addEventListener('DOMContentLoaded', function () {
    if (!window.XD) return;
    var box = document.getElementById('certBox');
    var NAME_KEY = 'xd_cert_name_v1';
    var name = '';
    try { name = localStorage.getItem(NAME_KEY) || ''; } catch (e) { }

    function modStatus() {
        var list = [], all = true;
        for (var m = 0; m < XD.modIds.length; m++) {
            var id = XD.modIds[m];
            var nd = XD.node(id);
            var p = XD.progress.nodeProgress(id);
            list.push({ id: id, n: nd ? nd.n : id, p: p, done: p === 100 });
            if (p < 100) all = false;
        }
        return { all: all, list: list };
    }

    function certHtml(nm) {
        var ach = XD.achieve.list(), got = 0;
        for (var i = 0; i < ach.length; i++) if (ach[i].at) got++;
        var now = new Date();
        var dateStr = now.getFullYear() + ' 年 ' + (now.getMonth() + 1) + ' 月 ' + now.getDate() + ' 日';
        return '<div class="cert">' +
            '<div class="c-crown">🎓</div>' +
            '<h2>毕 业 证 书</h2>' +
            '<div class="c-sub">现代化 · 知识学习站</div>' +
            '<div class="cert-name-row">在证书上写个称呼：' +
            '<input id="certName" value="' + XD.escapeHtml(nm) + '" placeholder="如：王阿姨" maxlength="12">' +
            '</div>' +
            '<div class="c-name">' + (nm ? XD.escapeHtml(nm) : '亲爱的学员') + '</div>' +
            '<p>恭喜你学完了本站 <b>A 到 N 十四个模块</b>的全部课程，' +
            '从认识电脑到网上购物、从 AI 入门到防骗防诈，一步一个脚印走了过来。<br>' +
            '本证书证明你已经掌握了数字生活的基础本领，愿你继续乐学，与时俱进。</p>' +
            '<div class="c-meta">' +
            '<span>🏅 徽章 <b>' + got + ' 枚</b></span>' +
            '<span>📖 读过 <b>' + XD.progress.count() + ' 页</b></span>' +
            '<span>🔥 连续 <b>' + XD.studyLog.streakDays() + ' 天</b></span>' +
            '<span>🗓 ' + dateStr + '</span></div>' +
            '<div class="c-stamp">学习站<br>毕业章</div>' +
            '<div style="margin-top:20px;"><button class="btn" id="certPrint">🖨 打印本页证书</button></div>' +
            '</div>';
    }

    var st = modStatus();
    if (st.all) {
        box.innerHTML = certHtml(name);
        var input = document.getElementById('certName');
        if (input) {
            input.addEventListener('input', function () {
                var v = input.value.trim();
                try { localStorage.setItem(NAME_KEY, v); } catch (e) { }
                var nm = document.querySelector('.c-name');
                if (nm) nm.textContent = v || '亲爱的学员';
            });
        }
        document.getElementById('certPrint').addEventListener('click', function () { window.print(); });
        var btn = document.querySelector('.cert-name-row input');
        if (btn && name) btn.focus();
    } else {
        var h = '<div class="grad-list">';
        for (var i = 0; i < st.list.length; i++) {
            var g = st.list[i];
            h += '<div class="grad-item' + (g.done ? ' done' : '') + '">' +
                '<span class="g-name">' + g.id + ' · ' + XD.escapeHtml(g.n) + '</span>' +
                '<span class="g-p">' + (g.done ? '✅ 完成' : g.p + '%') + '</span></div>';
        }
        h += '</div>';
        var doneN = 0;
        for (var j = 0; j < st.list.length; j++) if (st.list[j].done) doneN++;
        box.innerHTML = '<div class="callout tip"><b>还差一步：已完成 ' + doneN + ' / 14 个模块</b><br>' +
            '把下面的模块都学完，就能领取毕业证书啦！点模块名去学习，进度会实时更新。</div>' + h +
            '<a class="btn" href="index.html">📚 继续学习</a>';
    }
});
</script>
</body>
</html>
