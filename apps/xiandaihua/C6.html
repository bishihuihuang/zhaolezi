<script>
/* ============================================================
 * 模块C结业测验（页面内联脚本，借 XD.quiz 引擎统一渲染/评分）
 * 题目数据即文案：q / opts / a / exp 逐字保留；错题自动入错题本
 * ============================================================ */
document.addEventListener('DOMContentLoaded', function () {
    if (!window.XD || !XD.quiz) return;
    XD.quiz.run('quiz', {
        id: 'C',
        title: '模块C测验：网络与服务器',

        /* ---- 题目清单（10 题，q/opts/a/exp 逐字保留） ---- */
        questions: [
            {
                q: '互联网通信最常见的模型是？',
                opts: ['服务器主动推送一切', '客户端发请求，服务器回应', '所有电脑地位完全平等无主从', '靠传真机传递'],
                a: 1,
                exp: '客户端-服务器模型：客户端主动问、服务器被动答，是网页/App 通信的基本盘。'
            },
            {
                q: '网页服务（HTTP）默认监听哪个端口？',
                opts: ['22', '80', '443', '3306'] ,
                a: 1,
                exp: 'HTTP=80，HTTPS=443，SSH=22，MySQL=3306。'
            },
            {
                q: '浏览器输入 baidu.com 后，第一步发生的是？',
                opts: ['直接连到百度服务器', 'DNS 把域名翻译成 IP', '下载全部图片', '弹出 404'],
                a: 1,
                exp: '先通过 DNS 拿 IP，才能建立连接。'
            },
            {
                q: '你家设备的 IP 通常是 192.168.x.x，这说明它是？',
                opts: ['公网 IP，全球唯一', '内网（私有）IP，只在本局域网有效', 'IPv6 地址', '服务器的地址'],
                a: 1,
                exp: '192.168.x.x、10.x.x.x 是私有网段，经路由器 NAT 共享上网。'
            },
            {
                q: '在"ddd.com 打不开"时，看到状态码 404，说明？',
                opts: ['服务器崩溃了', '请求的页面/资源不存在', '网速太慢', '电脑中毒'],
                a: 1,
                exp: '4xx 是客户端请求方面的问题；404=服务器上没这个页面。'
            },
            {
                q: '状态码 500 的含义是？',
                opts: ['成功', '服务器内部错误', '重定向', '禁止访问'],
                a: 1,
                exp: '5xx 表示服务器那边出错了（程序异常等），通常该等一会儿或联系站长。'
            },
            {
                q: 'HTTPS 相比 HTTP，关键优势是？',
                opts: ['网速翻倍', '内容加密防偷看', '不用域名', '无需服务器'],
                a: 1,
                exp: 'HTTPS = HTTP + TLS 加密，密码/支付信息不会明文暴露。'
            },
            {
                q: '浏览器第二次打开同一页面通常更快，主要因为？',
                opts: ['服务器变快了', '浏览器缓存了资源', 'DNS 记住了密码', '网速变快了'],
                a: 1,
                exp: '图片/JS 等资源被缓存到本地，第二次直接读缓存。'
            },
            {
                q: '服务器操作系统绝大多数是？',
                opts: ['Windows', 'Linux', 'Android', 'macOS'],
                a: 1,
                exp: 'Linux（Ubuntu/Debian/CentOS 系）免费稳定，占据服务器市场绝大多数份额。'
            },
            {
                q: '静态网站与动态网站的区别，正确的是？',
                opts: ['静态站更好看', '动态站按请求现算现生成，支持登录评论；纯 HTML 站是静态的', '静态站不能上 GitHub', '动态站不需要服务器'],
                a: 1,
                exp: '动态站=静态资源+后端程序+数据库；本站这种纯 HTML/CSS/JS 是静态站，所以能免费托管于 GitHub Pages。'
            }
        ]
    });
});
</script>
