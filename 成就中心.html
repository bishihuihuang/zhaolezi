<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<title>成就中心 - 找乐子</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        min-height: 100vh;
        background: var(--bg);
        color: var(--txt);
        overflow-x: hidden;
        position: relative;
    }

    /* ========== 背景流光层（全站统一，20秒无缝循环） ========== */
    .bg-animation {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
    }
    .bg-flow-1 {
        position: absolute;
        top: -100%;
        left: -100%;
        width: 300%;
        height: 300%;
        background: var(--flow-grad);
        /* 六主题适配：flowGradient 背景位移动画移除（触性能铁律） */
    }
    .bg-flow-2 {
        position: absolute;
        top: -60%;
        left: -40%;
        width: 220%;
        height: 220%;
        background: radial-gradient(ellipse at 30% 70%, rgba(255,140,100,.35), transparent 50%),
            radial-gradient(ellipse at 65% 35%, rgba(120,180,255,.3), transparent 45%),
            radial-gradient(ellipse at 80% 80%, rgba(220,130,250,.25), transparent 40%);
        animation:none;
        will-change: transform;
    }
    .bg-flow-3 {
        position: absolute;
        top: -30%;
        left: -20%;
        width: 180%;
        height: 180%;
        background: radial-gradient(circle at 50% 50%, rgba(255,200,130,.15), transparent 60%),
            radial-gradient(circle at 20% 80%, rgba(80,220,200,.2), transparent 50%);
        animation:none;
        will-change: transform;
    }
    /* flowGradient 关键帧已移除（background-position 全屏重绘，性能铁律禁用） */
    @keyframes flowDrift {
        0% { transform: translate(0, 0) scale(1) rotate(0deg); }
        50% { transform: translate(3%, -4%) scale(1.05) rotate(5deg); }
        100% { transform: translate(-2%, 3%) scale(.97) rotate(-5deg); }
    }
    @keyframes flowRotate {
        0% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(180deg) scale(1.08); }
        100% { transform: rotate(360deg) scale(1); }
    }

    /* ========== 透明悬浮球 ========== */

    /* ========== 主体布局（全站统一：白色悬浮容器） ========== */
    main {
        position: relative;
        z-index: 10;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 60px 20px 40px;
    }
    .container {
        width: 80%;
        max-width: 1200px;
        background: var(--card);
        border-radius: 24px;
        box-shadow: 0 25px 70px rgba(0, 0, 0, .35), 0 0 0 1px var(--line);
        max-height: calc(100vh - 100px);
        overflow-y: auto;
        padding: 20px;
        color: var(--txt);
    }
    .container::-webkit-scrollbar { width: 10px; }
    .container::-webkit-scrollbar-track { background: rgba(0, 0, 0, .04); border-radius: 12px; }
    .container::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 12px; border: 2px solid transparent; }

    .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
    .title-area {
        grid-column: 1 / 5;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 90px;
        background: var(--title-grad);
        /* 六主题适配：titleGradient 位移动画移除（标题横幅随主题静态渐变） */
        border-radius: 20px;
        box-shadow: 0 12px 40px color-mix(in srgb, var(--gold-2) 35%, transparent), inset 0 1px 0 color-mix(in srgb, var(--card-2) 40%, transparent);
        padding: 10px;
    }
    .title-area h2 {
        font-size: 34px;
        font-weight: 900;
        letter-spacing: 4px;
        color: var(--btn-txt);
        text-shadow: 2px 2px 10px rgba(0, 0, 0, .3);
        text-align: center;
    }
    .back-area {
        grid-column: 5 / 7;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 90px;
        background: var(--back-grad);
        border-radius: 20px;
        box-shadow: 0 12px 40px color-mix(in srgb, var(--green) 40%, transparent), inset 0 1px 0 color-mix(in srgb, var(--card-2) 40%, transparent);
        text-decoration: none;
        color: var(--btn-txt);
        font-size: 18px;
        font-weight: 800;
        cursor: pointer;
        transition: transform .3s, box-shadow .3s;
    }
    .back-area:hover {
        transform: translateY(-5px);
        box-shadow: 0 18px 50px color-mix(in srgb, var(--green) 50%, transparent);
    }
    .back-area:active {
        transform: translateY(-2px) scale(.96);
    }
    .card {
        grid-column: 1 / -1;
        background: var(--card-2);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, .1);
        border: 2px solid var(--line);
    }
    .card-half { grid-column: 1 / 4; }
    .card-half-2 { grid-column: 4 / 7; }
    .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        border: none; cursor: pointer; font-size: 15px; padding: 10px 20px; border-radius: 10px;
        background: var(--btn-grad); color: var(--btn-txt);
        box-shadow: 0 4px 14px color-mix(in srgb, var(--glow) 40%, transparent); transition: transform .2s, box-shadow .2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px color-mix(in srgb, var(--glow) 55%, transparent); }
    .btn:active { transform: scale(.96); }
    .btn-secondary { background: color-mix(in srgb, var(--glow) 10%, transparent); color: var(--txt); box-shadow: none; }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    input, textarea, select {
        width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
        font-size: 14px; background: var(--card-2); color: var(--txt); outline: none;
    }
    input:focus, textarea:focus { border-color: var(--glow); box-shadow: 0 0 0 3px color-mix(in srgb, var(--glow) 20%, transparent); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
    .hint { font-size: 12px; color: var(--dim); margin-top: 8px; }
    .stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
    .stat div { background: color-mix(in srgb, var(--glow) 8%, transparent); border-radius: 10px; padding: 10px; text-align: center; }
    .stat b { display: block; font-size: 20px; color: var(--glow); }
    .stat span { font-size: 12px; color: var(--dim); }

    /* ========== 成就中心专属 ========== */
    .pts-title {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 14px;
        text-align: center;
    }
    .pts-title > div { background: color-mix(in srgb, var(--glow) 8%, transparent); border-radius: 12px; padding: 12px 8px; }
    .pts-title b { display: block; font-size: 22px; color: var(--glow); margin-bottom: 2px; }
    .pts-title span { font-size: 12px; color: var(--dim); }
    .title-next {
        margin-top: 12px;
        font-size: 13px;
        color: var(--dim);
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .title-bar {
        flex: 1;
        min-width: 140px;
        height: 8px;
        background: color-mix(in srgb, var(--dim) 10%, transparent);
        border-radius: 6px;
        overflow: hidden;
    }
    .title-bar i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--gold), var(--gold-2));
        border-radius: 6px;
        transition: width .5s ease;
    }
    .tier-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .tier-tab {
        border: 1px solid var(--line);
        background: var(--card-2);
        color: var(--txt);
        border-radius: 20px;
        padding: 6px 14px;
        font-size: 13px;
        cursor: pointer;
        transition: all .2s;
    }
    .tier-tab.active { background: var(--btn-grad); color: var(--btn-txt); border-color: transparent; transform: translateY(-1px); box-shadow: 0 4px 12px color-mix(in srgb, var(--glow) 40%, transparent); }
    .cat-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .cat-chip {
        border: 1px dashed var(--line);
        background: transparent;
        color: var(--dim, #888);
        border-radius: 14px;
        padding: 4px 12px;
        font-size: 12px;
        cursor: pointer;
        transition: all .2s;
    }
    .cat-chip.active { border-style: solid; border-color: var(--glow); color: var(--glow); background: color-mix(in srgb, var(--glow) 8%, transparent); }
    #badgeGrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
        margin-top: 14px;
    }
    .ach-card {
        position: relative;
        border-radius: 14px;
        padding: 12px 10px;
        text-align: center;
        transition: transform .2s, box-shadow .2s;
        border: 1px solid var(--line);
        background: var(--card-2);
    }
    .ach-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,.12); }
    .ach-card .ic { font-size: 30px; line-height: 1.2; }
    .ach-card .nm { font-size: 13px; font-weight: bold; margin-top: 6px; line-height: 1.3; }
    .ach-card .ds { font-size: 11px; margin-top: 3px; color: var(--dim, #888); line-height: 1.5; }
    .ach-card .hw { font-size: 11px; margin-top: 4px; color: var(--gold-2);
        background: color-mix(in srgb, var(--gold-2) 8%, transparent); border-radius: 8px; padding: 3px 6px; line-height: 1.4; }
    .ach-card .pts { position: absolute; top: 8px; right: 8px; font-size: 11px; color: var(--btn-txt);
        background: var(--glow); border-radius: 10px; padding: 1px 7px; }
    .ach-card .tm { font-size: 10px; color: var(--dim); margin-top: 4px; }
    .ach-card.locked { opacity: .82; filter: grayscale(.55); }
    .ach-card.locked .hw { display: block; }
    .ach-card.fog { opacity: .5; filter: grayscale(1); }
    .ach-card.fog .ds, .ach-card.fog .hw { display: none; }
    .prog { margin-top: 6px; }
    .prog .bar { height: 5px; background: color-mix(in srgb, var(--dim) 10%, transparent); border-radius: 4px; overflow: hidden; }
    .prog .bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--gold), var(--gold-2)); }
    .prog .tx { font-size: 10px; color: var(--dim); margin-top: 3px; }
    .tier-badge {
        display: inline-block;
        font-size: 10px;
        border-radius: 8px;
        padding: 1px 6px;
        margin-top: 4px;
        border: 1px solid currentColor;
        color: var(--dim);
    }
    /* ========== 转场遮罩（全站统一样式） ========== */
    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(8, 10, 25, .72);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        opacity: 0;
        visibility: hidden;
        transition: opacity .4s ease, visibility .4s ease;
        pointer-events: none;
    }
    .overlay.active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }
    .loader-wrap {
        position: relative;
        width: 180px;
        height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .loader-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, .1);
        border-top-color: #f6d365;
        border-right-color: #fda085;
        animation: ringSpin .8s linear infinite;
    }
    .loader-ring::before {
        content: '';
        position: absolute;
        top: 12px;
        left: 12px;
        right: 12px;
        bottom: 12px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-bottom-color: #a78bfa;
        border-left-color: #667eea;
        animation: ringSpin 1.4s linear infinite reverse;
    }
    .loader-ring::after {
        content: '';
        position: absolute;
        top: 28px;
        left: 28px;
        right: 28px;
        bottom: 28px;
        border-radius: 50%;
        border: 1px solid transparent;
        border-top-color: #fb7185;
        border-right-color: #2dd4bf;
        animation: ringSpin 2s linear infinite;
    }
    .loader-text {
        position: relative;
        z-index: 5;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 4px;
        background: linear-gradient(90deg, #f6d365, #fda085, #f6d365);
        background-size: 200% 100%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: textShine 1.5s linear infinite;
    }
    @keyframes ringSpin { to { transform: rotate(360deg); } }
    @keyframes textShine {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
    }
    @media (max-width: 900px) {
        .container { width: 95%; padding: 12px; }
        .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .title-area, .back-area { grid-column: 1 / -1; min-height: 80px; }
        .title-area h2 { font-size: 28px; }
        .back-area { font-size: 16px; }
        .card-half, .card-half-2 { grid-column: 1 / -1; }
    }
    @media (max-width: 768px) {
        main { padding: 40px 12px 30px; }
        .container { width: 94%; max-width: 94vw; padding: 14px; }
        .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .title-area, .back-area { grid-column: 1 / -1; min-height: 70px; }
        .title-area h2 { font-size: 24px; }
        .stat { grid-template-columns: 1fr 1fr; }
        .pts-title { grid-template-columns: 1fr 1fr; }
        .pts-title > div:nth-child(3) { grid-column: 1 / -1; }
        #badgeGrid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    }
    @media (max-width: 480px) {
        .container { width: 96%; padding: 10px; }
        .grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .title-area h2 { font-size: 20px; letter-spacing: 2px; }
        .back-area { font-size: 15px; }
        #badgeGrid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
    }
</style>

<main>
<div class="container">
    <div class="grid">
        <div class="title-area"><h2>🏆 成就中心</h2></div>
        <a href="index.html" class="back-area" id="backHome"><span style="font-size:28px;">🏠</span>返回主页</a>
        <div class="card card-half">
            <div style="font-size:16px;font-weight:bold;color:#667eea;margin-bottom:4px;">📅 每日签到</div>

            <div class="stat">
                <div><b id="streak">0</b><span>连续签到(天)</span></div>
                <div><b id="totalCheck">0</b><span>累计签到</span></div>
                <div><b id="todayStatus">未签</b><span>今日状态</span></div>

            <div class="row" style="justify-content:center;">
                <button id="checkinBtn" class="btn">✅ 立即签到</button>

            <div style="font-size:16px;font-weight:bold;color:#667eea;margin-bottom:4px;">👑 等级与积分</div>
            <div class="hint">解锁成就赚积分、升头衔：基础+10 · 中级+30 · 高级+100 · 隐藏+50</div>
            <div class="pts-title">
                <div><b id="achPts">0</b><span>成就积分</span></div>
                <div><b id="achCount">0 / 0</b><span>已解锁 / 总数</span></div>
                <div><b id="achTitle">🐣探索新手</b><span>当前头衔</span></div>
            </div>
            <div class="title-next" id="titleNext"></div>
        </div>
        <div class="card">
            <div style="font-size:16px;font-weight:bold;color:#667eea;margin-bottom:4px;">🏆 成就收集</div>
