<title>今天玩什么·随机乐子 - 找乐子</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        min-height: 100vh;
        background: var(--bg);
        color: var(--txt);
        overflow-x: hidden;
        position: relative;
    }

    /* ========== 背景流光层（全站统一） ========== */
    .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; pointer-events: none; }
    .bg-flow-1 { position: absolute; top: -100%; left: -100%; width: 300%; height: 300%; background: var(--flow-grad); background-size: 400% 400%; animation: flowGradient 20s ease-in-out infinite; will-change: background-position; }
    .bg-flow-2 { position: absolute; top: -60%; left: -40%; width: 220%; height: 220%; background: radial-gradient(ellipse at 30% 70%, rgba(255,140,100,.35), transparent 50%), radial-gradient(ellipse at 65% 35%, rgba(120,180,255,.3), transparent 45%), radial-gradient(ellipse at 80% 80%, rgba(220,130,250,.25), transparent 40%); animation: flowDrift 20s ease-in-out infinite alternate; will-change: transform; }
    .bg-flow-3 { position: absolute; top: -30%; left: -20%; width: 180%; height: 180%; background: radial-gradient(circle at 50% 50%, rgba(255,200,130,.15), transparent 60%), radial-gradient(circle at 20% 80%, rgba(80,220,200,.2), transparent 50%); animation: flowRotate 20s linear infinite; will-change: transform; }
    @keyframes flowGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    @keyframes flowDrift { 0% { transform: translate(0, 0) scale(1) rotate(0deg); } 50% { transform: translate(3%, -4%) scale(1.05) rotate(5deg); } 100% { transform: translate(-2%, 3%) scale(.97) rotate(-5deg); } }
    @keyframes flowRotate { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.08); } 100% { transform: rotate(360deg) scale(1); } }

    /* ========== 透明悬浮球 ========== */
    .orb { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 35%, rgba(255,255,255,.3), rgba(255,255,255,.1) 50%, transparent 70%); box-shadow: 0 0 60px rgba(255,255,255,.08), inset 0 0 30px rgba(255,255,255,.04); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); pointer-events: none; will-change: transform, opacity; }
    .orb-1 { width: 260px; height: 260px; top: 12%; left: 8%; animation: orbFloatA 18s ease-in-out infinite, orbSpin 40s linear infinite; }
    .orb-2 { width: 160px; height: 160px; top: 55%; left: 75%; animation: orbFloatB 22s ease-in-out infinite, orbSpin 55s linear infinite; }
    .orb-3 { width: 110px; height: 110px; top: 68%; left: 20%; animation: orbFloatA 16s ease-in-out infinite reverse, orbSpin 35s linear infinite; }
    .orb-4 { width: 220px; height: 220px; top: 28%; left: 60%; animation: orbFloatB 20s ease-in-out infinite reverse, orbSpin 50s linear infinite; }
    .orb-5 { width: 80px; height: 80px; top: 80%; left: 45%; animation: orbFloatA 14s ease-in-out infinite, orbSpin 30s linear infinite; }
    @keyframes orbFloatA { 0% { transform: translate(0,0) scale(1); opacity:.6; } 30% { transform: translate(18px,-22px) scale(1.04); opacity:.8; } 60% { transform: translate(-12px,10px) scale(.96); opacity:.5; } 100% { transform: translate(0,0) scale(1); opacity:.6; } }
    @keyframes orbFloatB { 0% { transform: translate(0,0) scale(1); opacity:.5; } 35% { transform: translate(-20px,12px) scale(1.06); opacity:.7; } 70% { transform: translate(14px,-15px) scale(.94); opacity:.4; } 100% { transform: translate(0,0) scale(1); opacity:.5; } }
    @keyframes orbSpin { to { transform: rotate(360deg); } }

    /* ========== 主体布局（全站统一：悬浮容器） ========== */
    main { position: relative; z-index: 10; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 60px 20px 40px; }
    .container {
        width: 80%; max-width: 1200px;
        background: var(--card);
        border-radius: 24px;
        box-shadow: 0 25px 70px rgba(0, 0, 0, .35), 0 0 0 1px rgba(255, 255, 255, .3), inset 0 1px 0 rgba(255, 255, 255, .6);
        max-height: calc(100vh - 100px);
        overflow-y: auto;
        padding: 20px;
        color: var(--txt);
    }
    .container::-webkit-scrollbar { width: 10px; }
    .container::-webkit-scrollbar-track { background: rgba(0, 0, 0, .04); border-radius: 12px; }
    .container::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 12px; border: 2px solid rgba(255, 255, 255, .4); }

    .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
    .title-area {
        grid-column: 1 / 5;
        display: flex; align-items: center; justify-content: center;
        min-height: 90px;
        background: var(--title-grad);
        background-size: 300% 300%;
        animation: titleGradient 6s ease infinite;
        border-radius: 20px;
        box-shadow: 0 12px 40px rgba(255, 150, 50, .35), inset 0 1px 0 rgba(255, 255, 255, .2);
        padding: 10px;
    }
    .title-area h2 { font-size: 34px; font-weight: 900; letter-spacing: 4px; color: #fff; text-shadow: 2px 2px 10px rgba(0, 0, 0, .3); text-align: center; }
    @keyframes titleGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    .back-area {
        grid-column: 5 / 7;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        min-height: 90px;
        background: var(--back-grad);
        border-radius: 20px;
        box-shadow: 0 12px 40px rgba(17, 153, 142, .4), inset 0 1px 0 rgba(255, 255, 255, .2);
        text-decoration: none; color: #fff; font-size: 18px; font-weight: 800; cursor: pointer;
        transition: transform .3s, box-shadow .3s;
    }
    .back-area:hover { transform: translateY(-5px); box-shadow: 0 18px 50px rgba(17, 153, 142, .5); }
    .back-area:active { transform: translateY(-2px) scale(.96); }

    .card { grid-column: 1 / -1; background: var(--card-2); border-radius: 16px; padding: 20px; box-shadow: 0 6px 20px rgba(0, 0, 0, .1); border: 2px solid var(--line); }
    .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        border: none; cursor: pointer; font-size: 15px; padding: 10px 20px; border-radius: 10px;
        background: var(--btn-grad); color: #fff;
        box-shadow: 0 4px 14px rgba(102,126,234,.4); transition: transform .2s, box-shadow .2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102,126,234,.55); }
    .btn:active { transform: scale(.96); }
    .btn-secondary { background: #e8eaf6; color: var(--txt); box-shadow: none; }
    .btn-danger { background: linear-gradient(135deg, #e53935, #d32f2f); box-shadow: 0 4px 14px rgba(229,57,53,.4); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    input, textarea, select {
        width: 100%; border: 1px solid #d0d4ea; border-radius: 10px; padding: 10px 12px;
        font-size: 14px; background: var(--card-2); color: var(--txt); outline: none;
    }
    input:focus, textarea:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,.2); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
    .hint { font-size: 12px; color: #999; margin-top: 8px; }

    /* ========== 模式切换 Tab ========== */
    .mode-tabs { display: flex; gap: 10px; margin-bottom: 14px; }
    .mode-tab {
        flex: 1; padding: 12px; border: 2px solid var(--line); border-radius: 12px;
        background: transparent; color: var(--txt); font-size: 15px; font-weight: 700;
        cursor: pointer; transition: all .25s;
    }
    .mode-tab.active { background: var(--btn-grad); color: #fff; border-color: transparent; box-shadow: 0 4px 14px rgba(102,126,234,.4); }

    /* ========== 转盘区 ========== */
    .wheel-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 10px 0; }
    .wheel-box { position: relative; width: min(62vw, 380px); height: min(62vw, 380px); }
    #wheelCanvas { width: 100%; height: 100%; display: block; }
    .wheel-center {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: 84px; height: 84px; border-radius: 50%;
        background: var(--btn-grad); color: #fff; font-size: 15px; font-weight: 800;
        display: flex; align-items: center; justify-content: center; text-align: center;
        cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.35);
        border: 3px solid rgba(255,255,255,.4); user-select: none;
    }
    .wheel-center:active { transform: translate(-50%, -50%) scale(.94); }
    .wheel-pointer {
        position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
        width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent;
        border-top: 26px solid #ff5e5e; z-index: 3; filter: drop-shadow(0 2px 4px rgba(0,0,0,.3));
    }

    /* ========== 骰子区 ========== */
    .dice-wrap { display: none; flex-direction: column; align-items: center; gap: 16px; padding: 10px 0; }
    .dice-wrap.show { display: flex; }
    .dice-scene { width: 140px; height: 140px; perspective: 600px; }
    .dice-cube {
        width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
        transform: rotateX(-20deg) rotateY(30deg); transition: transform 1.6s cubic-bezier(.2,.6,.2,1);
    }
    .dice-cube.rolling { transform: rotateX(1080deg) rotateY(1440deg) rotateZ(720deg); }
    .dice-face {
        position: absolute; width: 100%; height: 100%; border-radius: 16px;
        background: linear-gradient(135deg, #f8f9ff, #e3e7f5);
        display: flex; align-items: center; justify-content: center; font-size: 52px;
        box-shadow: inset 0 0 0 2px rgba(120,130,180,.3);
        color: #3a4058;
    }
    .dice-face:nth-child(1) { transform: rotateY(0deg) translateZ(70px); }
    .dice-face:nth-child(2) { transform: rotateY(90deg) translateZ(70px); }
    .dice-face:nth-child(3) { transform: rotateY(180deg) translateZ(70px); }
    .dice-face:nth-child(4) { transform: rotateY(-90deg) translateZ(70px); }
    .dice-face:nth-child(5) { transform: rotateX(90deg) translateZ(70px); }
    .dice-face:nth-child(6) { transform: rotateX(-90deg) translateZ(70px); }

    /* ========== 分类卡片墙 ========== */
    .cat-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 4px; }
    .cat-chip {
        display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-radius: 12px;
        background: rgba(102,126,234,.08); border: 2px solid var(--line);
        cursor: pointer; transition: all .2s; font-size: 14px; font-weight: 700; color: var(--txt);
        position: relative;
    }
    .cat-chip:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,.18); border-color: var(--gold); }
    .cat-chip .cnt { margin-left: auto; font-size: 11px; color: #999; font-weight: 600; }

    /* ========== 结果区 ========== */
    .result-box {
        margin-top: 14px; padding: 26px; border-radius: 14px; text-align: center;
        min-height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        background: var(--btn-grad); color: #fff; font-size: 20px; font-weight: 800;
        word-break: break-all; position: relative; overflow: hidden;
    }
    .result-box .cat-tag { font-size: 12px; background: rgba(255,255,255,.22); border-radius: 20px; padding: 3px 12px; letter-spacing: 1px; }
    .result-box.pop { animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
    @keyframes pop { 0% { transform: scale(.7); opacity: .4; } 100% { transform: scale(1); opacity: 1; } }
    .result-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

    /* ========== 历史 & 统计 ========== */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .sub-title { font-size: 15px; font-weight: 800; margin-bottom: 8px; color: var(--gold); display: flex; align-items: center; gap: 6px; }
    .hist-item {
        background: rgba(102,126,234,.07); border-radius: 8px; padding: 8px 12px;
        font-size: 13px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
        cursor: pointer; transition: background .2s; border: 1px solid transparent;
    }
    .hist-item:hover { background: rgba(102,126,234,.16); border-color: var(--gold); }
    .hist-item .t { color: var(--txt); }
    .hist-item .tm { color: #aaa; font-size: 11px; white-space: nowrap; }
    .stat-bar { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; }
    .stat-bar .lbl { min-width: 130px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat-bar .bar { flex: 1; height: 10px; border-radius: 6px; background: rgba(102,126,234,.1); overflow: hidden; }
    .stat-bar .bar i { display: block; height: 100%; border-radius: 6px; background: var(--btn-grad); transition: width .6s ease; }
    .stat-bar .num { min-width: 36px; text-align: right; color: #999; font-size: 12px; }

    /* ========== 自定义管理 ========== */
    .custom-list { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    .custom-item { display: flex; align-items: center; gap: 8px; background: rgba(102,126,234,.06); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
    .custom-item .nm { font-weight: 800; color: var(--gold); }
    .custom-item .it { color: var(--txt); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .custom-item .del { cursor: pointer; color: #e57373; font-weight: 800; padding: 2px 8px; border-radius: 6px; }
    .custom-item .del:hover { background: rgba(229,115,115,.15); }
    .empty-tip { color: #999; font-size: 13px; }

    /* ========== 彩带 ========== */
    #confettiCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999998; pointer-events: none; }

    /* ========== 转场遮罩（全站统一） ========== */
    .overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999999;
        display: flex; align-items: center; justify-content: center;
        background: rgba(8, 10, 25, .72); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
        opacity: 0; visibility: hidden; transition: opacity .4s ease, visibility .4s ease; pointer-events: none;
    }
    .overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }
    .loader-wrap { position: relative; width: 180px; height: 180px; display: flex; align-items: center; justify-content: center; }
    .loader-ring { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 3px solid rgba(255,255,255,.1); border-top-color: #f6d365; border-right-color: #fda085; animation: ringSpin .8s linear infinite; }
    .loader-ring::before { content: ''; position: absolute; top: 12px; left: 12px; right: 12px; bottom: 12px; border-radius: 50%; border: 2px solid transparent; border-bottom-color: #a78bfa; border-left-color: #667eea; animation: ringSpin 1.4s linear infinite reverse; }
    .loader-ring::after { content: ''; position: absolute; top: 28px; left: 28px; right: 28px; bottom: 28px; border-radius: 50%; border: 1px solid transparent; border-top-color: #fb7185; border-right-color: #2dd4bf; animation: ringSpin 2s linear infinite; }
    .loader-text { position: relative; z-index: 5; font-size: 24px; font-weight: 900; letter-spacing: 4px; background: linear-gradient(90deg, #f6d365, #fda085, #f6d365); background-size: 200% 100%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: textShine 1.5s linear infinite; }
    @keyframes ringSpin { to { transform: rotate(360deg); } }
    @keyframes textShine { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

    @media (max-width: 900px) {
        .container { width: 95%; padding: 12px; }
        .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .title-area, .back-area { grid-column: 1 / -1; min-height: 80px; }
        .title-area h2 { font-size: 28px; }
        .back-area { font-size: 16px; }
        .orb { display: none; }
        .two-col { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
        main { padding: 40px 12px 30px; }
        .container { width: 94%; max-width: 94vw; padding: 14px; }
        .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .title-area, .back-area { grid-column: 1 / -1; min-height: 70px; }
        .title-area h2 { font-size: 24px; }
        .wheel-box { width: min(78vw, 340px); height: min(78vw, 340px); }
    }
    @media (max-width: 480px) {
        .container { width: 96%; padding: 10px; }
        .grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .title-area h2 { font-size: 20px; letter-spacing: 2px; }
        .back-area { font-size: 15px; }
        .wheel-box { width: min(82vw, 300px); height: min(82vw, 300px); }
    }
</style>

<div class="container">

        <div class="card">

        <div class="card">
