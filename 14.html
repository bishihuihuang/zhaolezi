<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找乐子——虚拟消费系统</title>
<style>
/* ===== 基础重置与样式 ===== */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif; background:#0a0e27; color:#fff; overflow-x:hidden; }

/* 背景流光（与index一致） */
.bg-animation { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; overflow:hidden; }
.bg-flow-1 { position:absolute; top:-150%; left:-100%; width:350%; height:350%; background:linear-gradient(125deg,#0a0e27,#1c1458,#32227a,#1a0f3e,#241a5e,#0e1233,#1d1652); background-size:400% 400%; animation:flowGrad 20s ease-in-out infinite; }
.bg-flow-2 { position:absolute; top:-80%; left:-60%; width:260%; height:260%; background:radial-gradient(ellipse at 30% 70%,rgba(255,140,100,.4),transparent 60%),radial-gradient(ellipse at 70% 30%,rgba(90,180,255,.35),transparent 50%); animation:flowDrift 20s ease-in-out infinite alternate; }
.bg-flow-3 { position:absolute; top:-40%; left:-20%; width:200%; height:200%; background:radial-gradient(circle at 60% 40%,rgba(220,140,255,.25),transparent 55%); animation:flowSpin 20s linear infinite; }
@keyframes flowGrad {0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
@keyframes flowDrift {0%{transform:translate(0,0) scale(1) rotate(0deg);}50%{transform:translate(5%,-3%) scale(1.08) rotate(6deg);}100%{transform:translate(-2%,4%) scale(.94) rotate(-6deg);}}
@keyframes flowSpin {0%{transform:rotate(0deg) scale(1);}50%{transform:rotate(180deg) scale(1.06);}100%{transform:rotate(360deg) scale(1);}}
.orb { position:absolute; border-radius:50%; background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.32),rgba(255,255,255,.12) 45%,transparent 75%); box-shadow:0 0 60px rgba(255,255,255,.1),inset 0 0 30px rgba(255,255,255,.05); pointer-events:none; will-change:transform,opacity; }
.orb-1{width:260px;height:260px;top:10%;left:5%;animation:orbFloat1 18s ease-in-out infinite,orbRotate 40s linear infinite;}
.orb-2{width:160px;height:160px;top:55%;left:78%;animation:orbFloat2 22s ease-in-out infinite,orbRotate 55s linear infinite;}
.orb-3{width:110px;height:110px;top:70%;left:18%;animation:orbFloat1 16s ease-in-out infinite reverse,orbRotate 35s linear infinite;}
.orb-4{width:200px;height:200px;top:28%;left:62%;animation:orbFloat2 20s ease-in-out infinite,orbRotate 45s linear infinite;}
.orb-5{width:80px;height:80px;top:82%;left:45%;animation:orbFloat1 14s ease-in-out infinite,orbRotate 30s linear infinite;}
@keyframes orbFloat1{0%,100%{transform:translate(0,0);opacity:.5;}30%{transform:translate(20px,-25px);opacity:.8;}60%{transform:translate(-12px,15px);opacity:.4;}}
@keyframes orbFloat2{0%,100%{transform:translate(0,0);opacity:.6;}50%{transform:translate(-18px,14px);opacity:.3;}}
@keyframes orbRotate{to{transform:rotate(360deg);}}

/* 头部栏 */
header { position:fixed; top:0; left:0; width:100%; z-index:1000; display:flex; justify-content:space-between; align-items:center; padding:15px 30px; background:rgba(0,0,0,.4); backdrop-filter:blur(10px); border-bottom:1px solid rgba(255,255,255,.1); }
header h1 { font-size:24px; background:linear-gradient(90deg,#f6d365,#fda085,#f6d365); -webkit-background-clip:text; background-clip:text; color:transparent; letter-spacing:3px; }
.header-user { display:flex; gap:15px; align-items:center; font-size:14px; }
.header-user #points { color:#ffd700; font-weight:bold; }

/* 主容器 */
main { position:relative; z-index:10; padding-top:80px; display:flex; justify-content:center; align-items:flex-start; min-height:100vh; }
.container { width:90%; max-width:1400px; background:rgba(245,247,255,.96); border-radius:24px; box-shadow:0 25px 70px rgba(0,0,0,.4); overflow:hidden; margin-top:20px; }

/* 标题区域 */
.title-area { display:flex; justify-content:space-between; align-items:center; padding:20px 30px; background:linear-gradient(135deg,#1a1a4e,#2d1b69); }
.title-area h2 { font-size:36px; font-weight:900; background:linear-gradient(90deg,#f6d365,#fff,#a78bfa,#f6d365); -webkit-background-clip:text; background-clip:text; color:transparent; letter-spacing:3px; }
.title-actions { display:flex; gap:12px; align-items:center; }
.title-actions a.btn-main { padding:10px 24px; background:linear-gradient(135deg,#4e4376,#6b5b95); color:#fff; text-decoration:none; border-radius:50px; font-weight:bold; transition:.3s; box-shadow:0 4px 15px rgba(0,0,0,.2); }
.title-actions a.btn-main:hover { transform:translateY(-3px); box-shadow:0 8px 20px rgba(0,0,0,.3); }

/* 工具栏 */
.toolbar { display:flex; justify-content:space-between; align-items:center; padding:15px 20px; background:#f5f6fa; border-bottom:1px solid #e0e0e0; flex-wrap:wrap; gap:10px; }
.toolbar-left { display:flex; gap:10px; }
.refresh-btn, .coupon-btn {
  border:none; border-radius:20px; padding:8px 18px; cursor:pointer; font-size:14px; font-weight:bold;
}
.refresh-btn { background:#4a6cf7; color:#fff; }
.coupon-btn { background:#ff9800; color:#fff; }
.category-filters { display:flex; gap:8px; flex-wrap:wrap; }
.category-filters .cat-btn { border:none; background:#e0e0e0; border-radius:20px; padding:8px 15px; cursor:pointer; font-size:13px; transition:.2s; }
.category-filters .cat-btn.active { background:#667eea; color:#fff; }

/* 商品网格 */
.shop-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:15px; padding:20px; max-height:calc(100vh - 250px); overflow-y:auto; }
.product-card { background:#fff; color:#333; border-radius:14px; padding:12px; box-shadow:0 6px 20px rgba(0,0,0,.08); display:flex; flex-direction:column; transition:.3s; border:1px solid #eee; position:relative; }
.product-card:hover { transform:translateY(-5px); box-shadow:0 12px 25px rgba(0,0,0,.15); }
.product-card .prod-icon { font-size:40px; text-align:center; margin-bottom:8px; }
.product-card .prod-name { font-weight:700; font-size:15px; min-height:42px; cursor:pointer; }
.product-card .prod-desc { font-size:12px; color:#777; margin-bottom:6px; min-height:34px; }
.product-card .prod-price { color:#e65100; font-weight:800; font-size:18px; margin-bottom:10px; }
.product-card .add-to-cart { background:#ff9800; color:#fff; border:none; border-radius:30px; padding:8px; cursor:pointer; font-weight:bold; transition:.2s; min-height:44px; }
.product-card .add-to-cart:hover { background:#f57c00; }
.product-card .add-to-cart.added { background:#4caf50; }
.product-card .fav-btn { position:absolute; top:8px; right:8px; background:transparent; border:none; font-size:20px; cursor:pointer; opacity:.5; transition:.2s; min-width:44px; min-height:44px; }
.product-card .fav-btn.fav { opacity:1; color:#ff2eb9; }

/* 购物车 */
.cart-wrapper { position:fixed; top:90px; right:20px; z-index:999; }
.cart-icon { width:50px; height:50px; background:#1e1e2f; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 15px rgba(0,0,0,.4); cursor:pointer; font-size:24px; transition:transform .2s; }
.cart-icon:hover { transform:scale(1.1); }
.cart-panel { position:absolute; right:0; top:60px; width:340px; max-height:75vh; background:#1e1e2f; border-radius:20px; padding:15px; box-shadow:0 10px 30px rgba(0,0,0,.5); opacity:0; visibility:hidden; transform:translateX(20px); transition:opacity .3s,transform .3s,visibility .3s; }
.cart-wrapper:hover .cart-panel, .cart-wrapper:focus-within .cart-panel { opacity:1; visibility:visible; transform:translateX(0); }
.cart-panel h3 { color:#f6d365; font-size:20px; margin-bottom:10px; border-bottom:1px solid #ffffff22; padding-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
.cart-panel h3 .clear-cart { background:none; border:none; color:#ff6b6b; cursor:pointer; font-size:13px; min-height:44px; }
.cart-list { flex:1; overflow-y:auto; max-height:400px; }
.cart-item { display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid #ffffff10; font-size:14px; gap:5px; }
.cart-item .ci-info { flex:1; display:flex; flex-direction:column; }
.cart-item .ci-name { color:#fff; }
.cart-item .ci-price { color:#ffaa33; font-size:13px; }
.cart-item .ci-qty { display:flex; align-items:center; gap:5px; }
/* 【修复】调整数量按钮和删除按钮尺寸 */
.ci-qty button {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    border: none;
    background: #333;
    color: #fff;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.ci-qty span { min-width:20px; text-align:center; }
.cart-item .ci-remove {
    width: 44px;
    height: 44px;
    background:#ff6b6b;
    border:none;
    color:#fff;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
}
.cart-total { display:flex; justify-content:space-between; font-size:18px; font-weight:bold; margin:12px 0; color:#fff; }
.coupon-section { display:flex; gap:8px; margin-bottom:10px; }
.coupon-section button { background:#667eea; color:#fff; border:none; border-radius:8px; padding:8px 12px; cursor:pointer; font-weight:bold; min-height:44px; }
.checkout-btn { width:100%; padding:12px; background:linear-gradient(135deg,#ff2eb9,#be2edd); border:none; border-radius:50px; color:#fff; font-weight:900; font-size:17px; cursor:pointer; transition:.3s; margin-bottom:8px; min-height:44px; }
.checkout-btn:hover { transform:translateY(-3px); box-shadow:0 8px 20px #be2edd88; }
.checkout-btn:disabled { opacity:.5; cursor:not-allowed; }
.jump-to-shop { width:100%; padding:8px; background:#333; border:none; border-radius:20px; color:#f6d365; font-size:14px; font-weight:bold; cursor:pointer; transition:.2s; min-height:44px; }
.jump-to-shop:hover { background:#555; }

/* 支付模态 */
.overlay-modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.7); z-index:99999; display:none; align-items:center; justify-content:center; }
.overlay-modal.show { display:flex; }
.modal-box { background:#fff; color:#333; border-radius:25px; padding:30px; width:400px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.4); }
.modal-box h2 { margin-bottom:20px; color:#e65100; }
.modal-box .pay-methods { display:flex; gap:10px; justify-content:center; margin-bottom:20px; }
.pay-method { padding:10px 20px; border-radius:20px; border:2px solid #ddd; cursor:pointer; font-weight:bold; transition:.2s; min-height:44px; display:flex; align-items:center; justify-content:center; }
.pay-method:hover { border-color:#ff9800; }
.pay-method.active { background:#ff9800; color:#fff; border-color:#ff9800; }
.modal-box .modal-actions { display:flex; gap:10px; justify-content:center; }
.btn-confirm { background:#4caf50; color:#fff; border:none; padding:10px 30px; border-radius:50px; cursor:pointer; font-size:16px; font-weight:bold; min-height:44px; }
.btn-cancel { background:#ddd; border:none; padding:10px 30px; border-radius:50px; cursor:pointer; font-size:16px; font-weight:bold; min-height:44px; }

/* 支付成功 */
.success-modal { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#1e1e2f; color:#fff; padding:40px 60px; border-radius:30px; box-shadow:0 0 100px rgba(76,175,80,.5); z-index:99998; display:none; text-align:center; }
.success-modal.show { display:block; }
.success-modal .icon { font-size:80px; }
.success-modal h3 { margin:20px 0 10px; }
.success-modal button { margin-top:20px; background:#4caf50; border:none; color:#fff; padding:10px 40px; border-radius:50px; cursor:pointer; font-size:18px; font-weight:bold; min-height:44px; }

/* 商品详情弹窗 */
.detail-modal { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#fff; color:#333; border-radius:25px; padding:30px; width:500px; box-shadow:0 30px 80px rgba(0,0,0,.5); z-index:99997; display:none; }
.detail-modal.show { display:block; }
.detail-modal .close-detail { position:absolute; top:15px; right:15px; border:none; background:#f0f0f0; width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:16px; font-weight:bold; min-width:44px; min-height:44px; }
.detail-modal .detail-icon { font-size:80px; text-align:center; margin-bottom:15px; }
.detail-modal h3 { text-align:center; margin-bottom:15px; }
.detail-modal p { margin-bottom:15px; }
.detail-modal .price { font-size:24px; color:#e65100; font-weight:bold; }
.detail-modal button.add-from-detail { display:block; width:100%; padding:12px; background:#ff9800; border:none; color:#fff; border-radius:30px; cursor:pointer; font-size:16px; font-weight:bold; margin-top:15px; min-height:44px; }

/* 分页控件 */
.pagination { grid-column:1/-1; display:flex; gap:10px; justify-content:center; margin:20px 0; }
.page-btn { border:2px solid #667eea; background:#fff; color:#333; border-radius:20px; padding:8px 18px; cursor:pointer; font-size:14px; font-weight:bold; transition:all .2s; box-shadow:0 2px 6px rgba(0,0,0,.1); min-height:44px; }
.page-btn:hover:not(:disabled) { background:#667eea; color:#fff; transform:translateY(-2px); }
.page-btn:disabled { opacity:.5; cursor:not-allowed; }
.page-info { display:flex; align-items:center; font-size:14px; color:#555; padding:0 10px; }

/* 滚动条 */
.shop-grid::-webkit-scrollbar { width:8px; }
.shop-grid::-webkit-scrollbar-track { background:#e0e0e0; }
.shop-grid::-webkit-scrollbar-thumb { background:#888; border-radius:10px; }
.cart-list::-webkit-scrollbar { width:6px; }
.cart-list::-webkit-scrollbar-thumb { background:#555; }

/* 响应式 */
@media (max-width:1200px){ .shop-grid{grid-template-columns:repeat(4,1fr);} .cart-panel{width:300px;} }
@media (max-width:900px){ .shop-grid{grid-template-columns:repeat(3,1fr);} .cart-panel{width:260px;} header{padding:10px 15px;} .toolbar{flex-direction:column;} }
@media (max-width:600px){ .shop-grid{grid-template-columns:repeat(2,1fr);} .cart-panel{width:230px;} .title-area h2{font-size:26px;} .container{width:95%;} }

/* ========== 新转场动画（高级图转，文字不动） ========== */
#transitionOverlay {
    position:fixed; top:0; left:0; width:100%; height:100%; z-index:999999;
    background:rgba(0,0,0,0); display:flex; align-items:center; justify-content:center;
    opacity:0; visibility:hidden; transition:opacity .4s, visibility .4s;
}
#transitionOverlay.active { opacity:1; visibility:visible; background:rgba(8,10,25,.85); }
#transitionOverlay::before {
    content:''; position:absolute; top:50%; left:50%; width:600px; height:600px; margin:-300px 0 0 -300px;
    background:radial-gradient(circle,rgba(246,211,101,.3),transparent 60%);
    animation:centerPulse 1s ease-in-out infinite;
}
@keyframes centerPulse { 0%,100%{transform:scale(.8);opacity:.8;} 50%{transform:scale(1.2);opacity:.5;} }
.trans-geo {
    position:absolute; top:50%; left:50%; width:0; height:0;
    transform-style:preserve-3d;
    animation:geoRotate 2s linear infinite;
}
.trans-geo .cube {
    position:absolute; width:80px; height:80px; margin:-40px 0 0 -40px;
    background:linear-gradient(135deg,#f6d365,#fda085); border:2px solid #fff;
    transform:rotateX(45deg) rotateY(45deg);
    animation:cubeSpin 3s linear infinite;
}
@keyframes cubeSpin { 0%{transform:rotateX(0) rotateY(0);} 100%{transform:rotateX(360deg) rotateY(360deg);} }
.trans-particles { position:absolute; inset:0; overflow:hidden; }
.trans-particle {
    position:absolute; width:6px; height:6px; border-radius:50%;
    background:linear-gradient(90deg,#f6d365,#fda085);
    animation:flyToCenter 1.2s ease-in-out infinite;
}
@keyframes flyToCenter {
    0% { transform:translate(var(--start-x),var(--start-y)) scale(1); opacity:1; }
    100% { transform:translate(0,0) scale(0); opacity:0; }
}
.trans-text {
    position:relative; z-index:5; font-size:36px; font-weight:900; letter-spacing:6px;
    background:linear-gradient(90deg,#f6d365,#fff,#a78bfa,#f6d365);
    background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:textShine 1.5s linear infinite;
    text-align:center; line-height:1.3;
    padding:20px 40px; border-radius:20px;
    background-color:rgba(0,0,0,.5);
}
@keyframes textShine { 0%{background-position:0% 50%;} 100%{background-position:200% 50%;} }

/* 优惠券弹窗 */
.coupon-modal {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:#fff; color:#333; border-radius:20px; padding:25px; width:400px;
    box-shadow:0 20px 50px rgba(0,0,0,.4); z-index:99999; display:none; 
}
.coupon-modal.show { display:block; }
.coupon-modal h3 { text-align:center; margin-bottom:15px; }
.coupon-list { max-height:300px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
.coupon-item {
    border:2px solid #ddd; border-radius:10px; padding:10px; cursor:pointer; transition:.2s;
}
.coupon-item:hover { border-color:#ff9800; background:#fff3e0; }
.coupon-close {
    display:block; width:100%; margin-top:15px; padding:8px; background:#ddd; border:none; border-radius:20px; cursor:pointer; font-weight:bold; min-height:44px;
}

        /* ========== 手机端响应式适配（通用） ========== */
        @media (max-width: 768px) {
            html, body {
                overflow-x: hidden;
                width: 100%;
            }
            main {
                padding: 70px 0 30px !important;
            }
            .container, .card-container, .wrapper, .box, .panel, .form-box {
                width: 94% !important;
                max-width: 94vw !important;
                padding: 14px !important;
                margin: 0 auto !important;
            }
            /* 6列/多列网格改3列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 8px !important;
                padding: 4px !important;
            }
            /* 大区域占满整行 */
            .title-area, .back-area, .display-area, .game-main,
            .calculator-area, .main-area, .content-area, .result-area,
            .input-area, .output-area, .board-area, .info-area, .settings-area {
                grid-column: 1 / -1 !important;
                grid-row: auto !important;
            }
            /* 左右分栏改上下堆叠 */
            .left-panel, .right-panel, .side-panel, .sidebar {
                flex: 1 1 100% !important;
                width: 100% !important;
                border-right: none !important;
                border-bottom: 1px solid rgba(0,0,0,.1) !important;
            }
            .display-area, .game-main, .calculator-area {
                flex-direction: column !important;
                padding: 12px !important;
            }
            .cell, .tool-cell, .grid-cell {
                padding: 10px 6px !important;
                min-height: 70px !important;
            }
            h1, h2, h3, .title-text, .author-name, .main-title {
                font-size: 22px !important;
                letter-spacing: 1px !important;
            }
            .btn, button, input, select, textarea {
                font-size: 14px !important;
                padding: 10px 14px !important;
            }
            .ghost-btn, .back-btn, .return-btn {
                padding: 8px 16px !important;
                font-size: 13px !important;
            }
            /* 隐藏非必要装饰元素 */
            .orb, .decoration, .deco-element, .floating-shape {
                display: none !important;
            }
        }
        @media (max-width: 480px) {
            .container, .card-container, .wrapper, .box {
                width: 96% !important;
                padding: 10px !important;
            }
            /* 小屏手机改2列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 6px !important;
            }
            h1, h2, h3, .title-text, .author-name {
                font-size: 18px !important;
            }
            .cell, .tool-cell {
                min-height: 80px !important;
                padding: 8px 4px !important;
            }
            .btn, button {
                font-size: 13px !important;
                padding: 8px 12px !important;
            }
        }
</style>
</head>
<body>
<!-- 背景 -->
<div class="bg-animation">
  <div class="bg-flow-1"></div><div class="bg-flow-2"></div><div class="bg-flow-3"></div>
  <div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div><div class="orb orb-4"></div><div class="orb orb-5"></div>
</div>
<!-- 头部 -->
<header>
  <h1>🛍️ 找乐子虚拟消费系统</h1>
  <div class="header-user"><span>👤 游客</span><span id="points">积分：0</span></div>
</header>
<!-- 主体 -->
<main>
  <div class="container">
    <div class="title-area">
      <h2>找乐子——虚拟消费系统</h2>
      <div class="title-actions"><a href="index.html" class="btn-main" id="mainHome" aria-label="返回主程序">主程序</a></div>
    </div>
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="refreshBtn" class="refresh-btn" aria-label="刷新商品">🔄 刷新商品</button>
        <button id="couponBtn" class="coupon-btn" aria-label="选择优惠券">🎟️ 优惠券</button>
      </div>
      <div class="category-filters" id="categoryFilters">
        <button class="cat-btn active" data-cat="全部">全部</button>
        <button class="cat-btn" data-cat="电子产品">电子产品</button>
        <button class="cat-btn" data-cat="美食">美食</button>
        <button class="cat-btn" data-cat="饮料">饮料</button>
        <button class="cat-btn" data-cat="拼豆">拼豆</button>
