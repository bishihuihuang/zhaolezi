<style>
/* ============================================================
   找乐子 · 优质工具库 · 提升版
   基于 landing-page-design skill 视觉系统（B1-B11）
   设计方向：深色 flat + 金色 accent（方案 A）
   ============================================================ */

/* ---------- 设计 token（B2 间距表 / B3 圆角 / B1 字阶） ---------- */
:root {
  --bg: #000000;
  --surface: #181818;
  --surface-2: #1F1F1F;
  --line: #272727;
  --text: #FFFFFF;
  --text-dim: #9B9B9B;
  --text-mute: #6E6E6E;
  --accent: #F6D365;
  --accent-2: #FDA085;
  --accent-ink: #181818;
  --sp-0: 0; --sp-25: 2px; --sp-50: 4px; --sp-75: 8px; --sp-100: 12px;
  --sp-200: 16px; --sp-300: 24px; --sp-400: 32px; --sp-500: 40px;
  --sp-600: 48px; --sp-700: 64px; --sp-800: 80px;
  --r-lg: 16px;      /* 外层 rounded-2xl */
  --r-md: 8px;       /* 内层 = 16 - 8(gap) = 8 rounded-lg */
  --r-sm: 4px;       /* 小元素 rounded */
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --dur: 500ms;      /* 布局/位置变化 */
  --dur-fast: 300ms; /* 颜色/透明度 hover */
  --font: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
}

/* ---------- V126d 亮背景图自动浅色前景（theme.js 按图片亮度设置 data-bg-lum） ---------- */
:root[data-bg-lum="light"] {
  --text: #16181f;
  --text-dim: rgba(22, 24, 31, .72);
  --text-mute: rgba(22, 24, 31, .55);
  --surface: rgba(255, 255, 255, .82);
  --surface-2: rgba(255, 255, 255, .92);
  --line: rgba(22, 24, 31, .14);
}

/* ---------- 重置（B1 无连字符、无超粗、系统字体） ---------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  font-size: 16px;          /* text-base */
  line-height: 1.6;
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
::selection { background: var(--accent); color: var(--accent-ink); }

/* ---------- 焦点可见（B9 可访问性要求） ---------- */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

/* ---------- 跳转链接（B10） ---------- */
.skip-link {
  position: absolute; left: var(--sp-100); top: -100%;
  z-index: 99999;
  background: var(--accent); color: var(--accent-ink);
  padding: var(--sp-75) var(--sp-200);
  border-radius: var(--r-md);
  font-weight: 600; font-size: 14px;
  transition: top var(--dur) var(--ease);
}
.skip-link:focus { top: var(--sp-100); }

/* ---------- 背景：flat 深色 + 静态径向光斑（B4 无渐变背景；只 anim transform/opacity） ---------- */
.bg-ambient {
  position: fixed; inset: 0; z-index: 0;
  overflow: hidden; pointer-events: none;
  /* V126b：移除不透明底色（body 已有 var(--bg)），否则主题背景/自定义背景图被此层完全遮死 */
}
/* V126b：主题背景承载层——dark 主题维持 var(--bg) 原视觉；
   非 dark 主题由 common.css 的 .bg-flow-1 规则接管（背景图/自定义上传图 + 光晕 + 纹理） */
.bg-ambient .bg-flow-1 {
  position: absolute; inset: 0;
  background: var(--bg);
}
.glow {
  position: absolute; border-radius: 50%;
  filter: blur(80px);
  opacity: .16;
  will-change: transform, opacity;
}
.glow-1 { width: 520px; height: 520px; top: -140px; left: -120px; background: radial-gradient(circle, #F6D365, transparent 65%); animation: driftA 22s var(--ease) infinite alternate; }
.glow-2 { width: 460px; height: 460px; top: 30%; right: -160px; background: radial-gradient(circle, #FDA085, transparent 65%); animation: driftB 26s var(--ease) infinite alternate; }
.glow-3 { width: 400px; height: 400px; bottom: -180px; left: 22%; background: radial-gradient(circle, #667eea, transparent 65%); opacity: .12; animation: driftA 30s var(--ease) infinite alternate-reverse; }
@keyframes driftA { from { transform: translate3d(0,0,0); } to { transform: translate3d(40px, 30px, 0); } }
@keyframes driftB { from { transform: translate3d(0,0,0); } to { transform: translate3d(-36px, 24px, 0); } }

/* ---------- 头部（B7 导航：悬浮条、半透明、模糊） ---------- */
.site-header {
  position: fixed; top: var(--sp-100); left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  display: flex; align-items: center; gap: var(--sp-400);
  max-width: 1440px; width: calc(100% - 48px);
  padding: var(--sp-100) var(--sp-300);
  border-radius: var(--r-lg);
  background: var(--surface);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--line);
}
.brand { font-size: 20px; font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
.brand b { color: var(--accent); font-weight: 700; }
.site-nav { display: flex; gap: var(--sp-200); margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.site-nav::-webkit-scrollbar { display: none; }
.site-nav a {
  font-size: 14px; color: var(--text-dim); padding: var(--sp-50) var(--sp-100);
  border-radius: var(--r-md); transition: color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.site-nav a:hover { color: var(--text); background: var(--surface-2); }

/* ---------- Hero（B5：标题白→灰渐变、max-width 680px、balance） ---------- */
main { position: relative; z-index: 1; padding-top: 120px; }
.hero {
  max-width: 680px; margin: 0 auto;
  padding: var(--sp-700) var(--sp-300) var(--sp-600);
  text-align: center;
}
.hero-kicker {
  font-size: 14px; font-weight: 600; letter-spacing: .18em;
  color: var(--accent); text-transform: uppercase;
  margin-bottom: var(--sp-200);
}
.hero-title {
  font-size: 60px; font-weight: 700; line-height: 1.05;
  letter-spacing: -.01em; text-wrap: balance;
  background: var(--title-grad);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.hero-sub {
  margin: var(--sp-300) auto 0; max-width: 560px;
  font-size: 20px; line-height: 1.5; color: var(--text-dim);
  text-wrap: pretty;
}
.hero-actions { margin-top: var(--sp-400); }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: var(--sp-100) var(--sp-300);
  font-size: 16px; font-weight: 600; border-radius: var(--r-md);
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), background var(--dur-fast) var(--ease);
}
.btn-primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 22%, transparent); }
.btn-primary:hover { background: color-mix(in srgb, var(--accent) 82%, #ffffff); box-shadow: 0 12px 32px color-mix(in srgb, var(--accent) 32%, transparent); }
.btn-primary:active { transform: scale(.98); }
.hero-proof {
  margin-top: var(--sp-300); font-size: 14px; color: var(--text-mute);
  font-variant-numeric: tabular-nums;
}

/* ---------- 工具区（分区 + 网格） ---------- */
.tools-wrap { max-width: 1440px; margin: 0 auto; padding: 0 var(--sp-300) var(--sp-800); }
.section { margin-bottom: var(--sp-700); scroll-margin-top: 110px; }
.section-title {
  display: flex; align-items: center; gap: var(--sp-100);
  font-size: 24px; font-weight: 700; margin-bottom: var(--sp-300);
}
.section-title::before {
  content: ''; width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); flex: none;
}
.section-title .count { font-size: 14px; font-weight: 400; color: var(--text-mute); }
.grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: var(--sp-200);
}
@supports not (display: grid) {
  .grid { display: flex; flex-wrap: wrap; gap: var(--sp-200); }
  .tool-box { flex: 1 1 calc(16.66% - 16px); min-width: 130px; }
}

/* ---------- 工具框（B4 flat 表面、B3 圆角、B9 状态） ---------- */
.tool-box {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 128px; padding: var(--sp-200) var(--sp-100);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg);
  transition: transform var(--dur) var(--ease), border-color var(--dur-fast) var(--ease), box-shadow var(--dur) var(--ease);
  will-change: transform;
}
.tool-box:hover {
  transform: translateY(-6px);
  border-color: color-mix(in srgb, var(--accent) 50%, transparent);
  box-shadow: 0 14px 34px rgba(0, 0, 0, .4), 0 0 0 1px color-mix(in srgb, var(--accent) 20%, transparent);
}
.tool-box:active { transform: scale(.97); transition-duration: .1s; }
.tool-box .tool-icon { font-size: 26px; line-height: 1; margin-bottom: var(--sp-100); }
.tool-box .tool-title { font-size: 16px; font-weight: 600; text-align: center; line-height: 1.4; }
.tool-box .tooltip {
  position: absolute; bottom: calc(100% + 8px); left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--line);
  padding: var(--sp-75) var(--sp-100);
  border-radius: var(--r-md);
  font-size: 12px; line-height: 1.45; white-space: nowrap;
  max-width: 260px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease), visibility var(--dur-fast);
  z-index: 9;
}
.tool-box:hover .tooltip,
.tool-box:focus-visible .tooltip { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

/* ---------- 底部（B10 footer 版权一行） ---------- */
.site-footer {
  position: relative; z-index: 1;
  border-top: 1px solid var(--line);
  padding: var(--sp-400) var(--sp-300);
  text-align: center;
}
.site-footer .f-copy { font-size: 14px; color: var(--text-mute); }

/* ---------- 跳转覆盖层（保留品牌加载动画） ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 999999;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0, 0, 0, .72);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity var(--dur) var(--ease), visibility var(--dur);
}
.overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }
.loader-wrap { position: relative; width: 180px; height: 180px; display: flex; align-items: center; justify-content: center; }
.loader-ring {
  position: absolute; inset: 0; border-radius: 50%;
  border: 3px solid rgba(255, 255, 255, .12);
  border-top-color: var(--accent); border-right-color: var(--accent-2);
  animation: ringSpin .8s linear infinite;
}
.loader-ring::before {
  content: ''; position: absolute; inset: 14px; border-radius: 50%;
  border: 2px solid transparent; border-bottom-color: #A78BFA; border-left-color: #667EEA;
  animation: ringSpin 1.4s linear infinite reverse;
}
.loader-text { position: relative; z-index: 2; font-size: 22px; font-weight: 700; letter-spacing: .1em; color: var(--accent); }
@keyframes ringSpin { to { transform: rotate(360deg); } }

/* ---------- 响应式（B2/B3 归一，6→4→3→2 列） ---------- */
@media (max-width: 1280px) { .grid { grid-template-columns: repeat(4, 1fr); } }
@media (max-width: 900px)  { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 720px)  {
  .site-header { width: calc(100% - 32px); gap: var(--sp-200); padding: var(--sp-100) var(--sp-200); }
  .hero { padding-top: var(--sp-600); }
  .hero-title { font-size: 40px; }
  .hero-sub { font-size: 18px; }
  .tools-wrap { padding: 0 var(--sp-200) var(--sp-600); }
  .grid { grid-template-columns: repeat(2, 1fr); gap: var(--sp-100); }
  .tool-box .tooltip { display: none; }
}
@media (max-width: 400px) { .hero-title { font-size: 32px; } }

/* ---------- 减少动效（B7 尊重 prefers-reduced-motion） ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  html { scroll-behavior: auto; }
}
</style>
