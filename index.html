<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找乐子——优质工具库</title>
    <style>
        /* ========== 全局重置 ========== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            min-height: 100vh;
            background: #0a0e27;
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }

        /* ========== 背景流光层（20秒无缝循环） ========== */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-flow-1 {
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: linear-gradient(125deg,
                    #0a0e27, #161a3d, #1f1652, #331d6e,
                    #1d1b4b, #0f122f, #241a54);
            background-size: 400% 400%;
            animation: flowGradient 20s ease-in-out infinite;
            will-change: background-position;
        }

        .bg-flow-2 {
            position: absolute;
            top: -60%;
            left: -40%;
            width: 220%;
            height: 220%;
            background: radial-gradient(ellipse at 30% 70%,
                    rgba(255, 140, 100, .35), transparent 50%),
                radial-gradient(ellipse at 65% 35%,
                    rgba(120, 180, 255, .3), transparent 45%),
                radial-gradient(ellipse at 80% 80%,
                    rgba(220, 130, 250, .25), transparent 40%);
            animation: flowDrift 20s ease-in-out infinite alternate;
            will-change: transform;
        }

        .bg-flow-3 {
            position: absolute;
            top: -30%;
            left: -20%;
            width: 180%;
            height: 180%;
            background: radial-gradient(circle at 50% 50%,
                    rgba(255, 200, 130, .15), transparent 60%),
                radial-gradient(circle at 20% 80%,
                    rgba(80, 220, 200, .2), transparent 50%);
            animation: flowRotate 20s linear infinite;
            will-change: transform;
        }

        @keyframes flowGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes flowDrift {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(3%, -4%) scale(1.05) rotate(5deg); }
            100% { transform: translate(-2%, 3%) scale(.97) rotate(-5deg); }
        }

        @keyframes flowRotate {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.08); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* ========== 悬浮球（透明、漂浮、旋转） ========== */
        .orb {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%,
                    rgba(255, 255, 255, .3),
                    rgba(255, 255, 255, .1) 50%,
                    transparent 70%);
            box-shadow: 0 0 60px rgba(255, 255, 255, .08),
                inset 0 0 30px rgba(255, 255, 255, .04);
            pointer-events: none;
            will-change: transform, opacity;
        }

        .orb-1 {
            width: 260px;
            height: 260px;
            top: 12%;
            left: 8%;
            animation: orbFloatA 18s ease-in-out infinite,
                orbSpin 40s linear infinite;
        }

        .orb-2 {
            width: 160px;
            height: 160px;
            top: 55%;
            left: 75%;
            animation: orbFloatB 22s ease-in-out infinite,
                orbSpin 55s linear infinite;
        }

        .orb-3 {
            width: 110px;
            height: 110px;
            top: 68%;
            left: 20%;
            animation: orbFloatA 16s ease-in-out infinite reverse,
                orbSpin 35s linear infinite;
        }

        .orb-4 {
            width: 220px;
            height: 220px;
            top: 28%;
            left: 60%;
            animation: orbFloatB 20s ease-in-out infinite reverse,
                orbSpin 50s linear infinite;
        }

        .orb-5 {
            width: 80px;
            height: 80px;
            top: 80%;
            left: 45%;
            animation: orbFloatA 14s ease-in-out infinite,
                orbSpin 30s linear infinite;
        }

        @keyframes orbFloatA {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: .6;
            }
            30% {
                transform: translate(18px, -22px) scale(1.04);
                opacity: .8;
            }
            60% {
                transform: translate(-12px, 10px) scale(.96);
                opacity: .5;
            }
            100% {
                transform: translate(0, 0) scale(1);
                opacity: .6;
            }
        }

        @keyframes orbFloatB {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: .5;
            }
            35% {
                transform: translate(-20px, 12px) scale(1.06);
                opacity: .7;
            }
            70% {
                transform: translate(14px, -15px) scale(.94);
                opacity: .4;
            }
            100% {
                transform: translate(0, 0) scale(1);
                opacity: .5;
            }
        }

        @keyframes orbSpin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ========== 头部 ========== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            text-align: center;
            padding: 18px 20px;
            background: linear-gradient(180deg,
                    rgba(8, 10, 30, .9),
                    rgba(10, 14, 39, .5),
                    transparent);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, .06);
            box-shadow: 0 4px 40px rgba(0, 0, 0, .3);
        }

        header h1 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 5px;
            background: linear-gradient(90deg,
                    #f6d365, #fda085, #f6d365,
                    #fda085, #f6d365);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textShine 3s linear infinite;
            display: inline-block;
            text-shadow: 0 0 30px rgba(246, 211, 101, .3);
        }

        @keyframes textShine {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 200% 50%;
            }
        }

        /* ========== 主体布局 ========== */
        main {
            padding-top: 100px;
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-bottom: 50px;
        }

        /* ========== 白色容器（80%宽，可滚动） ========== */
        .container {
            width: 80%;
            max-width: 1440px;
            background: rgba(245, 247, 255, .96);
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, .35),
                0 0 0 1px rgba(255, 255, 255, .3),
                inset 0 1px 0 rgba(255, 255, 255, .6);
            max-height: calc(100vh - 130px);
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
        }

        .container::-webkit-scrollbar {
            width: 10px;
        }

        .container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, .04);
            border-radius: 12px;
        }

        .container::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #667eea, #764ba2);
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, .4);
        }

        /* ========== 网格布局（6列） ========== */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            padding: 6px;
        }

        /* 回退：不支持 grid 时使用 flex（兼容旧浏览器） */
        @supports not (display: grid) {
            .grid {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
            }
            .title-area {
                flex: 1 1 100%;
                min-height: 100px;
            }
            .back-area {
                flex: 1 1 100%;
                min-height: 80px;
            }
            .tool-box {
                flex: 1 1 calc(16.66% - 12px);
                min-width: 120px;
            }
        }

        /* ========== 标题区域（前2行前4列） ========== */
        .title-area {
            grid-column: 1 / 5;
            grid-row: 1 / 3;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg,
                    #101430, #1a1a4e, #2d1b69, #1a1a4e);
            background-size: 300% 300%;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(20, 15, 80, .45),
                inset 0 1px 0 rgba(255, 255, 255, .12);
            position: relative;
            overflow: hidden;
            cursor: default;
            transition: transform .4s cubic-bezier(.34, 1.56, .64, 1),
                box-shadow .4s ease;
        }

        .title-area:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 18px 60px rgba(30, 25, 100, .5),
                0 0 50px rgba(102, 126, 234, .25);
        }

        .title-area:active {
            transform: translateY(-2px) scale(.98);
            transition-duration: .1s;
        }

        .title-area h2 {
            font-size: 46px;
            font-weight: 900;
            text-align: center;
            line-height: 1.3;
            letter-spacing: 5px;
            background: linear-gradient(90deg,
                    #f6d365, #ffffff, #a78bfa, #f6d365);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleShine 4s ease-in-out infinite;
        }

        .title-area::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg,
                    transparent 30%,
                    rgba(255, 255, 255, .12) 50%,
                    transparent 70%);
            animation: titleSweep 5s ease-in-out infinite;
        }

        @keyframes titleShine {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        @keyframes titleSweep {
            0% {
                transform: translateX(-60%) rotate(0deg);
            }
            100% {
                transform: translateX(60%) rotate(0deg);
            }
        }

        /* ========== 工具框（超链接格子） ========== */
        .tool-box {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 112px;
            height: 112px;
            border-radius: 14px;
            padding: 12px 8px;
            text-decoration: none;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .18),
                inset 0 1px 0 rgba(255, 255, 255, .15);
            transition: transform .35s cubic-bezier(.34, 1.56, .64, 1),
                box-shadow .35s ease;
            cursor: pointer;
            will-change: transform;
            overflow: hidden;
            isolation: isolate;
        }

        .tool-box::before {
            content: '';
            position: absolute;
            top: -80%;
            left: -80%;
            width: 260%;
            height: 260%;
            background: linear-gradient(45deg,
                    transparent 40%,
                    rgba(255, 255, 255, .18) 50%,
                    transparent 60%);
            transform: rotate(45deg) translateX(-100%);
            transition: transform .6s ease;
            z-index: 0;
        }

        .tool-box:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 14px 35px rgba(0, 0, 0, .25),
                0 0 40px rgba(120, 150, 255, .2);
        }

        .tool-box:hover::before {
            transform: rotate(45deg) translateX(100%);
        }

        .tool-box:active {
            transform: translateY(-2px) scale(.94);
            box-shadow: 0 4px 12px rgba(0, 0, 0, .2);
            transition-duration: .1s;
        }

        /* 工具框颜色变体 */
        .color-0 {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
        }

        .color-1 {
            background: linear-gradient(135deg, #6d28d9, #a78bfa);
        }

        .color-2 {
            background: linear-gradient(135deg, #0f766e, #2dd4bf);
        }

        .color-3 {
            background: linear-gradient(135deg, #b45309, #fbbf24);
        }

        .color-4 {
            background: linear-gradient(135deg, #be123c, #fb7185);
        }

        /* 工具框内容 */
        .tool-box .tool-icon {
            font-size: 24px;
            line-height: 1;
            margin-bottom: 6px;
            position: relative;
            z-index: 2;
            display: block;
        }

        .tool-box .tool-icon:empty {
            display: none;
        }

        .tool-box .tool-title {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            text-align: center;
            line-height: 1.4;
            font-size: 14px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, .2);
            word-break: normal;
            overflow-wrap: anywhere;
            -webkit-line-break: after-white-space;
            line-break: strict;
            min-height: 2.8em;
        }

        /* ========== 悬停浮窗（tooltip） ========== */
        .tool-box .tooltip {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%) translateY(8px) scale(.9);
            background: rgba(15, 18, 40, .95);
            color: #fff;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 12px;
            line-height: 1.4;
            white-space: nowrap;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .4),
                0 0 0 1px rgba(255, 255, 255, .1);
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity .3s ease, transform .3s ease, visibility .3s;
            z-index: 9999;
        }

        .tool-box .tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 6px solid transparent;
            border-top-color: rgba(15, 18, 40, .95);
        }

        .tool-box:hover .tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        /* ========== 跳转覆盖层 ========== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(8, 10, 25, .72);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            opacity: 0;
            visibility: hidden;
            transition: opacity .4s ease, visibility .4s ease;
            pointer-events: none;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* 转圈动画 */
        .loader-wrap {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, .1);
            border-top-color: #f6d365;
            border-right-color: #fda085;
            animation: ringSpin .8s linear infinite;
            box-sizing: border-box;
        }

        .loader-ring::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-bottom-color: #a78bfa;
            border-left-color: #667eea;
            animation: ringSpin 1.4s linear infinite reverse;
        }

        .loader-ring::after {
            content: '';
            position: absolute;
            top: 28px;
            left: 28px;
            right: 28px;
            bottom: 28px;
            border-radius: 50%;
            border: 1px solid transparent;
            border-top-color: #fb7185;
            border-right-color: #2dd4bf;
            animation: ringSpin 2s linear infinite;
        }

        .loader-text {
            position: relative;
            z-index: 5;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(90deg,
                    #f6d365, #fda085, #f6d365);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textShine 1.5s linear infinite;
        }

        @keyframes ringSpin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ========== 响应式适配：平板端（3列） ========== */
        @media (max-width: 1024px) {
            .container {
                width: 92%;
                padding: 14px;
            }
            .grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }
            .title-area {
                grid-column: 1 / -1;
                grid-row: auto;
                min-height: 120px;
            }
            .title-area h2 {
                font-size: 32px;
                letter-spacing: 3px;
            }
        }

        /* ========== 响应式适配：手机大屏（3列） ========== */
        @media (max-width: 768px) {
            header {
                padding: 14px 16px;
            }
            header h1 {
                font-size: 20px;
                letter-spacing: 2px;
            }
            main {
                padding-top: 80px;
            }
            .container {
                width: 94%;
                max-width: 100%;
                padding: 12px;
                max-height: none;
                border-radius: 18px;
            }
            .grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
                padding: 4px;
            }
            .title-area {
                grid-column: 1 / -1;
                grid-row: auto;
                min-height: 100px;
                border-radius: 16px;
            }
            .title-area h2 {
                font-size: 26px;
                letter-spacing: 2px;
            }
            .tool-box {
                min-height: 96px;
                height: auto;
                padding: 10px 6px;
                border-radius: 12px;
            }
            .tool-box .tool-icon {
                font-size: 22px;
                margin-bottom: 4px;
            }
            .tool-box .tool-title {
                font-size: 12px;
                line-height: 1.35;
                min-height: auto;
                letter-spacing: 0.5px;
            }
            .tool-box .tooltip {
                display: none;
            }
        }

        /* ========== 响应式适配：手机小屏（2列） ========== */
        @media (max-width: 480px) {
            header h1 {
                font-size: 18px;
                letter-spacing: 1px;
            }
            .container {
                width: 96%;
                padding: 10px;
            }
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            .title-area {
                min-height: 90px;
            }
            .title-area h2 {
                font-size: 22px;
                letter-spacing: 1px;
            }
            .tool-box {
                min-height: 100px;
                padding: 12px 8px;
            }
            .tool-box .tool-icon {
                font-size: 24px;
            }
            .tool-box .tool-title {
                font-size: 13px;
                line-height: 1.4;
            }
        }

        /* ========== 网格回退：不支持grid的旧浏览器 ========== */
        @supports not (display: grid) {
            .grid {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
            }
            .title-area {
                flex: 1 1 100%;
                min-height: 100px;
            }
            .tool-box {
                flex: 1 1 calc(16.66% - 12px);
                min-width: 120px;
            }
            @media (max-width: 768px) {
                .grid {
                    flex-direction: row;
                }
                .tool-box {
                    flex: 1 1 calc(33.33% - 8px);
                    min-width: 0;
                }
            }
            @media (max-width: 480px) {
                .tool-box {
                    flex: 1 1 calc(50% - 8px);
                }
            }
        }
    
        /* 手机端标题换行标签：电脑端隐藏，手机端显示 */
        .mobile-break {
            display: none;
        }
        @media (max-width: 768px) {
            .mobile-break {
                display: block;
            }
        }
</style>
</head>
<body>

    <!-- 背景流光层 -->
    <div class="bg-animation">
        <div class="bg-flow-1"></div>
        <div class="bg-flow-2"></div>
        <div class="bg-flow-3"></div>
        <!-- 悬浮球 -->
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
        <div class="orb orb-5"></div>
    </div>

    <!-- 头部 -->
    <header>
        <h1>找乐子——优质工具库</h1>
    </header>

    <!-- 主体内容 -->
    <main>
        <div class="container">
            <div class="grid" id="grid"></div>
        </div>
    </main>

    <!-- 跳转覆盖层 -->
    <div class="overlay" id="overlay">
        <div class="loader-wrap">
            <div class="loader-ring"></div>
            <div class="loader-text">找乐子～</div>
        </div>
