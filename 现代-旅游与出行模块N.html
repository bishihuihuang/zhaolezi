        <p class="lesson-sub">订票、进站、住宿、预约与防坑：一个人也能把远门出明白</p>

        <div class="callout info">
            <b>这个模块学什么？</b>
            出门旅游对年轻人是享受，对初学的长辈却常是"两眼一抹黑"：高铁票怎么买、机场流程什么样、酒店订哪家、热门景区怎么预约、路上又怎么防宰防坑。本模块六节课，从出发前的规划一路讲到旅途中的应急，把"出门"这条线完整走一遍。
