<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 修复问题 5：添加 favicon -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
<title>二维码生成器 - 找乐子</title>
<style>
    /* ========== 全局重置 ========== */
    *,
    *::before,
    *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        min-height: 100vh;
        background: #0a0e27;
        color: #fff;
        overflow-x: hidden;
        position: relative;
    }

    /* ========== 背景流光层（20秒无缝循环） ========== */
    .bg-animation {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
    }

    .bg-flow-1 {
        position: absolute;
        top: -100%;
        left: -100%;
        width: 300%;
        height: 300%;
        background: linear-gradient(125deg, #0a0e27, #161a3d, #1f1652, #331d6e, #1d1b4b, #0f122f, #241a54);
        background-size: 400% 400%;
        animation: flowGradient 20s ease-in-out infinite;
        will-change: background-position;
    }

    .bg-flow-2 {
        position: absolute;
        top: -60%;
        left: -40%;
        width: 220%;
        height: 220%;
        background: radial-gradient(ellipse at 30% 70%, rgba(255,140,100,.35), transparent 50%),
            radial-gradient(ellipse at 65% 35%, rgba(120,180,255,.3), transparent 45%),
            radial-gradient(ellipse at 80% 80%, rgba(220,130,250,.25), transparent 40%);
        animation: flowDrift 20s ease-in-out infinite alternate;
        will-change: transform;
    }

    .bg-flow-3 {
        position: absolute;
        top: -30%;
        left: -20%;
        width: 180%;
        height: 180%;
        background: radial-gradient(circle at 50% 50%, rgba(255,200,130,.15), transparent 60%),
            radial-gradient(circle at 20% 80%, rgba(80,220,200,.2), transparent 50%);
        animation: flowRotate 20s linear infinite;
        will-change: transform;
    }

    @keyframes flowGradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    @keyframes flowDrift {
        0% { transform: translate(0, 0) scale(1) rotate(0deg); }
        50% { transform: translate(3%, -4%) scale(1.05) rotate(5deg); }
        100% { transform: translate(-2%, 3%) scale(.97) rotate(-5deg); }
    }

    @keyframes flowRotate {
        0% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(180deg) scale(1.08); }
        100% { transform: rotate(360deg) scale(1); }
    }

    /* ========== 透明悬浮球 ========== */
    .orb {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, rgba(255,255,255,.3), rgba(255,255,255,.1) 50%, transparent 70%);
        box-shadow: 0 0 60px rgba(255,255,255,.08), inset 0 0 30px rgba(255,255,255,.04);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        pointer-events: none;
        will-change: transform, opacity;
    }

    .orb-1 { width: 260px; height: 260px; top: 12%; left: 8%; animation: orbFloatA 18s ease-in-out infinite, orbSpin 40s linear infinite; }
    .orb-2 { width: 160px; height: 160px; top: 55%; left: 75%; animation: orbFloatB 22s ease-in-out infinite, orbSpin 55s linear infinite; }
    .orb-3 { width: 110px; height: 110px; top: 68%; left: 20%; animation: orbFloatA 16s ease-in-out infinite reverse, orbSpin 35s linear infinite; }
    .orb-4 { width: 220px; height: 220px; top: 28%; left: 60%; animation: orbFloatB 20s ease-in-out infinite reverse, orbSpin 50s linear infinite; }
    .orb-5 { width: 80px; height: 80px; top: 80%; left: 45%; animation: orbFloatA 14s ease-in-out infinite, orbSpin 30s linear infinite; }

    @keyframes orbFloatA {
        0% { transform: translate(0,0) scale(1); opacity:.6; }
        30% { transform: translate(18px,-22px) scale(1.04); opacity:.8; }
        60% { transform: translate(-12px,10px) scale(.96); opacity:.5; }
        100% { transform: translate(0,0) scale(1); opacity:.6; }
    }

    @keyframes orbFloatB {
        0% { transform: translate(0,0) scale(1); opacity:.5; }
        35% { transform: translate(-20px,12px) scale(1.06); opacity:.7; }
        70% { transform: translate(14px,-15px) scale(.94); opacity:.4; }
        100% { transform: translate(0,0) scale(1); opacity:.5; }
    }

    @keyframes orbSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    /* ========== 主体布局 ========== */
    main {
        position: relative;
        z-index: 10;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 60px 20px 40px;
    }

    .container {
        width: 80%;
        max-width: 1200px;
        background: rgba(245, 247, 255, .96);
        border-radius: 24px;
        box-shadow: 0 25px 70px rgba(0, 0, 0, .35), 0 0 0 1px rgba(255, 255, 255, .3), inset 0 1px 0 rgba(255, 255, 255, .6);
        max-height: calc(100vh - 100px);
        overflow-y: auto;
        padding: 20px;
        color: #333;
    }

    .container::-webkit-scrollbar { width: 10px; }
    .container::-webkit-scrollbar-track { background: rgba(0, 0, 0, .04); border-radius: 12px; }
    .container::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #667eea, #764ba2); border-radius: 12px; border: 2px solid rgba(255, 255, 255, .4); }

    /* ========== 网格布局 ========== */
    .grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        grid-template-rows: repeat(8, minmax(80px, auto));
        gap: 12px;
    }

    /* 标题区 */
    .title-area {
        grid-column: 1 / 5;
        grid-row: 1 / 3;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #ff6b6b, #ffa500, #ffd700, #ff6b6b);
        background-size: 300% 300%;
        animation: titleGradient 6s ease infinite;
        border-radius: 20px;
        box-shadow: 0 12px 40px rgba(255, 150, 50, .35), inset 0 1px 0 rgba(255, 255, 255, .2);
    }

    .title-area h2 {
        font-size: 42px;
        font-weight: 900;
        letter-spacing: 4px;
        color: #fff;
        text-shadow: 2px 2px 10px rgba(0, 0, 0, .3);
    }

    @keyframes titleGradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* 返回主页 */
    .back-area {
        grid-column: 5 / 7;
        grid-row: 1 / 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #11998e, #38ef7d);
        border-radius: 20px;
        box-shadow: 0 12px 40px rgba(17, 153, 142, .4), inset 0 1px 0 rgba(255,  255, 255, .2);
        text-decoration: none;
        color: #fff;
        font-size: 22px;
        font-weight: 800;
        cursor: pointer;
        transition: transform .3s, box-shadow .3s;
    }

    .back-area:hover {
        transform: translateY(-5px);
        box-shadow: 0 18px 50px rgba(17, 153, 142, .5);
    }

    .back-area:active {
        transform: translateY(-2px) scale(.96);
    }

    /* ========== 内容区：输入区 ========== */
    .input-card {
        grid-column: 1 / 7;
        grid-row: 3 / 5;
        background: #fff;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, .1);
        border: 2px solid #e8e8e8;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .input-card label {
        font-size: 16px;
        font-weight: 700;
        color: #333;
    }

    .text-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    #qrText {
        flex: 1;
        padding: 12px 16px;
        border: 2px solid #d0d0e0;
        border-radius: 12px;
        font-size: 15px;
        outline: none;
        transition: border-color .3s, box-shadow .3s;
        background: #fafafe;
        color: #333;
        min-width: 200px;
    }

    #qrText:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, .15);
    }

    .options-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
    }

    .opt-label {
        font-size: 14px;
        font-weight: 600;
        color: #555;
    }

    select#levelSelect {
        padding: 8px 12px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        background: #fff;
        cursor: pointer;
    }

    /* 按钮 */
    .btn {
        border: none;
        border-radius: 12px;
        padding: 10px 24px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 1px;
        color: #fff;
        background: linear-gradient(135deg, #667eea, #764ba2);
        box-shadow: 0 8px 20px rgba(102, 126, 234, .4);
        cursor: pointer;
        transition: transform .2s cubic-bezier(.34, 1.56, .64, 1), box-shadow .2s ease;
    }

    .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 30px rgba(102, 126, 234, .5);
    }

    .btn:active {
        transform: translateY(-1px) scale(.96);
        box-shadow: 0 4px 10px rgba(102, 126, 234, .4);
    }

    .btn-secondary {
        background: linear-gradient(135deg, #f093fb, #f5576c);
        box-shadow: 0 8px 20px rgba(240, 147, 251, .4);
    }

    .btn-secondary:hover {
        box-shadow: 0 12px 30px rgba(240, 147, 251, .5);
    }

    /* ========== 内容区：Canvas 展示区 ========== */
    .result-card {
        grid-column: 1 / 7;
        grid-row: 5 / 9;
        background: #fff;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, .1);
        border: 2px solid #e8e8e8;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 15px;
    }

    #qrCanvas {
        border: 2px solid #eee;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 8px 20px rgba(0, 0, 0, .08);
        max-width: 100%;
        height: auto;
    }

    .download-row {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: center;
    }

    /* ========== 转场遮罩 ========== */
    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(8, 10, 25, .72);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        opacity: 0;
        visibility: hidden;
        transition: opacity .4s ease, visibility .4s ease;
        pointer-events: none;
    }

    .overlay.active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }

    .loader-wrap {
        position: relative;
        width: 180px;
        height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .loader-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, .1);
        border-top-color: #f6d365;
        border-right-color: #fda085;
        animation: ringSpin .8s linear infinite;
    }

    .loader-ring::before {
        content: '';
        position: absolute;
        top: 12px;
        left: 12px;
        right: 12px;
        bottom: 12px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-bottom-color: #a78bfa;
        border-left-color: #667eea;
        animation: ringSpin 1.4s linear infinite reverse;
    }

    .loader-ring::after {
        content: '';
        position: absolute;
        top: 28px;
        left: 28px;
        right: 28px;
        bottom: 28px;
        border-radius: 50%;
        border: 1px solid transparent;
        border-top-color: #fb7185;
        border-right-color: #2dd4bf;
        animation: ringSpin 2s linear infinite;
    }

    .loader-text {
        position: relative;
        z-index: 5;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 4px;
        background: linear-gradient(90deg, #f6d365, #fda085, #f6d365);
        background-size: 200% 100%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: textShine 1.5s linear infinite;
    }

    @keyframes ringSpin { to { transform: rotate(360deg); } }
    @keyframes textShine {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
    }

    /* ========== 响应式 ========== */
    @media (max-width: 900px) {
        .container { width: 95%; padding: 12px; }
        .grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: auto; }
        .title-area { grid-column: 1/3; grid-row: auto; min-height: 100px; }
        .back-area { grid-column: 1/3; grid-row: auto; min-height: 80px; }
        .input-card { grid-column: 1/3; grid-row: auto; }
        .result-card { grid-column: 1/3; grid-row: auto; }
        .text-row { flex-direction: column; }
    }

        /* ========== 手机端响应式适配（通用） ========== */
        @media (max-width: 768px) {
            html, body {
                overflow-x: hidden;
                width: 100%;
            }
            main {
                padding: 70px 0 30px !important;
            }
            .container, .card-container, .wrapper, .box, .panel, .form-box {
                width: 94% !important;
                max-width: 94vw !important;
                padding: 14px !important;
                margin: 0 auto !important;
            }
            /* 6列/多列网格改3列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 8px !important;
                padding: 4px !important;
            }
            /* 大区域占满整行 */
            .title-area, .back-area, .display-area, .game-main,
            .calculator-area, .main-area, .content-area, .result-area,
            .input-area, .output-area, .board-area, .info-area, .settings-area {
                grid-column: 1 / -1 !important;
                grid-row: auto !important;
            }
            /* 左右分栏改上下堆叠 */
            .left-panel, .right-panel, .side-panel, .sidebar {
                flex: 1 1 100% !important;
                width: 100% !important;
                border-right: none !important;
                border-bottom: 1px solid rgba(0,0,0,.1) !important;
            }
            .display-area, .game-main, .calculator-area {
                flex-direction: column !important;
                padding: 12px !important;
            }
            .cell, .tool-cell, .grid-cell {
                padding: 10px 6px !important;
                min-height: 70px !important;
            }
            h1, h2, h3, .title-text, .author-name, .main-title {
                font-size: 22px !important;
                letter-spacing: 1px !important;
            }
            .btn, button, input, select, textarea {
                font-size: 14px !important;
                padding: 10px 14px !important;
            }
            .ghost-btn, .back-btn, .return-btn {
                padding: 8px 16px !important;
                font-size: 13px !important;
            }
            /* 隐藏非必要装饰元素 */
            .orb, .decoration, .deco-element, .floating-shape {
                display: none !important;
            }
        }
        @media (max-width: 480px) {
            .container, .card-container, .wrapper, .box {
                width: 96% !important;
                padding: 10px !important;
            }
            /* 小屏手机改2列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 6px !important;
            }
            h1, h2, h3, .title-text, .author-name {
                font-size: 18px !important;
            }
            .cell, .tool-cell {
                min-height: 80px !important;
                padding: 8px 4px !important;
            }
            .btn, button {
                font-size: 13px !important;
                padding: 8px 12px !important;
            }
        }
</style>

<!-- 多设备适配改进 v1.0 -->
<style>
/* 6. 全局box-sizing reset */
*, *::before, *::after {
    box-sizing: border-box;
}

/* 3. 刘海屏安全区域适配 */
body {
    padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) 
             env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
}

/* 2. 触摸设备优化：禁用hover残留效果 */
@media (hover: none) {
    .tool-box:hover, .card:hover, .box:hover, button:hover, a:hover {
        transform: none !important;
        box-shadow: inherit !important;
    }
    .tooltip, [class*="tooltip"], [class*="tip"] {
        display: none !important;
    }
}

/* 4. 深色模式支持 */
@media (prefers-color-scheme: dark) {
    body {
        background-color: #121212 !important;
        color: #e0e0e0 !important;
    }
}
</style>

<!-- 游戏页面触摸优化 -->
<style>
/* 7. 游戏按钮触摸目标增大到44px */
button, .btn, .game-btn, .cell, .key, [class*="button"], [class*="btn"] {
    min-width: 44px !important;
    min-height: 44px !important;
}

/* 小屏幕游戏页面优化 */
@media (max-width: 768px) {
    canvas, .game-container, .board, .grid-board {
        max-width: 100% !important;
        height: auto !important;
    }
}
</style>

</head>
<body>
    <!-- 背景 -->
    <div class="bg-animation">
        <div class="bg-flow-1"></div>
        <div class="bg-flow-2"></div>
        <div class="bg-flow-3"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
        <div class="orb orb-5"></div>
    </div>

    <main>
        <div class="container">
            <div class="grid">
                <!-- 标题区 -->
                <div class="title-area">
                    <h2>二维码生成器</h2>
                </div>
                <!-- 返回主页 -->
                <a href="index.html" class="back-area" id="backHome">
                    <span style="font-size:32px;">🏠</span>
                    返回主页
                </a>

                <!-- 输入区 -->
                <div class="input-card">
                    <label for="qrText">输入文本或网址</label>
                    <div class="text-row">
                        <input type="text" id="qrText" placeholder="输入你想转换的内容，例如：https://www.example.com" value="">
                        <select id="levelSelect" aria-label="纠错级别" title="纠错级别">
                            <option value="L">纠错级别 L (7%)</option>
                            <option value="M" selected>纠错级别 M (15%)</option>
                            <option value="Q">纠错级别 Q (25%)</option>
                            <option value="H">纠错级别 H (30%)</option>
                        </select>
                    </div>
                    <div class="options-row">
                        <button id="generateBtn" class="btn">✨ 生成二维码</button>
                        <button id="clearBtn" class="btn btn-secondary">清空</button>
                    </div>
                </div>

                <!-- 展示区 -->
                <div class="result-card">
                    <canvas id="qrCanvas" width="300" height="300"></canvas>
                    <div class="download-row">
                        <button id="downloadBtn" class="btn">⬇️ 下载二维码</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 转场遮罩 -->
    <div class="overlay" id="overlay">
        <div class="loader-wrap">
            <div class="loader-ring"></div>
            <div class="loader-text">找乐子～</div>
        </div>
