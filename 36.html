<title>双人井字棋 - 找乐子</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        min-height: 100vh;
        background: #0a0e27;
        color: #fff;
        overflow-x: hidden;
    }
    .container { width: 100%; max-width: 900px; margin: 0 auto; padding: 16px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .title-area { grid-column: 1 / -1; text-align: center; padding: 18px 0 6px; }
    .title-area h2 { font-size: 24px; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; }
    .back-area {
        grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 8px;
        text-decoration: none; color: #bbb; font-size: 13px; padding: 8px; border-radius: 10px;
        background: rgba(255,255,255,.05); transition: all .3s;
    }
    .back-area:hover { background: rgba(255,255,255,.12); color: #fff; }
    .card {
        grid-column: 1 / -1;
        background: linear-gradient(135deg, #f8f9ff, #f0f2ff);
        border-radius: 16px; padding: 20px; color: #333;
        box-shadow: 0 8px 30px rgba(0,0,0,.35);
    }
    .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        border: none; cursor: pointer; font-size: 15px; padding: 10px 20px; border-radius: 10px;
        background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
        box-shadow: 0 4px 14px rgba(102,126,234,.4); transition: transform .2s, box-shadow .2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102,126,234,.55); }
    .btn:active { transform: scale(.96); }
    .btn-secondary { background: #e8eaf6; color: #333; box-shadow: none; }
    .btn-danger { background: linear-gradient(135deg, #e53935, #d32f2f); box-shadow: 0 4px 14px rgba(229,57,53,.4); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    input, textarea, select {
        width: 100%; border: 1px solid #d0d4ea; border-radius: 10px; padding: 10px 12px;
        font-size: 14px; background: #fff; color: #333; outline: none;
    }
    input:focus, textarea:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,.2); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
    .hint { font-size: 12px; color: #999; margin-top: 8px; }
    .stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
    .stat div { background: rgba(102,126,234,.08); border-radius: 10px; padding: 10px; text-align: center; }
    .stat b { display: block; font-size: 20px; color: #667eea; }
    .stat span { font-size: 12px; color: #888; }
    /* ========== 转场遮罩（全站统一样式） ========== */
    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(8, 10, 25, .72);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        opacity: 0;
        visibility: hidden;
        transition: opacity .4s ease, visibility .4s ease;
        pointer-events: none;
    }
    .overlay.active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }
    .loader-wrap {
        position: relative;
        width: 180px;
        height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .loader-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, .1);
        border-top-color: #f6d365;
        border-right-color: #fda085;
        animation: ringSpin .8s linear infinite;
    }
    .loader-ring::before {
        content: '';
        position: absolute;
        top: 12px;
        left: 12px;
        right: 12px;
        bottom: 12px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-bottom-color: #a78bfa;
        border-left-color: #667eea;
        animation: ringSpin 1.4s linear infinite reverse;
    }
    .loader-ring::after {
        content: '';
        position: absolute;
        top: 28px;
        left: 28px;
        right: 28px;
        bottom: 28px;
        border-radius: 50%;
        border: 1px solid transparent;
        border-top-color: #fb7185;
        border-right-color: #2dd4bf;
        animation: ringSpin 2s linear infinite;
    }
    .loader-text {
        position: relative;
        z-index: 5;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 4px;
        background: linear-gradient(90deg, #f6d365, #fda085, #f6d365);
        background-size: 200% 100%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: textShine 1.5s linear infinite;
    }
    @keyframes ringSpin { to { transform: rotate(360deg); } }
    @keyframes textShine {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
    }
    @media (max-width: 600px) {
        .grid { grid-template-columns: repeat(2, 1fr); }
        .stat { grid-template-columns: 1fr 1fr; }
    }
</style>
