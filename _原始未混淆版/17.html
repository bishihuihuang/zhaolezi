<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找乐子——古今中外暗号大全</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "KaiTi", "STKaiti", "FangSong", "Microsoft YaHei", serif;
            min-height: 100vh;
            background: #f9f6e8;
            color: #5a3e1b;
            overflow-x: hidden;
        }
        
        /* 背景动画 */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: linear-gradient(120deg, #f9e79f, #f4d03f, #f7dc6f, #f9e79f);
            background-size: 300% 300%;
            animation: goldenFlow 10s ease-in-out infinite;
        }
        @keyframes goldenFlow {
            0% { background-position: 0% 50%; }
            25% { background-position: 100% 50%; }
            50% { background-position: 50% 100%; }
            75% { background-position: 0% 100%; }
            100% { background-position: 0% 50%; }
        }
        .bg-animation::after {
            content: '';
            position: absolute;
            top: -20%;
            left: -20%;
            width: 120%;
            height: 120%;
            background: radial-gradient(ellipse, rgba(255, 255, 255, .3), transparent 60%);
            animation: lightDrift 8s ease-in-out infinite alternate;
            z-index: 1;
        }
        @keyframes lightDrift {
            0% { transform: translate(-10%, -10%) scale(1); }
            50% { transform: translate(10%, 10%) scale(1.1); }
            100% { transform: translate(-10%, 10%) scale(0.9); }
        }
        
        /* 雪花飘落 */
        .snowflake {
            position: fixed;
            top: -10px;
            background: #e6c200;
            border-radius: 50%;
            opacity: 0.8;
            pointer-events: none;
            z-index: 1;
            animation: snowFall linear infinite;
        }
        @keyframes snowFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0.2; }
        }
        
        /* 网格布局 */
        main {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 0;
        }
        .container {
            width: 94%;
            max-width: 1300px;
            background: rgba(255, 255, 255, .75);
            border-radius: 24px;
            box-shadow: 0 15px 50px rgba(218, 165, 32, .3);
            padding: 10px;
            margin-top: 20px;
            border: 2px solid #d4af37;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(8, minmax(70px, auto));
            gap: 10px;
        }
        .cell {
            border-radius: 12px;
            border: 1px solid #d4af37;
            background: rgba(255, 255, 255, .5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            position: relative;
        }
        .title-area {
            grid-row: 1 / 3;
            grid-column: 1 / 5;
            background: linear-gradient(135deg, #f9e79f, #f4d03f, #f7dc6f);
            border: 2px solid #d4af37;
            box-shadow: 0 0 30px rgba(212, 175, 55, .4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .title-area h1 {
            font-size: 42px;
            font-weight: 900;
            color: #7a4e1f;
            letter-spacing: 6px;
            text-shadow: 2px 2px 0 #f7dc6f;
        }
        .title-area small {
            font-size: 14px;
            letter-spacing: 4px;
            color: #5a3e1b;
            margin-top: 6px;
        }
        .back-area {
            grid-row: 1 / 3;
            grid-column: 5 / 7;
            background: linear-gradient(135deg, #f4d03f, #f9e79f);
            border: 2px solid #d4af37;
            color: #5a3e1b;
            text-decoration: none;
            font-weight: 900;
            font-size: 22px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all .3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80px;
            min-width: 44px;
        }
        .back-area:hover {
            background: #f7dc6f;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, .4);
        }
        
        /* 纯白文本区域：左右两列 */
        .display-area {
            grid-row: 3 / 9;
            grid-column: 1 / 7;
            background: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 0;
            min-height: 400px;
            position: relative;
            display: flex;
            flex-direction: row;
            overflow: hidden;
        }
        
        /* 左侧：输入区 */
        .left-panel {
            flex: 0 0 280px;
            padding: 10px;
            border-right: 2px solid #d4af37;
            background: #ffffff;
            display: flex;
            flex-direction: column;
        }
        .display-header {
            display: block;
            margin: 0;
            color: #d4af37;
            font-size: 20px;
            font-weight: bold;
            white-space: nowrap;
            letter-spacing: 1px;
            text-align: left;
        }
        #secretInput {
            display: block;
            width: 100%;
            padding: 8px 0;
            border: none;
            outline: none;
            background: transparent;
            font-family: "KaiTi", serif;
            font-size: 18px;
            color: #5a3e1b;
            min-height: 44px;
        }
        #secretInput::placeholder {
            color: #d4af37;
        }
        
        /* 新增：刷新按钮样式 */
        .refresh-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: linear-gradient(135deg, #d4af37, #f4d03f, #d4af37);
            background-size: 200% 200%;
            border: none;
            border-radius: 20px;
            color: #7a4e1f;
            font-family: "KaiTi", "STKaiti", serif;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, .4);
            transition: all .3s ease;
            letter-spacing: 3px;
            min-height: 44px;
        }
        .refresh-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, .6);
            background-position: 100% 50%;
        }
        .refresh-btn:active {
            transform: translateY(0) scale(.96);
            transition-duration: .1s;
        }
        
        /* 右侧：媒体显示区 */
        .right-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
            background: #ffffff;
            flex-direction: column;
        }
        
        /* 媒体自适应显示 */
        .display-video,
        .display-audio,
        .display-image {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            margin-top: 10px;
        }
        .display-audio {
            width: 80%;
        }
        .display-file-label {
            font-size: 18px;
            font-style: italic;
            color: #ff8c00;
            margin-top: 5px;
            text-align: center;
        }
        .output-content {
            margin-top: 6px;
            font-size: 30px;
            line-height: 1.8;
            white-space: pre-wrap;
            color: #ff4500;
            text-align: center;
        }
        
        /* 国风转场 */
        .transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999999;
            background: rgba(249, 231, 159, .9);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            -webkit-opacity: 0;
            -webkit-transition: opacity .4s ease;
            transition: opacity .4s ease;
            pointer-events: none;
            will-change: opacity;
        }
        .transition-overlay.active {
            opacity: 1;
            -webkit-opacity: 1;
            pointer-events: auto;
        }
        .transition-overlay .gold-ring {
            position: relative;
            width: 180px;
            height: 180px;
            border: 4px solid #d4af37;
            border-radius: 50%;
            animation: goldenPulse 1.2s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .transition-overlay .gold-ring::before {
            content: '';
            position: absolute;
            inset: 20px;
            border: 2px dashed #d4af37;
            animation: spinRing 4s linear infinite;
        }
        @keyframes goldenPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 30px #d4af37; }
            50% { transform: scale(1.1); box-shadow: 0 0 50px #f4d03f; }
        }
        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }
        .transition-overlay .find-text {
            font-family: "KaiTi", "STKaiti", serif;
            font-size: 32px;
            font-weight: 900;
            color: #b8860b;
            letter-spacing: 6px;
            z-index: 2;
            background: rgba(255, 255, 255, .5);
            padding: 6px 16px;
            border-radius: 40px;
            white-space: nowrap;
            -webkit-white-space: nowrap;
            display: inline-block;
            text-align: center;
            line-height: 1.2;
        }
        
        /* Toast提示 */
        .toast-msg {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(122, 78, 31, .95);
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-family: "KaiTi", "STKaiti", serif;
            z-index: 9999999;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .4);
            transition: opacity .3s ease, transform .3s ease;
            pointer-events: none;
        }
        
        /* 响应式 */
        @media (max-width: 900px) {
            .grid { gap: 6px; }
            .title-area h1 { font-size: 28px; }
            .back-area { font-size: 18px; }
        }
        @media (max-width: 600px) {
            .container { width: 98%; }
            .grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: auto; }
            .title-area { grid-row: 1; grid-column: 1/3; }
            .back-area { grid-row: 2; grid-column: 1/3; }
            .display-area { grid-row: 3; grid-column: 1/3; min-height: 300px; flex-direction: column; }
            .left-panel { flex: none; width: 100%; border-right: none; border-bottom: 2px solid #d4af37; }
            .right-panel { flex: none; width: 100%; min-height: 300px; }
        }
    
        /* ========== 手机端响应式适配（通用） ========== */
        @media (max-width: 768px) {
            html, body {
                overflow-x: hidden;
                width: 100%;
            }
            main {
                padding: 70px 0 30px !important;
            }
            .container, .card-container, .wrapper, .box, .panel, .form-box {
                width: 94% !important;
                max-width: 94vw !important;
                padding: 14px !important;
                margin: 0 auto !important;
            }
            /* 6列/多列网格改3列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 8px !important;
                padding: 4px !important;
            }
            /* 大区域占满整行 */
            .title-area, .back-area, .display-area, .game-main,
            .calculator-area, .main-area, .content-area, .result-area,
            .input-area, .output-area, .board-area, .info-area, .settings-area {
                grid-column: 1 / -1 !important;
                grid-row: auto !important;
            }
            /* 左右分栏改上下堆叠 */
            .left-panel, .right-panel, .side-panel, .sidebar {
                flex: 1 1 100% !important;
                width: 100% !important;
                border-right: none !important;
                border-bottom: 1px solid rgba(0,0,0,.1) !important;
            }
            .display-area, .game-main, .calculator-area {
                flex-direction: column !important;
                padding: 12px !important;
            }
            .cell, .tool-cell, .grid-cell {
                padding: 10px 6px !important;
                min-height: 70px !important;
            }
            h1, h2, h3, .title-text, .author-name, .main-title {
                font-size: 22px !important;
                letter-spacing: 1px !important;
            }
            .btn, button, input, select, textarea {
                font-size: 14px !important;
                padding: 10px 14px !important;
            }
            .ghost-btn, .back-btn, .return-btn {
                padding: 8px 16px !important;
                font-size: 13px !important;
            }
            /* 隐藏非必要装饰元素 */
            .orb, .decoration, .deco-element, .floating-shape {
                display: none !important;
            }
        }
        @media (max-width: 480px) {
            .container, .card-container, .wrapper, .box {
                width: 96% !important;
                padding: 10px !important;
            }
            /* 小屏手机改2列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 6px !important;
            }
            h1, h2, h3, .title-text, .author-name {
                font-size: 18px !important;
            }
            .cell, .tool-cell {
                min-height: 80px !important;
                padding: 8px 4px !important;
            }
            .btn, button {
                font-size: 13px !important;
                padding: 8px 12px !important;
            }
        }
</style>

{ trigger: "The ones who love us never really leave us", type: "text", textContent: "爱我们的人永远不会真正离开——《哈利·波特》" },
{ trigger: "It does not do to dwell on dreams and forget to live", type: "text", textContent: "沉湎于虚幻的梦想而忘记现实的生活，是毫无益处的——《哈利·波特》" },
{ trigger: "After all this time?", type: "text", textContent: "Always，Always——《哈利·波特》" },
{ trigger: "Dobby has no master, Dobby is a free elf", type: "text", textContent: "多比没有主人，多比是自由的精灵——《哈利·波特》" },
{ trigger: "To the well-organized mind, death is but the next great adventure", type: "text", textContent: "对于头脑清醒的人来说，死亡不过是另一场伟大的冒险——《哈利·波特》" },
{ trigger: "We are only as strong as we are united, as weak as we are divided", type: "text", textContent: "团结使我们强大，分裂使我们软弱——《哈利·波特》" },
{ trigger: "I am not afraid, I was born to be a Gryffindor", type: "text", textContent: "我不害怕，我生来就是格兰芬多——《哈利·波特》" },
{ trigger: "It takes a great deal of bravery to stand up to our enemies, but just as much to stand up to our friends", type: "text", textContent: "反抗敌人需要勇气，但反抗朋友同样需要——《哈利·波特》" },
{ trigger: "You are a wizard, Harry", type: "text", textContent: "你是个巫师，哈利——《哈利·波特》" },
{ trigger: "Happiness can be found even in the darkest of times, if one only remembers to turn on the light", type: "text", textContent: "即使在最黑暗的时候，只要记得点亮灯，就能找到幸福——《哈利·波特》" },
{ trigger: "We must all face the choice between what is right and what is easy", type: "text", textContent: "我们必须面对选择，是做正确的事，还是做容易的事——《哈利·波特》" },
{ trigger: "There are some things you can't share without ending up liking each other", type: "text", textContent: "有些东西你不能与别人分享，否则你会喜欢上他们——《哈利·波特》" },
{ trigger: "The world is not divided into good people and Death Eaters", type: "text", textContent: "世界不是分成好人和食死徒——《哈利·波特》" },
{ trigger: "Give me Harry Potter, and I shall leave the school untouched", type: "text", textContent: "把哈利·波特给我，我就不会动学校——《哈利·波特》" },
{ trigger: "You want to know how to get out of this? Follow the spiders", type: "text", textContent: "想知道怎么出去？跟着蜘蛛——《哈利·波特》" },
{ trigger: "The last enemy that shall be destroyed is death", type: "text", textContent: "最后一个要战胜的敌人就是死亡——《哈利·波特》" },
{ trigger: "If you want to know what a man's like, take a good look at how he treats his inferiors, not his equals", type: "text", textContent: "如果你想知道一个人的品行，就看他如何对待下属，而不是平级——《哈利·波特》" },
{ trigger: "Well, it's just that you seem to be labouring under the delusion that I am going to come quietly", type: "text", textContent: "似乎你以为我会乖乖跟你走——《哈利·波特》" },
{ trigger: "I open at the close", type: "text", textContent: "我在结束时开启——《哈利·波特》" },
{ trigger: "Snape, Severus, Professor Severus Snape", type: "text", textContent: "斯内普，西弗勒斯·斯内普教授——《哈利·波特》" },
{ trigger: "It is not our abilities that show what we truly are, it is our choices", type: "text", textContent: "决定我们是谁的不是我们的能力，而是我们的选择——《哈利·波特》" },
{ trigger: "One can never have enough socks", type: "text", textContent: "一个人永远不会嫌袜子多——《哈利·波特》" },
{ trigger: "I am Dumbledore's man, through and through", type: "text", textContent: "我是邓布利多的人，完完全全是——《哈利·波特》" },
{ trigger: "You and your friends are not the only ones who know something about the Dark Arts", type: "text", textContent: "你和你的朋友们不是唯一了解黑魔法的人——《哈利·波特》" },
{ trigger: "Just because you have the emotional range of a teaspoon doesn't mean we all have", type: "text", textContent: "虽然你的感情只有一茶匙，但并不意味着我们也是——《哈利·波特》" },
{ trigger: "I mean, you could be a great wizard, you know, if you applied yourself", type: "text", textContent: "如果你专心，你可以成为伟大的巫师——《哈利·波特》" },
{ trigger: "Hmm, yes, you're an interesting one", type: "text", textContent: "嗯，是的，你是个有趣的人——《哈利·波特》" },
{ trigger: "I must not tell lies", type: "text", textContent: "我不能说谎——《哈利·波特》" },
{ trigger: "I'll be in my bedroom, making no noise and pretending I'm not there", type: "text", textContent: "我会待在卧室里，不发出声音，假装我不在那里——《哈利·波特》" },
{ trigger: "What's life without a little risk?", type: "text", textContent: "没有一点风险算什么生活？——《哈利·波特》" },
{ trigger: "Boys, this is a no-magic zone", type: "text", textContent: "男孩们，这里是禁魔区——《哈利·波特》" },
{ trigger: "It's a-a- a wheeze", type: "text", textContent: "是是是——韦斯莱的笑话——《哈利·波特》" },
{ trigger: "Socks are the best gifts", type: "text", textContent: "袜子是最好的礼物——《哈利·波特》" },
{ trigger: "I'm not going to be a murderer", type: "text", textContent: "我不会成为杀人犯——《哈利·波特》" },
{ trigger: "I'm a— what?", type: "text", textContent: "我是——什么？——《哈利·波特》" },
{ trigger: "You are a wizard, Harry", type: "text", textContent: "你是个巫师，哈利——《哈利·波特》" },
{ trigger: "You have been selected by the Sorting Hat", type: "text", textContent: "你被分院帽选中了——《哈利·波特》" },
{ trigger: "I'm going to die", type: "text", textContent: "我要死了——《哈利·波特》" },
{ trigger: "Turn to page 394", type: "text", textContent: "翻到第394页——《哈利·波特》" },
{ trigger: "My Lord, let me go", type: "text", textContent: "主人，让我走吧——《哈利·波特》" },
{ trigger: "Dobby, do you know how to get to the Room of Requirement?", type: "text", textContent: "多比，你知道有求必应屋怎么走吗？——《哈利·波特》" },
{ trigger: "The truth is, Harry, I'm not a real wizard", type: "text", textContent: "事实是，哈利，我不是真正的巫师——《哈利·波特》" },
{ trigger: "It's not magic, it's science", type: "text", textContent: "这不是魔法，是科学——《哈利·波特》" },
{ trigger: "There is a light in the darkness", type: "text", textContent: "黑暗中有一道光——《哈利·波特》" },
{ trigger: "Never trust anything that can think for itself if you can't see where it keeps its brain", type: "text", textContent: "除非你能看到它的大脑在哪里，否则永远不要信任能自己思考的东西——《哈利·波特》" },
{ trigger: "I can teach you how to bottle fame, brew glory, even stopper death", type: "text", textContent: "我可以教你怎么装瓶名声，酿造荣耀，甚至封住死亡——《哈利·波特》" },
{ trigger: "Kill me and you'll never know the truth", type: "text", textContent: "杀了我你永远不知道真相——《哈利·波特》" },
{ trigger: "I'm not going to let you die here", type: "text", textContent: "我不会让你死在这里——《哈利·波特》" },
{ trigger: "It's a trap", type: "text", textContent: "这是陷阱——《哈利·波特》" },
{ trigger: "Trust me", type: "text", textContent: "相信我——《哈利·波特》" },
{ trigger: "You know, I just had a thought... maybe we should just leave", type: "text", textContent: "你知道吗，我刚有个想法……也许我们应该离开——《哈利·波特》" },
{ trigger: "I'll meet you at the train station", type: "text", textContent: "我会在火车站见你——《哈利·波特》" },
{ trigger: "Anything's possible if you've got enough nerve", type: "text", textContent: "如果你有足够的勇气，一切皆有可能——《哈利·波特》" },
{ trigger: "The wand chooses the wizard, remember", type: "text", textContent: "记住，魔杖选择巫师——《哈利·波特》" },
{ trigger: "Never underestimate the power of a good wig", type: "text", textContent: "永远不要低估一顶好假发的力量——《哈利·波特》" },
{ trigger: "I have to go, I have a date with a firebolt", type: "text", textContent: "我必须走了，我要去赴一把火弩箭的约——《哈利·波特》" },
{ trigger: "You can't fly, you're a wizard", type: "text", textContent: "你不能飞，你是巫师——《哈利·波特》" },
{ trigger: "We are the Knights of Walpurgis", type: "text", textContent: "我们是沃尔普吉斯骑士——《哈利·波特》" },
{ trigger: "I'm a genius, I'm a genius, I'm a genius!", type: "text", textContent: "我是天才，我是天才，我是天才！——《哈利·波特》" },
{ trigger: "Why are you all staring at me?", type: "text", textContent: "你们为什么都盯着我？——《哈利·波特》" },
{ trigger: "Well, we can't all be perfect", type: "text", textContent: "好吧，我们不可能都完美——《哈利·波特》" },
{ trigger: "I never thought I'd die fighting side by side with an elf", type: "text", textContent: "我从没想过会和一个精灵并肩作战至死——《哈利·波特》" },
{ trigger: "How dare you stand where he stood?", type: "text", textContent: "你怎么敢站在他站过的地方？——《哈利·波特》" },
{ trigger: "Did you put your name in the Goblet of Fire, Harry?", type: "text", textContent: "哈利，你把名字放进火焰杯了吗？——《哈利·波特》" },
{ trigger: "I'm not going to let you die here", type: "text", textContent: "我不会让你死在这里——《哈利·波特》" },
{ trigger: "The world isn't split into good people and Death Eaters", type: "text", textContent: "世界不是分成好人和食死徒——《哈利·波特》" },
{ trigger: "Catch it, it's a snitch!", type: "text", textContent: "抓住它，是金色飞贼！——《哈利·波特》" },
{ trigger: "This is the Room of Requirement", type: "text", textContent: "这是有求必应屋——《哈利·波特》" },
{ trigger: "There are no greater men than those who fight for others", type: "text", textContent: "没有比为他人的战斗更伟大的人——《哈利·波特》" },
{ trigger: "The prophecy is lost, it's gone", type: "text", textContent: "预言丢了，不见了——《哈利·波特》" },
{ trigger: "I am the master of death", type: "text", textContent: "我是死亡的主宰——《哈利·波特》" },
{ trigger: "I am Lord Voldemort", type: "text", textContent: "我是伏地魔——《哈利·波特》" },
{ trigger: "You have been selected, Harry", type: "text", textContent: "你被选中了，哈利——《哈利·波特》" },
{ trigger: "I don't go looking for trouble, trouble usually finds me", type: "text", textContent: "我不找麻烦，麻烦通常来找我——《哈利·波特》" },
{ trigger: "A journey of a thousand miles begins with a single step", type: "text", textContent: "千里之行始于足下——《哈利·波特》" },
{ trigger: "Nothing is more dangerous than a friend who is always right", type: "text", textContent: "没有什么比永远正确的朋友更危险——《哈利·波特》" },
{ trigger: "Do not pity the dead, Harry. Pity the living, and above all, those who live without love", type: "text", textContent: "不要可怜死者，哈利。可怜活人，尤其是那些没有爱地活着的人——《哈利·波特》" },
{ trigger: "It is the unknown we fear when we look upon death and darkness, nothing more", type: "text", textContent: "我们在面对死亡和黑暗时，我们恐惧的只是未知——《哈利·波特》" },
{ trigger: "It is our choices, Harry, that show what we truly are, far more than our abilities", type: "text", textContent: "是我们选择，哈利，展示我们真正是什么，远胜于能力——《哈利·波特》" },
{ trigger: "The ones who love us never really leave us", type: "text", textContent: "爱我们的人永远不会真正离开——《哈利·波特》" },
{ trigger: "Always", type: "text", textContent: "永远——《哈利·波特》" },
{ trigger: "This is the way", type: "text", textContent: "这就是道路——《曼达洛人》" },
{ trigger: "I am the danger", type: "text", textContent: "我就是危险——《绝命毒师》" },
{ trigger: "Say my name", type: "text", textContent: "说出我的名字——《绝命毒师》" },
{ trigger: "I am the one who knocks", type: "text", textContent: "我就是那个敲门的人——《绝命毒师》" },
{ trigger: "You're goddamn right", type: "text", textContent: "你说得对极了——《绝命毒师》" },
{ trigger: "We're done when I say we're done", type: "text", textContent: "我说结束才结束——《绝命毒师》" },
{ trigger: "I have a dream", type: "text", textContent: "我有一个梦想——《马丁·路德·金》" },
{ trigger: "Yes we can", type: "text", textContent: "是的，我们可以——《奥巴马》" },
{ trigger: "Change will not come if we wait for some other person or some other time", type: "text", textContent: "如果我们等待别人或另一个时代，改变不会到来——《奥巴马》" },
{ trigger: "To be or not to be, that is the question", type: "text", textContent: "生存还是毁灭，这是一个问题——《哈姆雷特》" },
{ trigger: "What a piece of work is a man", type: "text", textContent: "人类是一件多么了不起的杰作——《哈姆雷特》" },
{ trigger: "All that glitters is not gold", type: "text", textContent: "闪光的不都是金子——《威尼斯商人》" },

        const secretInput = document.getElementById('secretInput');
        const outputZone = document.getElementById('outputZone');
        const refreshBtn = document.getElementById('refreshBtn');
        
        // Toast提示函数
        function showToast(message) {
            const oldToast = document.querySelector('.toast-msg');
            if (oldToast) oldToast.remove();
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(10px)';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }
        
        // 刷新按钮：随机抽取一条文本暗号并显示
        refreshBtn.addEventListener('click', function() {
            const textItems = triggerMap.filter(item => item.type === 'text');
            if (textItems.length === 0) return;
            const randomIndex = Math.floor(Math.random() * textItems.length);
            const randomItem = textItems[randomIndex];
            displayMatch(randomItem);
            showToast('已随机显示一条暗号');
        });
        
        secretInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const inputText = secretInput.value.trim();
                if (inputText === '') return;
                
                // 寻找最先出现的暗号
                const matches = triggerMap
                    .map(item => {
                        const pos = inputText.indexOf(item.trigger);
                        return { item, pos };
                    })
                    .filter(entry => entry.pos !== -1);
                
                if (matches.length > 0) {
                    matches.sort((a, b) => a.pos - b.pos);
                    displayMatch(matches[0].item);
                } else {
                    const randomItem = triggerMap[Math.floor(Math.random() * triggerMap.length)];
                    outputZone.innerHTML = `<div style="color:#d4af37;">输入${randomItem.trigger}试试吧~~</div>`;
                }
                
                secretInput.value = '';
            }
        });
        
        function displayMatch(item) {
            outputZone.innerHTML = '';
            if (item.type === 'text') {
                const textDiv = document.createElement('div');
                textDiv.className = 'output-content';
                textDiv.textContent = item.textContent;
                outputZone.appendChild(textDiv);
                if (item.file) {
                    const label = document.createElement('div');
                    label.className = 'display-file-label';
                    label.textContent = '文本来源：' + removeExtension(item.file);
                    outputZone.appendChild(label);
                }
            } else if (item.type === 'audio') {
                const audio = document.createElement('audio');
                audio.controls = true;
                audio.className = 'display-audio';
                audio.preload = 'auto';
                audio.src = item.file;
                audio.onerror = function() {
                    audio.outerHTML = `<div style="color:#c00;">音频文件未找到：${item.file}</div>`;
                };
                audio.addEventListener('canplay', function() {
                    audio.play().catch(() => {});
                });
                outputZone.appendChild(audio);
                addFileLabel(item.file);
            } else if (item.type === 'video') {
                const video = document.createElement('video');
                video.controls = true;
                video.className = 'display-video';
                video.src = item.file;
                video.playsInline = true;
                video.preload = 'auto';
                video.onerror = function() {
                    video.outerHTML = `<div style="color:#c00;">视频文件未找到：${item.file}</div>`;
                };
                outputZone.appendChild(video);
                addFileLabel(item.file);
            } else if (item.type === 'image') {
                const img = document.createElement('img');
                img.className = 'display-image';
                img.src = item.file;
                img.alt = item.trigger;
                img.onerror = function() {
                    img.outerHTML = `<div style="color:#c00;">图片文件未找到：${item.file}</div>`;
                };
                outputZone.appendChild(img);
                addFileLabel(item.file);
            }
        }
        
        function addFileLabel(filePath) {
            const label = document.createElement('div');
            label.className = 'display-file-label';
            label.textContent = '文件：' + removeExtension(filePath);
            outputZone.appendChild(label);
        }
        
        function removeExtension(filePath) {
            const filename = filePath.split('/').pop();
            const dotIndex = filename.lastIndexOf('.');
            if (dotIndex > 0) return filename.substring(0, dotIndex);
            return filename;
        }
        
        const transitionOverlay = document.getElementById('transitionOverlay');
        const backHome = document.getElementById('backHome');
        backHome.addEventListener('click', function(e) {
            e.preventDefault();
            transitionOverlay.classList.add('active');
            void transitionOverlay.offsetWidth;
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        });
        
        // 按 Esc 关闭转场覆盖层
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (transitionOverlay.classList.contains('active')) {
                    transitionOverlay.classList.remove('active');
                }
            }
        });
