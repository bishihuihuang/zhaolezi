<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找乐子——更新公告</title>
    <style>
        /* ========== 全局重置 ========== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            min-height: 100vh;
            background: #0a0e27;
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }

        /* ========== 背景流光层（20秒无缝循环） ========== */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-flow-1 {
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: linear-gradient(125deg,
                    #0a0e27, #161a3d, #1f1652, #331d6e,
                    #1d1b4b, #0f122f, #241a54);
            background-size: 400% 400%;
            animation: flowGradient 20s ease-in-out infinite;
            will-change: background-position;
        }

        .bg-flow-2 {
            position: absolute;
            top: -60%;
            left: -40%;
            width: 220%;
            height: 220%;
            background: radial-gradient(ellipse at 30% 70%,
                    rgba(255, 140, 100, .35), transparent 50%),
                radial-gradient(ellipse at 65% 35%,
                    rgba(120, 180, 255, .3), transparent 45%),
                radial-gradient(ellipse at 80% 80%,
                    rgba(220, 130, 250, .25), transparent 40%);
            animation: flowDrift 20s ease-in-out infinite alternate;
            will-change: transform;
        }

        .bg-flow-3 {
            position: absolute;
            top: -30%;
            left: -20%;
            width: 180%;
            height: 180%;
            background: radial-gradient(circle at 50% 50%,
                    rgba(255, 200, 130, .15), transparent 60%),
                radial-gradient(circle at 20% 80%,
                    rgba(80, 220, 200, .2), transparent 50%);
            animation: flowRotate 20s linear infinite;
            will-change: transform;
        }

        @keyframes flowGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes flowDrift {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(3%, -4%) scale(1.05) rotate(5deg); }
            100% { transform: translate(-2%, 3%) scale(.97) rotate(-5deg); }
        }

        @keyframes flowRotate {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.08); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* ========== 悬浮球（透明、漂浮、旋转） ========== */
        .orb {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%,
                    rgba(255, 255, 255, .3),
                    rgba(255, 255, 255, .1) 50%,
                    transparent 70%);
            box-shadow: 0 0 60px rgba(255, 255, 255, .08),
                inset 0 0 30px rgba(255, 255, 255, .04);
            pointer-events: none;
            will-change: transform, opacity;
        }

        .orb-1 { width: 260px; height: 260px; top: 12%; left: 8%; animation: orbFloatA 18s ease-in-out infinite, orbSpin 40s linear infinite; }
        .orb-2 { width: 160px; height: 160px; top: 55%; left: 75%; animation: orbFloatB 22s ease-in-out infinite, orbSpin 55s linear infinite; }
        .orb-3 { width: 110px; height: 110px; top: 68%; left: 20%; animation: orbFloatA 16s ease-in-out infinite reverse, orbSpin 35s linear infinite; }
        .orb-4 { width: 220px; height: 220px; top: 28%; left: 60%; animation: orbFloatB 20s ease-in-out infinite reverse, orbSpin 50s linear infinite; }
        .orb-5 { width: 80px; height: 80px; top: 80%; left: 45%; animation: orbFloatA 14s ease-in-out infinite, orbSpin 30s linear infinite; }

        @keyframes orbFloatA {
            0% { transform: translate(0,0) scale(1); opacity:.6; }
            30% { transform: translate(18px,-22px) scale(1.04); opacity:.8; }
            60% { transform: translate(-12px,10px) scale(.96); opacity:.5; }
            100% { transform: translate(0,0) scale(1); opacity:.6; }
        }

        @keyframes orbFloatB {
            0% { transform: translate(0,0) scale(1); opacity:.5; }
            35% { transform: translate(-20px,12px) scale(1.06); opacity:.7; }
            70% { transform: translate(14px,-15px) scale(.94); opacity:.4; }
            100% { transform: translate(0,0) scale(1); opacity:.5; }
        }

        @keyframes orbSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ========== 头部（固定在顶部） ========== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            text-align: center;
            padding: 18px 20px;
            background: linear-gradient(180deg, rgba(8,10,30,.9), rgba(10,14,39,.5), transparent);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255,255,255,.06);
            box-shadow: 0 4px 40px rgba(0,0,0,.3);
        }

        header h1 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 5px;
            background: linear-gradient(90deg, #f6d365, #fda085, #f6d365, #fda085, #f6d365);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textShine 3s linear infinite;
            display: inline-block;
            text-shadow: 0 0 30px rgba(246,211,101,.3);
        }

        @keyframes textShine {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* ========== 主体布局 ========== */
        main {
            padding-top: 100px;
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-bottom: 50px;
        }

        /* ========== 白色容器（80%宽，可滚动） ========== */
        .container {
            width: 80%;
            max-width: 1440px;
            background: rgba(245,247,255,.96);
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.3), inset 0 1px 0 rgba(255,255,255,.6);
            max-height: calc(100vh - 130px);
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
        }

        .container::-webkit-scrollbar { width: 10px; }
        .container::-webkit-scrollbar-track { background: rgba(0,0,0,.04); border-radius: 12px; }
        .container::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #667eea, #764ba2); border-radius: 12px; border: 2px solid rgba(255,255,255,.4); }

        /* ========== 网格布局（6列） ========== */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            padding: 6px;
        }

        /* ========== 标题区（前2行前4列） ========== */
        .title-area {
            grid-column: 1 / 5;
            grid-row: 1 / 3;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ff6b6b, #ffa500, #ffd700, #ff6b6b);
            background-size: 300% 300%;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(255,150,50,.35), inset 0 1px 0 rgba(255,255,255,.2);
            animation: titleGradient 6s ease infinite;
            position: relative;
            overflow: hidden;
            cursor: default;
            transition: transform .4s cubic-bezier(.34,1.56,.64,1), box-shadow .4s ease;
        }

        .title-area:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 18px 60px rgba(255,150,50,.5), 0 0 50px rgba(255,200,100,.25);
        }

        .title-area h2 {
            font-size: 46px;
            font-weight: 900;
            text-align: center;
            line-height: 1.3;
            letter-spacing: 5px;
            color: #fff;
            text-shadow: 2px 2px 10px rgba(0,0,0,.3);
        }

        @keyframes titleGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ========== 返回主页（前2行第5-6列） ========== */
        .back-area {
            grid-column: 5 / 7;
            grid-row: 1 / 3;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: #fff;
            font-size: 24px;
            font-weight: 800;
            text-decoration: none;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(17,153,142,.4), inset 0 1px 0 rgba(255,255,255,.2);
            transition: transform .3s, box-shadow .3s;
            cursor: pointer;
        }

        .back-area:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 50px rgba(17,153,142,.5);
        }

        .back-area:active {
            transform: translateY(-2px) scale(.96);
        }

        /* ========== 公告卡片（内容区，从第3行开始，占满6列） ========== */
        .announcement-card {
            grid-column: 1 / 7;
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,.1);
            border: 2px solid #e8e8e8;
            position: relative;
            overflow: hidden;
            transition: transform .3s, box-shadow .3s, border-color .3s;
            cursor: default;
            animation: cardFadeIn .5s ease-out both;
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .announcement-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, #ff6b6b, #ffa500);
            border-radius: 4px 0 0 4px;
        }

        .announcement-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,.15);
            border-color: #ffd700;
        }

        .announcement-card .date {
            display: inline-block;
            background: linear-gradient(135deg, #ff6b6b, #ffa500);
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(255,107,107,.3);
            transition: transform .2s;
        }

        .announcement-card:hover .date {
            transform: scale(1.05);
        }

        .announcement-card .content {
            font-size: 16px;
            line-height: 1.8;
            color: #444;
            padding-left: 8px;
        }

        /* ========== 跳转覆盖层 ========== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(8,10,25,.72);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            opacity: 0;
            visibility: hidden;
            transition: opacity .4s ease, visibility .4s ease;
            pointer-events: none;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .loader-wrap {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,.1);
            border-top-color: #f6d365;
            border-right-color: #fda085;
            animation: ringSpin .8s linear infinite;
            box-sizing: border-box;
        }

        .loader-ring::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-bottom-color: #a78bfa;
            border-left-color: #667eea;
            animation: ringSpin 1.4s linear infinite reverse;
        }

        .loader-ring::after {
            content: '';
            position: absolute;
            top: 28px;
            left: 28px;
            right: 28px;
            bottom: 28px;
            border-radius: 50%;
            border: 1px solid transparent;
            border-top-color: #fb7185;
            border-right-color: #2dd4bf;
            animation: ringSpin 2s linear infinite;
        }

        .loader-text {
            position: relative;
            z-index: 5;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #f6d365, #fda085, #f6d365);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textShine 1.5s linear infinite;
        }

        @keyframes ringSpin {
            to { transform: rotate(360deg); }
        }

        /* ========== 响应式适配：平板端（4列） ========== */
        @media (max-width: 1024px) {
            .container { width: 92%; padding: 14px; }
            .grid { grid-template-columns: repeat(4, 1fr); gap: 10px; }
            .title-area, .back-area { grid-column: 1 / -1; grid-row: auto; min-height: 100px; }
            .title-area h2 { font-size: 32px; letter-spacing: 3px; }
            .announcement-card { grid-column: 1 / -1; }
        }

        /* ========== 响应式适配：手机大屏（3列） ========== */
        @media (max-width: 768px) {
            header { padding: 14px 16px; }
            header h1 { font-size: 20px; letter-spacing: 2px; }
            main { padding-top: 80px; padding-bottom: 30px; }
            .container { width: 94%; padding: 12px; max-height: none; border-radius: 18px; }
            .grid { grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 4px; }
            .title-area, .back-area { grid-column: 1 / -1; grid-row: auto; min-height: 80px; border-radius: 16px; }
            .title-area h2 { font-size: 26px; letter-spacing: 2px; }
            .back-area { font-size: 20px; }
            .announcement-card { grid-column: 1 / -1; padding: 14px; border-radius: 14px; }
            .announcement-card .date { font-size: 13px; padding: 3px 10px; }
            .announcement-card .content { font-size: 15px; line-height: 1.7; }
            /* 手机端去除hover效果，使用active */
            .announcement-card:hover { transform: none; box-shadow: 0 6px 20px rgba(0,0,0,.1); border-color: #e8e8e8; }
            .announcement-card:active { transform: scale(.98); }
            .title-area:hover { transform: none; }
            .back-area:hover { transform: none; }
            .back-area:active { transform: scale(.96); }
        }

        /* ========== 响应式适配：手机中屏（2列） ========== */
        @media (max-width: 600px) {
            header h1 { font-size: 18px; letter-spacing: 1px; }
            .container { width: 95%; padding: 10px; }
            .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .title-area, .back-area { grid-column: 1 / -1; grid-row: auto; min-height: 70px; }
            .title-area h2 { font-size: 24px; letter-spacing: 1px; }
            .back-area { font-size: 18px; }
            .announcement-card { grid-column: 1 / -1; padding: 12px; }
            .announcement-card .content { font-size: 14px; line-height: 1.7; }
            /* 手机端简化背景动画，提升性能 */
            .bg-flow-2, .bg-flow-3 { display: none; }
            .orb-3, .orb-4, .orb-5 { display: none; }
        }

        /* ========== 响应式适配：手机小屏（1列） ========== */
        @media (max-width: 400px) {
            header { padding: 12px 12px; }
            header h1 { font-size: 16px; letter-spacing: 1px; }
            main { padding-top: 70px; }
            .container { width: 96%; padding: 8px; border-radius: 14px; }
            .grid { grid-template-columns: 1fr; gap: 6px; padding: 2px; }
            .title-area, .back-area { grid-column: 1 / -1; grid-row: auto; min-height: 60px; border-radius: 12px; }
            .title-area h2 { font-size: 20px; letter-spacing: 1px; }
            .back-area { font-size: 16px; }
            .announcement-card { grid-column: 1 / -1; padding: 10px; border-radius: 12px; }
            .announcement-card .date { font-size: 12px; padding: 2px 8px; margin-bottom: 8px; }
            .announcement-card .content { font-size: 13px; line-height: 1.7; padding-left: 6px; }
            .announcement-card::before { width: 3px; }
            .loader-wrap { width: 140px; height: 140px; }
            .loader-text { font-size: 18px; letter-spacing: 2px; }
        }

        /* ========== 触摸设备优化 ========== */
        @media (hover: none) and (pointer: coarse) {
            .announcement-card:hover, .title-area:hover, .back-area:hover {
                transform: none;
            }
            .announcement-card:active {
                transform: scale(.98);
                transition: transform .1s;
            }
            .back-area:active {
                transform: scale(.96);
                transition: transform .1s;
            }
        }

        /* ========== 安全区域适配（刘海屏） ========== */
        @supports (padding: max(0px)) {
            header {
                padding-left: max(18px, env(safe-area-inset-left));
                padding-right: max(18px, env(safe-area-inset-right));
                padding-top: max(18px, env(safe-area-inset-top));
            }
            main {
                padding-left: max(0px, env(safe-area-inset-left));
                padding-right: max(0px, env(safe-area-inset-right));
                padding-bottom: max(50px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>

    <!-- 背景流光层 -->
    <div class="bg-animation">
        <div class="bg-flow-1"></div>
        <div class="bg-flow-2"></div>
        <div class="bg-flow-3"></div>
        <!-- 悬浮球 -->
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
        <div class="orb orb-5"></div>
    </div>

    <!-- 头部 -->
    <header>
        <h1>找乐子——更新公告</h1>
    </header>

    <!-- 主体内容 -->
    <main>
        <div class="container">
            <div class="grid" id="grid"></div>
        </div>
    </main>

    <!-- 跳转覆盖层 -->
    <div class="overlay" id="overlay">
        <div class="loader-wrap">
            <div class="loader-ring"></div>
            <div class="loader-text">找乐子～</div>
        </div>
    </div>

    <script>
        /* ================================================================
         * 公告数据配置（后期扩展）
         * 每条公告包含：date（日期），content（内容）
         * 按日期倒序排列显示
         * ================================================================ */
        const announcementsConfig = [
            { date: '永久公告', content: '欢迎来到“找乐子——更新公告”页面！这里是所有工具的最新动态。' },
            { date: '2026-09-05', content: '新增「文件搜索」工具：选择文件夹后可模糊搜索文件名和路径，支持关键词高亮、一键打开文件，快速定位海量文件。' },
            { date: '2026-08-29', content: '找乐子——优质工具库S1上线。' },
            { date: '2026-08-28', content: '面向大家的功能已完善。' },
            { date: '2026-08-27', content: '本地网页已上传至云端。' },
            // 后期添加更多公告...
        ];

        /* ================================================================
         * 创建标题区
         * ================================================================ */
        function createTitleArea() {
            const div = document.createElement('div');
            div.className = 'title-area';
            div.innerHTML = '<h2>找乐子——更新公告</h2>';
            return div;
        }

        /* ================================================================
         * 创建返回主页按钮
         * ================================================================ */
        function createBackArea() {
            const a = document.createElement('a');
            a.className = 'back-area';
            a.href = 'index.html';
            a.textContent = '返回主页';
            a.setAttribute('aria-label', '返回主页');
            a.title = '返回主页';
            // 点击事件：阻止默认，显示转场动画后跳转
            a.addEventListener('click', function(e) {
                e.preventDefault();
                showLoadingOverlay('index.html');
            });
            return a;
        }

        /* ================================================================
         * 创建公告卡片
         * ================================================================ */
        function createAnnouncementCard(announcement, index) {
            const card = document.createElement('div');
            card.className = 'announcement-card';
            // 动态设置入场动画延迟（每张卡片依次延迟0.1秒）
            card.style.animationDelay = (0.1 + index * 0.1) + 's';

            const dateSpan = document.createElement('span');
            dateSpan.className = 'date';
            dateSpan.textContent = announcement.date;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'content';
            contentDiv.textContent = announcement.content;

            card.appendChild(dateSpan);
            card.appendChild(contentDiv);
            return card;
        }

        /* ================================================================
         * 渲染主函数
         * ================================================================ */
        function renderAnnouncements() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            // 添加标题区域
            grid.appendChild(createTitleArea());

            // 添加返回主页按钮
            grid.appendChild(createBackArea());

            // 按日期倒序排列公告
            const sorted = [...announcementsConfig].sort((a, b) => new Date(b.date) - new Date(a.date));

            // 添加公告卡片（从第3行开始，自动占据后续行）
            sorted.forEach((announcement, index) => {
                grid.appendChild(createAnnouncementCard(announcement, index));
            });
        }

        /* ================================================================
         * 跳转覆盖层动画
         * ================================================================ */
        let overlayTimer = null;

        function showLoadingOverlay(url) {
            const overlay = document.getElementById('overlay');
            overlay.classList.add('active');

            if (overlayTimer) {
                clearTimeout(overlayTimer);
            }

            overlayTimer = setTimeout(() => {
                overlay.classList.remove('active');
                if (url && url !== '#') {
                    window.location.href = url;
                }
            }, 1000);
        }

        /* ================================================================
         * 初始化
         * ================================================================ */
        document.addEventListener('DOMContentLoaded', function() {
            renderAnnouncements();

            // 后期刷新公告的方法
            window.refreshAnnouncements = function(newConfig) {
                if (newConfig && Array.isArray(newConfig)) {
                    announcementsConfig.length = 0;
                    announcementsConfig.push(...newConfig);
                }
                renderAnnouncements();
            };
        });
    </script>
</body>
