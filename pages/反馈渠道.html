<style>
    *,
    *::before,
    *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body {
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        min-height: 100vh;
        background: var(--bg);
        color: var(--txt);
        overflow-x: hidden;
        position: relative;
    }
    /* 背景流光层（20秒无缝循环） */
    .bg-animation {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
    }
    .bg-flow-1 {
        position: absolute;
        top: -100%;
        left: -100%;
        width: 300%;
        height: 300%;
        background: var(--flow-grad);
        /* 六主题适配：flowGradient 背景位移动画移除（触性能铁律） */
    }
    .bg-flow-2 {
        position: absolute;
        top: -60%;
        left: -40%;
        width: 220%;
        height: 220%;
        background: radial-gradient(ellipse at 30% 70%, rgba(255,140,100,.35), transparent 50%),
            radial-gradient(ellipse at 65% 35%, rgba(120,180,255,.3), transparent 45%),
            radial-gradient(ellipse at 80% 80%, rgba(220,130,250,.25), transparent 40%);
        animation: flowDrift 20s ease-in-out infinite alternate;
        will-change: transform;
    }
    .bg-flow-3 {
        position: absolute;
        top: -30%;
        left: -20%;
        width: 180%;
        height: 180%;
        background: radial-gradient(circle at 50% 50%, rgba(255,200,130,.15), transparent 60%),
            radial-gradient(circle at 20% 80%, rgba(80,220,200,.2), transparent 50%);
        animation: flowRotate 20s linear infinite;
        will-change: transform;
    }
    /* flowGradient 关键帧已移除（background-position 全屏重绘，性能铁律禁用） */
    @keyframes flowDrift {
        0% { transform: translate(0, 0) scale(1) rotate(0deg); }
        50% { transform: translate(3%, -4%) scale(1.05) rotate(5deg); }
        100% { transform: translate(-2%, 3%) scale(.97) rotate(-5deg); }
    }
    @keyframes flowRotate {
        0% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(180deg) scale(1.08); }
        100% { transform: rotate(360deg) scale(1); }
    }
    /* 透明悬浮球 */
    .orb {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, color-mix(in srgb, var(--card-2) 60%, transparent), color-mix(in srgb, var(--card-2) 15%, transparent) 50%, transparent 70%);
        box-shadow: 0 0 60px color-mix(in srgb, var(--glow) 8%, transparent), inset 0 0 30px color-mix(in srgb, var(--card-2) 20%, transparent);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        pointer-events: none;
        will-change: transform, opacity;
    }
    .orb-1 { width: 260px; height: 260px; top: 12%; left: 8%; animation: orbFloatA 18s ease-in-out infinite, orbSpin 40s linear infinite; }
    .orb-2 { width: 160px; height: 160px; top: 55%; left: 75%; animation: orbFloatB 22s ease-in-out infinite, orbSpin 55s linear infinite; }
    .orb-3 { width: 110px; height: 110px; top: 68%; left: 20%; animation: orbFloatA 16s ease-in-out infinite reverse, orbSpin 35s linear infinite; }
    .orb-4 { width: 220px; height: 220px; top: 28%; left: 60%; animation: orbFloatB 20s ease-in-out infinite reverse, orbSpin 50s linear infinite; }
    .orb-5 { width: 80px; height: 80px; top: 80%; left: 45%; animation: orbFloatA 14s ease-in-out infinite, orbSpin 30s linear infinite; }
    @keyframes orbFloatA {
        0% { transform: translate(0,0) scale(1); opacity:.6; }
        30% { transform: translate(18px,-22px) scale(1.04); opacity:.8; }
        60% { transform: translate(-12px,10px) scale(.96); opacity:.5; }
        100% { transform: translate(0,0) scale(1); opacity:.6; }
    }
    @keyframes orbFloatB {
        0% { transform: translate(0,0) scale(1); opacity:.5; }
        35% { transform: translate(-20px,12px) scale(1.06); opacity:.7; }
        70% { transform: translate(14px,-15px) scale(.94); opacity:.4; }
        100% { transform: translate(0,0) scale(1); opacity:.5; }
    }
    @keyframes orbSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    /* 主体布局 */
    main {
        position: relative;
        z-index: 10;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 60px 20px 40px;
    }
    .container {
        width: 80%;
        max-width: 1200px;
        background: var(--card);
        border-radius: 24px;
        box-shadow: 0 25px 70px rgba(0,0,0,.35), 0 0 0 1px var(--line);
        max-height: calc(100vh - 100px);
        overflow-y: auto;
        padding: 20px;
        color: var(--txt);
    }
    .container::-webkit-scrollbar { width: 10px; }
    .container::-webkit-scrollbar-track { background: rgba(0,0,0,.04); border-radius: 12px; }
    .container::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 12px; border: 2px solid transparent; }
    /* 网格布局（6列8行） */
    .grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        grid-template-rows: repeat(8, minmax(80px, auto));
        gap: 12px;
    }
    /* 标题区（前2行前4列） */
    .title-area {
        grid-column: 1 / 5;
        grid-row: 1 / 3;
        display: flex;
        align-items: center;
        justify-content: center;
        /* 六主题适配：落日横幅→常量落日渐变（titleGradient 动画移除） */
        background: var(--gold-3-grad);
        border-radius: 20px;
        box-shadow: 0 12px 40px color-mix(in srgb, var(--gold-2) 35%, transparent), inset 0 1px 0 color-mix(in srgb, var(--card-2) 40%, transparent);
    }
    .title-area h2 {
        font-size: 42px;
        font-weight: 900;
        letter-spacing: 4px;
        color: var(--btn-txt);
        text-shadow: 2px 2px 10px rgba(0,0,0,.3);
    }
    /* 返回主页（前2行5-6列） */
    .back-area {
        grid-column: 5 / 7;
        grid-row: 1 / 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--back-grad);
        border-radius: 20px;
        box-shadow: 0 12px 40px color-mix(in srgb, var(--green) 40%, transparent), inset 0 1px 0 color-mix(in srgb, var(--card-2) 40%, transparent);
        text-decoration: none;
        color: var(--btn-txt);
        font-size: 22px;
        font-weight: 800;
        cursor: pointer;
        transition: transform .3s, box-shadow .3s;
    }
    .back-area:hover {
        transform: translateY(-5px);
        box-shadow: 0 18px 50px color-mix(in srgb, var(--green) 50%, transparent);
    }
    .back-area:active {
        transform: translateY(-2px) scale(.96);
    }
    /* 内容区：邮箱展示框（3行1列） */
    .email-display {
        grid-column: 1 / 2;
        grid-row: 3;
        background: var(--card-2);
        border: 2px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 16px;
        font-weight: 600;
        color: var(--txt);
        box-shadow: 0 4px 12px rgba(0,0,0,.06);
        transition: all .3s;
    }
    .email-display:hover {
        box-shadow: 0 8px 20px rgba(0,0,0,.12);
        transform: translateY(-2px);
    }
    .email-display .label {
        margin: 0 0 5px 0;
    }
    .email-display .address {
        color: var(--glow);
        font-size: 18px;
        font-weight: 800;
    }
    /* 内容区：邮箱操作框（3行2列） */
    .email-actions {
        grid-column: 2 / 3;
        grid-row: 3;
        background: var(--card-2);
        border: 2px solid var(--line);
        border-radius: 12px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 4px 12px rgba(0,0,0,.06);
    }
    .email-actions .btn {
        width: 100%;
        padding: 8px 16px;
        border: none;
        border-radius: 20px;
        background: var(--glow);
        color: var(--btn-txt);
        font-size: 14px;
        cursor: pointer;
        transition: all .2s;
    }
    .email-actions .btn:hover {
        transform: translateY(-2px);
        filter: brightness(.9);
    }
    .email-actions .btn:active {
        transform: scale(.95);
    }
    .email-actions .btn-secondary {
        background: var(--btn-grad);
        color: var(--btn-txt);
    }
    .email-actions .btn-secondary:hover {
        filter: brightness(.92);
    }
    /* 文本展示框（4-8行1-2列）彩边纯白 */
    .text-display {
        grid-column: 1 / 3;
        grid-row: 4 / 9;
        background: var(--card-2);
        border: 4px solid transparent;
        border-image: linear-gradient(45deg, var(--red), var(--gold-2), var(--gold), var(--glow), var(--purple)) 1;
        border-radius: 12px;
        padding: 20px;
        overflow-y: auto;
        color: var(--txt);
        font-size: 20px;
        font-weight: 700;
        line-height: 1.8;
        box-shadow: 0 6px 20px rgba(0,0,0,.1);
        transition: all .3s;
        text-align: left;
    }
    .text-display:hover {
        box-shadow: 0 12px 30px rgba(0,0,0,.15);
        transform: translateY(-2px);
    }
    .text-display p {
        margin: 0 0 8px 0;
    }
    .text-display .last-line {
        letter-spacing: -1px; /* 微缩左右距 */
        margin-bottom: 0;
    }
    /* 图片展示框（3-8行3-6列）占满剩余空间 */
    .image-display {
        grid-column: 3 / 7;
        grid-row: 3 / 9;
        background: var(--card);
        border: 2px dashed var(--line);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        box-shadow: 0 6px 20px rgba(0,0,0,.08);
        transition: all .3s;
        position: relative;
    }
    .image-display:hover {
        box-shadow: 0 12px 30px rgba(0,0,0,.12);
        border-color: var(--glow);
    }
    .image-display img {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }
    /* 转场遮罩 */
    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(8,10,25,.72);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        opacity: 0;
        visibility: hidden;
        transition: opacity .4s ease, visibility .4s ease;
        pointer-events: none;
    }
    .overlay.active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }
    .loader-wrap {
        position: relative;
        width: 180px;
        height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .loader-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 3px solid rgba(255,255,255,.1);
        border-top-color: #f6d365;
        border-right-color: #fda085;
        animation: ringSpin .8s linear infinite;
    }
    .loader-ring::before {
        content: '';
        position: absolute;
        top: 12px;
        left: 12px;
        right: 12px;
        bottom: 12px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-bottom-color: #a78bfa;
        border-left-color: #667eea;
        animation: ringSpin 1.4s linear infinite reverse;
    }
    .loader-ring::after {
        content: '';
        position: absolute;
        top: 28px;
        left: 28px;
        right: 28px;
        bottom: 28px;
        border-radius: 50%;
        border: 1px solid transparent;
        border-top-color: #fb7185;
        border-right-color: #2dd4bf;
        animation: ringSpin 2s linear infinite;
    }
    .loader-text {
        position: relative;
        z-index: 5;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 4px;
        background: linear-gradient(90deg, #f6d365, #fda085, #f6d365);
        background-size: 200% 100%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: textShine 1.5s linear infinite;
    }
    @keyframes ringSpin { to { transform: rotate(360deg); } }
    @keyframes textShine {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
    }
    /* 响应式 */
    @media (max-width: 900px) {
        .container { width: 95%; padding: 12px; }
        .grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: auto; }
        .title-area { grid-column: 1/3; grid-row: auto; min-height: 100px; }
        .back-area { grid-column: 1/3; grid-row: auto; min-height: 80px; }
        .email-display { grid-column: 1/3; grid-row: auto; }
        .email-actions { grid-column: 1/3; grid-row: auto; }
        .text-display { grid-column: 1/3; grid-row: auto; min-height: 250px; }
        .image-display { grid-column: 1/3; grid-row: auto; min-height: 250px; }
    }

        /* ========== 手机端响应式适配（通用） ========== */
        @media (max-width: 768px) {
            html, body {
                overflow-x: hidden;
                width: 100%;
            }
            main {
                padding: 70px 0 30px !important;
            }
            .container, .card-container, .wrapper, .box, .panel, .form-box {
                width: 94% !important;
                max-width: 94vw !important;
                padding: 14px !important;
                margin: 0 auto !important;
            }
            /* 6列/多列网格改3列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 8px !important;
                padding: 4px !important;
            }
            /* 大区域占满整行 */
            .title-area, .back-area, .display-area, .game-main,
            .calculator-area, .main-area, .content-area, .result-area,
            .input-area, .output-area, .board-area, .info-area, .settings-area {
                grid-column: 1 / -1 !important;
                grid-row: auto !important;
            }
            /* 左右分栏改上下堆叠 */
            .left-panel, .right-panel, .side-panel, .sidebar {
                flex: 1 1 100% !important;
                width: 100% !important;
                border-right: none !important;
                border-bottom: 1px solid var(--line) !important;
            }
            .display-area, .game-main, .calculator-area {
                flex-direction: column !important;
                padding: 12px !important;
            }
            .cell, .tool-cell, .grid-cell {
                padding: 10px 6px !important;
                min-height: 70px !important;
            }
            h1, h2, h3, .title-text, .author-name, .main-title {
                font-size: 22px !important;
                letter-spacing: 1px !important;
            }
            .btn, button, input, select, textarea {
                font-size: 14px !important;
                padding: 10px 14px !important;
            }
            .ghost-btn, .back-btn, .return-btn {
                padding: 8px 16px !important;
                font-size: 13px !important;
            }
            /* 隐藏非必要装饰元素 */
            .orb, .decoration, .deco-element, .floating-shape {
                display: none !important;
            }
        }
        @media (max-width: 480px) {
            .container, .card-container, .wrapper, .box {
                width: 96% !important;
                padding: 10px !important;
            }
            /* 小屏手机改2列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 6px !important;
            }
            h1, h2, h3, .title-text, .author-name {
                font-size: 18px !important;
            }
            .cell, .tool-cell {
                min-height: 80px !important;
                padding: 8px 4px !important;
            }
            .btn, button {
                font-size: 13px !important;
                padding: 8px 12px !important;
            }
        }
</style>
