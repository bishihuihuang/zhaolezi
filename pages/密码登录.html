    <style>
        /* 密码登录 · 编辑风：一扇安静的纸面之门（其余门禁页同款气质） */
        html, body { height: 100%; }
        body {
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        .login-square {
            width: min(88vw, 400px);
            text-align: center;
        }
        .login-glyph { font-size: 26px; margin-bottom: 18px; opacity: .75; }
        h1 { margin: 0 0 8px; }
        .login-sub { font-size: 14px; color: var(--dim); margin: 0 0 32px; }

        input[type="password"] {
            width: 100%;
            padding: 13px 16px;
            font-size: 16px;
            letter-spacing: 3px;
            text-align: center;
        }
        .input-group { margin-bottom: 18px; }

        .remember-group {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-bottom: 28px;
        }
        .remember-group input { width: 15px; height: 15px; padding: 0; cursor: pointer; }
        .remember-group label { font-size: 13px; color: var(--dim); cursor: pointer; user-select: none; }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 14px;
        }
        .btn {
            flex: 1;
            max-width: 180px;
            padding: 13px 0;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 4px;
            text-indent: 4px;
            color: var(--btn-txt, #fff);
            background: var(--blue, #667eea);
            border: none;
            border-radius: var(--ed-radius, 6px);
            cursor: pointer;
            transition: filter .18s ease;
        }
        .btn:hover { filter: brightness(1.08); }
        .btn:active { transform: translateY(1px); }
        .btn-cancel {
            background: none;
            border: 1px solid var(--line);
            color: var(--txt);
            letter-spacing: 2px;
            text-indent: 2px;
        }
        .btn-cancel:hover { border-color: var(--txt); filter: none; }

        /* 错误时的抖动 */
        .shake { animation: shake .5s; }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        /* 转场遮罩（品牌件） */
        #transitionMask {
            position: fixed; inset: 0; z-index: 9999;
            display: none; justify-content: center; align-items: center;
            background: rgba(8, 10, 25, .72);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            opacity: 0; visibility: hidden;
            transition: opacity .4s, visibility .4s;
            pointer-events: none;
        }
        #transitionMask.show { display: flex; opacity: 1; visibility: visible; pointer-events: auto; }
        .loader-text { font-size: 20px; font-weight: 700; letter-spacing: 5px; color: var(--card-2); }

        /* 小房子键（站规：右上角，带回转场） */
        .home-fab {
            position: fixed; top: 14px; right: 16px; z-index: 2147483647;
            width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
            font-size: 22px; text-decoration: none; color: var(--txt);
            background: var(--card-2); border: 1px solid var(--line); border-radius: 50%;
            transition: border-color .2s ease;
        }
        .home-fab:hover { border-color: var(--txt); }

        .home-overlay {
            position: fixed; inset: 0; z-index: 999999; display: flex; align-items: center; justify-content: center;
            background: rgba(8, 10, 25, .72); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            opacity: 0; visibility: hidden; transition: opacity .4s ease, visibility .4s ease; pointer-events: none;
        }
        .home-overlay.show { opacity: 1; visibility: visible; pointer-events: auto; }
        .home-loader-text { color: var(--card-2); font-size: 19px; font-weight: 700; letter-spacing: 5px; }

        @media (max-width: 768px) {
            .login-square { width: 90vw; }
            h1 { font-size: var(--ed-fz-h2, 24px); }
        }
    </style>

<style data-no-obf>/* 全站打磨层 V3.0 */
/* ==================================================================
   全站通用打磨层（V3.0 · 综合提升）
   追加到 common.css / xd-common.css / cy-common.css 末尾，级联覆盖全站。
   设计原则：
   - 零破坏：:where() 包裹 = 零特异性，绝不覆盖页面既有样式；不设 margin/尺寸/定位。
   - 主题自适应：一律 var(--zl-*，fallback)，不引入新硬编码色。
   - 不变量：不改任何布局结构、跳转逻辑、找乐子主题。
   - 提升：可访问性（焦点/减少动效/色彩方案/触摸）、可读性（tabular-nums）、
           交互反馈（hover/active 过渡）、文本健壮性（长词换行）。
   ================================================================== */

/* 1. 原生控件随系统深浅色自适应（修复滚动条/输入框/下拉在深色下刺眼白块） */
:root { color-scheme: light dark; }

/* 2. 触摸设备消除双击缩放延迟（移动端点按更跟手） */
html { -webkit-tap-highlight-color: transparent; }
:where(a, button, [role="button"], input, select, textarea, summary, label:has(input), [tabindex]):not([disabled]) {
    touch-action: manipulation;
}

/* 3. 键盘焦点统一可见（:where 零特异性 + !important 压过页面 outline:none）
      仅键盘触发（focus-visible），鼠标点击不出现，不打扰普通点击用户 */
:where(a, button, [role="button"], input, select, textarea, summary, [tabindex], [contenteditable]):focus-visible {
    outline: 3px solid var(--zl-accent, var(--gold, #f6d365)) !important;
    outline-offset: 2px !important;
    border-radius: 6px;
}

/* 4. 交互反馈：hover/active 平滑过渡（仅列属性，不用 transition:all） */
:where(a, button, [role="button"], summary, [tabindex]):where(:not([disabled])) {
    transition: color .15s ease, background-color .15s ease, border-color .15s ease, box-shadow .15s ease, opacity .15s ease;
}

/* 5. 文本健壮性：长英文词/URL 在窄屏不再撑破容器 */
:where(p, li, dd, dt, td, th, figcaption, blockquote, h1, h2, h3, h4, h5, h6, a, span, div) {
    overflow-wrap: break-word;
}

/* 6. 数字对齐：统计/计数/表格数字用等宽数字，跳动更整齐 */
:where(td, .stat, .stat-num, .count, .num, [data-num]) {
    font-variant-numeric: tabular-nums;
}

/* 6b. 图片响应式：窄屏不撑破容器、保持比例不失真（未显式设尺寸的图更稳） */
:where(img, picture, video) {
    max-width: 100%;
    height: auto;
}

/* 7. 尊重系统"减少动态效果"（兜底层：common.css 已有，此处保证三家族全覆盖）
      用 :where 包裹，特异性为 0，页面更具体的动效规则仍可生效 */
@media (prefers-reduced-motion: reduce) {
    :where(*, *::before, *::after) {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important;
    }
}

/* 8. 打印友好：隐藏固定悬浮件，正文铺满（低成本加分项） */
@media print {
    :where([class*="fab"], [class*="float"], [class*="dock"], nav.zl-crumb, .zl-skip-link) {
        display: none !important;
    }
}
