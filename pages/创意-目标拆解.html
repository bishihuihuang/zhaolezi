    <header class="cy-shell">
        <h1>创意引擎 · 目标拆解</h1>
    </header>

    <main class="cy-page">
        <div class="cy-card">
            <h2>🎯 我的目标</h2>
            <div class="sub">先写下目标，再逐项拆解。系统会用 SMART 原则帮你做「目标体检」。</div>
            <input class="cy-input" id="goalName" placeholder="目标名称，如：三个月内发布个人作品集网站">
            <div class="cy-toolbar">
                <input class="cy-input" type="date" id="goalDate" style="width:170px;">
                <input class="cy-input" id="goalNum" placeholder="衡量数字，如：12 个作品" style="flex:1;">
                <button class="cy-btn cy-btn-ghost" id="btnExampleGoal">🧪 示例</button>
            </div>
        </div>

        <div class="cy-card">
            <h2>🧪 SMART 目标体检</h2>
            <div class="sub">点一下方格切换状态；系统会结合你的目标文字自动给出建议。</div>
            <div class="smart-grid" id="smartGrid"></div>
            <div class="hint" id="smartAdvice" style="font-size:13px;color:var(--zl-text);margin-top:10px;line-height:1.8;"></div>
        </div>

        <div class="cy-card">
            <h2>🧱 里程碑拆解</h2>
            <div class="sub">把大目标拆成 3-6 个里程碑，每个里程碑设一个期限，甘特图自动排布。</div>
            <div class="ms-row">
                <input class="cy-input" id="msName" placeholder="里程碑名称，如：完成选题与结构">
                <input class="cy-input" type="date" id="msDate">
                <button class="cy-btn" id="btnAddMs">＋ 添加</button>
            </div>
            <div class="ms-list" id="msList"></div>
            <div class="gantt" id="gantt"></div>
        </div>

        <div class="cy-card">
            <h2>📤 导出与保存</h2>
            <div class="cy-toolbar">
                <button class="cy-btn" id="btnExport">📄 导出计划（Markdown）</button>
                <button class="cy-btn cy-btn-ghost" id="btnSave">💾 存为本页草稿</button>
                <button class="cy-btn cy-btn-ghost" id="btnLoad">📂 载入草稿</button>
            </div>
        </div>
