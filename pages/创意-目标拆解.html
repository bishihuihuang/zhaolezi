    <main id="zl-main" class="cy-page">
        <div class="cy-card">
            <h2>🎯 我的目标</h2>

            <input class="cy-input" id="goalName" placeholder="目标名称，如：三个月内发布个人作品集网站" aria-label="目标名称，如：三个月内发布个人作品集网站">

                <input class="cy-input" type="date" id="goalDate" style="width:170px;" aria-label="goal Date">

        <div class="cy-card">
            <h2>🧪 SMART 目标体检</h2>

                <button class="cy-btn" id="btnAddMs">＋ 添加</button>
            </div>
            <div class="ms-list" id="msList"></div>
            <div class="gantt" id="gantt"></div>
        </div>
