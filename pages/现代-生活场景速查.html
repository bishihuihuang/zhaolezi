        <p class="lesson-sub">遇到问题不知去哪学？输入关键词，或直接点下面的生活场景</p>

        <div class="callout info">
            <b>怎么用？</b>
            不用翻目录——把你眼下的问题<strong>当成生活场景</strong>来找：比如「电脑越来越卡」「发红包」「挂号看病」。在下面搜索框输入关键词，或直接点场景卡片，就会<strong>直达对应的课程页</strong>。每个场景对应 1-4 篇教程，点哪篇学哪篇。
