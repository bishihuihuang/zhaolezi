<style data-no-obf>/* 全站打磨层 V3.0 */
/* ==================================================================
   全站通用打磨层（V3.0 · 综合提升）
   追加到 common.css / xd-common.css / cy-common.css 末尾，级联覆盖全站。
   设计原则：
   - 零破坏：:where() 包裹 = 零特异性，绝不覆盖页面既有样式；不设 margin/尺寸/定位。
   - 主题自适应：一律 var(--zl-*，fallback)，不引入新硬编码色。
   - 不变量：不改任何布局结构、跳转逻辑、找乐子主题。
   - 提升：可访问性（焦点/减少动效/色彩方案/触摸）、可读性（tabular-nums）、
           交互反馈（hover/active 过渡）、文本健壮性（长词换行）。
   ================================================================== */

/* 1. 原生控件随系统深浅色自适应（修复滚动条/输入框/下拉在深色下刺眼白块） */
:root { color-scheme: light dark; }

/* 2. 触摸设备消除双击缩放延迟（移动端点按更跟手） */
html { -webkit-tap-highlight-color: transparent; }
:where(a, button, [role="button"], input, select, textarea, summary, label:has(input), [tabindex]):not([disabled]) {
    touch-action: manipulation;
}

/* 3. 键盘焦点统一可见（:where 零特异性 + !important 压过页面 outline:none）
      仅键盘触发（focus-visible），鼠标点击不出现，不打扰普通点击用户 */
:where(a, button, [role="button"], input, select, textarea, summary, [tabindex], [contenteditable]):focus-visible {
    outline: 3px solid var(--zl-accent, var(--gold, #f6d365)) !important;
    outline-offset: 2px !important;
    border-radius: 6px;
}

/* 4. 交互反馈：hover/active 平滑过渡（仅列属性，不用 transition:all） */
:where(a, button, [role="button"], summary, [tabindex]):where(:not([disabled])) {
    transition: color .15s ease, background-color .15s ease, border-color .15s ease, box-shadow .15s ease, opacity .15s ease;
}

/* 5. 文本健壮性：长英文词/URL 在窄屏不再撑破容器 */
:where(p, li, dd, dt, td, th, figcaption, blockquote, h1, h2, h3, h4, h5, h6, a, span, div) {
    overflow-wrap: break-word;
}

/* 6. 数字对齐：统计/计数/表格数字用等宽数字，跳动更整齐 */
:where(td, .stat, .stat-num, .count, .num, [data-num]) {
    font-variant-numeric: tabular-nums;
}

/* 6b. 图片响应式：窄屏不撑破容器、保持比例不失真（未显式设尺寸的图更稳） */
:where(img, picture, video) {
    max-width: 100%;
    height: auto;
}

/* 7. 尊重系统"减少动态效果"（兜底层：common.css 已有，此处保证三家族全覆盖）
      用 :where 包裹，特异性为 0，页面更具体的动效规则仍可生效 */
@media (prefers-reduced-motion: reduce) {
    :where(*, *::before, *::after) {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important;
    }
}

/* 8. 打印友好：隐藏固定悬浮件，正文铺满（低成本加分项） */
@media print {
    :where([class*="fab"], [class*="float"], [class*="dock"], nav.zl-crumb, .zl-skip-link) {
        display: none !important;
    }
}

    <article class="lesson container">
        <h1 class="lesson-title">🧪 提示词实验室</h1>
        <p class="lesson-sub">模块E · 第 4 课 | 组装式提示词生成器</p>

        <div class="callout info">
            <b>怎么玩</b>
            选一个场景，填好<strong>角色 / 任务 / 上下文 / 格式</strong>四块积木，点「生成提示词」，把成品复制到任何 AI 对话框使用。参考 E2 的五要素，越具体效果越好。
        </div>

        <div id="lab">
            <div class="lab-card">
                <div class="lab-field">
                    <label>① 场景模板（选一个，自动填好角色）</label>
                    <select id="sceneSel" aria-label="scene Sel">
                        <option value="learn">学习提问：把概念讲明白</option>
                        <option value="write">写文章：按受众产出</option>
                        <option value="polish">改稿：保留原意改风格</option>
                        <option value="plan">做计划：表格化任务安排</option>
                        <option value="debug">代码排错：报错秒懂</option>
                        <option value="custom">自定义：从零组装</option>
                    </select>
                </div>
                <div class="lab-field">
                    <label>② 角色（AI 以什么身份回答你）</label>
                    <input id="roleIn" type="text" placeholder="例：一位耐心的初中数学老师" aria-label="例：一位耐心的初中数学老师">
                    <div class="role-chips" id="roleChips">
                        <span class="chip">耐心的老师</span>
                        <span class="chip">资深编辑</span>
                        <span class="chip">求职辅导师</span>
                        <span class="chip">健身教练</span>
                        <span class="chip">Python 导师</span>
                        <span class="chip">产品经理</span>
                    </div>
                </div>
                <div class="lab-field">
                    <label>③ 任务（要 AI 做什么？带上约束）</label>
                    <input id="taskIn" type="text" placeholder="例：用 200 字以内的通俗语言解释「量子纠缠」，并给 1 个生活例子" aria-label="例：用 200 字以内的通俗语言解释「量子纠缠」，并给 1 个生活例子">
                    <div class="lab-hint">动词开头 + 字数/条数/风格等约束，效果最好。</div>
                </div>
                <div class="lab-field">
                    <label>④ 上下文（给 AI 喂背景 / 原材料）</label>
                    <textarea id="ctxIn" rows="3" placeholder="例：我是零基础的初中生；目标读者是 55 岁阿姨；粘贴你的原稿…" aria-label="例：我是零基础的初中生；目标读者是 55 岁阿姨；粘贴你的原稿…"></textarea>
                </div>
                <div class="lab-field">
                    <label>⑤ 格式（输出长什么样）</label>
                    <select id="fmtSel" aria-label="fmt Sel">
                        <option value="分点列出">分点列出，每点不超过 20 字</option>
                        <option value="表格">用 Markdown 表格输出</option>
                        <option value="段落">连贯段落，不用编号</option>
                        <option value="代码">只输出代码，不加解释</option>
                        <option value="自由">自由发挥</option>
                    </select>
                </div>
                <div class="lab-row">
                    <button class="btn" id="genBtn">⚡ 生成提示词</button>
                    <button class="btn btn-secondary" id="copyBtn">📋 复制成品</button>
                </div>
                <div class="lab-field" style="margin-top:14px;">
                    <label>生成的提示词</label>
                    <textarea id="labOut" readonly placeholder="点「生成提示词」后，成品会出现在这里…" aria-label="点「生成提示词」后，成品会出现在这里…"></textarea>
                </div>
                <div class="lab-preview" id="labNote"></div>
            </div>
        </div>

        <div class="lesson-footer">
            <span>✅ 打开本页即已自动记录学习进度</span>
