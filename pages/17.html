<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找乐子——古今中外暗号大全</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "KaiTi", "STKaiti", "FangSong", "Microsoft YaHei", serif;
            min-height: 100vh;
            background: #f9f6e8;
            color: #5a3e1b;
            overflow-x: hidden;
        }
        
        /* 背景动画 */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: linear-gradient(120deg, #f9e79f, #f4d03f, #f7dc6f, #f9e79f);
            background-size: 300% 300%;
            animation: goldenFlow 10s ease-in-out infinite;
        }
        @keyframes goldenFlow {
            0% { background-position: 0% 50%; }
            25% { background-position: 100% 50%; }
            50% { background-position: 50% 100%; }
            75% { background-position: 0% 100%; }
            100% { background-position: 0% 50%; }
        }
        .bg-animation::after {
            content: '';
            position: absolute;
            top: -20%;
            left: -20%;
            width: 120%;
            height: 120%;
            background: radial-gradient(ellipse, rgba(255, 255, 255, .3), transparent 60%);
            animation: lightDrift 8s ease-in-out infinite alternate;
            z-index: 1;
        }
        @keyframes lightDrift {
            0% { transform: translate(-10%, -10%) scale(1); }
            50% { transform: translate(10%, 10%) scale(1.1); }
            100% { transform: translate(-10%, 10%) scale(0.9); }
        }
        
        /* 雪花飘落 */
        .snowflake {
            position: fixed;
            top: -10px;
            background: #e6c200;
            border-radius: 50%;
            opacity: 0.8;
            pointer-events: none;
            z-index: 1;
            animation: snowFall linear infinite;
        }
        @keyframes snowFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0.2; }
        }
        
        /* 网格布局 */
        main {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 0;
        }
        .container {
            width: 94%;
            max-width: 1300px;
            background: rgba(255, 255, 255, .75);
            border-radius: 24px;
            box-shadow: 0 15px 50px rgba(218, 165, 32, .3);
            padding: 10px;
            margin-top: 20px;
            border: 2px solid #d4af37;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(8, minmax(70px, auto));
            gap: 10px;
        }
        .cell {
            border-radius: 12px;
            border: 1px solid #d4af37;
            background: rgba(255, 255, 255, .5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            position: relative;
        }
        .title-area {
            grid-row: 1 / 3;
            grid-column: 1 / 5;
            background: linear-gradient(135deg, #f9e79f, #f4d03f, #f7dc6f);
            border: 2px solid #d4af37;
            box-shadow: 0 0 30px rgba(212, 175, 55, .4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .title-area h1 {
            font-size: 42px;
            font-weight: 900;
            color: #7a4e1f;
            letter-spacing: 6px;
            text-shadow: 2px 2px 0 #f7dc6f;
        }
        .title-area small {
            font-size: 14px;
            letter-spacing: 4px;
            color: #5a3e1b;
            margin-top: 6px;
        }
        .back-area {
            grid-row: 1 / 3;
            grid-column: 5 / 7;
            background: linear-gradient(135deg, #f4d03f, #f9e79f);
            border: 2px solid #d4af37;
            color: #5a3e1b;
            text-decoration: none;
            font-weight: 900;
            font-size: 22px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all .3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80px;
            min-width: 44px;
        }
        .back-area:hover {
            background: #f7dc6f;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, .4);
        }
        
        /* 纯白文本区域：左右两列 */
        .display-area {
            grid-row: 3 / 9;
            grid-column: 1 / 7;
            background: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 0;
            min-height: 400px;
            position: relative;
            display: flex;
            flex-direction: row;
            overflow: hidden;
        }
        
        /* 左侧：输入区 */
        .left-panel {
            flex: 0 0 280px;
            padding: 10px;
            border-right: 2px solid #d4af37;
            background: #ffffff;
            display: flex;
            flex-direction: column;
        }
        .display-header {
            display: block;
            margin: 0;
            color: #d4af37;
            font-size: 20px;
            font-weight: bold;
            white-space: nowrap;
            letter-spacing: 1px;
            text-align: left;
        }
        #secretInput {
            display: block;
            width: 100%;
            padding: 8px 0;
            border: none;
            outline: none;
            background: transparent;
            font-family: "KaiTi", serif;
            font-size: 18px;
            color: #5a3e1b;
            min-height: 44px;
        }
        #secretInput::placeholder {
            color: #d4af37;
        }
        
        /* 新增：刷新按钮样式 */
        .refresh-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: linear-gradient(135deg, #d4af37, #f4d03f, #d4af37);
            background-size: 200% 200%;
            border: none;
            border-radius: 20px;
            color: #7a4e1f;
            font-family: "KaiTi", "STKaiti", serif;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, .4);
            transition: all .3s ease;
            letter-spacing: 3px;
            min-height: 44px;
        }
        .refresh-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, .6);
            background-position: 100% 50%;
        }
        .refresh-btn:active {
            transform: translateY(0) scale(.96);
            transition-duration: .1s;
        }
        
        /* 右侧：媒体显示区 */
        .right-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
            background: #ffffff;
            flex-direction: column;
        }
        
        /* 媒体自适应显示 */
        .display-video,
        .display-audio,
        .display-image {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            margin-top: 10px;
        }
        .display-audio {
            width: 80%;
        }
        .display-file-label {
            font-size: 18px;
            font-style: italic;
            color: #ff8c00;
            margin-top: 5px;
            text-align: center;
        }
        .output-content {
            margin-top: 6px;
            font-size: 30px;
            line-height: 1.8;
            white-space: pre-wrap;
            color: #ff4500;
            text-align: center;
        }
        
        /* 国风转场 */
        .transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999999;
            background: rgba(249, 231, 159, .9);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            -webkit-opacity: 0;
            -webkit-transition: opacity .4s ease;
            transition: opacity .4s ease;
            pointer-events: none;
            will-change: opacity;
        }
        .transition-overlay.active {
            opacity: 1;
            -webkit-opacity: 1;
            pointer-events: auto;
        }
        .transition-overlay .gold-ring {
            position: relative;
            width: 180px;
            height: 180px;
            border: 4px solid #d4af37;
            border-radius: 50%;
            animation: goldenPulse 1.2s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .transition-overlay .gold-ring::before {
            content: '';
            position: absolute;
            inset: 20px;
            border: 2px dashed #d4af37;
            animation: spinRing 4s linear infinite;
        }
        @keyframes goldenPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 30px #d4af37; }
            50% { transform: scale(1.1); box-shadow: 0 0 50px #f4d03f; }
        }
        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }
        .transition-overlay .find-text {
            font-family: "KaiTi", "STKaiti", serif;
            font-size: 32px;
            font-weight: 900;
            color: #b8860b;
            letter-spacing: 6px;
            z-index: 2;
            background: rgba(255, 255, 255, .5);
            padding: 6px 16px;
            border-radius: 40px;
            white-space: nowrap;
            -webkit-white-space: nowrap;
            display: inline-block;
            text-align: center;
            line-height: 1.2;
        }
        
        /* Toast提示 */
        .toast-msg {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(122, 78, 31, .95);
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-family: "KaiTi", "STKaiti", serif;
            z-index: 9999999;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .4);
            transition: opacity .3s ease, transform .3s ease;
            pointer-events: none;
        }
        
        /* 响应式 */
        @media (max-width: 900px) {
            .grid { gap: 6px; }
            .title-area h1 { font-size: 28px; }
            .back-area { font-size: 18px; }
        }
        @media (max-width: 600px) {
            .container { width: 98%; }
            .grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: auto; }
            .title-area { grid-row: 1; grid-column: 1/3; }
            .back-area { grid-row: 2; grid-column: 1/3; }
            .display-area { grid-row: 3; grid-column: 1/3; min-height: 300px; flex-direction: column; }
            .left-panel { flex: none; width: 100%; border-right: none; border-bottom: 2px solid #d4af37; }
            .right-panel { flex: none; width: 100%; min-height: 300px; }
        }
    
        /* ========== 手机端响应式适配（通用） ========== */
        @media (max-width: 768px) {
            html, body {
                overflow-x: hidden;
                width: 100%;
            }
            main {
                padding: 70px 0 30px !important;
            }
            .container, .card-container, .wrapper, .box, .panel, .form-box {
                width: 94% !important;
                max-width: 94vw !important;
                padding: 14px !important;
                margin: 0 auto !important;
            }
            /* 6列/多列网格改3列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 8px !important;
                padding: 4px !important;
            }
            /* 大区域占满整行 */
            .title-area, .back-area, .display-area, .game-main,
            .calculator-area, .main-area, .content-area, .result-area,
            .input-area, .output-area, .board-area, .info-area, .settings-area {
                grid-column: 1 / -1 !important;
                grid-row: auto !important;
            }
            /* 左右分栏改上下堆叠 */
            .left-panel, .right-panel, .side-panel, .sidebar {
                flex: 1 1 100% !important;
                width: 100% !important;
                border-right: none !important;
                border-bottom: 1px solid rgba(0,0,0,.1) !important;
            }
            .display-area, .game-main, .calculator-area {
                flex-direction: column !important;
                padding: 12px !important;
            }
            .cell, .tool-cell, .grid-cell {
                padding: 10px 6px !important;
                min-height: 70px !important;
            }
            h1, h2, h3, .title-text, .author-name, .main-title {
                font-size: 22px !important;
                letter-spacing: 1px !important;
            }
            .btn, button, input, select, textarea {
                font-size: 14px !important;
                padding: 10px 14px !important;
            }
            .ghost-btn, .back-btn, .return-btn {
                padding: 8px 16px !important;
                font-size: 13px !important;
            }
            /* 隐藏非必要装饰元素 */
            .orb, .decoration, .deco-element, .floating-shape {
                display: none !important;
            }
        }
        @media (max-width: 480px) {
            .container, .card-container, .wrapper, .box {
                width: 96% !important;
                padding: 10px !important;
            }
            /* 小屏手机改2列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 6px !important;
            }
            h1, h2, h3, .title-text, .author-name {
                font-size: 18px !important;
            }
            .cell, .tool-cell {
                min-height: 80px !important;
                padding: 8px 4px !important;
            }
            .btn, button {
                font-size: 13px !important;
                padding: 8px 12px !important;
            }
        }
</style>
