<style>
    .quiz-centers { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 14px; }
    .qc-card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: block; text-decoration: none; transition: transform .15s ease, box-shadow .15s ease; }
    .qc-card:hover { transform: translateY(-2px); box-shadow: none; }
    .qc-card b { display: block; font-size: 15px; color: var(--txt); margin-bottom: 4px; }
    .qc-card .sub { font-size: 12.5px; color: var(--dim); }
    .qc-card .score { display: inline-block; margin-top: 8px; font-size: 12.5px; font-weight: 700; padding: 2px 10px; border-radius: 8px; background: color-mix(in srgb, var(--blue) 12%, transparent); color: var(--blue); }
    .qc-card .score.best { background: color-mix(in srgb, var(--green) 14%, transparent); color: var(--green); }
    .qc-card .score.fail { background: color-mix(in srgb, var(--red) 13%, transparent); color: var(--red); }
    .errbook { margin-top: 22px; }
    .err-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .err-count { font-size: 13px; color: var(--dim); }
    .err-item { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-top: 12px; }
    .err-q { font-size: 14.5px; font-weight: 700; color: var(--txt); margin-bottom: 8px; }
    .err-q .q-tag { display: inline-block; font-size: 12px; font-weight: 700; color: var(--blue); background: color-mix(in srgb, var(--blue) 12%, transparent); padding: 1px 8px; border-radius: 8px; margin-right: 8px; }
    .err-opts { margin: 0; padding: 0; list-style: none; }
    .err-opts li { font-size: 13.5px; padding: 5px 10px; border-radius: 8px; margin: 4px 0; background: var(--card-2); color: var(--txt); }
    .err-opts li.right { background: color-mix(in srgb, var(--green) 14%, transparent); color: var(--green); font-weight: 700; }
    .err-opts li.yours { background: color-mix(in srgb, var(--red) 13%, transparent); color: var(--red); text-decoration: line-through; }
    .err-exp { font-size: 13px; color: var(--dim); background: color-mix(in srgb, var(--blue) 8%, transparent); border-left: 3px solid var(--blue); padding: 8px 12px; border-radius: 0 8px 8px 0; margin-top: 10px; }
    .err-ops { margin-top: 10px; display: flex; gap: 8px; }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-danger:hover { background: rgba(229, 57, 53, 1); }
</style>

<style data-no-obf>/* 全站打磨层 V3.0 */
/* ==================================================================
   全站通用打磨层（V3.0 · 综合提升）
   追加到 common.css / xd-common.css / cy-common.css 末尾，级联覆盖全站。
   设计原则：
   - 零破坏：:where() 包裹 = 零特异性，绝不覆盖页面既有样式；不设 margin/尺寸/定位。
   - 主题自适应：一律 var(--zl-*，fallback)，不引入新硬编码色。
   - 不变量：不改任何布局结构、跳转逻辑、找乐子主题。
   - 提升：可访问性（焦点/减少动效/色彩方案/触摸）、可读性（tabular-nums）、
           交互反馈（hover/active 过渡）、文本健壮性（长词换行）。
   ================================================================== */

/* 1. 原生控件随系统深浅色自适应（修复滚动条/输入框/下拉在深色下刺眼白块） */
:root { color-scheme: light dark; }

/* 2. 触摸设备消除双击缩放延迟（移动端点按更跟手） */
html { -webkit-tap-highlight-color: transparent; }
:where(a, button, [role="button"], input, select, textarea, summary, label:has(input), [tabindex]):not([disabled]) {
    touch-action: manipulation;
}

/* 3. 键盘焦点统一可见（:where 零特异性 + !important 压过页面 outline:none）
      仅键盘触发（focus-visible），鼠标点击不出现，不打扰普通点击用户 */
:where(a, button, [role="button"], input, select, textarea, summary, [tabindex], [contenteditable]):focus-visible {
    outline: 3px solid var(--zl-accent, var(--gold, #f6d365)) !important;
    outline-offset: 2px !important;
    border-radius: 6px;
}

/* 4. 交互反馈：hover/active 平滑过渡（仅列属性，不用 transition:all） */
:where(a, button, [role="button"], summary, [tabindex]):where(:not([disabled])) {
    transition: color .15s ease, background-color .15s ease, border-color .15s ease, box-shadow .15s ease, opacity .15s ease;
}

/* 5. 文本健壮性：长英文词/URL 在窄屏不再撑破容器 */
:where(p, li, dd, dt, td, th, figcaption, blockquote, h1, h2, h3, h4, h5, h6, a, span, div) {
    overflow-wrap: break-word;
}

/* 6. 数字对齐：统计/计数/表格数字用等宽数字，跳动更整齐 */
:where(td, .stat, .stat-num, .count, .num, [data-num]) {
    font-variant-numeric: tabular-nums;
}

/* 6b. 图片响应式：窄屏不撑破容器、保持比例不失真（未显式设尺寸的图更稳） */
:where(img, picture, video) {
    max-width: 100%;
    height: auto;
}

/* 7. 尊重系统"减少动态效果"（兜底层：common.css 已有，此处保证三家族全覆盖）
      用 :where 包裹，特异性为 0，页面更具体的动效规则仍可生效 */
@media (prefers-reduced-motion: reduce) {
    :where(*, *::before, *::after) {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important;
    }
}

/* 8. 打印友好：隐藏固定悬浮件，正文铺满（低成本加分项） */
@media print {
    :where([class*="fab"], [class*="float"], [class*="dock"], nav.zl-crumb, .zl-skip-link) {
        display: none !important;
    }
}

        <p class="lesson-sub">十三个模块测验全在这里，做错的题自动进错题本</p>

        <div class="callout info">
            <b>怎么用？</b>
            每个模块学完后，到对应测验页考一次：<strong>60 分以上算通过</strong>，考得差随时可以重做（成绩只记最好的一次）。做错的题会自动进入下面的错题本，可以<strong>逐题删除</strong>或<strong>一键清空</strong>。键盘模块（D）没有测验，以<strong>快捷键练习器</strong>和<strong>打字测试</strong>代替考核，记得去 <a href="现代-快捷键练习器.html">练习器</a> 和 <a href="现代-打字速度测试.html">打字测试</a> 练练手。
