<style>
    .quiz-centers { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 14px; }
    .qc-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: block; text-decoration: none; transition: transform .15s ease, box-shadow .15s ease; }
    .qc-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0, 0, 0, .12); }
    .qc-card b { display: block; font-size: 15px; color: var(--txt); margin-bottom: 4px; }
    .qc-card .sub { font-size: 12.5px; color: var(--dim); }
    .qc-card .score { display: inline-block; margin-top: 8px; font-size: 12.5px; font-weight: 700; padding: 2px 10px; border-radius: 10px; background: rgba(102, 126, 234, .12); color: var(--blue); }
    .qc-card .score.best { background: rgba(38, 198, 138, .14); color: var(--green); }
    .qc-card .score.fail { background: rgba(229, 57, 53, .13); color: var(--red); }
    .errbook { margin-top: 22px; }
    .err-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .err-count { font-size: 13px; color: var(--dim); }
    .err-item { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-top: 12px; }
    .err-q { font-size: 14.5px; font-weight: 700; color: var(--txt); margin-bottom: 8px; }
    .err-q .q-tag { display: inline-block; font-size: 12px; font-weight: 700; color: var(--blue); background: rgba(102, 126, 234, .12); padding: 1px 8px; border-radius: 8px; margin-right: 8px; }
    .err-opts { margin: 0; padding: 0; list-style: none; }
    .err-opts li { font-size: 13.5px; padding: 5px 10px; border-radius: 8px; margin: 4px 0; background: var(--card-2); color: var(--txt); }
    .err-opts li.right { background: rgba(38, 198, 138, .14); color: var(--green); font-weight: 700; }
    .err-opts li.yours { background: rgba(229, 57, 53, .13); color: var(--red); text-decoration: line-through; }
    .err-exp { font-size: 13px; color: var(--dim); background: rgba(102, 126, 234, .08); border-left: 3px solid var(--blue); padding: 8px 12px; border-radius: 0 8px 8px 0; margin-top: 10px; }
    .err-ops { margin-top: 10px; display: flex; gap: 8px; }
    .btn-danger { background: rgba(229, 57, 53, .9); color: #fff; }
    .btn-danger:hover { background: rgba(229, 57, 53, 1); }
</style>

        <h1 class="lesson-title">📝 测验中心与错题本</h1>
        <p class="lesson-sub">十三个模块测验全在这里，做错的题自动进错题本</p>

        <div class="callout info">
            <b>怎么用？</b>
            每个模块学完后，到对应测验页考一次：<strong>60 分以上算通过</strong>，考得差随时可以重做（成绩只记最好的一次）。做错的题会自动进入下面的错题本，可以<strong>逐题删除</strong>或<strong>一键清空</strong>。键盘模块（D）没有测验，以<strong>快捷键练习器</strong>和<strong>打字测试</strong>代替考核，记得去 <a href="现代-快捷键练习器.html">练习器</a> 和 <a href="现代-打字速度测试.html">打字测试</a> 练练手。
        </div>

        <h2 style="margin-top:18px;">🧪 十三套模块测验</h2>
        <div class="quiz-centers" id="quizCenters"></div>

        <div class="errbook">
            <div class="err-head">
                <h2 style="margin:0;">📕 错题本</h2>
                <span class="err-count" id="errCount"></span>
            </div>
            <div style="margin-top:8px;" id="errList"></div>
            <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;" id="errActions"></div>
        </div>
