<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫雷 - 找乐子</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            min-height: 100vh;
            background: var(--bg);
            color: var(--txt);
            overflow-x: hidden;
            position: relative;
        }

        /* 背景流光层（已添加 aria-hidden） */
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; pointer-events: none; }
        .bg-flow-1 { position: absolute; top: -100%; left: -100%; width: 300%; height: 300%; background: var(--flow-grad); background-size: 400% 400%; animation: flowGradient 20s ease-in-out infinite; }
        .bg-flow-2 { position: absolute; top: -60%; left: -40%; width: 220%; height: 220%; background: radial-gradient(ellipse at 30% 70%, rgba(255,140,100,.35), transparent 50%), radial-gradient(ellipse at 65% 35%, rgba(120,180,255,.3), transparent 45%), radial-gradient(ellipse at 80% 80%, rgba(220,130,250,.25), transparent 40%); animation: flowDrift 20s ease-in-out infinite alternate; }
        .bg-flow-3 { position: absolute; top: -30%; left: -20%; width: 180%; height: 180%; background: radial-gradient(circle at 50% 50%, rgba(255,200,130,.15), transparent 60%), radial-gradient(circle at 20% 80%, rgba(80,220,200,.2), transparent 50%); animation: flowRotate 20s linear infinite; }
        
        @keyframes flowGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes flowDrift { 0% { transform: translate(0, 0) scale(1) rotate(0deg); } 50% { transform: translate(3%, -4%) scale(1.05) rotate(5deg); } 100% { transform: translate(-2%, 3%) scale(.97) rotate(-5deg); } }
        @keyframes flowRotate { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.08); } 100% { transform: rotate(360deg) scale(1); } }

        /* 悬浮球 */
        .orb { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 35%, color-mix(in srgb, var(--card-2) 60%, transparent), color-mix(in srgb, var(--card-2) 15%, transparent) 50%, transparent 70%); box-shadow: 0 0 60px color-mix(in srgb, var(--glow) 8%, transparent), inset 0 0 30px color-mix(in srgb, var(--card-2) 20%, transparent); pointer-events: none; }
        .orb-1 { width: 260px; height: 260px; top: 12%; left: 8%; animation: orbFloatA 18s ease-in-out infinite, orbSpin 40s linear infinite; }
        .orb-2 { width: 160px; height: 160px; top: 55%; left: 75%; animation: orbFloatB 22s ease-in-out infinite, orbSpin 55s linear infinite; }
        .orb-3 { width: 110px; height: 110px; top: 68%; left: 20%; animation: orbFloatA 16s ease-in-out infinite reverse, orbSpin 35s linear infinite; }
        .orb-4 { width: 220px; height: 220px; top: 28%; left: 60%; animation: orbFloatB 20s ease-in-out infinite reverse, orbSpin 50s linear infinite; }
        .orb-5 { width: 80px; height: 80px; top: 80%; left: 45%; animation: orbFloatA 14s ease-in-out infinite, orbSpin 30s linear infinite; }

        @keyframes orbFloatA { 0% { transform: translate(0,0) scale(1); opacity:.6; } 30% { transform: translate(18px,-22px) scale(1.04); opacity:.8; } 60% { transform: translate(-12px,10px) scale(.96); opacity:.5; } 100% { transform: translate(0,0) scale(1); opacity:.6; } }
        @keyframes orbFloatB { 0% { transform: translate(0,0) scale(1); opacity:.5; } 35% { transform: translate(-20px,12px) scale(1.06); opacity:.7; } 70% { transform: translate(14px,-15px) scale(.94); opacity:.4; } 100% { transform: translate(0,0) scale(1); opacity:.5; } }
        @keyframes orbSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 主容器 */
        main { position: relative; z-index: 10; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 60px 20px 40px; }
        .container { width: 80%; max-width: 1000px; background: var(--card); border-radius: 24px; box-shadow: 0 25px 70px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.3), inset 0 1px 0 rgba(255,255,255,.6); max-height: calc(100vh - 100px); overflow-y: auto; padding: 20px; color: var(--txt); }
        .container::-webkit-scrollbar { width: 10px; }
        .container::-webkit-scrollbar-track { background: rgba(0,0,0,.04); border-radius: 12px; }
        .container::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 12px; border: 2px solid rgba(255,255,255,.4); }

        /* 网格布局 */
        .grid { display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(8, minmax(80px, auto)); gap: 12px; }
        .title-area { grid-column: 1 / 5; grid-row: 1 / 3; display: flex; align-items: center; justify-content: center; background: var(--title-grad); background-size: 300% 300%; animation: titleGradient 6s ease infinite; border-radius: 20px; box-shadow: 0 12px 40px rgba(255,150,50,.35), inset 0 1px 0 rgba(255,255,255,.2); }
        .title-area h2 { font-size: 42px; font-weight: 900; letter-spacing: 4px; color: var(--btn-txt); text-shadow: 2px 2px 10px rgba(0,0,0,.3); }
        @keyframes titleGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .back-area { grid-column: 5 / 7; grid-row: 1 / 3; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--back-grad); border-radius: 20px; box-shadow: 0 12px 40px rgba(17,153,142,.4), inset 0 1px 0 rgba(255,255,255,.2); text-decoration: none; color: #fff; font-size: 22px; font-weight: 800; cursor: pointer; transition: transform .3s, box-shadow .3s; min-height: 80px; min-width: 44px; }
        .back-area:hover { transform: translateY(-5px); box-shadow: 0 18px 50px color-mix(in srgb, var(--green) 50%, transparent); }
        .back-area:active { transform: translateY(-2px) scale(.96); }

        /* 游戏区域 */
        .game-area { grid-column: 1 / 7; grid-row: 3 / 9; background: var(--card); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 15px; }
        .config-panel { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; background: color-mix(in srgb, var(--glow) 5%, var(--card-2)); padding: 10px 15px; border-radius: 30px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
        .config-panel label { font-size: 14px; font-weight: 600; color: var(--dim); }
        .config-panel input { width: 60px; padding: 5px; border: 2px solid var(--line); border-radius: 6px; font-size: 14px; text-align: center; outline: none; min-height: 44px; }
        .config-panel input:focus { border-color: var(--glow); }
        .config-panel button { padding: 8px 18px; border: none; border-radius: 20px; background: var(--btn-grad); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px color-mix(in srgb, var(--glow) 40%, transparent); transition: transform .2s, box-shadow .2s; min-height: 44px; min-width: 44px; }
        .config-panel button:hover { transform: translateY(-2px); box-shadow: 0 6px 16px color-mix(in srgb, var(--glow) 50%, transparent); }

        .game-status { font-size: 18px; font-weight: 600; color: var(--txt); text-align: center; min-height: 24px; min-width: 44px; }

        .minefield { display: grid; gap: 2px; background: #c0c0c0; border: 3px solid #808080; padding: 3px; border-radius: 4px; box-shadow: 0 6px 15px rgba(0,0,0,.2); max-width: 100%; overflow-x: auto; }
        .cell { width: 32px; height: 32px; background: #bdbdbd; border: 2px solid; border-color: #fff #808080 #808080 #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; cursor: pointer; transition: background .1s, transform .1s; user-select: none; outline: none; }
        .cell:hover { background: #d0d0d0; }
        .cell:focus-visible { box-shadow: 0 0 0 4px color-mix(in srgb, var(--glow) 40%, transparent); z-index: 1; }
        .cell.revealed { background: #d7d7d7; border: 1px solid #999; cursor: default; }
        .cell.revealed:hover { background: #d7d7d7; }
        .cell.mine-hit { background: #ff0000; }
        .cell.flagged::after { content: '🚩'; font-size: 18px; }
        .cell:active:not(.revealed) { transform: scale(.95); }

        /* 转场遮罩 */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999999; display: flex; align-items: center; justify-content: center; background: rgba(8,10,25,.72); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); opacity: 0; visibility: hidden; transition: opacity .4s ease, visibility .4s ease; pointer-events: none; }
        .overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }
        .loader-wrap { position: relative; width: 180px; height: 180px; display: flex; align-items: center; justify-content: center; }
        .loader-ring { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 3px solid rgba(255,255,255,.1); border-top-color: #f6d365; border-right-color: #fda085; animation: ringSpin .8s linear infinite; }
        .loader-ring::before { content: ''; position: absolute; top: 12px; left: 12px; right: 12px; bottom: 12px; border-radius: 50%; border: 2px solid transparent; border-bottom-color: #a78bfa; border-left-color: #667eea; animation: ringSpin 1.4s linear infinite reverse; }
        .loader-ring::after { content: ''; position: absolute; top: 28px; left: 28px; right: 28px; bottom: 28px; border-radius: 50%; border: 1px solid transparent; border-top-color: #fb7185; border-right-color: #2dd4bf; animation: ringSpin 2s linear infinite; }
        .loader-text { position: relative; z-index: 5; font-size: 24px; font-weight: 900; letter-spacing: 4px; background: linear-gradient(90deg, #f6d365, #fda085, #f6d365); background-size: 200% 100%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: textShine 1.5s linear infinite; }
        @keyframes ringSpin { to { transform: rotate(360deg); } }
        @keyframes textShine { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

        /* 响应式 */
        @media (max-width: 900px) {
            .container { width: 95%; padding: 12px; }
            .grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: auto; }
            .title-area { grid-column: 1/3; grid-row: auto; min-height: 100px; }
            .back-area { grid-column: 1/3; grid-row: auto; min-height: 80px; }
            .game-area { grid-column: 1/3; grid-row: auto; }
        }
        @media (max-width: 700px) {
            .config-panel { flex-direction: column; align-items: stretch; gap: 8px; padding: 12px; }
            .config-panel label { text-align: center; }
            .config-panel input { width: 100%; }
            .minefield { max-width: 100%; overflow-x: auto; }
            .cell { width: 28px; height: 28px; font-size: 14px; }
            .cell.flagged::after { font-size: 15px; }
        }
        @media (max-width: 480px) {
            .container { padding: 8px; }
            .title-area h2 { font-size: 24px; letter-spacing: 2px; }
            .back-area { font-size: 16px; }
            .game-area { padding: 10px; gap: 10px; }
            .cell { width: 24px; height: 24px; font-size: 12px; }
            .cell.flagged::after { font-size: 13px; }
        }
    
        /* ========== 手机端响应式适配（通用） ========== */
        @media (max-width: 768px) {
            html, body {
                overflow-x: hidden;
                width: 100%;
            }
            main {
                padding: 70px 0 30px !important;
            }
            .container, .card-container, .wrapper, .box, .panel, .form-box {
                width: 94% !important;
                max-width: 94vw !important;
                padding: 14px !important;
                margin: 0 auto !important;
            }
            /* 6列/多列网格改3列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 8px !important;
                padding: 4px !important;
            }
            /* 大区域占满整行 */
            .title-area, .back-area, .display-area, .game-main,
            .calculator-area, .main-area, .content-area, .result-area,
            .input-area, .output-area, .board-area, .info-area, .settings-area {
                grid-column: 1 / -1 !important;
                grid-row: auto !important;
            }
            /* 左右分栏改上下堆叠 */
            .left-panel, .right-panel, .side-panel, .sidebar {
                flex: 1 1 100% !important;
                width: 100% !important;
                border-right: none !important;
                border-bottom: 1px solid var(--line) !important;
            }
            .display-area, .game-main, .calculator-area {
                flex-direction: column !important;
                padding: 12px !important;
            }
            .cell, .tool-cell, .grid-cell {
                padding: 10px 6px !important;
                min-height: 70px !important;
            }
            h1, h2, h3, .title-text, .author-name, .main-title {
                font-size: 22px !important;
                letter-spacing: 1px !important;
            }
            .btn, button, input, select, textarea {
                font-size: 14px !important;
                padding: 10px 14px !important;
            }
            .ghost-btn, .back-btn, .return-btn {
                padding: 8px 16px !important;
                font-size: 13px !important;
            }
            /* 隐藏非必要装饰元素 */
            .orb, .decoration, .deco-element, .floating-shape {
                display: none !important;
            }
        }
        @media (max-width: 480px) {
            .container, .card-container, .wrapper, .box {
                width: 96% !important;
                padding: 10px !important;
            }
            /* 小屏手机改2列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 6px !important;
            }
            h1, h2, h3, .title-text, .author-name {
                font-size: 18px !important;
            }
            .cell, .tool-cell {
                min-height: 80px !important;
                padding: 8px 4px !important;
            }
            .btn, button {
                font-size: 13px !important;
                padding: 8px 12px !important;
            }
        }

        /* ========== 手机端针对性修复：扫雷棋盘格子恢复 ========== */
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr !important;
                grid-template-rows: auto !important;
            }
            .title-area, .back-area, .game-area, .game-main {
                grid-column: 1 / -1 !important;
                grid-row: auto !important;
            }
            /* 恢复扫雷格子固定尺寸，覆盖通用CSS破坏 */
            .cell {
                width: 28px !important;
                height: 28px !important;
                min-height: 0 !important;
                padding: 0 !important;
                font-size: 14px !important;
                line-height: 1 !important;
            }
            .cell.flagged::after {
                font-size: 15px !important;
            }
            /* 棋盘容器自适应，允许横向滚动 */
            .minefield {
                width: 100% !important;
                max-width: 340px !important;
                overflow-x: auto !important;
                overflow-y: hidden !important;
                margin: 0 auto !important;
            }
            .game-area {
                padding: 12px 8px !important;
            }
            .game-status {
                font-size: 14px !important;
                padding: 8px !important;
            }
        }
        @media (max-width: 480px) {
            .cell {
                width: 24px !important;
                height: 24px !important;
                font-size: 12px !important;
            }
            .cell.flagged::after {
                font-size: 13px !important;
            }
            .minefield {
                max-width: 280px !important;
            }
        }
</style>
