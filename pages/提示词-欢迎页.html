<style>
  /* 欢迎页 · 编辑风：一页纸面，一个名字，一根进度线 */
  :root { --bg:#f6f7fd; --txt:#23263a; --dim:#6b7086; --dim-2:#8a8fa3; --blue:#667eea; }

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    color:var(--txt);-webkit-font-smoothing:antialiased;
  }
  .wrap{position:relative;z-index:1;text-align:center;transform:translateY(-5vh);padding:0 20px}
  .glyph{
    font-size:34px;margin-bottom:24px;opacity:.7;
    animation:glyphIn .9s cubic-bezier(.2,1,.4,1) both;
  }
  @keyframes glyphIn{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:.7}}
  .title{
    font-size:30px;font-weight:300;letter-spacing:10px;text-indent:10px;
    animation:titleIn 1s .15s ease both;
  }
  @keyframes titleIn{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:none}}
  .sub{
    margin-top:16px;font-size:13px;letter-spacing:3px;color:var(--dim);opacity:0;
    animation:fadeIn .9s .5s ease both;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .bar-wrap{
    margin:40px auto 0;width:210px;height:2px;border-radius:2px;
    background:rgba(110,110,180,.15);overflow:hidden;
  }
  .bar{
    height:100%;width:100%;border-radius:2px;
    background:var(--blue);
    transform:scaleX(0);transform-origin:left;
    animation:load 1.65s .55s cubic-bezier(.65,0,.35,1) forwards;
  }
  @keyframes load{to{transform:scaleX(1)}}
  .hint{margin-top:20px;font-size:12px;color:var(--dim-2);letter-spacing:2px;opacity:0;animation:fadeIn .8s 1.05s ease both}
  .dot{display:inline-block;animation:blink 1.2s ease-in-out infinite}
  .dot:nth-child(2){animation-delay:.18s}.dot:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,60%,100%{opacity:.15}30%{opacity:1}}
  @media (max-width:480px){
    .title{font-size:24px;letter-spacing:7px}
    .glyph{font-size:28px}
    .sub{font-size:12px;letter-spacing:2px}
  }
</style>

<style data-no-obf>/* 全站打磨层 V3.0 */
/* ==================================================================
   全站通用打磨层（V3.0 · 综合提升）
   追加到 common.css / xd-common.css / cy-common.css 末尾，级联覆盖全站。
   设计原则：
   - 零破坏：:where() 包裹 = 零特异性，绝不覆盖页面既有样式；不设 margin/尺寸/定位。
   - 主题自适应：一律 var(--zl-*，fallback)，不引入新硬编码色。
   - 不变量：不改任何布局结构、跳转逻辑、找乐子主题。
   - 提升：可访问性（焦点/减少动效/色彩方案/触摸）、可读性（tabular-nums）、
           交互反馈（hover/active 过渡）、文本健壮性（长词换行）。
   ================================================================== */

/* 1. 原生控件随系统深浅色自适应（修复滚动条/输入框/下拉在深色下刺眼白块） */
:root { color-scheme: light dark; }

/* 2. 触摸设备消除双击缩放延迟（移动端点按更跟手） */
html { -webkit-tap-highlight-color: transparent; }
:where(a, button, [role="button"], input, select, textarea, summary, label:has(input), [tabindex]):not([disabled]) {
    touch-action: manipulation;
}

/* 3. 键盘焦点统一可见（:where 零特异性 + !important 压过页面 outline:none）
      仅键盘触发（focus-visible），鼠标点击不出现，不打扰普通点击用户 */
:where(a, button, [role="button"], input, select, textarea, summary, [tabindex], [contenteditable]):focus-visible {
    outline: 3px solid var(--zl-accent, var(--gold, #f6d365)) !important;
    outline-offset: 2px !important;
    border-radius: 6px;
}

/* 4. 交互反馈：hover/active 平滑过渡（仅列属性，不用 transition:all） */
:where(a, button, [role="button"], summary, [tabindex]):where(:not([disabled])) {
    transition: color .15s ease, background-color .15s ease, border-color .15s ease, box-shadow .15s ease, opacity .15s ease;
}

/* 5. 文本健壮性：长英文词/URL 在窄屏不再撑破容器 */
:where(p, li, dd, dt, td, th, figcaption, blockquote, h1, h2, h3, h4, h5, h6, a, span, div) {
    overflow-wrap: break-word;
}

/* 6. 数字对齐：统计/计数/表格数字用等宽数字，跳动更整齐 */
:where(td, .stat, .stat-num, .count, .num, [data-num]) {
    font-variant-numeric: tabular-nums;
}

/* 6b. 图片响应式：窄屏不撑破容器、保持比例不失真（未显式设尺寸的图更稳） */
:where(img, picture, video) {
    max-width: 100%;
    height: auto;
}

/* 7. 尊重系统"减少动态效果"（兜底层：common.css 已有，此处保证三家族全覆盖）
      用 :where 包裹，特异性为 0，页面更具体的动效规则仍可生效 */
@media (prefers-reduced-motion: reduce) {
    :where(*, *::before, *::after) {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important;
    }
}

/* 8. 打印友好：隐藏固定悬浮件，正文铺满（低成本加分项） */
@media print {
    :where([class*="fab"], [class*="float"], [class*="dock"], nav.zl-crumb, .zl-skip-link) {
        display: none !important;
    }
}
