    <main id="zl-main" class="cy-page">
        <div class="cy-card">
            <h2>⚖️ 加权决策矩阵</h2>
            <div class="sub">把你的纠结量化：列出方案与标准，给每项标准定权重（越大越重要），逐格打分，系统自动算加权总分与排名。</div>

            <h2 style="margin-top:6px;">📋 方案（待选项）</h2>
            <div class="opt-grid" id="optGrid"></div>
            <div class="cy-toolbar" style="margin-top:10px;">
                <button class="cy-btn cy-btn-sm" id="btnAddOpt">＋ 添加方案</button>
                <button class="cy-btn cy-btn-sm cy-btn-ghost" id="btnExample">🧪 载入示例</button>
                <button class="cy-btn cy-btn-sm cy-btn-ghost" id="btnClear">🧹 清空</button>
            </div>

            <h2 style="margin-top:18px;">📏 标准与权重</h2>
            <div id="criBox"></div>
            <div class="cy-toolbar" style="margin-top:10px;">
                <button class="cy-btn cy-btn-sm" id="btnAddCri">＋ 添加标准</button>
            </div>
        </div>

        <div class="cy-card">
            <h2>📊 打分矩阵</h2>
            <div class="sub">每格填 0-10 分。行 = 方案，列 = 标准。</div>
            <div id="matrixWrap"></div>
        </div>

        <div class="cy-card">
            <h2>🏆 决策结果</h2>
