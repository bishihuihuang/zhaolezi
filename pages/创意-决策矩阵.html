        .opt-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-top: 12px; }
        .opt-card { border: 1px solid var(--zl-border); border-radius: 12px; padding: 12px 14px; background: var(--zl-card-2); }
        .opt-card .hd { display: flex; align-items: center; gap: 8px; }
        .opt-card input { flex: 1; }
        .cri-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
        .cri-row .nm { flex: 1; min-width: 120px; }
        .score-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
        .score-table th, .score-table td { border: 1px solid var(--zl-border); padding: 8px 10px; text-align: center; }
        .score-table th { background: var(--zl-card-2); color: var(--zl-dim); font-weight: 600; font-size: 12px; }
        .score-table input { width: 64px; text-align: center; }
        .score-table .opt-name { text-align: left; font-weight: 700; color: var(--zl-text); white-space: nowrap; }
        .rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; font-size: 13px; font-weight: 700; margin-right: 8px; }
        .rank-1 { background: linear-gradient(135deg,#f6c945,#e8a020); color: #fff; }
        .rank-2 { background: linear-gradient(135deg,#a5b4c8,#7a8ba1); color: #fff; }
        .rank-3 { background: linear-gradient(135deg,#c9a36a,#a97b3e); color: #fff; }
        .rank-n { background: var(--zl-card-2); color: var(--zl-dim); }
        .bar-wrap { height: 8px; border-radius: 6px; background: var(--zl-card-2); overflow: hidden; margin-top: 6px; }
        .bar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--zl-accent), var(--zl-accent-2)); transition: width .3s; }
        .sensitivity-bar { display: flex; align-items: center; gap: 10px; font-size: 13px; margin-top: 6px; color: var(--zl-text); }
        .sensitivity-bar .score { min-width: 52px; text-align: right; font-weight: 700; }

    <main class="cy-page">
        <div class="cy-card">
            <h2>⚖️ 加权决策矩阵</h2>
            <div class="sub">把你的纠结量化：列出方案与标准，给每项标准定权重（越大越重要），逐格打分，系统自动算加权总分与排名。</div>

            <h2 style="margin-top:6px;">📋 方案（待选项）</h2>

                <button class="cy-btn cy-btn-sm" id="btnAddOpt">＋ 添加方案</button>

            <h2 style="margin-top:18px;">📏 标准与权重</h2>

            <div class="cy-toolbar" style="margin-top:10px;">
                <button class="cy-btn cy-btn-sm" id="btnAddCri">＋ 添加标准</button>

        <div class="cy-card">
            <h2>📊 打分矩阵</h2>
