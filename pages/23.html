<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线词典 - 找乐子</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            min-height: 100vh;
            background: var(--bg);
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }

        /* ========== 背景流光层（20秒无缝循环） ========== */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-flow-1 {
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: var(--flow-grad);
            background-size: 400% 400%;
            animation: flowGradient 20s ease-in-out infinite;
        }

        .bg-flow-2 {
            position: absolute;
            top: -60%;
            left: -40%;
            width: 220%;
            height: 220%;
            background: radial-gradient(ellipse at 30% 70%,
                    rgba(255, 140, 100, .35), transparent 50%),
                radial-gradient(ellipse at 65% 35%,
                    rgba(120, 180, 255, .3), transparent 45%),
                radial-gradient(ellipse at 80% 80%,
                    rgba(220, 130, 250, .25), transparent 40%);
            animation: flowDrift 20s ease-in-out infinite alternate;
        }

        .bg-flow-3 {
            position: absolute;
            top: -30%;
            left: -20%;
            width: 180%;
            height: 180%;
            background: radial-gradient(circle at 50% 50%,
                    rgba(255, 200, 130, .15), transparent 60%),
                radial-gradient(circle at 20% 80%,
                    rgba(80, 220, 200, .2), transparent 50%);
            animation: flowRotate 20s linear infinite;
        }

        @keyframes flowGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes flowDrift {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(3%, -4%) scale(1.05) rotate(5deg); }
            100% { transform: translate(-2%, 3%) scale(.97) rotate(-5deg); }
        }

        @keyframes flowRotate {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.08); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* 悬浮球 */
        .orb {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%,
                    rgba(255, 255, 255, .3),
                    rgba(255, 255, 255, .1) 50%,
                    transparent 70%);
            box-shadow: 0 0 60px rgba(255, 255, 255, .08),
                inset 0 0 30px rgba(255, 255, 255, .04);
            pointer-events: none;
            will-change: transform, opacity;
        }

        .orb-1 { width: 260px; height: 260px; top: 12%; left: 8%; animation: orbFloatA 18s ease-in-out infinite, orbSpin 40s linear infinite; }
        .orb-2 { width: 160px; height: 160px; top: 55%; left: 75%; animation: orbFloatB 22s ease-in-out infinite, orbSpin 55s linear infinite; }
        .orb-3 { width: 110px; height: 110px; top: 68%; left: 20%; animation: orbFloatA 16s ease-in-out infinite reverse, orbSpin 35s linear infinite; }
        .orb-4 { width: 220px; height: 220px; top: 28%; left: 60%; animation: orbFloatB 20s ease-in-out infinite reverse, orbSpin 50s linear infinite; }
        .orb-5 { width: 80px; height: 80px; top: 80%; left: 45%; animation: orbFloatA 14s ease-in-out infinite, orbSpin 30s linear infinite; }

        @keyframes orbFloatA {
            0% { transform: translate(0,0) scale(1); opacity:.6; }
            30% { transform: translate(18px,-22px) scale(1.04); opacity:.8; }
            60% { transform: translate(-12px,10px) scale(.96); opacity:.5; }
            100% { transform: translate(0,0) scale(1); opacity:.6; }
        }

        @keyframes orbFloatB {
            0% { transform: translate(0,0) scale(1); opacity:.5; }
            35% { transform: translate(-20px,12px) scale(1.06); opacity:.7; }
            70% { transform: translate(14px,-15px) scale(.94); opacity:.4; }
            100% { transform: translate(0,0) scale(1); opacity:.5; }
        }

        @keyframes orbSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ========== 主容器 ========== */
        main {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 60px 20px 40px;
        }

        .container {
            width: 80%;
            max-width: 1200px;
            background: rgba(245, 247, 255, .96);
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, .35),
                0 0 0 1px rgba(255, 255, 255, .3),
                inset 0 1px 0 rgba(255, 255, 255, .6);
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            padding: 20px;
            color: #333;
        }

        .container::-webkit-scrollbar { width: 10px; }
        .container::-webkit-scrollbar-track { background: rgba(0, 0, 0, .04); border-radius: 12px; }
        .container::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 12px; border: 2px solid rgba(255, 255, 255, .4); }

        /* ========== 网格布局 ========== */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(8, minmax(80px, auto));
            gap: 12px;
        }

        .title-area {
            grid-column: 1 / 5;
            grid-row: 1 / 3;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gold-grad);
            background-size: 300% 300%;
            animation: titleGradient 6s ease infinite;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(255, 150, 50, .35),
                inset 0 1px 0 rgba(255, 255, 255, .2);
        }

        .title-area h2 {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, .3);
        }

        @keyframes titleGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .back-area {
            grid-column: 5 / 7;
            grid-row: 1 / 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--back-grad);
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(17, 153, 142, .4),
                inset 0 1px 0 rgba(255, 255, 255, .2);
            text-decoration: none;
            color: #fff;
            font-size: 22px;
            font-weight: 800;
            cursor: pointer;
            transition: transform .3s, box-shadow .3s;
            min-height: 80px;
            min-width: 44px;
        }

        .back-area:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 50px rgba(17, 153, 142, .5);
        }

        .back-area:active {
            transform: translateY(-2px) scale(.96);
        }

        /* ========== 词典功能区（3-8行） ========== */
        .dictionary-area {
            grid-column: 1 / 7;
            grid-row: 3 / 9;
            background: rgba(255, 255, 255, .85);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .search-box {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            max-width: 500px;
            padding: 12px 20px;
            border: 2px solid #d0d0e0;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
            transition: border-color .3s, box-shadow .3s;
            background: #fafafe;
            min-height: 44px;
        }

        .search-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, .15);
        }

        .search-btn {
            padding: 12px 28px;
            border: none;
            border-radius: 30px;
            background: var(--btn-grad);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(102, 126, 234, .4);
            transition: transform .2s, box-shadow .2s;
            min-height: 44px;
            min-width: 44px;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, .5);
        }

        .search-btn:active {
            transform: scale(.95);
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 8px 18px;
            border: 2px solid #ddd;
            border-radius: 20px;
            background: #fff;
            color: #555;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
            min-height: 44px;
            min-width: 44px;
        }

        .tab-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: #fff;
        }

        .tab-btn:hover {
            border-color: #667eea;
        }

        .result-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
        }

        .result-card {
            background: #fff;
            border-radius: 12px;
            padding: 15px 20px;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .06);
            border-left: 4px solid #d4af37;
            transition: transform .2s, box-shadow .2s;
            outline: none;
        }

        .result-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, .1);
        }

        .result-card:focus-visible {
            box-shadow: 0 0 0 4px rgba(102, 126, 234, .4);
        }

        .result-card .word {
            font-size: 20px;
            font-weight: 800;
            color: #333;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .result-card .type-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            background: #e3f2fd;
            color: #1565c0;
        }

        .result-card .meaning {
            font-size: 15px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 4px;
        }

        .result-card .example {
            font-size: 14px;
            color: #999;
            font-style: italic;
        }

        .empty-state {
            text-align: center;
            color: #aaa;
            font-size: 16px;
            padding: 40px 0;
            font-style: italic;
        }

        /* ========== 转场遮罩 ========== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(8, 10, 25, .72);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            opacity: 0;
            visibility: hidden;
            transition: opacity .4s ease, visibility .4s ease;
            pointer-events: none;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .loader-wrap {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, .1);
            border-top-color: #f6d365;
            border-right-color: #fda085;
            animation: ringSpin .8s linear infinite;
        }

        .loader-ring::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-bottom-color: #a78bfa;
            border-left-color: #667eea;
            animation: ringSpin 1.4s linear infinite reverse;
        }

        .loader-ring::after {
            content: '';
            position: absolute;
            top: 28px;
            left: 28px;
            right: 28px;
            bottom: 28px;
            border-radius: 50%;
            border: 1px solid transparent;
            border-top-color: #fb7185;
            border-right-color: #2dd4bf;
            animation: ringSpin 2s linear infinite;
        }

        .loader-text {
            position: relative;
            z-index: 5;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
            background: var(--sunset-grad);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textShine 1.5s linear infinite;
        }

        @keyframes ringSpin { to { transform: rotate(360deg); } }
        @keyframes textShine {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* ========== 响应式 ========== */
        @media (max-width: 900px) {
            .container { width: 95%; padding: 12px; }
            .grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: auto; }
            .title-area { grid-column: 1/3; grid-row: auto; min-height: 100px; }
            .back-area { grid-column: 1/3; grid-row: auto; min-height: 80px; }
            .dictionary-area { grid-column: 1/3; grid-row: auto; }
        }
        @media (max-width: 600px) {
            .filter-tabs { gap: 6px; }
            .tab-btn { padding: 6px 12px; font-size: 12px; min-height: 44px; }
            .search-box { gap: 8px; }
            .search-input { padding: 10px 16px; font-size: 14px; min-height: 44px; }
            .search-btn { padding: 10px 20px; font-size: 14px; min-height: 44px; }
            .result-card { padding: 12px 14px; }
            .result-card .word { font-size: 16px; }
            .result-card .meaning { font-size: 13px; }
            .result-card .example { font-size: 12px; }
        }
        @media (max-width: 480px) {
            .container { padding: 8px; }
            .title-area h2 { font-size: 24px; letter-spacing: 2px; }
            .back-area { font-size: 16px; }
            .dictionary-area { padding: 12px; gap: 12px; }
            .search-box { flex-direction: column; }
            .search-input { width: 100%; max-width: none; }
            .search-btn { width: 100%; }
            .filter-tabs { flex-wrap: wrap; }
            .tab-btn { flex: 1 1 calc(50% - 4px); text-align: center; }
        }
    
        /* ========== 手机端响应式适配（通用） ========== */
        @media (max-width: 768px) {
            html, body {
                overflow-x: hidden;
                width: 100%;
            }
            main {
                padding: 70px 0 30px !important;
            }
            .container, .card-container, .wrapper, .box, .panel, .form-box {
                width: 94% !important;
                max-width: 94vw !important;
                padding: 14px !important;
                margin: 0 auto !important;
            }
            /* 6列/多列网格改3列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 8px !important;
                padding: 4px !important;
            }
            /* 大区域占满整行 */
            .title-area, .back-area, .display-area, .game-main,
            .calculator-area, .main-area, .content-area, .result-area,
            .input-area, .output-area, .board-area, .info-area, .settings-area {
                grid-column: 1 / -1 !important;
                grid-row: auto !important;
            }
            /* 左右分栏改上下堆叠 */
            .left-panel, .right-panel, .side-panel, .sidebar {
                flex: 1 1 100% !important;
                width: 100% !important;
                border-right: none !important;
                border-bottom: 1px solid rgba(0,0,0,.1) !important;
            }
            .display-area, .game-main, .calculator-area {
                flex-direction: column !important;
                padding: 12px !important;
            }
            .cell, .tool-cell, .grid-cell {
                padding: 10px 6px !important;
                min-height: 70px !important;
            }
            h1, h2, h3, .title-text, .author-name, .main-title {
                font-size: 22px !important;
                letter-spacing: 1px !important;
            }
            .btn, button, input, select, textarea {
                font-size: 14px !important;
                padding: 10px 14px !important;
            }
            .ghost-btn, .back-btn, .return-btn {
                padding: 8px 16px !important;
                font-size: 13px !important;
            }
            /* 隐藏非必要装饰元素 */
            .orb, .decoration, .deco-element, .floating-shape {
                display: none !important;
            }
        }
        @media (max-width: 480px) {
            .container, .card-container, .wrapper, .box {
                width: 96% !important;
                padding: 10px !important;
            }
            /* 小屏手机改2列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 6px !important;
            }
            h1, h2, h3, .title-text, .author-name {
                font-size: 18px !important;
            }
            .cell, .tool-cell {
                min-height: 80px !important;
                padding: 8px 4px !important;
            }
            .btn, button {
                font-size: 13px !important;
                padding: 8px 12px !important;
            }
        }


    /* ===== 词典增强 ===== */
    .tool-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .dict-stats { font-size: 13px; color: #888; line-height: 1.5; }
    .dict-stats b { color: #667eea; }
    .level-chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .chip { padding: 5px 12px; border: 1.5px solid #e0e0f0; border-radius: 16px; background: #fff; color: #667; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .18s; min-height: 36px; }
    .chip:hover { border-color: #667eea; color: #667eea; }
    .chip.active { background: var(--btn-grad); border-color: transparent; color: #fff; }
    .result-card .phonetic { font-size: 14px; color: #a06ad8; font-weight: 600; }
    .result-card .card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .card-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }
    .icon-btn { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid #e0e0f0; background: #fff; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all .18s; color: #999; }
    .icon-btn:hover { transform: scale(1.12); border-color: #667eea; }
    .icon-btn.speak { color: #1565c0; }
    .icon-btn.speak:hover { background: #e3f2fd; }
    .icon-btn.fav { color: #d4af37; }
    .icon-btn.fav.active { background: #ffefd0; border-color: #d4af37; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
    .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: #eef0ff; color: #5b6ad8; }
    .badge.freq { background: #fff3e6; color: #c97a15; }
    .result-card .meaning { white-space: pre-wrap; }
    .load-more-row { display: flex; justify-content: center; padding: 14px 0 4px; }
    .load-more-btn { padding: 10px 30px; border: 2px dashed #c9d2ff; border-radius: 24px; background: #fafafe; color: #667eea; font-size: 14px; font-weight: 700; cursor: pointer; transition: all .2s; }
    .load-more-btn:hover { background: #eef2ff; transform: translateY(-1px); }
    .history-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .history-bar .label { font-size: 13px; color: #999; }
    .hist-chip { padding: 4px 12px; border-radius: 14px; background: #f0f2ff; color: #4b57b8; font-size: 12px; cursor: pointer; border: none; transition: all .18s; }
    .hist-chip:hover { background: #dfe4ff; }
    .backup-btn { padding: 4px 12px; border-radius: 14px; background: #e8eef9; color: #4b57b8; font-size: 12px; font-weight: 700; cursor: pointer; border: 1px solid #c9d2ff; transition: all .18s; white-space: nowrap; }
    .backup-btn:hover { background: #dfe4ff; transform: translateY(-1px); }
    .home-intro { text-align: center; color: #888; font-size: 15px; padding: 8px 0 2px; }
    .home-intro b { color: #667eea; font-size: 18px; }
    .hot-title { font-size: 15px; font-weight: 800; color: #555; margin: 12px 0 8px; }
    .spin { display: inline-block; width: 18px; height: 18px; border: 2.5px solid #e0e0f0; border-top-color: #667eea; border-radius: 50%; animation: ringSpin .7s linear infinite; vertical-align: -3px; margin-right: 8px; }
    .loading-text { text-align: center; color: #aaa; padding: 20px 0; font-size: 14px; }
    .empty-state a { color: #667eea; cursor: pointer; text-decoration: underline; }
    .random-card-big { background: var(--btn-grad); color: #fff; border-radius: 14px; padding: 18px 22px; margin-bottom: 14px; box-shadow: 0 10px 28px rgba(102,126,234,.35); }
    .random-card-big .rw { font-size: 26px; font-weight: 900; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .random-card-big .rp { font-size: 14px; opacity: .9; margin: 2px 0 8px; }
    .random-card-big .rt { font-size: 15px; line-height: 1.7; white-space: pre-wrap; }
    .random-card-big .speak-btn { width: 34px; height: 34px; border-radius: 50%; border: none; background: rgba(255,255,255,.25); color: #fff; font-size: 16px; cursor: pointer; }
    .random-card-big .speak-btn:hover { background: rgba(255,255,255,.4); }
    .random-card-big .fav-btn { width: 34px; height: 34px; border-radius: 50%; border: none; background: rgba(255,255,255,.25); color: #fff; font-size: 16px; cursor: pointer; }
    .random-card-big .fav-btn.active { background: #ffd34d; color: #7a5c00; }
    .prog-wrap { display: flex; align-items: center; gap: 10px; justify-content: center; padding: 6px 0 2px; }
    .prog-bar { flex: 1; max-width: 260px; height: 8px; background: #ececf5; border-radius: 6px; overflow: hidden; }
    .prog-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #667eea, #764ba2); transition: width .2s; }
    .prog-note { text-align: center; color: rgba(102,102,140,.85); font-size: 13px; margin: 4px 0 14px; }
