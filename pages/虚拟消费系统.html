<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找乐子——虚拟消费系统</title>
<style>
/* ===== 基础重置与样式 ===== */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif; background: var(--bg); color:var(--txt); overflow-x:hidden; }

/* 背景流光（与index一致） */
.bg-animation { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; overflow:hidden; }
.bg-flow-1 { position:absolute; top:-150%; left:-100%; width:350%; height:350%; background: var(--flow-grad); /* 六主题适配：flowGrad 背景位移动画移除（触性能铁律），保留主题流光渐变静态铺陈 */ }
.bg-flow-2 { position:absolute; top:-80%; left:-60%; width:260%; height:260%; background:radial-gradient(ellipse at 30% 70%,rgba(255,140,100,.4),transparent 60%),radial-gradient(ellipse at 70% 30%,rgba(90,180,255,.35),transparent 50%); animation:flowDrift 20s ease-in-out infinite alternate; }
.bg-flow-3 { position:absolute; top:-40%; left:-20%; width:200%; height:200%; background:radial-gradient(circle at 60% 40%,rgba(220,140,255,.25),transparent 55%); animation:flowSpin 20s linear infinite; }
/* flowGrad 关键帧已移除（background-position 全屏重绘，性能铁律禁用） */
@keyframes flowDrift {0%{transform:translate(0,0) scale(1) rotate(0deg);}50%{transform:translate(5%,-3%) scale(1.08) rotate(6deg);}100%{transform:translate(-2%,4%) scale(.94) rotate(-6deg);}}
@keyframes flowSpin {0%{transform:rotate(0deg) scale(1);}50%{transform:rotate(180deg) scale(1.06);}100%{transform:rotate(360deg) scale(1);}}
.orb { position:absolute; border-radius:50%; background:radial-gradient(circle at 35% 35%,color-mix(in srgb,var(--card-2) 60%,transparent),color-mix(in srgb,var(--card-2) 18%,transparent) 45%,transparent 75%); box-shadow:0 0 60px color-mix(in srgb,var(--glow) 10%,transparent),inset 0 0 30px color-mix(in srgb,var(--card-2) 25%,transparent); pointer-events:none; will-change:transform,opacity; }
.orb-1{width:260px;height:260px;top:10%;left:5%;animation:orbFloat1 18s ease-in-out infinite,orbRotate 40s linear infinite;}
.orb-2{width:160px;height:160px;top:55%;left:78%;animation:orbFloat2 22s ease-in-out infinite,orbRotate 55s linear infinite;}
.orb-3{width:110px;height:110px;top:70%;left:18%;animation:orbFloat1 16s ease-in-out infinite reverse,orbRotate 35s linear infinite;}
.orb-4{width:200px;height:200px;top:28%;left:62%;animation:orbFloat2 20s ease-in-out infinite,orbRotate 45s linear infinite;}
.orb-5{width:80px;height:80px;top:82%;left:45%;animation:orbFloat1 14s ease-in-out infinite,orbRotate 30s linear infinite;}
@keyframes orbFloat1{0%,100%{transform:translate(0,0);opacity:.5;}30%{transform:translate(20px,-25px);opacity:.8;}60%{transform:translate(-12px,15px);opacity:.4;}}
@keyframes orbFloat2{0%,100%{transform:translate(0,0);opacity:.6;}50%{transform:translate(-18px,14px);opacity:.3;}}
@keyframes orbRotate{to{transform:rotate(360deg);}}

/* 头部栏 */
header { position:fixed; top:0; left:0; width:100%; z-index:1000; display:flex; justify-content:space-between; align-items:center; padding:15px 30px; background:var(--card); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
header h1 { font-size:24px; background:var(--title-grad); -webkit-background-clip:text; background-clip:text; color:transparent; letter-spacing:3px; }
.header-user { display:flex; gap:15px; align-items:center; font-size:14px; }
.header-user #points { color:var(--gold-2-ink,#c2185b); font-weight:bold; }

/* 主容器 */
main { position:relative; z-index:10; padding-top:80px; display:flex; justify-content:center; align-items:flex-start; min-height:100vh; }
.container { width:90%; max-width:1400px; background: var(--card); border-radius:24px; box-shadow:0 25px 70px rgba(0,0,0,.4); overflow:hidden; margin-top:20px; }

/* 标题区域 */
.title-area { display:flex; justify-content:space-between; align-items:center; padding:20px 30px; background:var(--btn-grad); }
.title-area h2 { font-size:36px; font-weight:900; background:linear-gradient(90deg,var(--btn-txt),color-mix(in srgb,var(--btn-txt) 55%,transparent),var(--btn-txt)); -webkit-background-clip:text; background-clip:text; color:transparent; letter-spacing:3px; }
.title-actions { display:flex; gap:12px; align-items:center; }
.title-actions a.btn-main { padding:10px 24px; background:color-mix(in srgb, var(--btn-txt) 22%, transparent); color:var(--btn-txt); text-decoration:none; border-radius:50px; font-weight:bold; transition:.3s; box-shadow:0 4px 15px rgba(0,0,0,.2); }
.title-actions a.btn-main:hover { transform:translateY(-3px); box-shadow:0 8px 20px rgba(0,0,0,.3); }

/* 工具栏 */
.toolbar { display:flex; justify-content:space-between; align-items:center; padding:15px 20px; background:var(--card-2); border-bottom:1px solid var(--line); flex-wrap:wrap; gap:10px; }
.toolbar-left { display:flex; gap:10px; }
.refresh-btn, .coupon-btn {
  border:none; border-radius:20px; padding:8px 18px; cursor:pointer; font-size:14px; font-weight:bold;
}
.refresh-btn { background:var(--glow); color:var(--btn-txt); }
.coupon-btn { background:var(--gold-2); color:var(--btn-txt); }
.category-filters { display:flex; gap:8px; flex-wrap:wrap; }
.category-filters .cat-btn { border:none; background:color-mix(in srgb, var(--dim) 14%, transparent); color:var(--txt); border-radius:20px; padding:8px 15px; cursor:pointer; font-size:13px; transition:.2s; }
.category-filters .cat-btn.active { background:var(--glow); color:var(--btn-txt); }

/* 商品网格 */
.shop-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:15px; padding:20px; max-height:calc(100vh - 250px); overflow-y:auto; }
.product-card { background: var(--card-2); color: var(--txt); border-radius:14px; padding:12px; box-shadow:0 6px 20px rgba(0,0,0,.08); display:flex; flex-direction:column; transition:.3s; border:1px solid var(--line); position:relative; }
.product-card:hover { transform:translateY(-5px); box-shadow:0 12px 25px rgba(0,0,0,.15); }
.product-card .prod-icon { font-size:40px; text-align:center; margin-bottom:8px; }
.product-card .prod-name { font-weight:700; font-size:15px; min-height:42px; cursor:pointer; }
.product-card .prod-desc { font-size:12px; color:var(--dim); margin-bottom:6px; min-height:34px; }
.product-card .prod-price { color:var(--gold-2-ink,#c2185b); font-weight:800; font-size:18px; margin-bottom:10px; }
.product-card .add-to-cart { background:var(--gold-2); color:var(--btn-txt); border:none; border-radius:30px; padding:8px; cursor:pointer; font-weight:bold; transition:.2s; min-height:44px; }
.product-card .add-to-cart:hover { filter:brightness(.92); }
.product-card .add-to-cart.added { background:var(--green); color:var(--btn-txt); }
.product-card .fav-btn { position:absolute; top:8px; right:8px; background:transparent; border:none; font-size:20px; cursor:pointer; opacity:.5; transition:.2s; min-width:44px; min-height:44px; }
.product-card .fav-btn.fav { opacity:1; color:var(--red); }

/* 购物车 */
.cart-wrapper { position:fixed; top:90px; right:20px; z-index:999; }
.cart-icon { width:50px; height:50px; background:var(--btn-grad); border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 15px rgba(0,0,0,.4); cursor:pointer; font-size:24px; transition:transform .2s; }
.cart-icon:hover { transform:scale(1.1); }
.cart-panel { position:absolute; right:0; top:60px; width:340px; max-height:75vh; background:var(--card); border-radius:20px; padding:15px; box-shadow:0 10px 30px rgba(0,0,0,.5); opacity:0; visibility:hidden; transform:translateX(20px); transition:opacity .3s,transform .3s,visibility .3s; }
.cart-wrapper:hover .cart-panel, .cart-wrapper:focus-within .cart-panel { opacity:1; visibility:visible; transform:translateX(0); }
.cart-panel h3 { color:var(--gold-2); font-size:20px; margin-bottom:10px; border-bottom:1px solid var(--line); padding-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
.cart-panel h3 .clear-cart { background:none; border:none; color:var(--red); cursor:pointer; font-size:13px; min-height:44px; }
.cart-list { flex:1; overflow-y:auto; max-height:400px; }
.cart-item { display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; gap:5px; }
.cart-item .ci-info { flex:1; display:flex; flex-direction:column; }
.cart-item .ci-name { color:var(--txt); }
.cart-item .ci-price { color:var(--gold-2); font-size:13px; }
.cart-item .ci-qty { display:flex; align-items:center; gap:5px; }
/* 【修复】调整数量按钮和删除按钮尺寸 */
.ci-qty button {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    border: none;
    background: color-mix(in srgb, var(--dim) 30%, transparent);
    color: var(--txt);
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.ci-qty span { min-width:20px; text-align:center; }
.cart-item .ci-remove {
    width: 44px;
    height: 44px;
    background:var(--red);
    border:none;
    color:var(--btn-txt);
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
}
.cart-total { display:flex; justify-content:space-between; font-size:18px; font-weight:bold; margin:12px 0; color:var(--txt); }
.coupon-section { display:flex; gap:8px; margin-bottom:10px; }
.coupon-section button { background:var(--glow); color:var(--btn-txt); border:none; border-radius:8px; padding:8px 12px; cursor:pointer; font-weight:bold; min-height:44px; }
.checkout-btn { width:100%; padding:12px; background:var(--btn-grad); border:none; border-radius:50px; color:var(--btn-txt); font-weight:900; font-size:17px; cursor:pointer; transition:.3s; margin-bottom:8px; min-height:44px; }
.checkout-btn:hover { transform:translateY(-3px); box-shadow:0 8px 20px color-mix(in srgb, var(--glow) 55%, transparent); }
.checkout-btn:disabled { opacity:.5; cursor:not-allowed; }
.jump-to-shop { width:100%; padding:8px; background:color-mix(in srgb, var(--dim) 30%, transparent); border:none; border-radius:20px; color:var(--gold-2); font-size:14px; font-weight:bold; cursor:pointer; transition:.2s; min-height:44px; }
.jump-to-shop:hover { background:color-mix(in srgb, var(--dim) 45%, transparent); }

/* 支付模态 */
.overlay-modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.7); z-index:99999; display:none; align-items:center; justify-content:center; }
.overlay-modal.show { display:flex; }
.modal-box { background: var(--card-2); color: var(--txt); border-radius:25px; padding:30px; width:400px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.4); }
.modal-box h2 { margin-bottom:20px; color:var(--gold-2); }
.modal-box .pay-methods { display:flex; gap:10px; justify-content:center; margin-bottom:20px; }
.pay-method { padding:10px 20px; border-radius:20px; border:2px solid var(--line); cursor:pointer; font-weight:bold; transition:.2s; min-height:44px; display:flex; align-items:center; justify-content:center; }
.pay-method:hover { border-color:var(--gold-2); }
.pay-method.active { background:var(--gold-2); color:var(--btn-txt); border-color:var(--gold-2); }
.modal-box .modal-actions { display:flex; gap:10px; justify-content:center; }
.btn-confirm { background:var(--green); color:var(--btn-txt); border:none; padding:10px 30px; border-radius:50px; cursor:pointer; font-size:16px; font-weight:bold; min-height:44px; }
.btn-cancel { background:color-mix(in srgb, var(--dim) 20%, transparent); color:var(--txt); border:none; padding:10px 30px; border-radius:50px; cursor:pointer; font-size:16px; font-weight:bold; min-height:44px; }

/* 支付成功 */
.success-modal { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--card); color:var(--txt); padding:40px 60px; border-radius:30px; box-shadow:0 0 100px color-mix(in srgb, var(--green) 50%, transparent); z-index:99998; display:none; text-align:center; }
.success-modal.show { display:block; }
.success-modal .icon { font-size:80px; }
.success-modal h3 { margin:20px 0 10px; }
.success-modal button { margin-top:20px; background:var(--green); border:none; color:var(--btn-txt); padding:10px 40px; border-radius:50px; cursor:pointer; font-size:18px; font-weight:bold; min-height:44px; }

/* 商品详情弹窗 */
.detail-modal { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background: var(--card-2); color: var(--txt); border-radius:25px; padding:30px; width:500px; box-shadow:0 30px 80px rgba(0,0,0,.5); z-index:99997; display:none; }
.detail-modal.show { display:block; }
.detail-modal .close-detail { position:absolute; top:15px; right:15px; border:none; background:color-mix(in srgb, var(--dim) 12%, transparent); color:var(--txt); width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:16px; font-weight:bold; min-width:44px; min-height:44px; }
.detail-modal .detail-icon { font-size:80px; text-align:center; margin-bottom:15px; }
.detail-modal h3 { text-align:center; margin-bottom:15px; }
.detail-modal p { margin-bottom:15px; }
.detail-modal .price { font-size:24px; color:var(--gold-2); font-weight:bold; }
.detail-modal button.add-from-detail { display:block; width:100%; padding:12px; background:var(--gold-2); border:none; color:var(--btn-txt); border-radius:30px; cursor:pointer; font-size:16px; font-weight:bold; margin-top:15px; min-height:44px; }

/* 分页控件 */
.pagination { grid-column:1/-1; display:flex; gap:10px; justify-content:center; margin:20px 0; }
.page-btn { border:2px solid color-mix(in srgb, var(--glow) 55%, transparent); background: var(--card-2); color: var(--txt); border-radius:20px; padding:8px 18px; cursor:pointer; font-size:14px; font-weight:bold; transition:all .2s; box-shadow:0 2px 6px rgba(0,0,0,.1); min-height:44px; }
.page-btn:hover:not(:disabled) { background:var(--glow); color:var(--btn-txt); transform:translateY(-2px); }
.page-btn:disabled { opacity:.5; cursor:not-allowed; }
.page-info { display:flex; align-items:center; font-size:14px; color:var(--dim); padding:0 10px; }

/* 滚动条 */
.shop-grid::-webkit-scrollbar { width:8px; }
.shop-grid::-webkit-scrollbar-track { background:color-mix(in srgb, var(--dim) 10%, transparent); }
.shop-grid::-webkit-scrollbar-thumb { background:var(--scroll-thumb); border-radius:10px; }
.cart-list::-webkit-scrollbar { width:6px; }
.cart-list::-webkit-scrollbar-thumb { background:var(--dim); }

/* 响应式 */
@media (max-width:1200px){ .shop-grid{grid-template-columns:repeat(4,1fr);} .cart-panel{width:300px;} }
@media (max-width:900px){ .shop-grid{grid-template-columns:repeat(3,1fr);} .cart-panel{width:260px;} header{padding:10px 15px;} .toolbar{flex-direction:column;} }
@media (max-width:600px){ .shop-grid{grid-template-columns:repeat(2,1fr);} .cart-panel{width:230px;} .title-area h2{font-size:26px;} .container{width:95%;} }

/* ========== 新转场动画（高级图转，文字不动） ========== */
#transitionOverlay {
    position:fixed; top:0; left:0; width:100%; height:100%; z-index:999999;
    background:rgba(0,0,0,0); display:flex; align-items:center; justify-content:center;
    opacity:0; visibility:hidden; transition:opacity .4s, visibility .4s;
}
#transitionOverlay.active { opacity:1; visibility:visible; background:rgba(8,10,25,.85); }
#transitionOverlay::before {
    content:''; position:absolute; top:50%; left:50%; width:600px; height:600px; margin:-300px 0 0 -300px;
    background:radial-gradient(circle,rgba(246,211,101,.3),transparent 60%);
    animation:centerPulse 1s ease-in-out infinite;
}
@keyframes centerPulse { 0%,100%{transform:scale(.8);opacity:.8;} 50%{transform:scale(1.2);opacity:.5;} }
.trans-geo {
    position:absolute; top:50%; left:50%; width:0; height:0;
    transform-style:preserve-3d;
    animation:geoRotate 2s linear infinite;
}
.trans-geo .cube {
    position:absolute; width:80px; height:80px; margin:-40px 0 0 -40px;
    background:linear-gradient(135deg,#f6d365,#fda085); border:2px solid #fff;
    transform:rotateX(45deg) rotateY(45deg);
    animation:cubeSpin 3s linear infinite;
}
@keyframes cubeSpin { 0%{transform:rotateX(0) rotateY(0);} 100%{transform:rotateX(360deg) rotateY(360deg);} }
.trans-particles { position:absolute; inset:0; overflow:hidden; }
.trans-particle {
    position:absolute; width:6px; height:6px; border-radius:50%;
    background:linear-gradient(90deg,#f6d365,#fda085);
    animation:flyToCenter 1.2s ease-in-out infinite;
}
@keyframes flyToCenter {
    0% { transform:translate(var(--start-x),var(--start-y)) scale(1); opacity:1; }
    100% { transform:translate(0,0) scale(0); opacity:0; }
}
.trans-text {
    position:relative; z-index:5; font-size:36px; font-weight:900; letter-spacing:6px;
    background:linear-gradient(90deg,#f6d365,#fff,#a78bfa,#f6d365);
    background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:textShine 1.5s linear infinite;
    text-align:center; line-height:1.3;
    padding:20px 40px; border-radius:20px;
    background-color:rgba(0,0,0,.5);
}
@keyframes textShine { 0%{background-position:0% 50%;} 100%{background-position:200% 50%;} }

/* 优惠券弹窗 */
.coupon-modal {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background: var(--card-2); color: var(--txt); border-radius:20px; padding:25px; width:400px;
    box-shadow:0 20px 50px rgba(0,0,0,.4); z-index:99999; display:none; 
}
.coupon-modal.show { display:block; }
.coupon-modal h3 { text-align:center; margin-bottom:15px; }
.coupon-list { max-height:300px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
.coupon-item {
    border:2px solid var(--line); border-radius:10px; padding:10px; cursor:pointer; transition:.2s;
}
.coupon-item:hover { border-color:var(--gold-2); background:color-mix(in srgb, var(--gold-2) 10%, transparent); }
.coupon-close {
    display:block; width:100%; margin-top:15px; padding:8px; background:color-mix(in srgb, var(--dim) 20%, transparent); color:var(--txt); border:none; border-radius:20px; cursor:pointer; font-weight:bold; min-height:44px;
}

        /* ========== 手机端响应式适配（通用） ========== */
        @media (max-width: 768px) {
            html, body {
                overflow-x: hidden;
                width: 100%;
            }
            main {
                padding: 70px 0 30px !important;
            }
            .container, .card-container, .wrapper, .box, .panel, .form-box {
                width: 94% !important;
                max-width: 94vw !important;
                padding: 14px !important;
                margin: 0 auto !important;
            }
            /* 6列/多列网格改3列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 8px !important;
                padding: 4px !important;
            }
            /* 大区域占满整行 */
            .title-area, .back-area, .display-area, .game-main,
            .calculator-area, .main-area, .content-area, .result-area,
            .input-area, .output-area, .board-area, .info-area, .settings-area {
                grid-column: 1 / -1 !important;
                grid-row: auto !important;
            }
            /* 左右分栏改上下堆叠 */
            .left-panel, .right-panel, .side-panel, .sidebar {
                flex: 1 1 100% !important;
                width: 100% !important;
                border-right: none !important;
                border-bottom: 1px solid var(--line) !important;
            }
            .display-area, .game-main, .calculator-area {
                flex-direction: column !important;
                padding: 12px !important;
            }
            .cell, .tool-cell, .grid-cell {
                padding: 10px 6px !important;
                min-height: 70px !important;
            }
            h1, h2, h3, .title-text, .author-name, .main-title {
                font-size: 22px !important;
                letter-spacing: 1px !important;
            }
            .btn, button, input, select, textarea {
                font-size: 14px !important;
                padding: 10px 14px !important;
            }
            .ghost-btn, .back-btn, .return-btn {
                padding: 8px 16px !important;
                font-size: 13px !important;
            }
            /* 隐藏非必要装饰元素 */
            .orb, .decoration, .deco-element, .floating-shape {
                display: none !important;
            }
        }
        @media (max-width: 480px) {
            .container, .card-container, .wrapper, .box {
                width: 96% !important;
                padding: 10px !important;
            }
            /* 小屏手机改2列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 6px !important;
            }
            h1, h2, h3, .title-text, .author-name {
                font-size: 18px !important;
            }
            .cell, .tool-cell {
                min-height: 80px !important;
                padding: 8px 4px !important;
            }
            .btn, button {
                font-size: 13px !important;
                padding: 8px 12px !important;
            }
        }
</style>

<style data-no-obf>/* 全站打磨层 V3.0 */
/* ==================================================================
   全站通用打磨层（V3.0 · 综合提升）
   追加到 common.css / xd-common.css / cy-common.css 末尾，级联覆盖全站。
   设计原则：
   - 零破坏：:where() 包裹 = 零特异性，绝不覆盖页面既有样式；不设 margin/尺寸/定位。
   - 主题自适应：一律 var(--zl-*，fallback)，不引入新硬编码色。
   - 不变量：不改任何布局结构、跳转逻辑、找乐子主题。
   - 提升：可访问性（焦点/减少动效/色彩方案/触摸）、可读性（tabular-nums）、
           交互反馈（hover/active 过渡）、文本健壮性（长词换行）。
   ================================================================== */

/* 1. 原生控件随系统深浅色自适应（修复滚动条/输入框/下拉在深色下刺眼白块） */
:root { color-scheme: light dark; }

/* 2. 触摸设备消除双击缩放延迟（移动端点按更跟手） */
html { -webkit-tap-highlight-color: transparent; }
:where(a, button, [role="button"], input, select, textarea, summary, label:has(input), [tabindex]):not([disabled]) {
    touch-action: manipulation;
}

/* 3. 键盘焦点统一可见（:where 零特异性 + !important 压过页面 outline:none）
      仅键盘触发（focus-visible），鼠标点击不出现，不打扰普通点击用户 */
:where(a, button, [role="button"], input, select, textarea, summary, [tabindex], [contenteditable]):focus-visible {
    outline: 3px solid var(--zl-accent, var(--gold, #f6d365)) !important;
    outline-offset: 2px !important;
    border-radius: 6px;
}

/* 4. 交互反馈：hover/active 平滑过渡（仅列属性，不用 transition:all） */
:where(a, button, [role="button"], summary, [tabindex]):where(:not([disabled])) {
    transition: color .15s ease, background-color .15s ease, border-color .15s ease, box-shadow .15s ease, opacity .15s ease;
}

/* 5. 文本健壮性：长英文词/URL 在窄屏不再撑破容器 */
:where(p, li, dd, dt, td, th, figcaption, blockquote, h1, h2, h3, h4, h5, h6, a, span, div) {
    overflow-wrap: break-word;
}

/* 6. 数字对齐：统计/计数/表格数字用等宽数字，跳动更整齐 */
:where(td, .stat, .stat-num, .count, .num, [data-num]) {
    font-variant-numeric: tabular-nums;
}

/* 6b. 图片响应式：窄屏不撑破容器、保持比例不失真（未显式设尺寸的图更稳） */
:where(img, picture, video) {
    max-width: 100%;
    height: auto;
}

/* 7. 尊重系统"减少动态效果"（兜底层：common.css 已有，此处保证三家族全覆盖）
      用 :where 包裹，特异性为 0，页面更具体的动效规则仍可生效 */
@media (prefers-reduced-motion: reduce) {
    :where(*, *::before, *::after) {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important;
    }
}

/* 8. 打印友好：隐藏固定悬浮件，正文铺满（低成本加分项） */
@media print {
    :where([class*="fab"], [class*="float"], [class*="dock"], nav.zl-crumb, .zl-skip-link) {
        display: none !important;
    }
}
