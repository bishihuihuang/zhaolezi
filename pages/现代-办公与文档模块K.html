        <p class="lesson-sub">Word、Excel、PPT、WPS 与电子邮件：把生活中的文字、账目和材料都做成文档</p>

        <div class="callout info">
            <b>这个模块学什么？</b>
            写通知、记账、做相册、发材料——这些都能在电脑上完成。本模块依次教你三件办公法宝：Word（写文章）、Excel（做表格算账）、PPT（做幻灯片）；再用免费的 WPS 把它们搬到手机上、学会打印；最后掌握电子邮件，给单位和亲友发正式材料。
