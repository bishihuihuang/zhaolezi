        [data-theme="light"] .wrap { background: var(--card); border-color: var(--line); }
        .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .5; z-index: 1; pointer-events: none; }
        .orb.a { width: 340px; height: 340px; background: var(--brand-1); top: -120px; left: -100px; }
        .orb.b { width: 300px; height: 300px; background: var(--brand-2); bottom: -110px; right: -80px; }
        .orb.c { width: 240px; height: 240px; background: var(--brand-3); bottom: 10%; left: 30%; opacity: .28; }
        .emoji { font-size: 68px; line-height: 1; margin-bottom: 18px; }
        .code {
            font-size: 84px; font-weight: 800; letter-spacing: -3px; margin: 0 0 6px;
            background: linear-gradient(120deg, var(--brand-1), var(--brand-2) 55%, var(--brand-3));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        h1 { font-size: 21px; font-weight: 700; margin: 0 0 12px; }
        p { font-size: 14.5px; line-height: 1.9; margin: 0 0 26px; opacity: .82; }
        a.go {
            display: inline-block; padding: 13px 30px; border-radius: 999px; text-decoration: none;
            font-size: 15px; font-weight: 700; color: var(--on-brand);
            background: linear-gradient(120deg, var(--brand-1), var(--brand-2));
            box-shadow: 0 10px 30px rgba(99,102,241,.45);
            transition: transform .18s ease, box-shadow .18s ease;
        }
        a.go:hover { transform: translateY(-2px); box-shadow: 0 16px 40px rgba(99,102,241,.55); }
        .tip { margin-top: 20px; font-size: 12px; opacity: .5; }
        .tip b { color: var(--brand-3); opacity: 1; }
        .foot {
            position: fixed; bottom: 22px; left: 0; right: 0; text-align: center;
            font-size: 12px; opacity: .42; letter-spacing: .5px;
        }
        @media (max-width: 520px) {
            .wrap { padding: 44px 26px; margin: 0 16px; }
            .code { font-size: 68px; }
        }
