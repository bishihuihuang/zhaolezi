<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>找乐子——强密码生成器</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            background: var(--bg);
            color: var(--txt);
            overflow-x: hidden;
        }
        /* 背景流光（与index完全一致） */
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; pointer-events: none; }
        .bg-flow-1 { position: absolute; top: -150%; left: -100%; width: 350%; height: 350%; background: var(--flow-grad); background-size: 400% 400%; animation: flowDriftLarge 20s ease-in-out infinite; will-change: transform; }
        .bg-flow-2 { position: absolute; top: -80%; left: -60%; width: 260%; height: 260%; background: radial-gradient(ellipse at 30% 70%, rgba(255,140,100,.4), transparent 60%), radial-gradient(ellipse at 70% 30%, rgba(90,180,255,.35), transparent 50%); animation: flowDrift 20s ease-in-out infinite alternate; }
        .bg-flow-3 { position: absolute; top: -40%; left: -20%; width: 200%; height: 200%; background: radial-gradient(circle at 60% 40%, rgba(220,140,255,.25), transparent 55%); animation: flowSpin 20s linear infinite; }
        @keyframes flowDriftLarge { 0% {transform:translate(0%,0%) scale(1);} 50% {transform:translate(-2%,-2%) scale(1.05);} 100% {transform:translate(0%,0%) scale(1);} }
        @keyframes flowDrift { 0% {transform:translate(0,0) scale(1) rotate(0deg);} 50% {transform:translate(5%,-3%) scale(1.08) rotate(6deg);} 100% {transform:translate(-2%,4%) scale(.94) rotate(-6deg);} }
        @keyframes flowSpin { 0% {transform:rotate(0deg) scale(1);} 50% {transform:rotate(180deg) scale(1.06);} 100% {transform:rotate(360deg) scale(1);} }
        .orb { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 35%, color-mix(in srgb, var(--card-2) 60%, transparent), color-mix(in srgb, var(--card-2) 15%, transparent) 45%, transparent 75%); box-shadow: 0 0 60px color-mix(in srgb, var(--glow) 10%, transparent), inset 0 0 30px color-mix(in srgb, var(--card-2) 20%, transparent); pointer-events: none; will-change: transform, opacity; }
        .orb-1 { width:260px; height:260px; top:10%; left:5%; animation:orbFloat1 18s ease-in-out infinite, orbRotate 40s linear infinite; }
        .orb-2 { width:160px; height:160px; top:55%; left:78%; animation:orbFloat2 22s ease-in-out infinite, orbRotate 55s linear infinite; }
        .orb-3 { width:110px; height:110px; top:70%; left:18%; animation:orbFloat1 16s ease-in-out infinite reverse, orbRotate 35s linear infinite; }
        .orb-4 { width:200px; height:200px; top:28%; left:62%; animation:orbFloat2 20s ease-in-out infinite, orbRotate 45s linear infinite; }
        .orb-5 { width:80px; height:80px; top:82%; left:45%; animation:orbFloat1 14s ease-in-out infinite, orbRotate 30s linear infinite; }
        @keyframes orbFloat1 { 0%,100% {transform:translate(0,0); opacity:.5;} 30% {transform:translate(20px,-25px); opacity:.8;} 60% {transform:translate(-12px,15px); opacity:.4;} }
        @keyframes orbFloat2 { 0%,100% {transform:translate(0,0); opacity:.6;} 50% {transform:translate(-18px,14px); opacity:.3;} }
        @keyframes orbRotate { to {transform:rotate(360deg);} }
        /* 主布局 */
        main { padding: 20px 0; position: relative; z-index: 10; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
        .container { width: 92%; max-width: 1200px; background: var(--card); border-radius: 24px; box-shadow: 0 25px 70px rgba(0,0,0,.35); padding: 20px; margin-top: 20px; }
        .grid { display: grid; grid-template-columns: repeat(6,1fr); grid-template-rows: repeat(8,minmax(60px,auto)); gap: 14px; }
        .cell { border-radius: 14px; background: color-mix(in srgb, var(--glow) 5%, transparent); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; position: relative; border: 2px solid transparent; }
        /* 标题区 */
        .title-area { grid-row: 1/3; grid-column: 1/5; background: var(--btn-grad); border-color:var(--gold); cursor:default; }
        .title-area h1 { font-size: 42px; font-weight:900; letter-spacing:5px; background: linear-gradient(90deg,var(--btn-txt),color-mix(in srgb,var(--btn-txt) 55%,transparent),var(--btn-txt)); background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:titleShine 4s ease-in-out infinite; text-align:center; }
        @keyframes titleShine { 0%,100%{background-position:0% 50%;} 50%{background-position:100% 50%;} }
        /* 返回主页 */
        .back-area { grid-row:1/3; grid-column:5/7; background:var(--btn-grad); border-color:var(--purple); text-decoration:none; color:var(--btn-txt); font-weight:800; font-size:22px; letter-spacing:3px; display:flex; flex-direction:column; justify-content:center; align-items:center; transition:transform .3s,box-shadow .3s; }
        .back-area:hover { filter:brightness(1.12); transform:translateY(-4px); box-shadow:0 10px 30px rgba(0,0,0,.3); }
        /* 密码输出区（3-6行，1-4列） */
        .output-panel { grid-row:3/7; grid-column:1/5; background:var(--card-2); border-color:var(--blue); padding:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        #passwordOutput { font-size:32px; font-weight:700; color:var(--txt); text-align:center; word-break:break-all; background:var(--card); border:2px solid var(--line); border-radius:12px; padding:15px; width:100%; margin-bottom:15px; letter-spacing:2px; user-select:all; cursor:pointer; outline:none; }
        #passwordOutput:focus { border-color:var(--blue); box-shadow:0 0 0 3px color-mix(in srgb, var(--blue) 20%, transparent); }
        .strength-meter { width:100%; margin-bottom:10px; }
        .strength-label { display:flex; justify-content:space-between; font-size:14px; color:var(--dim); margin-bottom:8px; }
        .strength-bar-bg { width:100%; height:14px; background:color-mix(in srgb, var(--dim) 12%, transparent); border-radius:10px; overflow:hidden; }
        .strength-bar { height:100%; width:0%; border-radius:10px; transition:width .3s, background .3s; }
        .strength-info { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin-top:6px; }
        /* 长度与选项面板（3-6行，5-6列） */
        .settings-panel { grid-row:3/7; grid-column:5/7; background:var(--card-2); border-color:var(--green); padding:15px; display:flex; flex-direction:column; justify-content:center; gap:12px; }
        .length-section { display:flex; flex-direction:column; gap:8px; }
        .length-section label { font-size:14px; color:var(--dim); display:flex; justify-content:space-between; align-items:center; }
        .length-control { display:flex; align-items:center; gap:10px; }
        .length-control input[type="range"] { flex:1; }
        .length-value { font-weight:700; color:var(--txt); font-size:18px; min-width:30px; text-align:center; }
        .length-progress { width:100%; height:10px; background:color-mix(in srgb, var(--dim) 12%, transparent); border-radius:10px; overflow:hidden; }
        .length-progress-bar { height:100%; width:0%; border-radius:10px; background:linear-gradient(90deg,#f44336,#ff9800,#4caf50,#2196f3,#9c27b0); transition:width .3s; }
        .options-section { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center; }
        .checkbox-group { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
        .checkbox-item { display:flex; align-items:center; gap:6px; font-size:14px; color:var(--txt); min-height:24px; }
        .checkbox-item input { width:18px; height:18px; cursor:pointer; }
        /* 历史区（7-8行，1-4列） */
        .history-panel { grid-row:7/9; grid-column:1/5; background:var(--card-2); border-color:var(--glow); padding:15px; display:flex; flex-direction:column; align-items:stretch; }
        .history-panel h3 { font-size:16px; color:var(--txt); margin-bottom:10px; }
        .history-list { max-height:100px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
        .history-item { display:flex; justify-content:space-between; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:14px; cursor:pointer; outline:none; transition:border-color .2s; }
        .history-item:focus { border-color:var(--blue); }
        .history-item span { color:var(--txt); word-break:break-all; flex:1; }
        .history-item button { border:none; background:none; color:var(--dim); font-size:16px; cursor:pointer; min-width:44px; min-height:44px; display:flex; align-items:center; justify-content:center; border-radius:8px; transition:background .2s; }
        .history-item button:hover { background:color-mix(in srgb, var(--dim) 8%, transparent); }
        /* 按钮区（7-8行，5-6列） */
        .button-panel { grid-row:7/9; grid-column:5/7; background:var(--card-2); border-color:var(--purple); padding:10px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:12px; }
        .button-panel button { width:90%; padding:10px; border:none; border-radius:50px; font-size:16px; font-weight:700; cursor:pointer; transition:transform .2s; min-height:44px; }
        #generateBtn { background:var(--btn-grad); color:var(--btn-txt); }
        #generateBtn:hover { transform:translateY(-2px); }
        #copyBtn { background:var(--green); color:var(--btn-txt); }
        #copyBtn:hover { transform:translateY(-2px); }
        #clearHistoryBtn { background:color-mix(in srgb, var(--dim) 12%, transparent); color:var(--dim); font-size:14px; }
        /* 跳转覆盖层（index.html通用圆环） */
        .overlay { position:fixed; top:0; left:0; width:100%; height:100%; z-index:999999; display:flex; align-items:center; justify-content:center; background:rgba(8,10,25,.72); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); opacity:0; visibility:hidden; transition:opacity .4s, visibility .4s; pointer-events:none; }
        .overlay.active { opacity:1; visibility:visible; pointer-events:auto; }
        .loader-wrap { position:relative; width:180px; height:180px; display:flex; align-items:center; justify-content:center; }
        .loader-ring { position:absolute; top:0; left:0; width:100%; height:100%; border-radius:50%; border:3px solid rgba(255,255,255,0.1); border-top-color:#f6d365; border-right-color:#fda085; animation:ringSpin .8s linear infinite; box-sizing:border-box; }
        .loader-ring::before { content:''; position:absolute; top:12px; left:12px; right:12px; bottom:12px; border-radius:50%; border:2px solid transparent; border-bottom-color:#a78bfa; border-left-color:#667eea; animation:ringSpin 1.4s linear infinite reverse; }
        .loader-ring::after { content:''; position:absolute; top:28px; left:28px; right:28px; bottom:28px; border-radius:50%; border:1px solid transparent; border-top-color:#fb7185; border-right-color:#2dd4bf; animation:ringSpin 2s linear infinite; }
        .loader-text { position:relative; z-index:5; font-size:24px; font-weight:900; letter-spacing:4px; background:linear-gradient(90deg,#f6d365,#fda085,#f6d365); background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:textShine 1.5s linear infinite; }
        @keyframes ringSpin { to { transform:rotate(360deg); } }
        @keyframes textShine { 0% { background-position:0% 50%; } 100% { background-position:200% 50%; } }
        /* 响应式（保留原有，增加可读性） */
        @media (max-width:900px) { .grid { gap:8px; } .title-area h1 { font-size:28px; } .back-area { font-size:18px; } .container { width:95%; } }
        @media (max-width:600px) {
            .grid { grid-template-columns:repeat(2,1fr); grid-template-rows:auto; }
            .title-area { grid-row:1; grid-column:1/3; }
            .back-area { grid-row:2; grid-column:1/3; }
            .output-panel { grid-row:3; grid-column:1/3; }
            .settings-panel { grid-row:4; grid-column:1/3; }
            .history-panel { grid-row:5; grid-column:1/3; }
            .button-panel { grid-row:6; grid-column:1/3; }
        }
    
        /* ========== 手机端响应式适配（通用） ========== */
        @media (max-width: 768px) {
            html, body {
                overflow-x: hidden;
                width: 100%;
            }
            main {
                padding: 70px 0 30px !important;
            }
            .container, .card-container, .wrapper, .box, .panel, .form-box {
                width: 94% !important;
                max-width: 94vw !important;
                padding: 14px !important;
                margin: 0 auto !important;
            }
            /* 6列/多列网格改3列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 8px !important;
                padding: 4px !important;
            }
            /* 大区域占满整行 */
            .title-area, .back-area, .display-area, .game-main,
            .calculator-area, .main-area, .content-area, .result-area,
            .input-area, .output-area, .board-area, .info-area, .settings-area {
                grid-column: 1 / -1 !important;
                grid-row: auto !important;
            }
            /* 左右分栏改上下堆叠 */
            .left-panel, .right-panel, .side-panel, .sidebar {
                flex: 1 1 100% !important;
                width: 100% !important;
                border-right: none !important;
                border-bottom: 1px solid var(--line) !important;
            }
            .display-area, .game-main, .calculator-area {
                flex-direction: column !important;
                padding: 12px !important;
            }
            .cell, .tool-cell, .grid-cell {
                padding: 10px 6px !important;
                min-height: 70px !important;
            }
            h1, h2, h3, .title-text, .author-name, .main-title {
                font-size: 22px !important;
                letter-spacing: 1px !important;
            }
            .btn, button, input, select, textarea {
                font-size: 14px !important;
                padding: 10px 14px !important;
            }
            .ghost-btn, .back-btn, .return-btn {
                padding: 8px 16px !important;
                font-size: 13px !important;
            }
            /* 隐藏非必要装饰元素 */
            .orb, .decoration, .deco-element, .floating-shape {
                display: none !important;
            }
        }
        @media (max-width: 480px) {
            .container, .card-container, .wrapper, .box {
                width: 96% !important;
                padding: 10px !important;
            }
            /* 小屏手机改2列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 6px !important;
            }
            h1, h2, h3, .title-text, .author-name {
                font-size: 18px !important;
            }
            .cell, .tool-cell {
                min-height: 80px !important;
                padding: 8px 4px !important;
            }
            .btn, button {
                font-size: 13px !important;
                padding: 8px 12px !important;
            }
        }
</style>
