<title>分享卡片生成 - 找乐子</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        min-height: 100vh;
        background: var(--bg);
        color: var(--txt);
        overflow-x: hidden;
        position: relative;
    }

    /* ========== 背景流光层（全站统一，20秒无缝循环） ========== */
    .bg-animation {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
    }
    .bg-flow-1 {
        position: absolute;
        top: -100%;
        left: -100%;
        width: 300%;
        height: 300%;
        background: var(--flow-grad);
        background-size: 400% 400%;
        animation: flowGradient 20s ease-in-out infinite;
        will-change: background-position;
    }
    .bg-flow-2 {
        position: absolute;
        top: -60%;
        left: -40%;
        width: 220%;
        height: 220%;
        background: radial-gradient(ellipse at 30% 70%, rgba(255,140,100,.35), transparent 50%),
            radial-gradient(ellipse at 65% 35%, rgba(120,180,255,.3), transparent 45%),
            radial-gradient(ellipse at 80% 80%, rgba(220,130,250,.25), transparent 40%);
        animation: flowDrift 20s ease-in-out infinite alternate;
        will-change: transform;
    }
    .bg-flow-3 {
        position: absolute;
        top: -30%;
        left: -20%;
        width: 180%;
        height: 180%;
        background: radial-gradient(circle at 50% 50%, rgba(255,200,130,.15), transparent 60%),
            radial-gradient(circle at 20% 80%, rgba(80,220,200,.2), transparent 50%);
        animation: flowRotate 20s linear infinite;
        will-change: transform;
    }
    @keyframes flowGradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    @keyframes flowDrift {
        0% { transform: translate(0, 0) scale(1) rotate(0deg); }
        50% { transform: translate(3%, -4%) scale(1.05) rotate(5deg); }
        100% { transform: translate(-2%, 3%) scale(.97) rotate(-5deg); }
    }
    @keyframes flowRotate {
        0% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(180deg) scale(1.08); }
        100% { transform: rotate(360deg) scale(1); }
    }

    /* ========== 透明悬浮球 ========== */
    .orb {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, color-mix(in srgb, var(--card-2) 60%, transparent), color-mix(in srgb, var(--card-2) 15%, transparent) 50%, transparent 70%);
        8%, transparent), inset 0 0 30px color-mix(in srgb, var(--card-2) 20%, transparent);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        pointer-events: none;
        will-change: transform, opacity;
    }
    .orb-1 { width: 260px; height: 260px; top: 12%; left: 8%; animation: orbFloatA 18s ease-in-out infinite, orbSpin 40s linear infinite; }
    .orb-2 { width: 160px; height: 160px; top: 55%; left: 75%; animation: orbFloatB 22s ease-in-out infinite, orbSpin 55s linear infinite; }
    .orb-3 { width: 110px; height: 110px; top: 68%; left: 20%; animation: orbFloatA 16s ease-in-out infinite reverse, orbSpin 35s linear infinite; }
    .orb-4 { width: 220px; height: 220px; top: 28%; left: 60%; animation: orbFloatB 20s ease-in-out infinite reverse, orbSpin 50s linear infinite; }
    .orb-5 { width: 80px; height: 80px; top: 80%; left: 45%; animation: orbFloatA 14s ease-in-out infinite, orbSpin 30s linear infinite; }
    @keyframes orbFloatA {
        0% { transform: translate(0,0) scale(1); opacity:.6; }
        30% { transform: translate(18px,-22px) scale(1.04); opacity:.8; }
        60% { transform: translate(-12px,10px) scale(.96); opacity:.5; }
        100% { transform: translate(0,0) scale(1); opacity:.6; }
    }
    @keyframes orbFloatB {
        0% { transform: translate(0,0) scale(1); opacity:.5; }
        35% { transform: translate(-20px,12px) scale(1.06); opacity:.7; }
        70% { transform: translate(14px,-15px) scale(.94); opacity:.4; }
        100% { transform: translate(0,0) scale(1); opacity:.5; }
    }
    @keyframes orbSpin { to { transform: rotate(360deg); } }

    /* ========== 主体布局（全站统一：白色悬浮容器） ========== */
    main {
        position: relative;
        z-index: 10;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 60px 20px 40px;
    }
    .container {
        width: 80%;
        max-width: 1200px;
        background: var(--card);
        border-radius: 8px;
        box-shadow: none;
        max-height: calc(100vh - 100px);
        overflow-y: auto;
        padding: 20px;
        color: var(--txt);
    }
    .container::-webkit-scrollbar { width: 10px; }
    .container::-webkit-scrollbar-track { background: rgba(0, 0, 0, .04); border-radius: 6px; }
    .container::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 6px; border: 2px solid transparent; }

    .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
    .title-area {
        grid-column: 1 / 5;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 90px;
        background: var(--blue);
        background-size: 300% 300%;
        animation: titleGradient 6s ease infinite;
        border-radius: 8px;
        box-shadow: 0 12px 40px color-mix(in srgb, var(--gold-2) 35%, transparent), inset 0 1px 0 color-mix(in srgb, var(--card-2) 40%, transparent);
        padding: 10px;
    }
    .title-area h2 { font-size: clamp(28px, 4.5vw, 40px); font-weight: 300; letter-spacing: .015em; line-height: 1.25; text-align: left; }
    @keyframes titleGradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    .back-area {
        grid-column: 5 / 7;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 90px;
        background: var(--green);
        border-radius: 8px;
        box-shadow: 0 12px 40px color-mix(in srgb, var(--green) 40%, transparent), inset 0 1px 0 color-mix(in srgb, var(--card-2) 40%, transparent);
        text-decoration: none;
        color: var(--btn-txt);
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition: transform .3s, box-shadow .3s;
    }
    .back-area:hover {
        transform: translateY(-5px);
        box-shadow: 0 18px 50px color-mix(in srgb, var(--green) 50%, transparent);
    }
    .back-area:active {
        transform: translateY(-2px) scale(.96);
    }
    .card {
        grid-column: 1 / -1;
        background: var(--card-2);
        border-radius: 8px;
        padding: 20px;
        box-shadow: none;
        border: 1px solid var(--line);
    }
    .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        border: none; cursor: pointer; font-size: 15px; padding: 10px 20px; border-radius: 6px;
        background: var(--blue); color: var(--btn-txt);
        box-shadow: 0 4px 14px color-mix(in srgb, var(--glow) 40%, transparent); transition: transform .2s, box-shadow .2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px color-mix(in srgb, var(--glow) 55%, transparent); }
    .btn:active { transform: scale(.96); }
    .btn-secondary { background: #e8eaf6; color: var(--txt); box-shadow: none; }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    input, textarea, select {
        width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px;
        font-size: 14px; background: var(--card-2); color: var(--txt); outline: none;
    }
    input:focus, textarea:focus { border-color: var(--glow); box-shadow: 0 0 0 3px color-mix(in srgb, var(--glow) 20%, transparent); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
    .hint { font-size: 12px; color: var(--dim); margin-top: 8px; }
    .stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
    .stat div { background: color-mix(in srgb, var(--glow) 8%, transparent); border-radius: 6px; padding: 10px; text-align: center; }
    .stat b { display: block; font-size: 20px; color: var(--glow); }
    .stat span { font-size: 12px; color: var(--dim); }
    /* ========== 转场遮罩（全站统一样式） ========== */
    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(8, 10, 25, .72);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        opacity: 0;
        visibility: hidden;
        transition: opacity .4s ease, visibility .4s ease;
        pointer-events: none;
    }
    .overlay.active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }
    .loader-wrap {
        position: relative;
        width: 180px;
        height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .loader-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, .1);
        border-top-color: #f6d365;
        border-right-color: #fda085;
        animation: ringSpin .8s linear infinite;
    }
    .loader-ring::before {
        content: '';
        position: absolute;
        top: 12px;
        left: 12px;
        right: 12px;
        bottom: 12px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-bottom-color: #a78bfa;
        border-left-color: #667eea;
        animation: ringSpin 1.4s linear infinite reverse;
    }
    .loader-ring::after {
        content: '';
        position: absolute;
        top: 28px;
        left: 28px;
        right: 28px;
        bottom: 28px;
        border-radius: 50%;
        border: 1px solid transparent;
        border-top-color: #fb7185;
        border-right-color: #2dd4bf;
        animation: ringSpin 2s linear infinite;
    }
    .loader-text {
        position: relative;
        z-index: 5;
        font-size: 24px;
        font-weight: 500;
        letter-spacing: 4px;
        background: linear-gradient(90deg, #f6d365, #fda085, #f6d365);
        background-size: 200% 100%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: textShine 1.5s linear infinite;
    }
    @keyframes ringSpin { to { transform: rotate(360deg); } }
    @keyframes textShine {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
    }
    @media (max-width: 900px) {
        .container { width: 95%; padding: 12px; }
        .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .title-area, .back-area { grid-column: 1 / -1; min-height: 80px; }
        .title-area h2 { font-size: clamp(28px, 4.5vw, 40px); font-weight: 300; letter-spacing: .015em; line-height: 1.25; text-align: left; }
        .back-area { font-size: 16px; }
        .orb { display: none; }
    }
    @media (max-width: 768px) {
        main { padding: 40px 12px 30px; }
        .container { width: 94%; max-width: 94vw; padding: 14px; }
        .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .title-area, .back-area { grid-column: 1 / -1; min-height: 70px; }
        .title-area h2 { font-size: clamp(28px, 4.5vw, 40px); font-weight: 300; letter-spacing: .015em; line-height: 1.25; text-align: left; }
        .stat { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 480px) {
        .container { width: 96%; padding: 10px; }
        .grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .title-area h2 { font-size: clamp(28px, 4.5vw, 40px); font-weight: 300; letter-spacing: .015em; line-height: 1.25; text-align: left; }
        .back-area { font-size: 15px; }
    }
</style>

<style data-no-obf>/* 全站打磨层 V3.0 */
/* ==================================================================
   全站通用打磨层（V3.0 · 综合提升）
   追加到 common.css / xd-common.css / cy-common.css 末尾，级联覆盖全站。
   设计原则：
   - 零破坏：:where() 包裹 = 零特异性，绝不覆盖页面既有样式；不设 margin/尺寸/定位。
   - 主题自适应：一律 var(--zl-*，fallback)，不引入新硬编码色。
   - 不变量：不改任何布局结构、跳转逻辑、找乐子主题。
   - 提升：可访问性（焦点/减少动效/色彩方案/触摸）、可读性（tabular-nums）、
           交互反馈（hover/active 过渡）、文本健壮性（长词换行）。
   ================================================================== */

/* 1. 原生控件随系统深浅色自适应（修复滚动条/输入框/下拉在深色下刺眼白块） */
:root { color-scheme: light dark; }

/* 2. 触摸设备消除双击缩放延迟（移动端点按更跟手） */
html { -webkit-tap-highlight-color: transparent; }
:where(a, button, [role="button"], input, select, textarea, summary, label:has(input), [tabindex]):not([disabled]) {
    touch-action: manipulation;
}

/* 3. 键盘焦点统一可见（:where 零特异性 + !important 压过页面 outline:none）
      仅键盘触发（focus-visible），鼠标点击不出现，不打扰普通点击用户 */
:where(a, button, [role="button"], input, select, textarea, summary, [tabindex], [contenteditable]):focus-visible {
    outline: 3px solid var(--zl-accent, var(--gold, #f6d365)) !important;
    outline-offset: 2px !important;
    border-radius: 6px;
}

/* 4. 交互反馈：hover/active 平滑过渡（仅列属性，不用 transition:all） */
:where(a, button, [role="button"], summary, [tabindex]):where(:not([disabled])) {
    transition: color .15s ease, background-color .15s ease, border-color .15s ease, box-shadow .15s ease, opacity .15s ease;
}

/* 5. 文本健壮性：长英文词/URL 在窄屏不再撑破容器 */
:where(p, li, dd, dt, td, th, figcaption, blockquote, h1, h2, h3, h4, h5, h6, a, span, div) {
    overflow-wrap: break-word;
}

/* 6. 数字对齐：统计/计数/表格数字用等宽数字，跳动更整齐 */
:where(td, .stat, .stat-num, .count, .num, [data-num]) {
    font-variant-numeric: tabular-nums;
}

/* 6b. 图片响应式：窄屏不撑破容器、保持比例不失真（未显式设尺寸的图更稳） */
:where(img, picture, video) {
    max-width: 100%;
    height: auto;
}

/* 7. 尊重系统"减少动态效果"（兜底层：common.css 已有，此处保证三家族全覆盖）
      用 :where 包裹，特异性为 0，页面更具体的动效规则仍可生效 */
@media (prefers-reduced-motion: reduce) {
    :where(*, *::before, *::after) {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important;
    }
}

/* 8. 打印友好：隐藏固定悬浮件，正文铺满（低成本加分项） */
@media print {
    :where([class*="fab"], [class*="float"], [class*="dock"], nav.zl-crumb, .zl-skip-link) {
        display: none !important;
    }
}

</style>
