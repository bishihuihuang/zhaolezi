<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找乐子——网页备忘录</title>
    <style>
        /* ========== 全局重置 ========== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            min-height: 100vh;
            background: var(--bg);
            color: var(--txt);
            overflow-x: hidden;
            position: relative;
        }

        /* ========== 背景流光层 ========== */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-flow-1 {
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: var(--flow-grad);
            background-size: 400% 400%;
            animation: flowDriftLarge 20s ease-in-out infinite;
            will-change: transform;
        }

        .bg-flow-2 {
            position: absolute;
            top: -60%;
            left: -40%;
            width: 220%;
            height: 220%;
            background: radial-gradient(ellipse at 30% 70%,
                    rgba(255, 140, 100, .35), transparent 50%),
                radial-gradient(ellipse at 65% 35%,
                    rgba(120, 180, 255, .3), transparent 45%),
                radial-gradient(ellipse at 80% 80%,
                    rgba(220, 130, 250, .25), transparent 40%);
            animation: flowDrift 20s ease-in-out infinite alternate;
            will-change: transform;
        }

        .bg-flow-3 {
            position: absolute;
            top: -30%;
            left: -20%;
            width: 180%;
            height: 180%;
            background: radial-gradient(circle at 50% 50%,
                    rgba(255, 200, 130, .15), transparent 60%),
                radial-gradient(circle at 20% 80%,
                    rgba(80, 220, 200, .2), transparent 50%);
            animation: flowRotate 20s linear infinite;
            will-change: transform;
        }

        @keyframes flowDriftLarge {
            0% { transform: translate(0%, 0%) scale(1); }
            50% { transform: translate(-2%, -2%) scale(1.05); }
            100% { transform: translate(0%, 0%) scale(1); }
        }

        @keyframes flowDrift {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(3%, -4%) scale(1.05) rotate(5deg); }
            100% { transform: translate(-2%, 3%) scale(.97) rotate(-5deg); }
        }

        @keyframes flowRotate {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.08); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* ========== 透明悬浮球 ========== */
        .orb {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%,
                    color-mix(in srgb, var(--card-2) 60%, transparent),
                    color-mix(in srgb, var(--card-2) 15%, transparent) 50%,
                    transparent 70%);
            box-shadow: 0 0 60px color-mix(in srgb, var(--glow) 8%, transparent),
                inset 0 0 30px color-mix(in srgb, var(--card-2) 20%, transparent);
            pointer-events: none;
            will-change: transform, opacity;
        }

        .orb-1 { width: 260px; height: 260px; top: 12%; left: 8%; animation: orbFloatA 18s ease-in-out infinite, orbSpin 40s linear infinite; }
        .orb-2 { width: 160px; height: 160px; top: 55%; left: 75%; animation: orbFloatB 22s ease-in-out infinite, orbSpin 55s linear infinite; }
        .orb-3 { width: 110px; height: 110px; top: 68%; left: 20%; animation: orbFloatA 16s ease-in-out infinite reverse, orbSpin 35s linear infinite; }
        .orb-4 { width: 220px; height: 220px; top: 28%; left: 60%; animation: orbFloatB 20s ease-in-out infinite reverse, orbSpin 50s linear infinite; }
        .orb-5 { width: 80px; height: 80px; top: 80%; left: 45%; animation: orbFloatA 14s ease-in-out infinite, orbSpin 30s linear infinite; }

        @keyframes orbFloatA {
            0% { transform: translate(0, 0) scale(1); opacity: .6; }
            30% { transform: translate(18px, -22px) scale(1.04); opacity: .8; }
            60% { transform: translate(-12px, 10px) scale(.96); opacity: .5; }
            100% { transform: translate(0, 0) scale(1); opacity: .6; }
        }

        @keyframes orbFloatB {
            0% { transform: translate(0, 0) scale(1); opacity: .5; }
            35% { transform: translate(-20px, 12px) scale(1.06); opacity: .7; }
            70% { transform: translate(14px, -15px) scale(.94); opacity: .4; }
            100% { transform: translate(0, 0) scale(1); opacity: .5; }
        }

        @keyframes orbSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ========== 主容器布局 ========== */
        main {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 60px 20px;
        }

        .container {
            width: 80%;
            max-width: 1440px;
            background: var(--card);
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, .35),
                0 0 0 1px var(--line),
                
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
            color: var(--txt);
        }

        .container::-webkit-scrollbar {
            width: 10px;
        }

        .container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, .04);
            border-radius: 12px;
        }

        .container::-webkit-scrollbar-thumb {
            background: var(--scroll-thumb);
            border-radius: 12px;
            border: 2px solid transparent;
        }

        /* ========== 网格布局 ========== */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(8, minmax(80px, auto));
            gap: 12px;
        }

        /* ========== 标题区域 ========== */
        .title-area {
            grid-column: 1 / 5;
            grid-row: 1 / 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--title-grad);
            background-size: 300% 300%;
            /* 已移除：background-position 位移动画 */
            border-radius: 20px;
            box-shadow: 0 12px 40px color-mix(in srgb, var(--gold-2) 35%, transparent),
                inset 0 1px 0 color-mix(in srgb, var(--card-2) 40%, transparent);
            position: relative;
            overflow: hidden;
            transition: transform .4s cubic-bezier(.34, 1.56, .64, 1),
                box-shadow .4s ease;
        }

        .title-area:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 18px 50px color-mix(in srgb, var(--gold-2) 40%, transparent);
        }

        .title-area h2 {
            font-size: 42px;
            font-weight: 900;
            text-align: center;
            line-height: 1.3;
            letter-spacing: 4px;
            color: var(--btn-txt);
            text-shadow: 2px 2px 10px rgba(0, 0, 0, .3);
        }

        .title-sub {
            font-size: 14px;
            color: color-mix(in srgb, var(--btn-txt) 85%, transparent);
            margin-top: 8px;
            text-align: center;
            letter-spacing: 1px;
            font-weight: 400;
            text-shadow: 0 1px 4px rgba(0, 0, 0, .3);
        }

        @keyframes titleGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ========== 返回主页区域 ========== */
        .back-area {
            grid-column: 5 / 7;
            grid-row: 1 / 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--back-grad);
            border-radius: 20px;
            box-shadow: 0 12px 40px color-mix(in srgb, var(--green) 40%, transparent),
                inset 0 1px 0 color-mix(in srgb, var(--card-2) 40%, transparent);
            text-decoration: none;
            color: var(--btn-txt);
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 3px;
            cursor: pointer;
            transition: transform .35s cubic-bezier(.34, 1.56, .64, 1),
                box-shadow .35s ease;
            min-height: 44px;
            min-width: 44px;
        }

        .back-area:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 18px 50px color-mix(in srgb, var(--green) 50%, transparent);
        }

        .back-area:active {
            transform: translateY(-2px) scale(.96);
            transition-duration: .1s;
        }

        .back-area .back-icon {
            font-size: 36px;
            margin-bottom: 6px;
        }

        /* ========== 输入文本框 ========== */
        .input-area {
            grid-column: 1 / 4;
            grid-row: 3 / 9;
            background: var(--card-2);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .1);
            border: 2px solid var(--line);
            transition: border-color .3s ease, box-shadow .3s ease;
            display: flex;
            flex-direction: column;
        }

        .input-area:focus-within {
            border-color: var(--glow);
            box-shadow: 0 6px 30px color-mix(in srgb, var(--glow) 20%, transparent);
        }

        .input-area label {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--txt);
            display: block;
        }

        .input-area textarea {
            width: 100%;
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            font-size: 14px;
            line-height: 1.6;
            color: var(--txt);
            background: transparent;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        }

        .input-area textarea::placeholder {
            color: var(--dim);
            font-style: normal;
        }

        /* ========== 保存按钮 ========== */
        .save-area {
            grid-column: 4 / 7;
            grid-row: 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .save-btn {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            color: var(--btn-txt);
            cursor: not-allowed;
            background: color-mix(in srgb, var(--dim) 22%, transparent);
            box-shadow: 0 4px 15px rgba(0, 0, 0, .1);
            transition: all .3s ease;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            min-height: 44px;
        }

        .save-btn.active {
            background: var(--green);
            box-shadow: 0 6px 20px color-mix(in srgb, var(--green) 40%, transparent);
            cursor: pointer;
        }

        .save-btn.active:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px color-mix(in srgb, var(--green) 50%, transparent);
        }

        .save-btn.active:active {
            transform: translateY(-1px) scale(.97);
        }

        .save-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 40%, color-mix(in srgb, var(--btn-txt) 30%, transparent) 50%, transparent 60%);
            transform: translateX(-100%);
            transition: transform .5s ease;
        }

        .save-btn.active:hover::before {
            transform: translateX(100%);
        }

        /* ========== 保存框区域 ========== */
        .saved-box {
            grid-column: 4 / 7;
            grid-row: 4 / 9;
            background: var(--card-2);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .1);
            border: 2px solid var(--line);
            overflow-y: auto;
            max-height: 100%;
        }

        .saved-box-header {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--txt);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .saved-box-header .count {
            background: var(--glow);
            color: var(--btn-txt);
            border-radius: 20px;
            padding: 3px 12px;
            font-size: 13px;
        }

        .saved-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 保存项卡片 */
        .saved-item {
            background: linear-gradient(135deg, color-mix(in srgb, var(--glow) 4%, var(--card-2)), color-mix(in srgb, var(--glow) 8%, var(--card-2)));
            border-radius: 12px;
            border: 1px solid var(--line);
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform .3s ease, box-shadow .3s ease;
            cursor: pointer;
            outline: none;
        }

        .saved-item:hover {
            transform: translateX(4px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, .1);
            border-color: var(--glow);
        }

        .saved-item:focus {
            border-color: var(--glow);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--glow) 20%, transparent);
        }

        .saved-item:active {
            transform: scale(.98);
        }

        .saved-item .item-icon {
            font-size: 20px;
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: color-mix(in srgb, var(--glow) 10%, transparent);
            border-radius: 8px;
        }

        .saved-item .item-info {
            flex: 1;
            min-width: 0;
        }

        .saved-item .item-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--txt);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .saved-item .item-url {
            font-size: 12px;
            color: var(--dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .saved-item .item-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .saved-item .action-btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .2s ease, transform .2s ease;
            background: transparent;
        }

        .saved-item .action-btn:hover {
            background: color-mix(in srgb, var(--dim) 8%, transparent);
            transform: scale(1.1);
        }

        .saved-item .copy-btn {
            color: var(--green);
        }

        .saved-item .edit-btn {
            color: var(--gold-2);
        }

        .saved-item .delete-btn {
            color: var(--red);
        }

        /* 空状态提示 */
        .empty-state {
            text-align: center;
            color: var(--dim);
            font-size: 14px;
            padding: 40px 10px;
            font-style: normal;
        }

        /* ========== Toast 提示 ========== */
        .toast-msg {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card);
            color: var(--txt);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 9999999;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .4);
            transition: opacity .3s ease, transform .3s ease;
            pointer-events: none;
            role: status;
            aria-live: polite;
        }

        /* ========== 加载覆盖层 ========== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(8, 10, 25, .72);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            opacity: 0;
            visibility: hidden;
            transition: opacity .4s ease, visibility .4s ease;
            pointer-events: none;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .loader-wrap {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, .1);
            border-top-color: #f6d365;
            border-right-color: #fda085;
            animation: ringSpin .8s linear infinite;
        }

        .loader-ring::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-bottom-color: #a78bfa;
            border-left-color: #667eea;
            animation: ringSpin 1.4s linear infinite reverse;
        }

        .loader-ring::after {
            content: '';
            position: absolute;
            top: 28px;
            left: 28px;
            right: 28px;
            bottom: 28px;
            border-radius: 50%;
            border: 1px solid transparent;
            border-top-color: #fb7185;
            border-right-color: #2dd4bf;
            animation: ringSpin 2s linear infinite;
        }

        .loader-text {
            position: relative;
            z-index: 5;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(90deg,
                    #f6d365, #fda085, #f6d365);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textShine 1.5s linear infinite;
        }

        @keyframes ringSpin {
            to { transform: rotate(360deg); }
        }

        @keyframes textShine {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* ========== 响应式适配 ========== */
        @media (max-width: 900px) {
            .container {
                width: 95%;
                padding: 12px;
            }
            .grid {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: auto;
            }
            .title-area { grid-column: 1/3; grid-row: auto; min-height: 100px; }
            .back-area { grid-column: 1/3; grid-row: auto; min-height: 80px; }
            .input-area { grid-column: 1/3; grid-row: auto; min-height: 250px; }
            .save-area { grid-column: 1/3; grid-row: auto; min-height: 60px; }
            .saved-box { grid-column: 1/3; grid-row: auto; max-height: 400px; }
        }

        @media (max-width: 600px) {
            .container { padding: 10px; }
            .title-area h2 { font-size: 28px; }
            .title-sub { font-size: 12px; }
            .back-area { font-size: 18px; }
            .saved-item { flex-direction: column; align-items: flex-start; }
            .saved-item .item-actions { margin-top: 6px; }
        }

        @media (max-width: 480px) {
            .container { padding: 8px; }
            .title-area h2 { font-size: 22px; }
            .title-sub { font-size: 12px; }
            .back-area { font-size: 14px; }
            .input-area { padding: 14px; }
            .save-btn { font-size: 14px; }
            .saved-box { padding: 10px; }
            .saved-item { padding: 8px; }
            .action-btn { width: 40px; height: 40px; font-size: 14px; }
        }
    
        /* ========== 手机端响应式适配（通用） ========== */
        @media (max-width: 768px) {
            html, body {
                overflow-x: hidden;
                width: 100%;
            }
            main {
                padding: 70px 0 30px !important;
            }
            .container, .card-container, .wrapper, .box, .panel, .form-box {
                width: 94% !important;
                max-width: 94vw !important;
                padding: 14px !important;
                margin: 0 auto !important;
            }
            /* 6列/多列网格改3列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 8px !important;
                padding: 4px !important;
            }
            /* 大区域占满整行 */
            .title-area, .back-area, .display-area, .game-main,
            .calculator-area, .main-area, .content-area, .result-area,
            .input-area, .output-area, .board-area, .info-area, .settings-area {
                grid-column: 1 / -1 !important;
                grid-row: auto !important;
            }
            /* 左右分栏改上下堆叠 */
            .left-panel, .right-panel, .side-panel, .sidebar {
                flex: 1 1 100% !important;
                width: 100% !important;
                border-right: none !important;
                border-bottom: 1px solid rgba(0,0,0,.1) !important;
            }
            .display-area, .game-main, .calculator-area {
                flex-direction: column !important;
                padding: 12px !important;
            }
            .cell, .tool-cell, .grid-cell {
                padding: 10px 6px !important;
                min-height: 70px !important;
            }
            h1, h2, h3, .title-text, .author-name, .main-title {
                font-size: 22px !important;
                letter-spacing: 1px !important;
            }
            .btn, button, input, select, textarea {
                font-size: 14px !important;
                padding: 10px 14px !important;
            }
            .ghost-btn, .back-btn, .return-btn {
                padding: 8px 16px !important;
                font-size: 13px !important;
            }
            /* 隐藏非必要装饰元素 */
            .orb, .decoration, .deco-element, .floating-shape {
                display: none !important;
            }
        }
        @media (max-width: 480px) {
            .container, .card-container, .wrapper, .box {
                width: 96% !important;
                padding: 10px !important;
            }
            /* 小屏手机改2列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 6px !important;
            }
            h1, h2, h3, .title-text, .author-name {
                font-size: 18px !important;
            }
            .cell, .tool-cell {
                min-height: 80px !important;
                padding: 8px 4px !important;
            }
            .btn, button {
                font-size: 13px !important;
                padding: 8px 12px !important;
            }
        }
</style>

<style data-no-obf>/* 全站打磨层 V3.0 */
/* ==================================================================
   全站通用打磨层（V3.0 · 综合提升）
   追加到 common.css / xd-common.css / cy-common.css 末尾，级联覆盖全站。
   设计原则：
   - 零破坏：:where() 包裹 = 零特异性，绝不覆盖页面既有样式；不设 margin/尺寸/定位。
   - 主题自适应：一律 var(--zl-*，fallback)，不引入新硬编码色。
   - 不变量：不改任何布局结构、跳转逻辑、找乐子主题。
   - 提升：可访问性（焦点/减少动效/色彩方案/触摸）、可读性（tabular-nums）、
           交互反馈（hover/active 过渡）、文本健壮性（长词换行）。
   ================================================================== */

/* 1. 原生控件随系统深浅色自适应（修复滚动条/输入框/下拉在深色下刺眼白块） */
:root { color-scheme: light dark; }

/* 2. 触摸设备消除双击缩放延迟（移动端点按更跟手） */
html { -webkit-tap-highlight-color: transparent; }
:where(a, button, [role="button"], input, select, textarea, summary, label:has(input), [tabindex]):not([disabled]) {
    touch-action: manipulation;
}

/* 3. 键盘焦点统一可见（:where 零特异性 + !important 压过页面 outline:none）
      仅键盘触发（focus-visible），鼠标点击不出现，不打扰普通点击用户 */
:where(a, button, [role="button"], input, select, textarea, summary, [tabindex], [contenteditable]):focus-visible {
    outline: 3px solid var(--zl-accent, var(--gold, #f6d365)) !important;
    outline-offset: 2px !important;
    border-radius: 6px;
}

/* 4. 交互反馈：hover/active 平滑过渡（仅列属性，不用 transition:all） */
:where(a, button, [role="button"], summary, [tabindex]):where(:not([disabled])) {
    transition: color .15s ease, background-color .15s ease, border-color .15s ease, box-shadow .15s ease, opacity .15s ease;
}

/* 5. 文本健壮性：长英文词/URL 在窄屏不再撑破容器 */
:where(p, li, dd, dt, td, th, figcaption, blockquote, h1, h2, h3, h4, h5, h6, a, span, div) {
    overflow-wrap: break-word;
}

/* 6. 数字对齐：统计/计数/表格数字用等宽数字，跳动更整齐 */
:where(td, .stat, .stat-num, .count, .num, [data-num]) {
    font-variant-numeric: tabular-nums;
}

/* 6b. 图片响应式：窄屏不撑破容器、保持比例不失真（未显式设尺寸的图更稳） */
:where(img, picture, video) {
    max-width: 100%;
    height: auto;
}

/* 7. 尊重系统"减少动态效果"（兜底层：common.css 已有，此处保证三家族全覆盖）
      用 :where 包裹，特异性为 0，页面更具体的动效规则仍可生效 */
@media (prefers-reduced-motion: reduce) {
    :where(*, *::before, *::after) {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important;
    }
}

/* 8. 打印友好：隐藏固定悬浮件，正文铺满（低成本加分项） */
@media print {
    :where([class*="fab"], [class*="float"], [class*="dock"], nav.zl-crumb, .zl-skip-link) {
        display: none !important;
    }
}
