<style>
    .cert { background: var(--card); border: 3px double var(--gold); border-radius: 8px; padding: 34px 26px; text-align: center; margin: 18px 0; position: relative; }
    .cert .c-crown { font-size: 46px; }
    .cert h2 { font-size: 26px; letter-spacing: 6px; color: var(--gold); margin: 8px 0 4px; }
    .cert .c-sub { font-size: 13px; color: var(--dim); letter-spacing: 3px; }
    .cert .c-name { font-size: 30px; font-weight: 500; color: var(--txt); border-bottom: 2px solid var(--gold); display: inline-block; padding: 0 22px 6px; margin: 14px 0 6px; }
    .cert p { font-size: 14.5px; color: var(--dim); line-height: 1.9; max-width: 560px; margin: 6px auto; }
    .cert .c-meta { display: flex; justify-content: center; gap: 26px; margin-top: 16px; font-size: 13.5px; color: var(--dim); flex-wrap: wrap; }
    .cert .c-meta b { color: var(--gold); font-size: 15px; }
    .cert .c-stamp { position: absolute; right: 26px; bottom: 26px; width: 88px; height: 88px; border: 3px solid var(--red); color: var(--red); border-radius: 50%;
        display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; transform: rotate(-18deg); opacity: .8; }
    .cert-name-row { display: flex; align-items: center; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
    .cert-name-row input { padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card-2); color: var(--txt); font-size: 14px; font-family: inherit; outline: none; }
    .cert-name-row input:focus { border-color: var(--gold); }
    .grad-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin: 14px 0; }
    .grad-item { background: var(--card-2); border: 1px solid var(--line); border-radius: 8px; padding: 11px 13px; font-size: 13.5px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .grad-item.done { border-color: var(--green); }
    .grad-item .g-name { color: var(--txt); font-weight: 700; }
    .grad-item .g-p { color: var(--dim); flex: none; }
    .grad-item.done .g-p { color: var(--green); font-weight: 600; }
    @media print {
        .cert { border: 3px double #000 !important; background: #fff !important; box-shadow: none !important; }
        .cert h2, .cert .c-sub, .cert .c-name, .cert .c-meta b { color: #000 !important; }
        .cert p { color: #000 !important; }
        .cert .c-stamp { border-color: #000; color: #000; opacity: .75; }
        .cert-name-row { display: none !important; }
    }
</style>

<style data-no-obf>/* 全站打磨层 V3.0 */
/* ==================================================================
   全站通用打磨层（V3.0 · 综合提升）
   追加到 common.css / xd-common.css / cy-common.css 末尾，级联覆盖全站。
   设计原则：
   - 零破坏：:where() 包裹 = 零特异性，绝不覆盖页面既有样式；不设 margin/尺寸/定位。
   - 主题自适应：一律 var(--zl-*，fallback)，不引入新硬编码色。
   - 不变量：不改任何布局结构、跳转逻辑、找乐子主题。
   - 提升：可访问性（焦点/减少动效/色彩方案/触摸）、可读性（tabular-nums）、
           交互反馈（hover/active 过渡）、文本健壮性（长词换行）。
   ================================================================== */

/* 1. 原生控件随系统深浅色自适应（修复滚动条/输入框/下拉在深色下刺眼白块） */
:root { color-scheme: light dark; }

/* 2. 触摸设备消除双击缩放延迟（移动端点按更跟手） */
html { -webkit-tap-highlight-color: transparent; }
:where(a, button, [role="button"], input, select, textarea, summary, label:has(input), [tabindex]):not([disabled]) {
    touch-action: manipulation;
}

/* 3. 键盘焦点统一可见（:where 零特异性 + !important 压过页面 outline:none）
      仅键盘触发（focus-visible），鼠标点击不出现，不打扰普通点击用户 */
:where(a, button, [role="button"], input, select, textarea, summary, [tabindex], [contenteditable]):focus-visible {
    outline: 3px solid var(--zl-accent, var(--gold, #f6d365)) !important;
    outline-offset: 2px !important;
    border-radius: 6px;
}

/* 4. 交互反馈：hover/active 平滑过渡（仅列属性，不用 transition:all） */
:where(a, button, [role="button"], summary, [tabindex]):where(:not([disabled])) {
    transition: color .15s ease, background-color .15s ease, border-color .15s ease, box-shadow .15s ease, opacity .15s ease;
}

/* 5. 文本健壮性：长英文词/URL 在窄屏不再撑破容器 */
:where(p, li, dd, dt, td, th, figcaption, blockquote, h1, h2, h3, h4, h5, h6, a, span, div) {
    overflow-wrap: break-word;
}

/* 6. 数字对齐：统计/计数/表格数字用等宽数字，跳动更整齐 */
:where(td, .stat, .stat-num, .count, .num, [data-num]) {
    font-variant-numeric: tabular-nums;
}

/* 6b. 图片响应式：窄屏不撑破容器、保持比例不失真（未显式设尺寸的图更稳） */
:where(img, picture, video) {
    max-width: 100%;
    height: auto;
}

/* 7. 尊重系统"减少动态效果"（兜底层：common.css 已有，此处保证三家族全覆盖）
      用 :where 包裹，特异性为 0，页面更具体的动效规则仍可生效 */
@media (prefers-reduced-motion: reduce) {
    :where(*, *::before, *::after) {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important;
    }
}

/* 8. 打印友好：隐藏固定悬浮件，正文铺满（低成本加分项） */
@media print {
    :where([class*="fab"], [class*="float"], [class*="dock"], nav.zl-crumb, .zl-skip-link) {
        display: none !important;
    }
}
