<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📕</text></svg>">
    <title>错题本</title>
    <style>
        :root {
            --warn: var(--gold, #ff8b52);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            min-height: 100vh;
            background: var(--bg);
            color: var(--txt);
            overflow-x: hidden;
            position: relative;
        }

        /* ========== 背景流光层（全站统一，20s 无缝循环） ========== */
        .bg-animation {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-flow-1 {
            position: absolute;
            top: -100%; left: -100%;
            width: 300%; height: 300%;
            background: var(--flow-grad);
            background-size: 400% 400%;
            animation: flowGradient 20s ease-in-out infinite;
        }

        .bg-flow-2 {
            position: absolute;
            top: -60%; left: -40%;
            width: 220%; height: 220%;
            background: radial-gradient(ellipse at 30% 70%, rgba(255,140,100,.35), transparent 50%),
                radial-gradient(ellipse at 65% 35%, rgba(120,180,255,.3), transparent 45%),
                radial-gradient(ellipse at 80% 80%, rgba(220,130,250,.25), transparent 40%);
            animation: flowDrift 20s ease-in-out infinite alternate;
        }

        .bg-flow-3 {
            position: absolute;
            top: -30%; left: -20%;
            width: 180%; height: 180%;
            background: radial-gradient(circle at 50% 50%, rgba(255,200,130,.15), transparent 60%),
                radial-gradient(circle at 20% 80%, rgba(80,220,200,.2), transparent 50%);
            animation: flowRotate 20s linear infinite;
        }

        @keyframes flowGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes flowDrift {
            0% { transform: translate(0,0) scale(1) rotate(0deg); }
            50% { transform: translate(3%,-4%) scale(1.05) rotate(5deg); }
            100% { transform: translate(-2%,3%) scale(.97) rotate(-5deg); }
        }

        @keyframes flowRotate {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.08); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, rgba(255,255,255,.3), rgba(255,255,255,.1) 50%, transparent 70%);
            box-shadow: 0 0 60px rgba(255,255,255,.08), inset 0 0 30px rgba(255,255,255,.04);
            pointer-events: none;
            will-change: transform, opacity;
        }

        .orb-1 { width: 260px; height: 260px; top: 12%; left: 8%; animation: orbFloatA 18s ease-in-out infinite, orbSpin 40s linear infinite; }
        .orb-2 { width: 160px; height: 160px; top: 55%; left: 75%; animation: orbFloatB 22s ease-in-out infinite, orbSpin 55s linear infinite; }
        .orb-3 { width: 110px; height: 110px; top: 68%; left: 20%; animation: orbFloatA 16s ease-in-out infinite reverse, orbSpin 35s linear infinite; }
        .orb-4 { width: 220px; height: 220px; top: 28%; left: 60%; animation: orbFloatB 20s ease-in-out infinite reverse, orbSpin 50s linear infinite; }
        .orb-5 { width: 80px; height: 80px; top: 80%; left: 45%; animation: orbFloatA 14s ease-in-out infinite, orbSpin 30s linear infinite; }

        @keyframes orbFloatA {
            0% { transform: translate(0,0) scale(1); opacity: .6; }
            30% { transform: translate(18px,-22px) scale(1.04); opacity: .8; }
            60% { transform: translate(-12px,10px) scale(.96); opacity: .5; }
            100% { transform: translate(0,0) scale(1); opacity: .6; }
        }

        @keyframes orbFloatB {
            0% { transform: translate(0,0) scale(1); opacity: .5; }
            35% { transform: translate(-20px,12px) scale(1.06); opacity: .7; }
            70% { transform: translate(14px,-15px) scale(.94); opacity: .4; }
            100% { transform: translate(0,0) scale(1); opacity: .5; }
        }

        @keyframes orbSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        main {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 14px 96px;
        }

        .container {
            width: 100%;
            max-width: 1180px;
            background: var(--card);
            border-radius: 24px;
            box-shadow: var(--shadow), 0 0 0 1px rgba(255,255,255,.3), inset 0 1px 0 rgba(255,255,255,.6);
            padding: 16px;
            color: var(--txt);
        }

        /* 顶部：标题 + 返回/公告 */
        .top-grid {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: start;
        }

        .title-area h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #ffd7a8 45%, #ff9e6d 70%, #c7e0ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: .5px;
        }

        .title-area .sub {
            font-size: 12px;
            color: var(--dim);
            margin-top: 5px;
            letter-spacing: 1px;
        }

        .title-area .sub::before {
            content: "✦";
            margin-right: 5px;
            color: var(--warn);
        }

        .top-acts {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .btn {
            padding: 9px 14px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            background: linear-gradient(135deg, rgba(255,140,90,.24), rgba(150,110,255,.24));
            color: var(--txt);
            border: 1px solid rgba(255,255,255,.18);
            transition: transform .16s, box-shadow .16s, background .16s, border-color .16s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            line-height: 1;
            white-space: nowrap;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(255,130,90,.28);
            background: linear-gradient(135deg, rgba(255,140,90,.38), rgba(150,110,255,.38));
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff8b52, #e14b8a 55%, #7b5cff);
            color: #fff;
            border-color: rgba(255,255,255,.3);
            box-shadow: 0 4px 16px rgba(220,70,130,.3);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #ff9c66, #ea5d99 55%, #8c6dff);
            box-shadow: 0 8px 24px rgba(220,70,130,.45);
        }

        .btn-ghost {
            background: rgba(127,127,127,.14);
            border-color: rgba(127,127,127,.32);
            color: var(--txt);
        }

        .btn-ghost:hover {
            background: rgba(127,127,127,.24);
        }

        .btn-danger {
            background: linear-gradient(135deg, rgba(230,62,62,.26), rgba(230,62,62,.42));
            border-color: rgba(230,62,62,.5);
            color: var(--txt);
        }

        .btn-danger:hover {
            background: linear-gradient(135deg, rgba(240,70,70,.4), rgba(240,70,70,.55));
            box-shadow: 0 8px 22px rgba(240,70,70,.3);
        }

        .btn-sm {
            padding: 6px 10px;
            font-size: 11px;
            border-radius: 9px;
        }

        /* 四张玻璃统计卡 */
        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 11px;
            margin-top: 16px;
        }

        .card {
            position: relative;
            border-radius: 18px;
            padding: 14px 14px 13px;
            background: var(--card);
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.5), 0 0 0 1px rgba(255,255,255,.13);
            overflow: hidden;
            transition: transform .18s, box-shadow .18s;
            display: flex;
            flex-direction: column;
            min-height: 96px;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--accent, linear-gradient(90deg,#ff9a3d,#e14b8a));
        }

        .card::after {
            content: "";
            position: absolute;
            right: -24px; bottom: -24px;
            width: 90px; height: 90px;
            border-radius: 50%;
            background: var(--accent, linear-gradient(90deg,#ff9a3d,#e14b8a));
            opacity: .1;
            pointer-events: none;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 36px rgba(0,0,0,.32), 0 0 0 1px rgba(255,255,255,.2);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--dim);
            font-weight: 600;
            letter-spacing: .4px;
            position: relative;
            z-index: 1;
        }

        .card-icon {
            font-size: 19px;
            line-height: 1;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,.25));
        }

        .card-num {
            font-size: 32px;
            font-weight: 800;
            line-height: 1.1;
            margin-top: 5px;
            position: relative;
            z-index: 1;
            font-variant-numeric: tabular-nums;
        }

        .card-desc {
            font-size: 10.5px;
            color: var(--dim);
            margin-top: 3px;
            line-height: 1.45;
            position: relative;
            z-index: 1;
        }

        .card-num .unit {
            font-size: 12px;
            font-weight: 600;
            opacity: .7;
            margin-left: 3px;
        }

        /* 待复习数字呼吸脉冲 */
        @keyframes numPulse {
            0%, 100% { transform: scale(1); text-shadow: 0 0 0 rgba(255,190,80,0); }
            50% { transform: scale(1.09); text-shadow: 0 0 20px rgba(255,190,80,.75); }
        }

        .card-num.pulse {
            animation: numPulse 2.2s ease-in-out infinite;
            color: var(--warn);
        }

        /* 掌握率圆环（纯 CSS conic-gradient，无 canvas/svg） */
        .ring-wrap {
            position: relative;
            width: 52px;
            height: 52px;
            flex-shrink: 0;
            margin-top: 4px;
            border-radius: 50%;
            background:
                conic-gradient(var(--ring-color, #34d399) calc(var(--ring-pct, 0) * 1%), rgba(255,255,255,.09) 0);
            box-shadow: 0 4px 14px rgba(0,0,0,.2), inset 0 0 0 1px rgba(255,255,255,.1);
            transition: background .6s ease;
        }

        .ring-fill {
            position: absolute;
            inset: 5px;
            border-radius: 50%;
            background: var(--card, rgba(20,26,58,.85));
            box-shadow: inset 0 2px 6px rgba(0,0,0,.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            color: var(--txt);
            line-height: 1;
            overflow: hidden;
        }

        /* 操作栏 */
        .toolbar {
            display: flex;
            gap: 9px;
            margin-top: 16px;
            flex-wrap: wrap;
            align-items: center;
        }

        /* 标签筛选滚动条 */
        .filter-wrap {
            margin-top: 14px;
            background: var(--card);
            border-radius: 16px;
            padding: 11px 12px;
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.5), 0 0 0 1px rgba(255,255,255,.13);
        }

        .filter-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 9px;
        }

        .filter-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--txt);
        }

        .filter-title .cnt {
            color: var(--warn);
            margin-left: 5px;
        }

        .filter-opt {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10.5px;
            color: var(--dim);
        }

        .switch {
            position: relative;
            width: 32px;
            height: 18px;
            background: rgba(127,127,127,.34);
            border-radius: 999px;
            cursor: pointer;
            transition: background .18s;
            flex-shrink: 0;
            border: 1px solid rgba(127,127,127,.34);
        }

        .switch::after {
            content: "";
            position: absolute;
            top: 2px; left: 2px;
            width: 12px; height: 12px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 3px rgba(0,0,0,.3);
            transition: transform .18s ease;
        }

        .switch.on {
            background: linear-gradient(135deg,#ff9a3d,#e14b8a);
        }

        .switch.on::after {
            transform: translateX(14px);
        }

        .filter-scroll {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 2px 2px 7px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .filter-scroll::-webkit-scrollbar {
            height: 5px;
        }

        .filter-scroll::-webkit-scrollbar-track {
            background: rgba(127,127,127,.14);
            border-radius: 999px;
        }

        .filter-scroll::-webkit-scrollbar-thumb {
            background: rgba(255,160,100,.5);
            border-radius: 999px;
        }

        .chip {
            flex-shrink: 0;
            padding: 5.5px 12px;
            border-radius: 999px;
            font-size: 11.5px;
            font-weight: 600;
            background: rgba(127,127,127,.12);
            border: 1px solid rgba(127,127,127,.3);
            color: var(--dim);
            cursor: pointer;
            transition: all .16s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            user-select: none;
            white-space: nowrap;
        }

        .chip:hover {
            background: rgba(127,127,127,.22);
            color: var(--txt);
            transform: translateY(-1px);
        }

        .chip.on {
            background: var(--accent, linear-gradient(135deg,#ff9a3d,#e14b8a));
            color: #fff;
            border-color: rgba(255,255,255,.4);
            box-shadow: 0 4px 12px rgba(220,80,120,.3);
        }

        .chip .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--c, #ccc);
            flex-shrink: 0;
        }

        .chip.on .dot {
            background: #fff;
        }

        .chip .n {
            font-size: 9.5px;
            opacity: .65;
            font-weight: 700;
        }

        /* 错题列表 */
        .err-list {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .err-item {
            position: relative;
            background: var(--card);
            border-radius: 16px;
            padding: 13px 14px;
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.5), 0 0 0 1px rgba(255,255,255,.13);
            border-left: 3px solid var(--sc, #ff9a3d);
            cursor: pointer;
            transition: transform .16s, box-shadow .16s;
            animation: itemIn .32s ease both;
            overflow: hidden;
        }

        @keyframes itemIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .err-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(0,0,0,.3), 0 0 0 1px rgba(255,255,255,.2);
        }

        .err-item.done {
            opacity: .78;
        }

        .err-item.done .ei-q {
            text-decoration: line-through;
            text-decoration-color: rgba(255,255,255,.28);
        }

        /* 长按删除：进度条 */
        .ei-holdbar {
            position: absolute;
            left: 0; bottom: 0;
            height: 3px;
            width: 0;
            background: linear-gradient(90deg,#ff5a5a,#ff9a3d);
            border-radius: 0 3px 3px 0;
            z-index: 3;
        }

        .err-item.holding {
            border-color: rgba(255,90,90,.6);
            box-shadow: 0 0 0 2px rgba(255,90,90,.35), var(--shadow);
        }

        .err-item.shaking {
            animation: shakeX .4s ease;
        }

        @keyframes shakeX {
            0%,100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(5px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(3px); }
        }

        .ei-main {
            display: flex;
            gap: 11px;
            align-items: flex-start;
        }

        .ei-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--sc, #ff9a3d);
            flex-shrink: 0;
            margin-top: 6px;
            box-shadow: 0 0 9px var(--sc, #ff9a3d);
        }

        .ei-body {
            flex: 1;
            min-width: 0;
        }

        .ei-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 4px;
        }

        .ei-subject {
            font-size: 11px;
            font-weight: 800;
            color: var(--sc, #ff9a3d);
            padding: 2px 7px;
            border-radius: 7px;
            background: rgba(127,127,127,.13);
            border: 1px solid rgba(127,127,127,.3);
        }

        .stars {
            color: var(--txt);
            font-size: 11.5px;
            letter-spacing: 1px;
            line-height: 1;
        }

        .stars .filled {
            color: var(--warn);
            filter: drop-shadow(0 1px 3px rgba(255,180,60,.45));
        }

        .stars .off {
            opacity: .26;
            filter: none;
        }

        .type-tag {
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 999px;
            background: rgba(127,127,127,.13);
            border: 1px solid rgba(127,127,127,.3);
            color: var(--blue);
            font-weight: 600;
        }

        .review-badge {
            color: var(--txt);
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 999px;
            font-weight: 700;
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .rb-today {
            background: linear-gradient(135deg, rgba(255,170,40,.26), rgba(255,110,50,.26));
            border: 1px solid rgba(255,150,40,.6);
            color: var(--warn);
            animation: badgeBlink 2s ease-in-out infinite;
        }

        @keyframes badgeBlink {
            0%,100% { box-shadow: 0 0 0 rgba(255,190,80,0); }
            50% { box-shadow: 0 0 12px rgba(255,190,80,.55); }
        }

        .rb-future {
            background: rgba(80,150,255,.18);
            border: 1px solid rgba(80,150,255,.42);
            color: #9fd4ff;
        }

        .rb-done {
            background: rgba(40,190,140,.2);
            border: 1px solid rgba(40,190,140,.48);
            color: #5ee0a4;
        }

        .ei-q {
            font-size: 14px;
            font-weight: 600;
            color: var(--txt);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .err-item.open .ei-q {
            -webkit-line-clamp: unset;
            display: block;
        }

        .ei-hint {
            font-size: 10px;
            color: var(--dim);
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* 展开详情 */
        .ei-detail {
            max-height: 0;
            overflow: hidden;
            transition: max-height .36s ease, opacity .26s ease, margin .26s ease;
            opacity: 0;
            margin-top: 0;
        }

        .err-item.open .ei-detail {
            max-height: 720px;
            opacity: 1;
            margin-top: 12px;
        }

        .detail-inner {
            padding-top: 12px;
            border-top: 1px dashed var(--line);
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .d-row {
            font-size: 12.5px;
            line-height: 1.65;
            color: var(--txt);
            word-break: break-word;
        }

        .d-row .lbl {
            font-size: 10.5px;
            color: var(--dim);
            font-weight: 700;
            display: inline-block;
            margin-right: 7px;
            min-width: 52px;
        }

        .d-img {
            max-width: 220px;
            max-height: 160px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,.2);
            box-shadow: 0 6px 18px rgba(0,0,0,.3);
            cursor: zoom-in;
            display: block;
        }

        .d-reviewline {
            display: flex;
            gap: 7px;
            align-items: center;
            flex-wrap: wrap;
            font-size: 11px;
            color: var(--dim);
            padding: 8px 10px;
            border-radius: 11px;
            background: rgba(127,127,127,.08);
            border: 1px solid rgba(127,127,127,.22);
        }

        .d-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 3px;
        }

        /* 空状态 */
        .empty {
            margin-top: 14px;
            text-align: center;
            padding: 46px 18px 40px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.5), 0 0 0 1px rgba(255,255,255,.13);
        }

        .empty-ill {
            font-size: 62px;
            line-height: 1;
            display: block;
            margin-bottom: 14px;
            animation: emptyFloat 3.4s ease-in-out infinite;
            filter: drop-shadow(0 10px 22px rgba(255,140,80,.28));
        }

        @keyframes emptyFloat {
            0%,100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-9px) rotate(2deg); }
        }

        .empty-txt {
            font-size: 15px;
            font-weight: 700;
            color: var(--txt);
            margin-bottom: 6px;
        }

        .empty-sub {
            font-size: 12px;
            color: var(--dim);
            line-height: 1.7;
            margin-bottom: 18px;

            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow-y: auto;

        .overlay.show {

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }

        .modal {

            align-items: center;

            height: 28px;
            border-radius: 9px;
            border: 1px solid rgba(127,127,127,.32);
            background: rgba(127,127,127,.16);

            font-size: 14px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .16s;
            flex-shrink: 0;

            color: var(--txt);

            transform: rotate(90deg);

        /* 表单 */
        .field {

        .field > label {

            font-size: 12px;
            font-weight: 700;
            color: var(--txt);
            margin-bottom: 6px;

        .field > label .req {
            color: var(--red);
            margin-left: 3px;
        }

        .field > label .opt {
            color: var(--dim);
            font-weight: 500;
            font-size: 10.5px;
            margin-left: 4px;
        }

        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(127,127,127,.34);
            background: rgba(127,127,127,.12);

            background-position: right 11px center;
            padding-right: 30px;

        select option {
            background: #1a1f42;
            color: #fff;
        }

        .field-row {

            grid-template-columns: 1fr 1fr;
            gap: 10px;

        /* 星级选择 */

            display: flex;
            gap: 6px;
            align-items: center;
        }

            font-size: 25px;
            line-height: 1;
            cursor: pointer;
            color: rgba(127,127,127,.55);

        .star-pick .st:hover {
            transform: scale(1.22);
        }

        .star-pick .st-lbl {
            font-size: 11px;
            color: var(--dim);
            margin-left: 6px;
        }

        /* 图片上传 */
        .upload-box {
            border: 2px dashed rgba(127,127,127,.42);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all .18s;
            background: rgba(127,127,127,.08);
        }

        .upload-box:hover {
            border-color: rgba(255,150,80,.65);
            background: rgba(255,150,80,.08);
        }

        .upload-box .ub-icon {
            font-size: 26px;
            display: block;
            margin-bottom: 5px;
        }

        .upload-box .ub-txt {
            font-size: 12px;
            color: var(--txt);
            font-weight: 600;
        }

        .upload-box .ub-tip {
            font-size: 10px;
            color: var(--dim);
            margin-top: 3px;
        }

        .upload-prev {
            margin-top: 9px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .upload-prev img {
            width: 64px;
            height: 64px;
            object-fit: cover;
            border-radius: 11px;
            border: 1px solid rgba(255,255,255,.25);
            box-shadow: 0 5px 14px rgba(0,0,0,.3);
        }

        .upload-prev .up-info {
            font-size: 11px;
            color: var(--dim);
            line-height: 1.6;
        }

        .upload-prev .up-info b {
            color: var(--txt);
        }

        .up-del {
            margin-top: 5px;
            padding: 4px 10px;
            font-size: 10.5px;
            border-radius: 8px;
            border: 1px solid rgba(230,62,62,.45);
            background: rgba(230,62,62,.16);
            color: var(--red);
            cursor: pointer;
            font-family: inherit;
        }

        /* 弹窗底部 */
        .modal-foot {

            gap: 9px;
            justify-content: flex-end;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px dashed var(--line);

        .footer {

            background: var(--card);

            padding: 14px;
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.5), 0 0 0 1px rgba(255,255,255,.13);

        .footer-title {

            font-weight: 800;
            color: var(--txt);
            margin-bottom: 11px;
            display: flex;
            align-items: center;
            gap: 6px;

        .plan-grid {

            gap: 8px;
            margin-bottom: 12px;

            border: 1px solid rgba(127,127,127,.24);
            transition: all .18s;
            cursor: default;
        }

        .plan-cell.hot {
            background: linear-gradient(135deg, rgba(255,180,60,.18), rgba(255,110,60,.18));
            border-color: rgba(255,180,60,.42);
        }

        .plan-cell .pc-when {
            font-size: 11px;
            font-weight: 700;
            color: var(--txt);
        }

        .plan-cell.hot .pc-when {
            color: var(--warn);
        }

        .plan-cell .pc-when .due {
            margin-left: 5px;
            font-size: 9.5px;
            padding: 1.5px 5px;
            border-radius: 6px;
            background: rgba(255,170,40,.22);
            border: 1px solid rgba(255,150,40,.55);
            color: var(--warn);

        .plan-cell .pc-num {
            font-size: 19px;
            font-weight: 800;
            margin-top: 2px;
            line-height: 1.1;
        }

        .plan-cell .pc-num .u {
            font-size: 10px;
            font-weight: 600;
            opacity: .65;
            margin-left: 2px;
        }

        .plan-cell .pc-sub {
            font-size: 9.5px;
            color: var(--dim);
            margin-top: 2px;
            line-height: 1.4;
        }

        .data-acts {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding-top: 12px;
            border-top: 1px dashed var(--line);

        /* 图片查看器 */
        .viewer {

            inset: 0;
            background: rgba(4,5,14,.93);

            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            backdrop-filter: blur(10px);
        }

        .viewer.show {
            display: flex;
            animation: fadeIn .2s ease;
        }

        .viewer img {
            max-width: 92%;
            max-height: 84vh;
            border-radius: 14px;
            box-shadow: 0 22px 60px rgba(0,0,0,.6);
            animation: modalIn .26s ease;
        }

        .viewer-x {
            position: absolute;
            top: 16px; right: 16px;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.2);
            background: rgba(255,255,255,.09);
            color: #fff;
            font-size: 17px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Toast */
        .toast-wrap {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            pointer-events: none;
            width: calc(100% - 28px);
            max-width: 400px;
        }

        .toast {
            padding: 10px 17px;
            border-radius: 999px;
            background: rgba(24,28,58,.95);
            border: 1px solid rgba(255,255,255,.2);
            color: #fff;
            font-size: 12.5px;
            font-weight: 600;
            box-shadow: 0 12px 30px rgba(0,0,0,.45);
            display: flex;
            align-items: center;
            gap: 7px;
            animation: toastIn .26s cubic-bezier(.2,.9,.3,1.2);
            backdrop-filter: blur(10px);
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-16px) scale(.92); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .toast.ok { border-color: rgba(80,220,160,.55); }
        .toast.err { border-color: rgba(240,90,90,.55); }
        .toast.warn { border-color: rgba(255,190,80,.55); }

        .toast.out {
            animation: toastOut .24s ease forwards;
        }

        @keyframes toastOut {
            to { opacity: 0; transform: translateY(-14px) scale(.94); }
        }

        /* 响应式 */
        @media (max-width: 780px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
                gap: 9px;
            }

            .card-num {
                font-size: 27px;
            }

            .top-grid {
                grid-template-columns: 1fr;
            }

            .top-acts {
                justify-content: flex-start;
            }
        }

        @media (max-width: 480px) {

                padding: 12px 10px 80px;

            }

                font-size: 20px;

            }

            .plan-grid {
                grid-template-columns: 1fr 1fr;
            }

            .ei-q {
                font-size: 13px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }

        /* 排序行 / 提示文字 */
        .sort-wrap {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            align-items: center;
        }

        .list-info {
            font-size: 11px;
            color: var(--dim);
        }
