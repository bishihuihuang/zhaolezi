    <main id="zl-main" class="cy-page">
        <div class="cy-card">
            <h2>🧩 联想挑战</h2>
            <div class="sub">每次出现两个「八竿子打不着」的词。30 秒内，为它们架一座桥——讲出（或写出）它们之间的联系。想不出就换一组，量变产生质变。</div>
            <div class="score-pill" id="scorePill" style="margin-top:8px;">本局连上 0 组 · 累计 0 组</div>
            <div class="pair-box">
                <div class="word-card"><div class="big" id="w1">—</div><div class="dom" id="d1"></div></div>
                <div class="bridge-mark">⇄</div>
                <div class="word-card"><div class="big" id="w2">—</div><div class="dom" id="d2"></div></div>
            </div>
            <div class="cy-toolbar" style="margin-top:14px;">
                <input class="cy-input" id="bridgeInput" placeholder="写下你们的连接点（可选，写了更有收获）" style="flex:1;" aria-label="写下你们的连接点（可选，写了更有收获）">
                <button class="cy-btn" id="btnConnect">🔗 连上了</button>
                <button class="cy-btn cy-btn-ghost" id="btnNext">🎲 换一组</button>
            </div>
            <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
            <div class="timer-num" id="timerNum">⏱ 30 秒</div>
        </div>

        <div class="cy-card">
            <h2>📜 本局连线日志</h2>
            <div id="logBox"><div style="padding:16px;text-align:center;color:var(--zl-dim);font-size:13px;">连上第一组，日志就会出现在这里。</div></div>
            <div class="hint" style="font-size:12px;color:var(--zl-dim);margin-top:10px;line-height:1.8;">
                💡 训练要点：① 不要急着否定，任何连接都算；② 能连出「故事」比「分类」更高级；③ 刻意练习间隔效应——每天 5 分钟就够。
            </div>
        </div>
