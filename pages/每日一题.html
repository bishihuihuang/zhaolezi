<style>
    /* 每日一题 · 编辑风：骨架来自 ed.css，本页只管题目区 */
    body { overflow-x: hidden; }

    .back-line { margin: 0 0 8px; }
    .back-line a { font-size: 14px; color: var(--dim); text-decoration: none; }
    .back-line a:hover { color: var(--txt); }

    /* 题面：日期一行、题干一行大字 */
    #qMeta { font-size: 12.5px; letter-spacing: .06em; color: var(--dim); margin-bottom: 10px; }
    #qTitle { font-size: 20px; font-weight: 400; line-height: 1.8; min-height: 56px; max-width: var(--ed-measure, 68ch); }

    /* 答案区：答对/答错/查看 三态分色 */
    #qAnswer {
        display: none; margin-top: 16px; padding: 14px 16px; border-radius: 6px;
        background: var(--card-2); border-left: 2px solid var(--line);
        color: var(--txt); font-size: 14.5px; line-height: 1.85; max-width: var(--ed-measure, 68ch);
    }
    #qAnswer.good { background: color-mix(in srgb, var(--green) 7%, transparent); border-left-color: var(--green); }
    #qAnswer.bad { background: color-mix(in srgb, var(--red) 7%, transparent); border-left-color: var(--red); }

    /* 选项：整行发丝线幽灵键 */
    #qOpts { display: none; margin-top: 16px; flex-direction: column; gap: 8px; max-width: 560px; }
    .q-opt {
        font: inherit; text-align: left; white-space: normal;
        padding: 12px 16px; border-radius: 6px; cursor: pointer;
        border: 1px solid var(--line); background: none; color: var(--txt);
        transition: border-color .15s ease, color .15s ease;
    }
    .q-opt:hover { border-color: var(--blue); color: var(--blue); }

    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 20px; }
    .hint { font-size: 13px; color: var(--dim); margin-top: 10px; line-height: 1.8; max-width: var(--ed-measure, 68ch); }

    /* 按键：主=蓝实心；次=发丝线 */
    .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        border: 1px solid transparent; cursor: pointer; font-size: 15px; font-family: inherit;
        padding: 11px 24px; border-radius: 6px;
        background: var(--blue); color: var(--btn-txt);
        transition: filter .18s ease, border-color .18s ease;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: translateY(1px); }
    .btn-secondary { background: none; border-color: var(--line); color: var(--txt); }
    .btn-secondary:hover { border-color: var(--txt); filter: none; }
    .btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
    #doneMsg { margin-top: 12px; font-size: 14px; font-weight: 500; color: var(--txt); min-height: 20px; }

    /* 数据三位 */
    .stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 28px; margin-top: 40px; }
    .stat > div { border-top: 1px solid var(--line); padding: 12px 2px 2px; }
    .stat b { display: block; font-size: 28px; font-weight: 300; color: var(--txt); font-variant-numeric: tabular-nums; }
    .stat span { font-size: 12px; letter-spacing: .08em; color: var(--dim); }

    /* 转场遮罩（品牌件） */
    .overlay {
        position: fixed; inset: 0; z-index: 999999; display: flex; align-items: center; justify-content: center;
        background: rgba(8, 10, 25, .72); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
        opacity: 0; visibility: hidden; transition: opacity .4s ease, visibility .4s ease; pointer-events: none;
    }
    .overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }
    .loader-wrap { position: relative; width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; }
    .loader-ring { position: absolute; width: 100%; height: 100%; border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, .1); border-top-color: #f6d365; border-right-color: #fda085; animation: ringSpin .8s linear infinite; }
    .loader-ring::before { content: ''; position: absolute; inset: 22px; border-radius: 50%; border: 2px solid transparent;
        border-bottom-color: #a78bfa; border-left-color: var(--blue); animation: ringSpin 1.4s linear infinite reverse; }
    .loader-text { position: relative; z-index: 5; font-size: 20px; font-weight: 700; letter-spacing: 4px; color: var(--card-2); }
    @keyframes ringSpin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
        .stat { grid-template-columns: 1fr 1fr; }
        .stat > div:nth-child(3) { grid-column: 1 / -1; }
    }
</style>

<style data-no-obf>/* 全站打磨层 V3.0 */
/* ==================================================================
   全站通用打磨层（V3.0 · 综合提升）
   追加到 common.css / xd-common.css / cy-common.css 末尾，级联覆盖全站。
   设计原则：
   - 零破坏：:where() 包裹 = 零特异性，绝不覆盖页面既有样式；不设 margin/尺寸/定位。
   - 主题自适应：一律 var(--zl-*，fallback)，不引入新硬编码色。
   - 不变量：不改任何布局结构、跳转逻辑、找乐子主题。
   - 提升：可访问性（焦点/减少动效/色彩方案/触摸）、可读性（tabular-nums）、
           交互反馈（hover/active 过渡）、文本健壮性（长词换行）。
   ================================================================== */

/* 1. 原生控件随系统深浅色自适应（修复滚动条/输入框/下拉在深色下刺眼白块） */
:root { color-scheme: light dark; }

/* 2. 触摸设备消除双击缩放延迟（移动端点按更跟手） */
html { -webkit-tap-highlight-color: transparent; }
:where(a, button, [role="button"], input, select, textarea, summary, label:has(input), [tabindex]):not([disabled]) {
    touch-action: manipulation;
}

/* 3. 键盘焦点统一可见（:where 零特异性 + !important 压过页面 outline:none）
      仅键盘触发（focus-visible），鼠标点击不出现，不打扰普通点击用户 */
:where(a, button, [role="button"], input, select, textarea, summary, [tabindex], [contenteditable]):focus-visible {
    outline: 3px solid var(--zl-accent, var(--gold, #f6d365)) !important;
    outline-offset: 2px !important;
    border-radius: 6px;
}

/* 4. 交互反馈：hover/active 平滑过渡（仅列属性，不用 transition:all） */
:where(a, button, [role="button"], summary, [tabindex]):where(:not([disabled])) {
    transition: color .15s ease, background-color .15s ease, border-color .15s ease, box-shadow .15s ease, opacity .15s ease;
}

/* 5. 文本健壮性：长英文词/URL 在窄屏不再撑破容器 */
:where(p, li, dd, dt, td, th, figcaption, blockquote, h1, h2, h3, h4, h5, h6, a, span, div) {
    overflow-wrap: break-word;
}

/* 6. 数字对齐：统计/计数/表格数字用等宽数字，跳动更整齐 */
:where(td, .stat, .stat-num, .count, .num, [data-num]) {
    font-variant-numeric: tabular-nums;
}

/* 6b. 图片响应式：窄屏不撑破容器、保持比例不失真（未显式设尺寸的图更稳） */
:where(img, picture, video) {
    max-width: 100%;
    height: auto;
}

/* 7. 尊重系统"减少动态效果"（兜底层：common.css 已有，此处保证三家族全覆盖）
      用 :where 包裹，特异性为 0，页面更具体的动效规则仍可生效 */
@media (prefers-reduced-motion: reduce) {
    :where(*, *::before, *::after) {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important;
    }
}

/* 8. 打印友好：隐藏固定悬浮件，正文铺满（低成本加分项） */
@media print {
    :where([class*="fab"], [class*="float"], [class*="dock"], nav.zl-crumb, .zl-skip-link) {
        display: none !important;
    }
}
