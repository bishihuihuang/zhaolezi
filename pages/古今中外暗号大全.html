<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找乐子——古今中外暗号大全</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "KaiTi", "STKaiti", "FangSong", "Microsoft YaHei", serif;
            min-height: 100vh;
            background: var(--bg);
            color: var(--txt);
            overflow-x: hidden;
        }
        
        /* 背景动画 */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            /* 六主题适配：金色光晕随主题（原 goldenFlow 背景位移动画移除，触性能铁律） */
            background: radial-gradient(ellipse at 50% -10%, color-mix(in srgb, var(--gold) 14%, transparent), transparent 65%);
        }
        .bg-animation::after {
            content: '';
            position: absolute;
            top: -20%;
            left: -20%;
            width: 120%;
            height: 120%;
            background: radial-gradient(ellipse, color-mix(in srgb, var(--gold) 16%, transparent), transparent 60%);
            animation: lightDrift 8s ease-in-out infinite alternate;
            z-index: 1;
        }
        @keyframes lightDrift {
            0% { transform: translate(-10%, -10%) scale(1); }
            50% { transform: translate(10%, 10%) scale(1.1); }
            100% { transform: translate(-10%, 10%) scale(0.9); }
        }
        
        /* 雪花飘落 */
        .snowflake {
            position: fixed;
            top: -10px;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0.8;
            pointer-events: none;
            z-index: 1;
            animation: snowFall linear infinite;
        }
        @keyframes snowFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0.2; }
        }
        
        /* 网格布局 */
        main {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 0;
        }
        .container {
            width: 94%;
            max-width: 1300px;
            background: var(--card);
            border-radius: 8px;
            box-shadow: 0 15px 50px color-mix(in srgb, var(--gold) 30%, transparent);
            padding: 10px;
            margin-top: 20px;
            border: 2px solid var(--gold);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(8, minmax(70px, auto));
            gap: 10px;
        }
        .cell {
            border-radius: 6px;
            border: 1px solid color-mix(in srgb, var(--gold) 45%, transparent);
            background: color-mix(in srgb, var(--card-2) 50%, transparent);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            position: relative;
        }
        .title-area {
            grid-row: 1 / 3;
            grid-column: 1 / 5;
            background: var(--blue);
            border: 2px solid color-mix(in srgb, var(--btn-txt) 30%, transparent);
            40%, transparent);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .title-area h1 {
            font-size: 42px;
            font-weight: 500;
            color: var(--btn-txt);
            letter-spacing: 6px;
            text-shadow: 2px 2px 0 color-mix(in srgb, var(--card-2) 70%, transparent);
        }
        .title-area small {
            font-size: 14px;
            letter-spacing: 4px;
            color: color-mix(in srgb, var(--btn-txt) 88%, transparent);
            margin-top: 6px;
        }
        .back-area {
            grid-row: 1 / 3;
            grid-column: 5 / 7;
            background: var(--blue);
            border: 2px solid color-mix(in srgb, var(--btn-txt) 30%, transparent);
            color: var(--btn-txt);
            text-decoration: none;
            font-weight: 500;
            font-size: 22px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: color .3s, background-color .3s, border-color .3s, opacity .3s, transform .3s, box-shadow .3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80px;
            min-width: 44px;
        }
        .back-area:hover {
            filter: brightness(1.1);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px color-mix(in srgb, var(--gold) 40%, transparent);
        }
        
        /* 纯白文本区域：左右两列 */
        .display-area {
            grid-row: 3 / 9;
            grid-column: 1 / 7;
            background: var(--card-2);
            border: none;
            border-radius: 6px;
            padding: 0;
            min-height: 400px;
            position: relative;
            display: flex;
            flex-direction: row;
            overflow: hidden;
        }
        
        /* 左侧：输入区 */
        .left-panel {
            flex: 0 0 280px;
            padding: 10px;
            border-right: 2px solid color-mix(in srgb, var(--gold) 45%, transparent);
            background: var(--card-2);
            display: flex;
            flex-direction: column;
        }
        .display-header {
            display: block;
            margin: 0;
            color: var(--gold);
            font-size: 20px;
            font-weight: bold;
            white-space: nowrap;
            letter-spacing: 1px;
            text-align: left;
        }
        #secretInput {
            display: block;
            width: 100%;
            padding: 8px 0;
            border: none;
            outline: none;
            background: transparent;
            font-family: "KaiTi", serif;
            font-size: 18px;
            color: var(--txt);
            min-height: 44px;
        }
        #secretInput::placeholder {
            color: color-mix(in srgb, var(--gold) 70%, transparent);
        }
        
        /* 新增：刷新按钮样式 */
        .refresh-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: var(--blue);
            border: none;
            border-radius: 8px;
            color: var(--btn-txt);
            font-family: "KaiTi", "STKaiti", serif;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 15px color-mix(in srgb, var(--gold) 40%, transparent);
            transition: color .3s ease, background-color .3s ease, border-color .3s ease, opacity .3s ease, transform .3s ease, box-shadow .3s ease;
            letter-spacing: 3px;
            min-height: 44px;
        }
        .refresh-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px color-mix(in srgb, var(--gold) 60%, transparent);
            filter: brightness(1.1);
        }
        .refresh-btn:active {
            transform: translateY(0) scale(.96);
            transition-duration: .1s;
        }
        
        /* 右侧：媒体显示区 */
        .right-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
            background: var(--card-2);
            flex-direction: column;
        }
        
        /* 媒体自适应显示 */
        .display-video,
        .display-audio,
        .display-image {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            margin-top: 10px;
        }
        .display-audio {
            width: 80%;
        }
        .display-file-label {
            font-size: 18px;
            font-style: normal;
            color: var(--gold-2);
            margin-top: 5px;
            text-align: center;
        }
        .output-content {
            margin-top: 6px;
            font-size: 30px;
            line-height: 1.8;
            white-space: pre-wrap;
            color: var(--gold-2);
            text-align: center;
        }
        
        /* 国风转场 */
        .transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999999;
            background: color-mix(in srgb, var(--gold) 18%, var(--bg));
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            -webkit-opacity: 0;
            -webkit-transition: opacity .4s ease;
            transition: opacity .4s ease;
            pointer-events: none;
            will-change: opacity;
        }
        .transition-overlay.active {
            opacity: 1;
            -webkit-opacity: 1;
            pointer-events: auto;
        }
        .transition-overlay .gold-ring {
            position: relative;
            width: 180px;
            height: 180px;
            border: 4px solid var(--gold);
            border-radius: 50%;
            animation: goldenPulse 1.2s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .transition-overlay .gold-ring::before {
            content: '';
            position: absolute;
            inset: 20px;
            border: 2px dashed color-mix(in srgb, var(--gold) 60%, transparent);
            animation: spinRing 4s linear infinite;
        }
        @keyframes goldenPulse {
            0%, 100% { transform: scale(1); 55%, transparent); }
            50% { transform: scale(1.1); 70%, transparent); }
        }
        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }
        .transition-overlay .find-text {
            font-family: "KaiTi", "STKaiti", serif;
            font-size: 32px;
            font-weight: 500;
            color: #c2255c;
            letter-spacing: 6px;
            z-index: 2;
            background: color-mix(in srgb, var(--card-2) 55%, transparent);
            padding: 6px 16px;
            border-radius: 40px;
            white-space: nowrap;
            -webkit-white-space: nowrap;
            display: inline-block;
            text-align: center;
            line-height: 1.2;
        }
        
        /* Toast提示 */
        .toast-msg {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card);
            color: var(--txt);
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-family: "KaiTi", "STKaiti", serif;
            z-index: 9999999;
            box-shadow: none;
            transition: opacity .3s ease, transform .3s ease;
            pointer-events: none;
        }
        
        /* 响应式 */
        @media (max-width: 900px) {
            .grid { gap: 6px; }
            .title-area h1 { font-size: 28px; }
            .back-area { font-size: 18px; }
        }
        @media (max-width: 600px) {
            .container { width: 98%; }
            .grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: auto; }
            .title-area { grid-row: 1; grid-column: 1/3; }
            .back-area { grid-row: 2; grid-column: 1/3; }
            .display-area { grid-row: 3; grid-column: 1/3; min-height: 300px; flex-direction: column; }
            .left-panel { flex: none; width: 100%; border-right: none; border-bottom: 2px solid color-mix(in srgb, var(--gold) 45%, transparent); }
            .right-panel { flex: none; width: 100%; min-height: 300px; }
        }
    
        /* ========== 手机端响应式适配（通用） ========== */
        @media (max-width: 768px) {
            html, body {
                overflow-x: hidden;
                width: 100%;
            }
            main {
                padding: 70px 0 30px !important;
            }
            .container, .card-container, .wrapper, .box, .panel, .form-box {
                width: 94% !important;
                max-width: 94vw !important;
                padding: 14px !important;
                margin: 0 auto !important;
            }
            /* 6列/多列网格改3列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 8px !important;
                padding: 4px !important;
            }
            /* 大区域占满整行 */
            .title-area, .back-area, .display-area, .game-main,
            .calculator-area, .main-area, .content-area, .result-area,
            .input-area, .output-area, .board-area, .info-area, .settings-area {
                grid-column: 1 / -1 !important;
                grid-row: auto !important;
            }
            /* 左右分栏改上下堆叠 */
            .left-panel, .right-panel, .side-panel, .sidebar {
                flex: 1 1 100% !important;
                width: 100% !important;
                border-right: none !important;
                border-bottom: 1px solid var(--line) !important;
            }
            .display-area, .game-main, .calculator-area {
                flex-direction: column !important;
                padding: 12px !important;
            }
            .cell, .tool-cell, .grid-cell {
                padding: 10px 6px !important;
                min-height: 70px !important;
            }
            h1, h2, h3, .title-text, .author-name, .main-title {
                font-size: 22px !important;
                letter-spacing: 1px !important;
            }
            .btn, button, input, select, textarea {
                font-size: 14px !important;
                padding: 10px 14px !important;
            }
            .ghost-btn, .back-btn, .return-btn {
                padding: 8px 16px !important;
                font-size: 13px !important;
            }
            /* 隐藏非必要装饰元素 */
            .orb, .decoration, .deco-element, .floating-shape {
                display: none !important;
            }
        }
        @media (max-width: 480px) {
            .container, .card-container, .wrapper, .box {
                width: 96% !important;
                padding: 10px !important;
            }
            /* 小屏手机改2列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 6px !important;
            }
            h1, h2, h3, .title-text, .author-name {
                font-size: 18px !important;
            }
            .cell, .tool-cell {
                min-height: 80px !important;
                padding: 8px 4px !important;
            }
            .btn, button {
                font-size: 13px !important;
                padding: 8px 12px !important;
            }
        }
</style>

<style data-no-obf>/* 全站打磨层 V3.0 */
/* ==================================================================
   全站通用打磨层（V3.0 · 综合提升）
   追加到 common.css / xd-common.css / cy-common.css 末尾，级联覆盖全站。
   设计原则：
   - 零破坏：:where() 包裹 = 零特异性，绝不覆盖页面既有样式；不设 margin/尺寸/定位。
   - 主题自适应：一律 var(--zl-*，fallback)，不引入新硬编码色。
   - 不变量：不改任何布局结构、跳转逻辑、找乐子主题。
   - 提升：可访问性（焦点/减少动效/色彩方案/触摸）、可读性（tabular-nums）、
           交互反馈（hover/active 过渡）、文本健壮性（长词换行）。
   ================================================================== */

/* 1. 原生控件随系统深浅色自适应（修复滚动条/输入框/下拉在深色下刺眼白块） */
:root { color-scheme: light dark; }

/* 2. 触摸设备消除双击缩放延迟（移动端点按更跟手） */
html { -webkit-tap-highlight-color: transparent; }
:where(a, button, [role="button"], input, select, textarea, summary, label:has(input), [tabindex]):not([disabled]) {
    touch-action: manipulation;
}

/* 3. 键盘焦点统一可见（:where 零特异性 + !important 压过页面 outline:none）
      仅键盘触发（focus-visible），鼠标点击不出现，不打扰普通点击用户 */
:where(a, button, [role="button"], input, select, textarea, summary, [tabindex], [contenteditable]):focus-visible {
    outline: 3px solid var(--zl-accent, var(--gold, #f6d365)) !important;
    outline-offset: 2px !important;
    border-radius: 6px;
}

/* 4. 交互反馈：hover/active 平滑过渡（仅列属性，不用 transition:all） */
:where(a, button, [role="button"], summary, [tabindex]):where(:not([disabled])) {
    transition: color .15s ease, background-color .15s ease, border-color .15s ease, box-shadow .15s ease, opacity .15s ease;
}

/* 5. 文本健壮性：长英文词/URL 在窄屏不再撑破容器 */
:where(p, li, dd, dt, td, th, figcaption, blockquote, h1, h2, h3, h4, h5, h6, a, span, div) {
    overflow-wrap: break-word;
}

/* 6. 数字对齐：统计/计数/表格数字用等宽数字，跳动更整齐 */
:where(td, .stat, .stat-num, .count, .num, [data-num]) {
    font-variant-numeric: tabular-nums;
}

/* 6b. 图片响应式：窄屏不撑破容器、保持比例不失真（未显式设尺寸的图更稳） */
:where(img, picture, video) {
    max-width: 100%;
    height: auto;
}

/* 7. 尊重系统"减少动态效果"（兜底层：common.css 已有，此处保证三家族全覆盖）
      用 :where 包裹，特异性为 0，页面更具体的动效规则仍可生效 */
@media (prefers-reduced-motion: reduce) {
    :where(*, *::before, *::after) {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important;
    }
}

/* 8. 打印友好：隐藏固定悬浮件，正文铺满（低成本加分项） */
@media print {
    :where([class*="fab"], [class*="float"], [class*="dock"], nav.zl-crumb, .zl-skip-link) {
        display: none !important;
    }
}

</style>

            <summary>暗号是什么</summary>
            <div class="ed-fold-body"><p>暗号的正式名字叫<strong>黑话或切口</strong>：行内人用固定的上下句确认身份，行外人听着像日常对话。最出名的一句当属「天王盖地虎，宝塔镇河妖」——出自评书与剿匪题材，上下句必须严丝合缝。</p><p>这套玩法历史很久：宋代市井有「隐语」，江湖行当各有切口，近代电报时代又发展出摩斯短句与书页密码（约定第几页第几行）。</p><p>本页收录了古今中外的经典暗号，并提供随机抽取——和朋友互相考上下句，是它最好玩的用法。</p></div>
