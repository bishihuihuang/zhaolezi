<style>
    /* 成就中心 · 编辑风：骨架来自 ed.css，本页只定义各区块的细节 */
    body { overflow-x: hidden; }

    .back-line { margin: 0 0 8px; }
    .back-line a { font-size: 14px; color: var(--dim); text-decoration: none; }
    .back-line a:hover { color: var(--txt); }

    .sec { margin-top: 40px; }
    .sec-title {
        font-size: 12.5px; font-weight: 500; letter-spacing: .16em;
        color: var(--dim); margin-bottom: 14px;
    }
    .sec-title b { color: var(--txt); font-weight: 500; letter-spacing: 0; font-size: 17px; margin-right: 10px; }

    /* 数据三位：大数字 + 小标签，发丝线承起 */
    .stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 28px; }
    .stat > div { border-top: 1px solid var(--line); padding: 12px 2px 2px; text-align: left; }
    .stat b { display: block; font-size: 28px; font-weight: 300; color: var(--txt); font-variant-numeric: tabular-nums; }
    .stat span { font-size: 12px; letter-spacing: .08em; color: var(--dim); }

    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; justify-content: center; }
    .hint { font-size: 13px; color: var(--dim); margin-top: 10px; line-height: 1.8; }

    /* 主按键：主题蓝实心；次按键：发丝线 */
    .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        border: 1px solid transparent; cursor: pointer; font-size: 15px; font-family: inherit;
        padding: 11px 24px; border-radius: 6px;
        background: var(--blue); color: var(--btn-txt);
        transition: filter .18s ease, border-color .18s ease;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: translateY(1px); }
    .btn-secondary { background: none; border-color: var(--line); color: var(--txt); }
    .btn-secondary:hover { border-color: var(--txt); filter: none; }
    .btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
    #checkinMsg { text-align: center; margin-top: 12px; font-size: 14px; color: var(--red); font-weight: 500; min-height: 20px; }

    /* 头衔进度：一根安静的蓝线 */
    .title-next { margin-top: 14px; font-size: 13px; color: var(--dim); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .title-next b { color: var(--txt); font-weight: 500; }
    .title-bar { flex: 1; min-width: 140px; height: 3px; background: var(--card-2); border-radius: 999px; overflow: hidden; }
    .title-bar i { display: block; height: 100%; background: var(--blue); border-radius: 999px; transition: width .5s ease; }

    /* 筛选：发丝线 chips，选中=蓝 */
    .tier-tabs, .cat-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .tier-tab, .cat-chip {
        border: 1px solid var(--line); background: none; color: var(--dim);
        border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer;
        font-family: inherit; transition: border-color .18s ease, color .18s ease;
    }
    .tier-tab:hover, .cat-chip:hover { border-color: var(--txt); color: var(--txt); }
    .tier-tab.active, .cat-chip.active { border-color: var(--blue); color: var(--blue); background: color-mix(in srgb, var(--blue) 7%, transparent); }
    #achProgress { margin: 6px 0 4px; font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }

    /* 成就卡：留白围出来的一格，稀有度只给一条边 */
    #badgeGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0 28px; margin-top: 8px; }
    .ach-card {
        position: relative; border: none; border-top: 1px solid var(--line); border-radius: 0;
        padding: 16px 6px 18px; text-align: center; background: none;
        transition: border-color .2s ease;
    }
    .ach-card:hover { border-top-color: var(--txt); }
    .ach-card .ic { font-size: 28px; line-height: 1.2; }
    .ach-card .nm { font-size: 13.5px; font-weight: 500; margin-top: 8px; line-height: 1.4; }
    .ach-card .ds { font-size: 12px; margin-top: 4px; color: var(--dim); line-height: 1.6; }
    .ach-card .hw { font-size: 12px; margin-top: 8px; color: var(--gold-2-ink);
        background: color-mix(in srgb, var(--gold-2) 7%, transparent); border-radius: 6px; padding: 4px 8px; line-height: 1.5; }
    .ach-card .pts { position: absolute; top: 14px; right: 6px; font-size: 12px; color: var(--blue); font-variant-numeric: tabular-nums; }
    .ach-card .tm { font-size: 12px; color: var(--dim); margin-top: 6px; }
    .ach-card.locked { opacity: .78; filter: grayscale(.6); }
    .ach-card.locked .hw { display: block; }
    .ach-card.fog { opacity: .45; filter: grayscale(1); }
    .ach-card.fog .ds, .ach-card.fog .hw { display: none; }
    .ach-card .prog { margin-top: 8px; }
    .ach-card .prog .bar { height: 3px; background: var(--card-2); border-radius: 999px; overflow: hidden; }
    .ach-card .prog .bar i { display: block; height: 100%; border-radius: 999px; background: var(--blue); }
    .ach-card .prog .tx { font-size: 12px; color: var(--dim); margin-top: 4px; font-variant-numeric: tabular-nums; }
    .tier-badge { display: inline-block; font-size: 12px; border-radius: 999px; padding: 1px 8px; margin-top: 6px;
        border: 1px solid currentColor; color: var(--dim); }
    .grid-empty { grid-column: 1/-1; text-align: center; color: var(--dim); padding: 28px 0; font-size: 13.5px; }

    /* 转场遮罩（品牌件） */
    .overlay {
        position: fixed; inset: 0; z-index: 999999; display: flex; align-items: center; justify-content: center;
        background: rgba(8, 10, 25, .72); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
        opacity: 0; visibility: hidden; transition: opacity .4s ease, visibility .4s ease; pointer-events: none;
    }
    .overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }
    .loader-wrap { position: relative; width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; }
    .loader-ring { position: absolute; width: 100%; height: 100%; border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, .1); border-top-color: #f6d365; border-right-color: #fda085; animation: ringSpin .8s linear infinite; }
    .loader-ring::before { content: ''; position: absolute; inset: 22px; border-radius: 50%; border: 2px solid transparent;
        border-bottom-color: #a78bfa; border-left-color: var(--blue); animation: ringSpin 1.4s linear infinite reverse; }
    .loader-text { position: relative; z-index: 5; font-size: 20px; font-weight: 700; letter-spacing: 4px; color: var(--card-2); }
    @keyframes ringSpin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
        .stat { grid-template-columns: 1fr 1fr; }
        .stat > div:nth-child(3) { grid-column: 1 / -1; }
        #badgeGrid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    }
</style>

<style data-no-obf>/* 全站打磨层 V3.0 */
/* ==================================================================
   全站通用打磨层（V3.0 · 综合提升）
   追加到 common.css / xd-common.css / cy-common.css 末尾，级联覆盖全站。
   设计原则：
   - 零破坏：:where() 包裹 = 零特异性，绝不覆盖页面既有样式；不设 margin/尺寸/定位。
   - 主题自适应：一律 var(--zl-*，fallback)，不引入新硬编码色。
   - 不变量：不改任何布局结构、跳转逻辑、找乐子主题。
   - 提升：可访问性（焦点/减少动效/色彩方案/触摸）、可读性（tabular-nums）、
           交互反馈（hover/active 过渡）、文本健壮性（长词换行）。
   ================================================================== */

/* 1. 原生控件随系统深浅色自适应（修复滚动条/输入框/下拉在深色下刺眼白块） */
:root { color-scheme: light dark; }

/* 2. 触摸设备消除双击缩放延迟（移动端点按更跟手） */
html { -webkit-tap-highlight-color: transparent; }
:where(a, button, [role="button"], input, select, textarea, summary, label:has(input), [tabindex]):not([disabled]) {
    touch-action: manipulation;
}

/* 3. 键盘焦点统一可见（:where 零特异性 + !important 压过页面 outline:none）
      仅键盘触发（focus-visible），鼠标点击不出现，不打扰普通点击用户 */
:where(a, button, [role="button"], input, select, textarea, summary, [tabindex], [contenteditable]):focus-visible {
    outline: 3px solid var(--zl-accent, var(--gold, #f6d365)) !important;
    outline-offset: 2px !important;
    border-radius: 6px;
}

/* 4. 交互反馈：hover/active 平滑过渡（仅列属性，不用 transition:all） */
:where(a, button, [role="button"], summary, [tabindex]):where(:not([disabled])) {
    transition: color .15s ease, background-color .15s ease, border-color .15s ease, box-shadow .15s ease, opacity .15s ease;
}

/* 5. 文本健壮性：长英文词/URL 在窄屏不再撑破容器 */
:where(p, li, dd, dt, td, th, figcaption, blockquote, h1, h2, h3, h4, h5, h6, a, span, div) {
    overflow-wrap: break-word;
}

/* 6. 数字对齐：统计/计数/表格数字用等宽数字，跳动更整齐 */
:where(td, .stat, .stat-num, .count, .num, [data-num]) {
    font-variant-numeric: tabular-nums;
}

/* 6b. 图片响应式：窄屏不撑破容器、保持比例不失真（未显式设尺寸的图更稳） */
:where(img, picture, video) {
    max-width: 100%;
    height: auto;
}

/* 7. 尊重系统"减少动态效果"（兜底层：common.css 已有，此处保证三家族全覆盖）
      用 :where 包裹，特异性为 0，页面更具体的动效规则仍可生效 */
@media (prefers-reduced-motion: reduce) {
    :where(*, *::before, *::after) {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important;
    }
}

/* 8. 打印友好：隐藏固定悬浮件，正文铺满（低成本加分项） */
@media print {
    :where([class*="fab"], [class*="float"], [class*="dock"], nav.zl-crumb, .zl-skip-link) {
        display: none !important;
    }
}

</style>
