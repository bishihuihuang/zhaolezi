<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记忆配对游戏 - 找乐子</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            min-height: 100vh;
            background: var(--bg);
            color: var(--txt);
            overflow-x: hidden;
            position: relative;
        }

        /* ===== 背景流光层 ===== */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-flow-1 {
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: var(--flow-grad);
            background-size: 400% 400%;
            animation: flowGradient 20s ease-in-out infinite;
            will-change: background-position;
        }

        .bg-flow-2 {
            position: absolute;
            top: -60%;
            left: -40%;
            width: 220%;
            height: 220%;
            background: radial-gradient(ellipse at 30% 70%,
                    rgba(255, 140, 100, .35), transparent 50%),
                radial-gradient(ellipse at 65% 35%,
                    rgba(120, 180, 255, .3), transparent 45%),
                radial-gradient(ellipse at 80% 80%,
                    rgba(220, 130, 250, .25), transparent 40%);
            animation: flowDrift 20s ease-in-out infinite alternate;
            will-change: transform;
        }

        .bg-flow-3 {
            position: absolute;
            top: -30%;
            left: -20%;
            width: 180%;
            height: 180%;
            background: radial-gradient(circle at 50% 50%,
                    rgba(255, 200, 130, .15), transparent 60%),
                radial-gradient(circle at 20% 80%,
                    rgba(80, 220, 200, .2), transparent 50%);
            animation: flowRotate 20s linear infinite;
            will-change: transform;
        }

        @keyframes flowGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes flowDrift {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(3%, -4%) scale(1.05) rotate(5deg); }
            100% { transform: translate(-2%, 3%) scale(.97) rotate(-5deg); }
        }

        @keyframes flowRotate {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.08); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* ===== 悬浮球 ===== */
        .orb {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%,
                    color-mix(in srgb, var(--card-2) 60%, transparent),
                    color-mix(in srgb, var(--card-2) 15%, transparent) 50%,
                    transparent 70%);
            box-shadow: 0 0 60px color-mix(in srgb, var(--glow) 8%, transparent),
                inset 0 0 30px color-mix(in srgb, var(--card-2) 20%, transparent);
            pointer-events: none;
            will-change: transform, opacity;
        }

        .orb-1 { width: 260px; height: 260px; top: 12%; left: 8%; animation: orbFloatA 18s ease-in-out infinite, orbSpin 40s linear infinite; }
        .orb-2 { width: 160px; height: 160px; top: 55%; left: 75%; animation: orbFloatB 22s ease-in-out infinite, orbSpin 55s linear infinite; }
        .orb-3 { width: 110px; height: 110px; top: 68%; left: 20%; animation: orbFloatA 16s ease-in-out infinite reverse, orbSpin 35s linear infinite; }
        .orb-4 { width: 220px; height: 220px; top: 28%; left: 60%; animation: orbFloatB 20s ease-in-out infinite reverse, orbSpin 50s linear infinite; }
        .orb-5 { width: 80px; height: 80px; top: 80%; left: 45%; animation: orbFloatA 14s ease-in-out infinite, orbSpin 30s linear infinite; }

        @keyframes orbFloatA {
            0% { transform: translate(0,0) scale(1); opacity:.6; }
            30% { transform: translate(18px,-22px) scale(1.04); opacity:.8; }
            60% { transform: translate(-12px,10px) scale(.96); opacity:.5; }
            100% { transform: translate(0,0) scale(1); opacity:.6; }
        }

        @keyframes orbFloatB {
            0% { transform: translate(0,0) scale(1); opacity:.5; }
            35% { transform: translate(-20px,12px) scale(1.06); opacity:.7; }
            70% { transform: translate(14px,-15px) scale(.94); opacity:.4; }
            100% { transform: translate(0,0) scale(1); opacity:.5; }
        }

        @keyframes orbSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== 主容器 ===== */
        main {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 60px 20px 40px;
        }

        .container {
            width: 80%;
            max-width: 1440px;
            background: background: var(--card);
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, .35),
                0 0 0 1px var(--line),
                
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            padding: 20px;
            color: var(--txt);
        }

        .container::-webkit-scrollbar { width: 10px; }
        .container::-webkit-scrollbar-track { background: rgba(0, 0, 0, .04); border-radius: 12px; }
        .container::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 12px; border: 2px solid transparent; }

        /* ===== 网格布局 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(8, minmax(80px, auto));
            gap: 12px;
        }

        .title-area {
            grid-column: 1 / 5;
            grid-row: 1 / 3;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gold-3-grad);
            background-size: 300% 300%;
            /* 已移除：background-position 位移动画 */
            border-radius: 20px;
            box-shadow: 0 12px 40px color-mix(in srgb, var(--gold-2) 35%, transparent),
                inset 0 1px 0 color-mix(in srgb, var(--card-2) 40%, transparent);
        }

        .title-area h2 {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 4px;
            color: var(--btn-txt);
            text-shadow: 2px 2px 10px rgba(0, 0, 0, .3);
        }

/* t4: 已令牌化移除 */
/* t4: 已令牌化移除 */
/* t4: 已令牌化移除 */
/* t4: 已令牌化移除 */
/* t4: 已令牌化移除 */

        .back-area {
            grid-column: 5 / 7;
            grid-row: 1 / 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--back-grad);
            border-radius: 20px;
            box-shadow: 0 12px 40px color-mix(in srgb, var(--green) 40%, transparent),
                inset 0 1px 0 color-mix(in srgb, var(--card-2) 40%, transparent);
            text-decoration: none;
            color: var(--btn-txt);
            font-size: 22px;
            font-weight: 800;
            cursor: pointer;
            transition: transform .3s, box-shadow .3s;
            min-height: 80px;
            min-width: 44px;
        }

        .back-area:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 50px color-mix(in srgb, var(--green) 50%, transparent);
        }

        .back-area:active {
            transform: translateY(-2px) scale(.96);
        }

        /* ===== 游戏区域 ===== */
        .game-area {
            grid-column: 1 / 7;
            grid-row: 3 / 9;
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 600px;
            margin-bottom: 10px;
        }

        .score-board {
            background: color-mix(in srgb, var(--glow) 5%, var(--card-2));
            border-radius: 30px;
            padding: 8px 20px;
            font-size: 15px;
            font-weight: 700;
            color: var(--txt);
            box-shadow: 0 2px 8px rgba(0, 0, 0, .05);
        }

        .new-game-btn {
            padding: 8px 18px;
            border: none;
            border-radius: 30px;
            background: var(--btn-grad);
            color: var(--btn-txt);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px color-mix(in srgb, var(--glow) 40%, transparent);
            transition: transform .2s, box-shadow .2s;
            min-height: 44px;
            min-width: 44px;
        }

        .new-game-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px color-mix(in srgb, var(--glow) 50%, transparent);
        }

        .new-game-btn:active {
            transform: scale(.95);
        }

        /* 卡片网格 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            max-width: 560px;
            width: 100%;
        }

        .card {
            aspect-ratio: 1 / 1;
            perspective: 1000px;
            cursor: pointer;
            outline: none;
        }

        .card:focus-visible {
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--glow) 40%, transparent);
            border-radius: 12px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform .4s;
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 900;
        }

        .card-back {
            background: var(--btn-grad);
            color: var(--btn-txt);
            box-shadow: 0 4px 12px rgba(0, 0, 0, .2);
            transition: box-shadow .3s;
        }

        .card:hover .card-back {
            box-shadow: 0 8px 20px rgba(102, 126, 234, .4);
            transform: translateY(-3px);
        }

        .card-front {
            background: var(--card-2);
            border: 2px solid var(--gold);
            color: var(--txt);
            transform: rotateY(180deg);
            box-shadow: 0 4px 12px rgba(0, 0, 0, .1);
        }

        .card.flipped:hover .card-back {
            box-shadow: none;
            transform: none;
        }

        .status-message {
            font-size: 18px;
            font-weight: 600;
            color: var(--txt);
            text-align: center;
            min-height: 24px;
            min-width: 44px;
        }

        /* 排行榜区域 */
        .leaderboard {
            width: 100%;
            max-width: 600px;
            background: var(--card-2);
            border-radius: 12px;
            padding: 15px 20px;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
            border-top: 3px solid var(--gold);
        }

        .leaderboard-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--txt);
            margin-bottom: 10px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .leaderboard-title::after {
            content: ' ▼';
            font-size: 12px;
        }

        .leaderboard-title.collapsed::after {
            content: ' ▶';
        }

        .leaderboard-title.collapsed + .leaderboard-list {
            display: none;
        }

        .leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .leaderboard-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid var(--line);
            font-size: 14px;
            color: var(--dim);
        }

        .leaderboard-list li:last-child {
            border-bottom: none;
        }

        .leaderboard-list li .rank {
            font-weight: 800;
            color: var(--gold);
            width: 30px;
        }

        .leaderboard-list li .time {
            font-weight: 700;
            color: var(--txt);
        }

        .leaderboard-empty {
            text-align: center;
            color: var(--dim);
            font-style: normal;
            padding: 10px 0;
        }

        /* ===== 转场遮罩 ===== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(8, 10, 25, .72);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            opacity: 0;
            visibility: hidden;
            transition: opacity .4s ease, visibility .4s ease;
            pointer-events: none;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .loader-wrap {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, .1);
            border-top-color: #f6d365;
            border-right-color: #fda085;
            animation: ringSpin .8s linear infinite;
        }

        .loader-ring::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-bottom-color: #a78bfa;
            border-left-color: #667eea;
            animation: ringSpin 1.4s linear infinite reverse;
        }

        .loader-ring::after {
            content: '';
            position: absolute;
            top: 28px;
            left: 28px;
            right: 28px;
            bottom: 28px;
            border-radius: 50%;
            border: 1px solid transparent;
            border-top-color: #fb7185;
            border-right-color: #2dd4bf;
            animation: ringSpin 2s linear infinite;
        }

        .loader-text {
            position: relative;
            z-index: 5;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #f6d365, #fda085, #f6d365);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textShine 1.5s linear infinite;
        }

        @keyframes ringSpin { to { transform: rotate(360deg); } }
        @keyframes textShine {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* ===== 响应式适配 ===== */
        @media (max-width: 900px) {
            .container { width: 95%; padding: 12px; }
            .grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: auto; }
            .title-area { grid-column: 1/3; grid-row: auto; min-height: 100px; }
            .back-area { grid-column: 1/3; grid-row: auto; min-height: 80px; }
            .game-area { grid-column: 1/3; grid-row: auto; }
            .cards-grid { grid-template-columns: repeat(4, 1fr); }
        }

        @media (max-width: 600px) {
            .cards-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            
            /* 新增：排行榜折叠 */
            .leaderboard {
                max-height: 150px;
                overflow-y: auto;
            }
            .leaderboard-title {
                font-size: 14px;
                margin-bottom: 6px;
            }
            .card-front {
                font-size: 28px;
            }
            .game-area {
                gap: 12px;
                padding: 12px;
            }
            .game-header {
                max-width: 100%;
            }
            .score-board {
                font-size: 13px;
                padding: 6px 14px;
            }
            .new-game-btn {
                font-size: 12px;
                padding: 6px 14px;
            }
            .status-message {
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .container { padding: 8px; }
            .title-area h2 { font-size: 24px; letter-spacing: 2px; }
            .back-area { font-size: 16px; }
            .game-area { padding: 8px; gap: 8px; }
            .cards-grid { gap: 6px; }
            .card-front { font-size: 24px; }
            .leaderboard { padding: 10px; }
            .leaderboard-list li { font-size: 12px; padding: 6px 8px; }
        }
    
        /* ========== 手机端响应式适配（通用） ========== */
        @media (max-width: 768px) {
            html, body {
                overflow-x: hidden;
                width: 100%;
            }
            main {
                padding: 70px 0 30px !important;
            }
            .container, .card-container, .wrapper, .box, .panel, .form-box {
                width: 94% !important;
                max-width: 94vw !important;
                padding: 14px !important;
                margin: 0 auto !important;
            }
            /* 6列/多列网格改3列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 8px !important;
                padding: 4px !important;
            }
            /* 大区域占满整行 */
            .title-area, .back-area, .display-area, .game-main,
            .calculator-area, .main-area, .content-area, .result-area,
            .input-area, .output-area, .board-area, .info-area, .settings-area {
                grid-column: 1 / -1 !important;
                grid-row: auto !important;
            }
            /* 左右分栏改上下堆叠 */
            .left-panel, .right-panel, .side-panel, .sidebar {
                flex: 1 1 100% !important;
                width: 100% !important;
                border-right: none !important;
                border-bottom: 1px solid var(--line) !important;
            }
            .display-area, .game-main, .calculator-area {
                flex-direction: column !important;
                padding: 12px !important;
            }
            .cell, .tool-cell, .grid-cell {
                padding: 10px 6px !important;
                min-height: 70px !important;
            }
            h1, h2, h3, .title-text, .author-name, .main-title {
                font-size: 22px !important;
                letter-spacing: 1px !important;
            }
            .btn, button, input, select, textarea {
                font-size: 14px !important;
                padding: 10px 14px !important;
            }
            .ghost-btn, .back-btn, .return-btn {
                padding: 8px 16px !important;
                font-size: 13px !important;
            }
            /* 隐藏非必要装饰元素 */
            .orb, .decoration, .deco-element, .floating-shape {
                display: none !important;
            }
        }
        @media (max-width: 480px) {
            .container, .card-container, .wrapper, .box {
                width: 96% !important;
                padding: 10px !important;
            }
            /* 小屏手机改2列 */
            .grid, .tools-grid, .item-grid, .card-grid, .button-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 6px !important;
            }
            h1, h2, h3, .title-text, .author-name {
                font-size: 18px !important;
            }
            .cell, .tool-cell {
                min-height: 80px !important;
                padding: 8px 4px !important;
            }
            .btn, button {
                font-size: 13px !important;
                padding: 8px 12px !important;
            }
        }
</style>

        <div class="bg-flow-2"></div>

                </div>

                    <span style="font-size:32px;">🏠</span>

                <div class="game-area">
