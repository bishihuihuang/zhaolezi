    <style>
        /* 作业验证 · 编辑风：一扇安静的纸面之门 */
        html, body { height: 100%; }
        body {
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .verify-wrap {
            width: 90%;
            max-width: 360px;
            text-align: center;
        }
        .verify-glyph {
            font-size: 26px;
            margin-bottom: 18px;
            opacity: .75;
        }
        h1 {
            margin: 0 0 6px;
        }
        .verify-sub {
            font-size: 14px;
            color: var(--dim);
            margin-bottom: 30px;
        }

        .input-wrap { margin-bottom: 14px; }
        .input-wrap input {
            width: 100%;
            padding: 13px 16px;
            font-size: 16px;
            letter-spacing: 3px;
            text-align: center;
            -webkit-appearance: none;
        }
        .input-wrap input::placeholder { letter-spacing: 1px; }

        .verify-btn {
            width: 100%;
            padding: 13px 0;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 6px;
            text-indent: 6px;
            color: var(--btn-txt, #fff);
            background: var(--blue, #667eea);
            border: none;
            border-radius: var(--ed-radius, 6px);
            cursor: pointer;
            transition: filter .18s ease, opacity .3s ease;
        }
        .verify-btn:hover { filter: brightness(1.08); }
        .verify-btn:active { transform: translateY(1px); }
        .verify-btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }

        .verify-hint { margin-top: 16px; font-size: 13px; min-height: 20px; color: var(--dim); }
        .verify-hint.ok { color: var(--ok, var(--green, #11998e)); }
        .verify-hint.err { color: var(--danger, var(--red, #fb7185)); }

        /* 加载转圈 */
        .loader {
            display: inline-block; width: 14px; height: 14px;
            border: 2px solid color-mix(in srgb, var(--btn-txt, #fff) 35%, transparent);
            border-top-color: var(--btn-txt, #fff);
            border-radius: 50%;
            animation: spin .6s linear infinite;
            vertical-align: middle; margin-left: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

<style data-no-obf>/* 全站打磨层 V3.0 */
/* ==================================================================
   全站通用打磨层（V3.0 · 综合提升）
   追加到 common.css / xd-common.css / cy-common.css 末尾，级联覆盖全站。
   设计原则：
   - 零破坏：:where() 包裹 = 零特异性，绝不覆盖页面既有样式；不设 margin/尺寸/定位。
   - 主题自适应：一律 var(--zl-*，fallback)，不引入新硬编码色。
   - 不变量：不改任何布局结构、跳转逻辑、找乐子主题。
   - 提升：可访问性（焦点/减少动效/色彩方案/触摸）、可读性（tabular-nums）、
           交互反馈（hover/active 过渡）、文本健壮性（长词换行）。
   ================================================================== */

/* 1. 原生控件随系统深浅色自适应（修复滚动条/输入框/下拉在深色下刺眼白块） */
:root { color-scheme: light dark; }

/* 2. 触摸设备消除双击缩放延迟（移动端点按更跟手） */
html { -webkit-tap-highlight-color: transparent; }
:where(a, button, [role="button"], input, select, textarea, summary, label:has(input), [tabindex]):not([disabled]) {
    touch-action: manipulation;
}

/* 3. 键盘焦点统一可见（:where 零特异性 + !important 压过页面 outline:none）
      仅键盘触发（focus-visible），鼠标点击不出现，不打扰普通点击用户 */
:where(a, button, [role="button"], input, select, textarea, summary, [tabindex], [contenteditable]):focus-visible {
    outline: 3px solid var(--zl-accent, var(--gold, #f6d365)) !important;
    outline-offset: 2px !important;
    border-radius: 6px;
}

/* 4. 交互反馈：hover/active 平滑过渡（仅列属性，不用 transition:all） */
:where(a, button, [role="button"], summary, [tabindex]):where(:not([disabled])) {
    transition: color .15s ease, background-color .15s ease, border-color .15s ease, box-shadow .15s ease, opacity .15s ease;
}

/* 5. 文本健壮性：长英文词/URL 在窄屏不再撑破容器 */
:where(p, li, dd, dt, td, th, figcaption, blockquote, h1, h2, h3, h4, h5, h6, a, span, div) {
    overflow-wrap: break-word;
}

/* 6. 数字对齐：统计/计数/表格数字用等宽数字，跳动更整齐 */
:where(td, .stat, .stat-num, .count, .num, [data-num]) {
    font-variant-numeric: tabular-nums;
}

/* 6b. 图片响应式：窄屏不撑破容器、保持比例不失真（未显式设尺寸的图更稳） */
:where(img, picture, video) {
    max-width: 100%;
    height: auto;
}

/* 7. 尊重系统"减少动态效果"（兜底层：common.css 已有，此处保证三家族全覆盖）
      用 :where 包裹，特异性为 0，页面更具体的动效规则仍可生效 */
@media (prefers-reduced-motion: reduce) {
    :where(*, *::before, *::after) {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important;
    }
}

/* 8. 打印友好：隐藏固定悬浮件，正文铺满（低成本加分项） */
@media print {
    :where([class*="fab"], [class*="float"], [class*="dock"], nav.zl-crumb, .zl-skip-link) {
        display: none !important;
    }
}
