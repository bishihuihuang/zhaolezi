    <title>验证 - 看看作业</title>
    <style>
        :root {
            --bg: #0f1729;
            --card: rgba(255,255,255,0.08);
            --txt: #e8e8e8;
            --gold-1: #d4a843;
            --gold-2: #b08d3b;
            --line: rgba(212,168,67,0.25);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--txt);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        /* 背景流动层（与 41.html 同风格） */
        .bg-flow-1, .bg-flow-2, .bg-flow-3 {
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
        }
        .bg-flow-1 {
            background: radial-gradient(ellipse at 20% 20%, rgba(212,168,67,0.12) 0%, transparent 60%);
            animation: bgMove1 20s ease-in-out infinite alternate;
        }
        .bg-flow-2 {
            background: radial-gradient(ellipse at 80% 80%, rgba(17,153,142,0.10) 0%, transparent 55%);
            animation: bgMove2 25s ease-in-out infinite alternate;
        }
        .bg-flow-3 {
            background: radial-gradient(ellipse at 50% 50%, rgba(56,239,125,0.06) 0%, transparent 50%);
            animation: bgMove3 18s ease-in-out infinite alternate;
        }
        @keyframes bgMove1 { from { transform: translate(-30px,-30px) scale(1); } to { transform: translate(30px,30px) scale(1.1); } }
        @keyframes bgMove2 { from { transform: translate(20px,-20px) scale(1); } to { transform: translate(-20px,20px) scale(1.15); } }
        @keyframes bgMove3 { from { transform: translate(-10px,10px) scale(1); } to { transform: translate(10px,-10px) scale(1.05); } }

        /* 验证卡片 */
        .verify-wrap {
            position: relative; z-index: 1;
            width: 90%; max-width: 360px;
            padding: 36px 28px 32px;
            border-radius: 20px;
            background: var(--card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--line);
            box-shadow: 0 20px 60px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
            text-align: center;
        }
        .verify-icon {
            width: 64px; height: 64px; margin: 0 auto 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; color: #1a1a2e;
            box-shadow: 0 4px 16px rgba(212,168,67,0.3);
        }
        .verify-title {
            font-size: 20px; font-weight: 700; letter-spacing: 2px;
            margin-bottom: 6px; color: #fff;
        }
        .verify-sub {
            font-size: 13px; color: rgba(255,255,255,0.5);
            margin-bottom: 24px;
        }
        .input-wrap {
            position: relative; margin-bottom: 16px;
        }
        .input-wrap input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px; letter-spacing: 3px;
            color: #fff;
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--line);
            border-radius: 12px;
            outline: none;
            transition: border-color .3s, box-shadow .3s;
            -webkit-appearance: none;
        }
        .input-wrap input:focus {
            border-color: var(--gold-1);
            box-shadow: 0 0 0 3px rgba(212,168,67,0.15);
        }
        .input-wrap input::placeholder {
            color: rgba(255,255,255,0.25);
            letter-spacing: 1px;
        }
        .verify-btn {
            width: 100%;
            padding: 14px 0;
            font-size: 16px; font-weight: 600; letter-spacing: 4px;
            color: #1a1a2e;
            background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
            border: none; border-radius: 12px;
            cursor: pointer;
            transition: transform .15s, box-shadow .3s, opacity .3s;
            box-shadow: 0 4px 16px rgba(212,168,67,0.25);
            -webkit-tap-highlight-color: transparent;
        }
        .verify-btn:active { transform: scale(0.97); }
        .verify-btn:hover { box-shadow: 0 6px 24px rgba(212,168,67,0.35); }
        .verify-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .verify-hint {
            margin-top: 14px;
            font-size: 13px;
            min-height: 20px;
            transition: color .3s;
        }
        .verify-hint.ok { color: #38ef7d; }
        .verify-hint.err { color: #ff6b6b; }

        /* 加载转圈 */
        .loader {
            display: inline-block; width: 16px; height: 16px;
            border: 2px solid rgba(26,26,46,0.3);
            border-top-color: #1a1a2e;
            border-radius: 50%;
            animation: spin .6s linear infinite;
            vertical-align: middle; margin-left: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 适配微信内置浏览器与手机 */
        @media (max-width: 480px) {
            .verify-wrap { padding: 30px 22px 26px; border-radius: 16px; }
            .verify-icon { width: 56px; height: 56px; font-size: 24px; }
            .verify-title { font-size: 18px; }
            .input-wrap input { font-size: 15px; padding: 12px 14px; }
            .verify-btn { font-size: 15px; padding: 12px 0; }
        }
    </style>

<style data-no-obf>/* 全站打磨层 V3.0 */
/* ==================================================================
   全站通用打磨层（V3.0 · 综合提升）
   追加到 common.css / xd-common.css / cy-common.css 末尾，级联覆盖全站。
   设计原则：
   - 零破坏：:where() 包裹 = 零特异性，绝不覆盖页面既有样式；不设 margin/尺寸/定位。
   - 主题自适应：一律 var(--zl-*，fallback)，不引入新硬编码色。
   - 不变量：不改任何布局结构、跳转逻辑、找乐子主题。
   - 提升：可访问性（焦点/减少动效/色彩方案/触摸）、可读性（tabular-nums）、
           交互反馈（hover/active 过渡）、文本健壮性（长词换行）。
   ================================================================== */

/* 1. 原生控件随系统深浅色自适应（修复滚动条/输入框/下拉在深色下刺眼白块） */
:root { color-scheme: light dark; }

/* 2. 触摸设备消除双击缩放延迟（移动端点按更跟手） */
html { -webkit-tap-highlight-color: transparent; }
:where(a, button, [role="button"], input, select, textarea, summary, label:has(input), [tabindex]):not([disabled]) {
    touch-action: manipulation;
}

/* 3. 键盘焦点统一可见（:where 零特异性 + !important 压过页面 outline:none）
      仅键盘触发（focus-visible），鼠标点击不出现，不打扰普通点击用户 */
:where(a, button, [role="button"], input, select, textarea, summary, [tabindex], [contenteditable]):focus-visible {
    outline: 3px solid var(--zl-accent, var(--gold, #f6d365)) !important;
    outline-offset: 2px !important;
    border-radius: 6px;
}

/* 4. 交互反馈：hover/active 平滑过渡（仅列属性，不用 transition:all） */
:where(a, button, [role="button"], summary, [tabindex]):where(:not([disabled])) {
    transition: color .15s ease, background-color .15s ease, border-color .15s ease, box-shadow .15s ease, opacity .15s ease;
}

/* 5. 文本健壮性：长英文词/URL 在窄屏不再撑破容器 */
:where(p, li, dd, dt, td, th, figcaption, blockquote, h1, h2, h3, h4, h5, h6, a, span, div) {
    overflow-wrap: break-word;
}

/* 6. 数字对齐：统计/计数/表格数字用等宽数字，跳动更整齐 */
:where(td, .stat, .stat-num, .count, .num, [data-num]) {
    font-variant-numeric: tabular-nums;
}

/* 6b. 图片响应式：窄屏不撑破容器、保持比例不失真（未显式设尺寸的图更稳） */
:where(img, picture, video) {
    max-width: 100%;
    height: auto;
}

/* 7. 尊重系统"减少动态效果"（兜底层：common.css 已有，此处保证三家族全覆盖）
      用 :where 包裹，特异性为 0，页面更具体的动效规则仍可生效 */
@media (prefers-reduced-motion: reduce) {
    :where(*, *::before, *::after) {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important;
    }
}

/* 8. 打印友好：隐藏固定悬浮件，正文铺满（低成本加分项） */
@media print {
    :where([class*="fab"], [class*="float"], [class*="dock"], nav.zl-crumb, .zl-skip-link) {
        display: none !important;
    }
}
