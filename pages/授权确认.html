    <style>
        /* 授权确认 · 编辑风：纸面中央的一次确认 */
        html, body { height: 100%; }
        body {
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .back-button-container {
            position: fixed; top: 16px; left: 18px; z-index: 100;
        }
        .back-link { font-size: 14px; color: var(--dim); text-decoration: none; }
        .back-link:hover { color: var(--txt); }

        .card-container {
            height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center;
            padding: 24px;
        }
        .title-text {
            font-size: 15px; letter-spacing: .3em; text-indent: .3em;
            color: var(--dim); margin-bottom: 40px;
        }

        .author-link { text-decoration: none; display: inline-block; }
        .author-name {
            display: block; font-size: 22px; font-weight: 300; letter-spacing: .12em;
            color: var(--txt);
        }
        .author-alias { display: block; font-size: 12.5px; color: var(--dim); margin-top: 8px; letter-spacing: .08em; }
        .author-deco { display: none; }

        .agreement-section {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-top: 56px;
        }
        .agreement-section input { width: 15px; height: 15px; padding: 0; cursor: pointer; }
        .agreement-section label { font-size: 14px; color: var(--txt); cursor: pointer; user-select: none; }
        .protocol-link { color: var(--blue); }

        .next-btn {
            margin-top: 26px;
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 180px; padding: 13px 28px;
            font-size: 15px; font-weight: 500; letter-spacing: 4px; text-indent: 4px;
            text-decoration: none;
            color: var(--btn-txt, #fff);
            background: var(--blue, #667eea);
            border-radius: var(--ed-radius, 6px);
            opacity: .35;
            pointer-events: none;
            transition: opacity .25s ease, filter .18s ease;
        }
        .next-btn.active { opacity: 1; pointer-events: auto; }
        .next-btn.active:hover { filter: brightness(1.08); }

        /* 转场遮罩（品牌件） */
        #transitionMask {
            position: fixed; inset: 0; z-index: 9999;
            display: none; justify-content: center; align-items: center;
            background: var(--bg);
        }
        #transitionMask.show { display: flex; animation: maskFadeIn .3s ease; }
        @keyframes maskFadeIn { from { opacity: 0; } to { opacity: 1; } }
        .spinner-circle {
            width: 88px; height: 88px;
            border: 3px solid color-mix(in srgb, var(--txt) 30%, transparent);
            border-top-color: var(--txt);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            animation: spinRotate 1.5s linear infinite;
        }
        .spinner-circle span {
            color: var(--txt); font-size: 16px; letter-spacing: 2px;
            animation: spinReverse 1.5s linear infinite;
        }
        @keyframes spinRotate  { to { transform: rotate(360deg); } }
        @keyframes spinReverse { to { transform: rotate(-360deg); } }

        /* 小房子键（站规） */
        .home-fab {
            position: fixed; top: 14px; right: 16px; z-index: 2147483647;
            width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
            font-size: 22px; text-decoration: none; color: var(--txt);
            background: var(--card-2); border: 1px solid var(--line); border-radius: 50%;
            transition: border-color .2s ease;
        }
        .home-fab:hover { border-color: var(--txt); }
        .home-overlay {
            position: fixed; inset: 0; z-index: 999999; display: flex; align-items: center; justify-content: center;
            background: rgba(8, 10, 25, .72); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            opacity: 0; visibility: hidden; transition: opacity .4s ease, visibility .4s ease; pointer-events: none;
        }
        .home-overlay.show { opacity: 1; visibility: visible; pointer-events: auto; }
        .home-loader-text { color: var(--card-2); font-size: 19px; font-weight: 700; letter-spacing: 5px; }
    </style>

<style data-no-obf>/* 全站打磨层 V3.0 */
/* ==================================================================
   全站通用打磨层（V3.0 · 综合提升）
   追加到 common.css / xd-common.css / cy-common.css 末尾，级联覆盖全站。
   设计原则：
   - 零破坏：:where() 包裹 = 零特异性，绝不覆盖页面既有样式；不设 margin/尺寸/定位。
   - 主题自适应：一律 var(--zl-*，fallback)，不引入新硬编码色。
   - 不变量：不改任何布局结构、跳转逻辑、找乐子主题。
   - 提升：可访问性（焦点/减少动效/色彩方案/触摸）、可读性（tabular-nums）、
           交互反馈（hover/active 过渡）、文本健壮性（长词换行）。
   ================================================================== */

/* 1. 原生控件随系统深浅色自适应（修复滚动条/输入框/下拉在深色下刺眼白块） */
:root { color-scheme: light dark; }

/* 2. 触摸设备消除双击缩放延迟（移动端点按更跟手） */
html { -webkit-tap-highlight-color: transparent; }
:where(a, button, [role="button"], input, select, textarea, summary, label:has(input), [tabindex]):not([disabled]) {
    touch-action: manipulation;
}

/* 3. 键盘焦点统一可见（:where 零特异性 + !important 压过页面 outline:none）
      仅键盘触发（focus-visible），鼠标点击不出现，不打扰普通点击用户 */
:where(a, button, [role="button"], input, select, textarea, summary, [tabindex], [contenteditable]):focus-visible {
    outline: 3px solid var(--zl-accent, var(--gold, #f6d365)) !important;
    outline-offset: 2px !important;
    border-radius: 6px;
}

/* 4. 交互反馈：hover/active 平滑过渡（仅列属性，不用 transition:all） */
:where(a, button, [role="button"], summary, [tabindex]):where(:not([disabled])) {
    transition: color .15s ease, background-color .15s ease, border-color .15s ease, box-shadow .15s ease, opacity .15s ease;
}

/* 5. 文本健壮性：长英文词/URL 在窄屏不再撑破容器 */
:where(p, li, dd, dt, td, th, figcaption, blockquote, h1, h2, h3, h4, h5, h6, a, span, div) {
    overflow-wrap: break-word;
}

/* 6. 数字对齐：统计/计数/表格数字用等宽数字，跳动更整齐 */
:where(td, .stat, .stat-num, .count, .num, [data-num]) {
    font-variant-numeric: tabular-nums;
}

/* 6b. 图片响应式：窄屏不撑破容器、保持比例不失真（未显式设尺寸的图更稳） */
:where(img, picture, video) {
    max-width: 100%;
    height: auto;
}

/* 7. 尊重系统"减少动态效果"（兜底层：common.css 已有，此处保证三家族全覆盖）
      用 :where 包裹，特异性为 0，页面更具体的动效规则仍可生效 */
@media (prefers-reduced-motion: reduce) {
    :where(*, *::before, *::after) {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important;
    }
}

/* 8. 打印友好：隐藏固定悬浮件，正文铺满（低成本加分项） */
@media print {
    :where([class*="fab"], [class*="float"], [class*="dock"], nav.zl-crumb, .zl-skip-link) {
        display: none !important;
    }
}

</style>
