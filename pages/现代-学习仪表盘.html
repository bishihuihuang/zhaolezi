<style>
    .dash-stat { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 18px 0; }
    .stat-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; text-align: center; }
    .stat-card b { display: block; font-size: 26px; color: var(--blue); margin: 4px 0 2px; }
    .stat-card span { font-size: 12.5px; color: var(--dim); }
    .stat-card .big-num { font-size: 30px; }
    .mod-prog { margin: 10px 0; }
    .mod-prog .mp-top { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
    .mod-prog .mp-top b { color: var(--txt); }
    .mod-prog .mp-top a { text-decoration: none; }
    .mod-prog .mp-top .pct { color: var(--dim); font-weight: 700; }
    .prog-track { height: 10px; background: var(--card-2); border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
    .prog-fill { height: 100%; background: var(--btn-grad); border-radius: 6px; transition: width .6s ease; }
    .quiz-table { width: 100%; }
    .quiz-table th, .quiz-table td { padding: 10px 12px; }
    .recent-list { margin: 0; padding: 0; list-style: none; }
    .recent-list li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
    .recent-list li:last-child { border-bottom: none; }
    .recent-list .t { color: var(--dim); flex: none; }
    .recent-list .badge-type { flex: none; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: rgba(102, 126, 234, .12); color: var(--blue); }
    .recent-list a { color: var(--txt); text-decoration: none; }
    .recent-list a:hover { color: var(--blue); text-decoration: underline; }
    .fav-del { flex: none; border: none; background: rgba(229, 57, 53, .1); color: var(--red); width: 26px; height: 26px;
        border-radius: 50%; cursor: pointer; font-size: 12px; line-height: 1; transition: background .15s; }
    .fav-del:hover { background: rgba(229, 57, 53, .22); }
    .empty-hint { color: var(--dim); font-size: 13.5px; padding: 12px 0; }
    .dash-section h2 { font-size: 17px; margin: 26px 0 6px; }
    .t-green { color: var(--green); font-weight: 700; }
    .t-red { color: var(--red); font-weight: 700; }
    .t-dim { color: var(--dim); }
    .task-goal { margin-bottom: 12px; padding: 10px 12px; background: var(--card-2); border: 1.5px solid var(--line); border-radius: 12px; }
    .task-goal-top { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
    .task-goal-top b { color: var(--gold); }
    .task-goal-top span { color: var(--dim); font-weight: 700; }
    .hm-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 12px 0 8px; }
    .hm-cell { background: var(--card-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 4px; text-align: center; cursor: pointer; transition: transform .15s, border-color .2s; }
    .hm-cell:hover { transform: translateY(-2px); border-color: var(--gold); }
    .hm-cell span { display: block; font-size: 12px; color: var(--dim); }
    .hm-cell b { font-size: 14px; font-weight: 900; color: var(--txt); }
    .hm-cell.lv1 { background: rgba(102, 126, 234, .14); }
    .hm-cell.lv1 b { color: var(--blue); }
    .hm-cell.lv2 { background: rgba(102, 126, 234, .32); }
    .hm-cell.lv2 b { color: #fff; }
    .hm-cell.lv3 { background: rgba(102, 126, 234, .55); }
    .hm-cell.lv3 b { color: #fff; }
    .hm-cell.lv4 { background: var(--btn-grad); }
    .hm-cell.lv4 b { color: #fff; }
    .hm-tip { min-height: 22px; font-size: 13px; color: var(--dim); margin-top: 4px; line-height: 1.8; }
    .hm-tip b { color: var(--gold); }
    .hm-tip span { margin-right: 12px; }
</style>

        <div class="callout tip">
