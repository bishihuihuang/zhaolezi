<style>
    .dash-stat { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 18px 0; }
    .stat-card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; text-align: center; }
    .stat-card b { display: block; font-size: 26px; color: var(--blue); margin: 4px 0 2px; }
    .stat-card span { font-size: 12.5px; color: var(--dim); }
    .stat-card .big-num { font-size: 30px; }

    .mod-prog .mp-top { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
    .mod-prog .mp-top b { color: var(--txt); }
    .mod-prog .mp-top a { text-decoration: none; }
    .mod-prog .mp-top .pct { color: var(--dim); font-weight: 700; }
    .prog-track { height: 10px; background: var(--card-2); border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
    .prog-fill { height: 100%; background: var(--blue); border-radius: 6px; transition: width .6s ease; }
    .quiz-table { width: 100%; }
    .quiz-table th, .quiz-table td { padding: 10px 12px; }
    .recent-list { margin: 0; padding: 0; list-style: none; }
    .recent-list li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
    .recent-list li:last-child { border-bottom: none; }
    .recent-list .t { color: var(--dim); flex: none; }
    .recent-list .badge-type { flex: none; font-size: 12px; padding: 1px 8px; border-radius: 8px; background: color-mix(in srgb, var(--blue) 12%, transparent); color: var(--blue); }
    .recent-list a { color: var(--txt); text-decoration: none; }
    .recent-list a:hover { color: var(--blue); text-decoration: underline; }
    .fav-del { flex: none; border: none; background: color-mix(in srgb, var(--red) 10%, transparent); color: var(--red); width: 26px; height: 26px;
        border-radius: 50%; cursor: pointer; font-size: 12px; line-height: 1; transition: background .15s; }
    .fav-del:hover { background: color-mix(in srgb, var(--red) 22%, transparent); }
    .empty-hint { color: var(--dim); font-size: 13.5px; padding: 12px 0; }
    .dash-section h2 { font-size: 17px; margin: 26px 0 6px; }
    .t-green { color: var(--green); font-weight: 700; }
    .t-red { color: var(--red); font-weight: 700; }
    .t-dim { color: var(--dim); }
    .task-goal { margin-bottom: 12px; padding: 10px 12px; background: var(--card-2); border: 1px solid var(--line); border-radius: 8px; }
    .task-goal-top { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
    .task-goal-top b { color: var(--gold); }
    .task-goal-top span { color: var(--dim); font-weight: 700; }
    .hm-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 12px 0 8px; }
    .hm-cell { background: var(--card-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 4px; text-align: center; cursor: pointer; transition: transform .15s, border-color .2s; }
    .hm-cell:hover { transform: translateY(-2px); border-color: var(--gold); }
    .hm-cell span { display: block; font-size: 12px; color: var(--dim); }
    .hm-cell b { font-size: 14px; font-weight: 500; color: var(--txt); }
    .hm-cell.lv1 { background: color-mix(in srgb, var(--blue) 14%, transparent); }
    .hm-cell.lv1 b { color: var(--blue); }
    .hm-cell.lv2 { background: color-mix(in srgb, var(--blue) 32%, transparent); }
    .hm-cell.lv2 b { color: #fff; }
    .hm-cell.lv3 { background: color-mix(in srgb, var(--blue) 55%, transparent); }
    .hm-cell.lv3 b { color: #fff; }
    .hm-cell.lv4 { background: var(--blue); }
    .hm-cell.lv4 b { color: #fff; }
    .hm-tip { min-height: 22px; font-size: 13px; color: var(--dim); margin-top: 4px; line-height: 1.8; }
    .hm-tip b { color: var(--gold); }
    .hm-tip span { margin-right: 12px; }

<style data-no-obf>/* 全站打磨层 V3.0 */
/* ==================================================================
   全站通用打磨层（V3.0 · 综合提升）
   追加到 common.css / xd-common.css / cy-common.css 末尾，级联覆盖全站。
   设计原则：
   - 零破坏：:where() 包裹 = 零特异性，绝不覆盖页面既有样式；不设 margin/尺寸/定位。
   - 主题自适应：一律 var(--zl-*，fallback)，不引入新硬编码色。
   - 不变量：不改任何布局结构、跳转逻辑、找乐子主题。
   - 提升：可访问性（焦点/减少动效/色彩方案/触摸）、可读性（tabular-nums）、
           交互反馈（hover/active 过渡）、文本健壮性（长词换行）。
   ================================================================== */

/* 1. 原生控件随系统深浅色自适应（修复滚动条/输入框/下拉在深色下刺眼白块） */
:root { color-scheme: light dark; }

/* 2. 触摸设备消除双击缩放延迟（移动端点按更跟手） */
html { -webkit-tap-highlight-color: transparent; }
:where(a, button, [role="button"], input, select, textarea, summary, label:has(input), [tabindex]):not([disabled]) {
    touch-action: manipulation;
}

/* 3. 键盘焦点统一可见（:where 零特异性 + !important 压过页面 outline:none）
      仅键盘触发（focus-visible），鼠标点击不出现，不打扰普通点击用户 */
:where(a, button, [role="button"], input, select, textarea, summary, [tabindex], [contenteditable]):focus-visible {
    outline: 3px solid var(--zl-accent, var(--gold, #f6d365)) !important;
    outline-offset: 2px !important;
    border-radius: 6px;
}

/* 4. 交互反馈：hover/active 平滑过渡（仅列属性，不用 transition:all） */
:where(a, button, [role="button"], summary, [tabindex]):where(:not([disabled])) {
    transition: color .15s ease, background-color .15s ease, border-color .15s ease, box-shadow .15s ease, opacity .15s ease;
}

/* 5. 文本健壮性：长英文词/URL 在窄屏不再撑破容器 */
:where(p, li, dd, dt, td, th, figcaption, blockquote, h1, h2, h3, h4, h5, h6, a, span, div) {
    overflow-wrap: break-word;
}

/* 6. 数字对齐：统计/计数/表格数字用等宽数字，跳动更整齐 */
:where(td, .stat, .stat-num, .count, .num, [data-num]) {
    font-variant-numeric: tabular-nums;
}

/* 6b. 图片响应式：窄屏不撑破容器、保持比例不失真（未显式设尺寸的图更稳） */
:where(img, picture, video) {
    max-width: 100%;
    height: auto;
}

/* 7. 尊重系统"减少动态效果"（兜底层：common.css 已有，此处保证三家族全覆盖）
      用 :where 包裹，特异性为 0，页面更具体的动效规则仍可生效 */
@media (prefers-reduced-motion: reduce) {
    :where(*, *::before, *::after) {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important;
    }
}

/* 8. 打印友好：隐藏固定悬浮件，正文铺满（低成本加分项） */
@media print {
    :where([class*="fab"], [class*="float"], [class*="dock"], nav.zl-crumb, .zl-skip-link) {
        display: none !important;
    }
}
