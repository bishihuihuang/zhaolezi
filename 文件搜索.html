<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
<title>找乐子——文件搜索</title>
<style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;min-height:100vh;background:#0a0e27;color:#fff;overflow-x:hidden;position:relative}
    .bg-animation{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;overflow:hidden;pointer-events:none}
    .bg-flow-1{position:absolute;top:-100%;left:-100%;width:300%;height:300%;background:linear-gradient(125deg,#0a0e27,#161a3d,#1f1652,#331d6e,#1d1b4b,#0f122f,#241a54);background-size:400% 400%;animation:flowGradient 20s ease-in-out infinite;will-change:background-position}
    .bg-flow-2{position:absolute;top:-60%;left:-40%;width:220%;height:220%;background:radial-gradient(ellipse at 30% 70%,rgba(255,140,100,.35),transparent 50%),radial-gradient(ellipse at 65% 35%,rgba(120,180,255,.3),transparent 45%),radial-gradient(ellipse at 80% 80%,rgba(220,130,250,.25),transparent 40%);animation:flowDrift 20s ease-in-out infinite alternate;will-change:transform}
    .bg-flow-3{position:absolute;top:-30%;left:-20%;width:180%;height:180%;background:radial-gradient(circle at 50% 50%,rgba(255,200,130,.15),transparent 60%),radial-gradient(circle at 20% 80%,rgba(80,220,200,.2),transparent 50%);animation:flowRotate 20s linear infinite;will-change:transform}
    @keyframes flowGradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    @keyframes flowDrift{0%{transform:translate(0,0) scale(1) rotate(0deg)}50%{transform:translate(3%,-4%) scale(1.05) rotate(5deg)}100%{transform:translate(-2%,3%) scale(.97) rotate(-5deg)}}
    @keyframes flowRotate{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(180deg) scale(1.08)}100%{transform:rotate(360deg) scale(1)}}
    .orb{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.3),rgba(255,255,255,.1) 50%,transparent 70%);box-shadow:0 0 60px rgba(255,255,255,.08),inset 0 0 30px rgba(255,255,255,.04);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:none;will-change:transform,opacity}
    .orb-1{width:260px;height:260px;top:12%;left:8%;animation:orbFloatA 18s ease-in-out infinite,orbSpin 40s linear infinite}
    .orb-2{width:160px;height:160px;top:55%;left:75%;animation:orbFloatB 22s ease-in-out infinite,orbSpin 55s linear infinite}
    .orb-3{width:110px;height:110px;top:68%;left:20%;animation:orbFloatA 16s ease-in-out infinite reverse,orbSpin 35s linear infinite}
    .orb-4{width:220px;height:220px;top:28%;left:60%;animation:orbFloatB 20s ease-in-out infinite reverse,orbSpin 50s linear infinite}
    .orb-5{width:80px;height:80px;top:80%;left:45%;animation:orbFloatA 14s ease-in-out infinite,orbSpin 30s linear infinite}
    @keyframes orbFloatA{0%{transform:translate(0,0) scale(1);opacity:.6}30%{transform:translate(18px,-22px) scale(1.04);opacity:.8}60%{transform:translate(-12px,10px) scale(.96);opacity:.5}100%{transform:translate(0,0) scale(1);opacity:.6}}
    @keyframes orbFloatB{0%{transform:translate(0,0) scale(1);opacity:.5}35%{transform:translate(-20px,12px) scale(1.06);opacity:.7}70%{transform:translate(14px,-15px) scale(.94);opacity:.4}100%{transform:translate(0,0) scale(1);opacity:.5}}
    @keyframes orbSpin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    main{position:relative;z-index:10;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:40px 20px}
    .container{width:90%;max-width:1200px;background:rgba(245,247,255,.96);border-radius:24px;box-shadow:0 25px 70px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.3),inset 0 1px 0 rgba(255,255,255,.6);max-height:calc(100vh - 80px);overflow-y:auto;padding:24px;color:#333}
    .container::-webkit-scrollbar{width:10px}
    .container::-webkit-scrollbar-track{background:rgba(0,0,0,.04);border-radius:12px}
    .container::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#667eea,#764ba2);border-radius:12px;border:2px solid rgba(255,255,255,.4)}
    .grid{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:auto;gap:14px}
    .title-area{grid-column:1/5;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ff6b6b,#ffa500,#ffd700,#ff6b6b);background-size:300% 300%;animation:titleGradient 6s ease infinite;border-radius:20px;box-shadow:0 12px 40px rgba(255,150,50,.35),inset 0 1px 0 rgba(255,255,255,.2);padding:24px}
    .title-area h2{font-size:36px;font-weight:900;letter-spacing:4px;color:#fff;text-shadow:2px 2px 10px rgba(0,0,0,.3)}
    @keyframes titleGradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    .back-area{grid-column:5/7;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#11998e,#38ef7d);border-radius:20px;box-shadow:0 12px 40px rgba(17,153,142,.4),inset 0 1px 0 rgba(255,255,255,.2);text-decoration:none;color:#fff;font-size:20px;font-weight:800;cursor:pointer;transition:transform .3s,box-shadow .3s}
    .back-area:hover{transform:translateY(-5px);box-shadow:0 18px 50px rgba(17,153,142,.5)}
    .back-area:active{transform:translateY(-2px) scale(.96)}
    .folder-select{grid-column:1/3;background:linear-gradient(135deg,#f0f4ff,#fafbff);border:2px solid #d0d0e0;border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 12px rgba(0,0,0,.06);transition:all .3s}
    .folder-select:hover{box-shadow:0 8px 20px rgba(0,0,0,.12);transform:translateY(-2px)}
    .folder-select .label{font-size:14px;font-weight:700;color:#666}
    .folder-select .path{font-size:13px;color:#667eea;font-weight:700;word-break:break-all;text-align:center;max-width:100%}
    .folder-select .btn{width:100%;padding:10px 16px;border:none;border-radius:20px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
    .folder-select .btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(102,126,234,.4)}
    .folder-select .btn:active{transform:scale(.95)}
    .folder-select .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .search-box{grid-column:3/7;background:linear-gradient(135deg,#f0f4ff,#fafbff);border:2px solid #d0d0e0;border-radius:14px;padding:16px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 12px rgba(0,0,0,.06);transition:all .3s}
    .search-box:focus-within{border-color:#667eea;box-shadow:0 8px 20px rgba(102,126,234,.15)}
    .search-box input{flex:1;padding:12px 16px;border:2px solid #e0e0f0;border-radius:10px;font-size:16px;font-weight:600;color:#333;outline:none;transition:border-color .2s}
    .search-box input:focus{border-color:#667eea}
    .search-box input::placeholder{color:#aaa;font-weight:400}
    .search-box .count{font-size:14px;font-weight:800;color:#667eea;white-space:nowrap;min-width:80px;text-align:center}
    .search-box .clear-btn{padding:8px 14px;border:none;border-radius:10px;background:#f0f0f5;color:#666;font-size:13px;cursor:pointer;transition:all .2s;white-space:nowrap}
    .search-box .clear-btn:hover{background:#e0e0ea;color:#333}
    .info-bar{grid-column:1/7;background:linear-gradient(135deg,#fff8e1,#fffdf5);border:2px solid #ffe082;border-radius:12px;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:14px;font-weight:600;color:#795548}
    .info-bar .stat{display:flex;align-items:center;gap:6px}
    .info-bar .stat span{color:#667eea;font-weight:800}
    .progress-bar{grid-column:1/7;height:8px;background:#e0e0f0;border-radius:4px;overflow:hidden;display:none}
    .progress-bar.show{display:block}
    .progress-bar .fill{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);border-radius:4px;transition:width .3s;width:0%}
    .results{grid-column:1/7;background:#fff;border:4px solid transparent;border-image:linear-gradient(45deg,#ff6b6b,#ffa500,#ffd700,#667eea,#764ba2) 1;border-radius:12px;padding:16px;max-height:50vh;overflow-y:auto;box-shadow:0 6px 20px rgba(0,0,0,.1);min-height:200px}
    .results::-webkit-scrollbar{width:8px}
    .results::-webkit-scrollbar-track{background:rgba(0,0,0,.04);border-radius:8px}
    .results::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#667eea,#764ba2);border-radius:8px}
    .result-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;cursor:pointer;transition:all .2s;border-bottom:1px solid #f0f0f5}
    .result-item:hover{background:linear-gradient(135deg,#f0f4ff,#f8f9ff);transform:translateX(4px)}
    .result-item .icon{font-size:24px;flex-shrink:0}
    .result-item .info{flex:1;min-width:0}
    .result-item .name{font-size:15px;font-weight:700;color:#333;word-break:break-all;margin-bottom:2px}
    .result-item .name mark{background:#ffe082;color:#d84315;padding:0 2px;border-radius:3px}
    .result-item .path{font-size:12px;color:#999;word-break:break-all}
    .result-item .path mark{background:#ffe082;color:#d84315;padding:0 2px;border-radius:3px}
    .result-item .size{font-size:13px;color:#667eea;font-weight:700;flex-shrink:0}
    .result-item .open-btn{padding:6px 14px;border:none;border-radius:8px;background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;flex-shrink:0}
    .result-item .open-btn:hover{transform:scale(1.05);box-shadow:0 4px 10px rgba(17,153,142,.3)}
    .empty-state{text-align:center;padding:60px 20px;color:#aaa}
    .empty-state .icon{font-size:64px;margin-bottom:16px;opacity:.5}
    .empty-state .text{font-size:18px;font-weight:600}
    .empty-state .hint{font-size:14px;margin-top:8px;color:#bbb}
    .overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:999999;display:flex;align-items:center;justify-content:center;background:rgba(8,10,25,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);opacity:0;visibility:hidden;transition:opacity .4s ease,visibility .4s ease;pointer-events:none}
    .overlay.active{opacity:1;visibility:visible;pointer-events:auto}
    .loader-wrap{position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center}
    .loader-ring{position:absolute;width:100%;height:100%;border-radius:50%;border:3px solid rgba(255,255,255,.1);border-top-color:#f6d365;border-right-color:#fda085;animation:ringSpin .8s linear infinite}
    .loader-ring::before{content:'';position:absolute;top:12px;left:12px;right:12px;bottom:12px;border-radius:50%;border:2px solid transparent;border-bottom-color:#a78bfa;border-left-color:#667eea;animation:ringSpin 1.4s linear infinite reverse}
    .loader-ring::after{content:'';position:absolute;top:28px;left:28px;right:28px;bottom:28px;border-radius:50%;border:1px solid transparent;border-top-color:#fb7185;border-right-color:#2dd4bf;animation:ringSpin 2s linear infinite}
    .loader-text{position:relative;z-index:5;font-size:16px;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#f6d365,#fda085,#f6d365);background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:textShine 1.5s linear infinite;text-align:center;max-width:180px;word-break:break-all}
    @keyframes ringSpin{to{transform:rotate(360deg)}}
    @keyframes textShine{0%{background-position:0% 50%}100%{background-position:200% 50%}}
    @media(max-width:900px){
        .container{width:95%;padding:14px}
        .grid{grid-template-columns:repeat(2,1fr)}
        .title-area{grid-column:1/3;min-height:80px}
        .title-area h2{font-size:24px}
        .back-area{grid-column:1/3;min-height:60px}
        .folder-select{grid-column:1/3}
        .search-box{grid-column:1/3}
        .info-bar{grid-column:1/3}
        .progress-bar{grid-column:1/3}
        .results{grid-column:1/3}
    }
</style>
</head>
<body>
<div class="bg-animation">
    <div class="bg-flow-1"></div>
    <div class="bg-flow-2"></div>
    <div class="bg-flow-3"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
    <div class="orb orb-5"></div>
</div>

<main>
<div class="container">
<div class="grid">
    <div class="title-area"><h2>找乐子——文件搜索</h2></div>
    <a href="index.html" class="back-area" id="backHome"><span style="font-size:28px">🏠</span>返回主页</a>

    <div class="folder-select">
        <span class="label">📁 选择搜索文件夹</span>
        <span class="path" id="folderPath">未选择</span>
        <button class="btn" id="selectFolderBtn">选择文件夹</button>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="输入关键词，如：钟、阿Q（模糊搜索文件名和路径）..." disabled>
        <span class="count" id="resultCount">0 个</span>
        <button class="clear-btn" id="clearBtn">清空</button>
    </div>

    <div class="info-bar" id="infoBar" style="display:none">
        <div class="stat">📂 文件夹：<span id="infoFolder">-</span></div>
        <div class="stat">📊 总文件：<span id="infoTotal">0</span></div>
        <div class="stat">✅ 匹配：<span id="infoMatch">0</span></div>
    </div>

    <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>

    <div class="results" id="results">
        <div class="empty-state">
            <div class="icon">🔍</div>
            <div class="text">请先选择文件夹</div>
            <div class="hint">选择后输入关键词即可模糊搜索文件名和文件夹名</div>
        </div>
    </div>
</div>
</div>
</main>

<div class="overlay" id="overlay">
    <div class="loader-wrap">
        <div class="loader-ring"></div>
        <div class="loader-text" id="loaderText">正在扫描...</div>
    </div>
</div>

<script>
(function(){
    'use strict';

    let dirHandle = null;
    let allFiles = [];
    let isScanning = false;

    const selectFolderBtn = document.getElementById('selectFolderBtn');
    const folderPath = document.getElementById('folderPath');
    const searchInput = document.getElementById('searchInput');
    const resultCount = document.getElementById('resultCount');
    const clearBtn = document.getElementById('clearBtn');
    const results = document.getElementById('results');
    const overlay = document.getElementById('overlay');
    const loaderText = document.getElementById('loaderText');
    const infoBar = document.getElementById('infoBar');
    const infoFolder = document.getElementById('infoFolder');
    const infoTotal = document.getElementById('infoTotal');
    const infoMatch = document.getElementById('infoMatch');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');

    document.getElementById('backHome').addEventListener('click', function(e){
        e.preventDefault();
        overlay.classList.add('active');
        setTimeout(function(){ window.location.href = 'index.html'; }, 800);
    });

    selectFolderBtn.addEventListener('click', async function(){
        if(isScanning) return;
        if(!window.showDirectoryPicker){
            alert('您的浏览器不支持文件夹选择功能，请使用 Chrome 或 Edge 浏览器');
            return;
        }
        try{
            dirHandle = await window.showDirectoryPicker();
            folderPath.textContent = dirHandle.name;
            searchInput.disabled = true;
            selectFolderBtn.disabled = true;
            searchInput.value = '';
            allFiles = [];
            isScanning = true;
            overlay.classList.add('active');
            progressBar.classList.add('show');
            await scanDirectory(dirHandle, '');
            isScanning = false;
            selectFolderBtn.disabled = false;
            searchInput.disabled = false;
            overlay.classList.remove('active');
            progressBar.classList.remove('show');
            infoBar.style.display = 'flex';
            infoFolder.textContent = dirHandle.name;
            infoTotal.textContent = allFiles.length;
            infoMatch.textContent = allFiles.length;
            resultCount.textContent = allFiles.length + ' 个';
            renderResults(allFiles);
            searchInput.focus();
        }catch(err){
            isScanning = false;
            selectFolderBtn.disabled = false;
            overlay.classList.remove('active');
            progressBar.classList.remove('show');
            if(err.name !== 'AbortError'){
                alert('选择文件夹失败：' + err.message);
            }
        }
    });

    async function scanDirectory(handle, path){
        const entries = [];
        try{
            for await (const entry of handle.values()){
                entries.push(entry);
            }
        }catch(e){
            return;
        }

        for(let i = 0; i < entries.length; i++){
            const entry = entries[i];
            const fullPath = path ? path + '/' + entry.name : entry.name;
            loaderText.textContent = '正在扫描...\n' + fullPath;
            progressFill.style.width = Math.min(100, (allFiles.length / 1000 * 100)) + '%';

            if(entry.kind === 'file'){
                try{
                    const file = await entry.getFile();
                    allFiles.push({
                        name: entry.name,
                        path: fullPath,
                        size: file.size,
                        handle: entry,
                        type: getFileType(entry.name)
                    });
                }catch(e){}
            }else if(entry.kind === 'directory'){
                await scanDirectory(entry, fullPath);
            }
            if((i+1) % 20 === 0) await new Promise(r => setTimeout(r, 0));
        }
    }

    function getFileType(name){
        const ext = name.split('.').pop().toLowerCase();
        const types = {
            'txt':'📄','md':'📝','pdf':'📕','doc':'📘','docx':'📘','xls':'📗','xlsx':'📗',
            'ppt':'📙','pptx':'📙','html':'🌐','htm':'🌐','css':'🎨','js':'📜','json':'📋',
            'jpg':'🖼️','jpeg':'🖼️','png':'🖼️','gif':'🖼️','svg':'🖼️','webp':'🖼️',
            'mp3':'🎵','wav':'🎵','flac':'🎵','mp4':'🎬','avi':'🎬','mkv':'🎬','mov':'🎬',
            'zip':'📦','rar':'📦','7z':'📦','tar':'📦','gz':'📦',
            'exe':'⚙️','msi':'⚙️','bat':'⚙️','sh':'⚙️',
            'epub':'📖','mobi':'📖','azw3':'📖'
        };
        return types[ext] || '📄';
    }

    function formatSize(bytes){
        if(bytes < 1024) return bytes + ' B';
        if(bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
        if(bytes < 1073741824) return (bytes/1048576).toFixed(1) + ' MB';
        return (bytes/1073741824).toFixed(2) + ' GB';
    }

    searchInput.addEventListener('input', function(){
        const keyword = this.value.trim().toLowerCase();
        if(!keyword){
            renderResults(allFiles);
            infoMatch.textContent = allFiles.length;
            resultCount.textContent = allFiles.length + ' 个';
            return;
        }
        const matched = allFiles.filter(f =>
            f.name.toLowerCase().includes(keyword) ||
            f.path.toLowerCase().includes(keyword)
        );
        renderResults(matched, keyword);
        infoMatch.textContent = matched.length;
        resultCount.textContent = matched.length + ' 个';
    });

    clearBtn.addEventListener('click', function(){
        searchInput.value = '';
        renderResults(allFiles);
        infoMatch.textContent = allFiles.length;
        resultCount.textContent = allFiles.length + ' 个';
        searchInput.focus();
    });

    searchInput.addEventListener('keydown', function(e){
        if(e.key === 'Escape'){
            this.value = '';
            this.dispatchEvent(new Event('input'));
        }
    });

    function highlight(text, keyword){
        if(!keyword) return text;
        const lower = text.toLowerCase();
        const kw = keyword.toLowerCase();
        let result = '';
        let lastIdx = 0;
        let idx = lower.indexOf(kw);
        while(idx !== -1){
            result += text.substring(lastIdx, idx) + '<mark>' + text.substring(idx, idx+keyword.length) + '</mark>';
            lastIdx = idx + keyword.length;
            idx = lower.indexOf(kw, lastIdx);
        }
        result += text.substring(lastIdx);
        return result || text;
    }

    function renderResults(files, keyword){
        if(files.length === 0){
            results.innerHTML = '<div class="empty-state"><div class="icon">😕</div><div class="text">没有找到匹配的文件</div><div class="hint">试试其他关键词</div></div>';
            return;
        }
        const display = files.slice(0, 500);
        let html = '';
        for(const f of display){
            html += '<div class="result-item">' +
                '<span class="icon">' + f.type + '</span>' +
                '<div class="info">' +
                    '<div class="name">' + highlight(f.name, keyword) + '</div>' +
                    '<div class="path">' + highlight(f.path, keyword) + '</div>' +
                '</div>' +
                '<span class="size">' + formatSize(f.size) + '</span>' +
                '<button class="open-btn">打开</button>' +
            '</div>';
        }
        if(files.length > 500){
            html += '<div style="text-align:center;padding:16px;color:#999;font-size:14px">仅显示前500条，共' + files.length + '条匹配，请缩小搜索范围</div>';
        }
        results.innerHTML = html;

        results.querySelectorAll('.open-btn').forEach((btn, i) => {
            btn.addEventListener('click', async function(e){
                e.stopPropagation();
                const file = display[i];
                try{
                    if(file.handle.requestPermission){
                        const perm = await file.handle.requestPermission({mode:'read'});
                        if(perm !== 'granted'){ alert('没有权限打开该文件'); return; }
                    }
                    const fileObj = await file.handle.getFile();
                    const url = URL.createObjectURL(fileObj);
                    window.open(url, '_blank');
                }catch(err){
                    alert('打开失败：' + err.message);
                }
            });
        });
    }
})();
</script>
</body>
</html>
