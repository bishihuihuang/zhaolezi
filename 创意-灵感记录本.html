        .tag-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 12px; background: var(--zl-card-2); border: 1px solid var(--zl-border); color: var(--zl-accent); cursor: pointer; }

        .note-item .tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .note-item .tags .t { padding: 1px 8px; border-radius: 10px; background: var(--zl-card-2); border: 1px solid var(--zl-border); color: var(--zl-accent); }
        .note-item .acts { display: flex; gap: 6px; }
        .fav-star { cursor: pointer; font-size: 16px; }
        .count-pill { font-size: 12px; color: var(--zl-dim); }
    </style>

    <main class="cy-page">
        <div class="cy-card">
            <h2>📓 速记新灵感</h2>
            <div class="sub">想到就记，别让它溜走。支持标签分类、星标收藏、全文搜索。</div>
            <textarea class="cy-textarea" id="noteText" style="min-height:130px;" placeholder="记录一个想法、一句话、一个画面……"></textarea>

                <input class="cy-input" id="noteTags" placeholder="标签，空格分隔：如 写作 灵感 设计" style="flex:1;">
                <button class="cy-btn" id="btnSave">📌 保存</button>

            </div>
        </div>

        <div class="cy-card">
            <h2>🗂 我的笔记 <span class="count-pill" id="countPill"></span></h2>

                <input class="cy-input" id="searchInput" placeholder="🔍 搜索笔记内容…" style="flex:1;">
                <button class="cy-btn cy-btn-ghost" id="btnExportJson">⬇ JSON 导出</button>
                <button class="cy-btn cy-btn-ghost" id="btnImportJson">⬆ JSON 导入</button>
                <input type="file" id="importFile" accept=".json,application/json" style="display:none;">
            </div>
            <div id="tagBar" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;"></div>
            <div id="noteList"></div>
        </div>
    </main>
