<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>看看作业</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            min-height: 100vh;
            color: var(--txt);
            overflow-x: hidden;
            position: relative;
            background-attachment: fixed;
            background-color: #0a0e27;
            transition: background .4s ease;
        }

        /* ================================================================
           主题背景：纯 CSS 渐变（10 个主题 × 电脑/手机 各一套）
           ================================================================ */

        /* ---- 默认（dark）：抽象雾山层叠 ---- */
        html[data-theme="dark"] body {
            background:
                radial-gradient(ellipse 90% 60% at 15% 25%, #2a1f4a 0%, transparent 55%),
                radial-gradient(ellipse 80% 70% at 85% 75%, #1a3a6a 0%, transparent 55%),
                radial-gradient(ellipse 120% 100% at 50% 50%, #1a1f3a 0%, #06080f 100%);
        }

        /* ---- blue：拓扑等高线 ---- */
        html[data-theme="blue"] body {
            background:
                radial-gradient(ellipse 80% 60% at 25% 35%, #1e4a8a 0%, transparent 55%),
                radial-gradient(ellipse 70% 80% at 80% 70%, #2a5298 0%, transparent 55%),
                linear-gradient(135deg, #0a1e3a 0%, #12294a 50%, #0f2847 100%);
        }

        /* ---- gold：拉丝金属 ---- */
        html[data-theme="gold"] body {
            background:
                radial-gradient(ellipse 70% 50% at 20% 25%, rgba(212,175,55,.45) 0%, transparent 55%),
                radial-gradient(ellipse 60% 60% at 80% 75%, rgba(184,134,11,.35) 0%, transparent 55%),
                linear-gradient(135deg, #e8e4df 0%, #c9c1b8 45%, #a89578 100%);
        }

        /* ---- light：莫兰迪色雾面 ---- */
        html[data-theme="light"] body {
            background:
                radial-gradient(ellipse 90% 60% at 20% 25%, #f0ece6 0%, transparent 60%),
                radial-gradient(ellipse 80% 70% at 85% 75%, #d9d0c4 0%, transparent 60%),
                linear-gradient(135deg, #ede8e2 0%, #ddd5cb 50%, #c4b9a8 100%);
        }

        /* ---- milk：机丝绸 ---- */
        html[data-theme="milk"] body {
            background:
                radial-gradient(ellipse 70% 60% at 30% 20%, #ffffff 0%, transparent 60%),
                radial-gradient(ellipse 80% 70% at 75% 80%, #f5ede0 0%, transparent 60%),
                linear-gradient(135deg, #faf6f0 0%, #f0ece6 50%, #e0d6c4 100%);
        }

        /* ---- guofeng：东方宣纸 ---- */
        html[data-theme="guofeng"] body {
            background:
                radial-gradient(ellipse 80% 70% at 25% 35%, #faf2e0 0%, transparent 60%),
                radial-gradient(ellipse 70% 60% at 80% 70%, #e8dcc8 0%, transparent 55%),
                linear-gradient(135deg, #f5ecd9 0%, #e6d8bd 50%, #c9b88f 100%);
        }

        /* ---- snowsun：高级宇宙尘埃 ---- */
        html[data-theme="snowsun"] body {
            background:
                radial-gradient(ellipse 70% 60% at 30% 30%, rgba(80,90,150,.55) 0%, transparent 55%),
                radial-gradient(ellipse 60% 70% at 70% 70%, rgba(60,50,120,.45) 0%, transparent 55%),
                linear-gradient(135deg, #0d0d1a 0%, #1a1a3a 50%, #2a2a4a 100%);
        }

        /* ---- cyber：数据光纤 ---- */
        html[data-theme="cyber"] body {
            background:
                radial-gradient(ellipse 70% 60% at 25% 35%, rgba(26,120,160,.55) 0%, transparent 55%),
                radial-gradient(ellipse 60% 70% at 75% 65%, rgba(50,200,220,.4) 0%, transparent 55%),
                linear-gradient(135deg, #0a1a2e 0%, #0f2540 50%, #1a3a5a 100%);
        }

        /* ---- aurora：极光深空蓝 ---- */
        html[data-theme="aurora"] body {
            background:
                radial-gradient(ellipse 70% 60% at 20% 30%, rgba(50,180,150,.45) 0%, transparent 55%),
                radial-gradient(ellipse 70% 70% at 80% 65%, rgba(120,80,200,.5) 0%, transparent 55%),
                linear-gradient(135deg, #0a1e3a 0%, #1a3a6a 50%, #2a1a5a 100%);
        }

        /* ---- custom：未来主义建筑 ---- */
        html[data-theme="custom"] body {
            background:
                radial-gradient(ellipse 80% 60% at 30% 35%, rgba(140,150,170,.4) 0%, transparent 55%),
                radial-gradient(ellipse 70% 70% at 75% 70%, rgba(100,110,130,.35) 0%, transparent 55%),
                linear-gradient(135deg, #1a1a22 0%, #2a2a3a 50%, #4a4a5a 100%);
        }

        /* ================================================================
           手机端适配（≤ 768px）：色块更集中、更饱和，观感更紧凑
           ================================================================ */
        @media (max-width: 768px) {
            html[data-theme="dark"] body {
                background:
                    radial-gradient(ellipse 110% 70% at 50% 30%, #2a1f4a 0%, transparent 65%),
                    radial-gradient(ellipse 100% 80% at 50% 90%, #1a3a6a 0%, transparent 65%),
                    linear-gradient(160deg, #1a1f3a 0%, #06080f 100%);
            }
            html[data-theme="blue"] body {
                background:
                    radial-gradient(ellipse 110% 70% at 50% 30%, #1e4a8a 0%, transparent 65%),
                    radial-gradient(ellipse 100% 80% at 50% 90%, #2a5298 0%, transparent 65%),
                    linear-gradient(160deg, #0a1e3a 0%, #0f2847 100%);
            }
            html[data-theme="gold"] body {
                background:
                    radial-gradient(ellipse 110% 70% at 50% 25%, rgba(212,175,55,.5) 0%, transparent 65%),
                    radial-gradient(ellipse 100% 80% at 50% 90%, rgba(184,134,11,.4) 0%, transparent 65%),
                    linear-gradient(160deg, #e8e4df 0%, #a89578 100%);
            }
            html[data-theme="light"] body {
                background:
                    radial-gradient(ellipse 110% 70% at 50% 30%, #f0ece6 0%, transparent 65%),
                    radial-gradient(ellipse 100% 80% at 50% 90%, #d9d0c4 0%, transparent 65%),
                    linear-gradient(160deg, #ede8e2 0%, #c4b9a8 100%);
            }
            html[data-theme="milk"] body {
                background:
                    radial-gradient(ellipse 110% 70% at 50% 25%, #ffffff 0%, transparent 65%),
                    radial-gradient(ellipse 100% 80% at 50% 90%, #f5ede0 0%, transparent 65%),
                    linear-gradient(160deg, #faf6f0 0%, #e0d6c4 100%);
            }
            html[data-theme="guofeng"] body {
                background:
                    radial-gradient(ellipse 110% 70% at 50% 30%, #faf2e0 0%, transparent 65%),
                    radial-gradient(ellipse 100% 80% at 50% 90%, #e8dcc8 0%, transparent 65%),
                    linear-gradient(160deg, #f5ecd9 0%, #c9b88f 100%);
            }
            html[data-theme="snowsun"] body {
                background:
                    radial-gradient(ellipse 110% 70% at 50% 30%, rgba(80,90,150,.6) 0%, transparent 65%),
                    radial-gradient(ellipse 100% 80% at 50% 90%, rgba(60,50,120,.5) 0%, transparent 65%),
                    linear-gradient(160deg, #0d0d1a 0%, #2a2a4a 100%);
            }
            html[data-theme="cyber"] body {
                background:
                    radial-gradient(ellipse 110% 70% at 50% 30%, rgba(26,120,160,.65) 0%, transparent 65%),
                    radial-gradient(ellipse 100% 80% at 50% 90%, rgba(50,200,220,.45) 0%, transparent 65%),
                    linear-gradient(160deg, #0a1a2e 0%, #1a3a5a 100%);
            }
            html[data-theme="aurora"] body {
                background:
                    radial-gradient(ellipse 110% 70% at 50% 30%, rgba(50,180,150,.55) 0%, transparent 65%),
                    radial-gradient(ellipse 100% 80% at 50% 90%, rgba(120,80,200,.6) 0%, transparent 65%),
                    linear-gradient(160deg, #0a1e3a 0%, #2a1a5a 100%);
            }
            html[data-theme="custom"] body {
                background:
                    radial-gradient(ellipse 110% 70% at 50% 35%, rgba(140,150,170,.45) 0%, transparent 65%),
                    radial-gradient(ellipse 100% 80% at 50% 90%, rgba(100,110,130,.4) 0%, transparent 65%),
                    linear-gradient(160deg, #1a1a22 0%, #4a4a5a 100%);
            }
        }

        /* ========== 旧流光层全部关闭 ========== */
        .bg-animation,
        .bg-flow-1, .bg-flow-2, .bg-flow-3,
        .orb { display: none !important; }

        /* ========== 主体布局 ========== */
        main {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 14px 96px;
        }

        .container {
            width: 100%;
            max-width: 1440px;
            background: var(--card);
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, .35),
                0 0 0 1px rgba(255, 255, 255, .3),
                inset 0 1px 0 rgba(255, 255, 255, .6);
            padding: 16px;
            color: var(--txt);
        }

        .top-grid {
            display: grid;
            grid-template-columns: 1fr 220px 220px;
            gap: 12px;
            margin-bottom: 16px;
        }

        .title-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--title-grad);
            background-size: 300% 300%;
            animation: titleGradient 6s ease infinite;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(255, 150, 50, .35),
                inset 0 1px 0 rgba(255, 255, 255, .2);
            position: relative;
            overflow: hidden;
            transition: transform .4s cubic-bezier(.34, 1.56, .64, 1),
                box-shadow .4s ease;
            min-height: 108px;
            padding: 16px;
            text-align: center;
        }

        .title-area:hover {
            transform: translateY(-4px) scale(1.005);
            box-shadow: 0 18px 50px rgba(255, 150, 50, .4);
        }

        .title-area h1 {
            font-size: 40px;
            font-weight: 900;
            line-height: 1.3;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, .3);
        }

        .title-sub {
            font-size: 13px;
            color: rgba(255, 255, 255, .88);
            margin-top: 4px;
            letter-spacing: 1px;
            font-weight: 400;
            text-shadow: 0 1px 4px rgba(0, 0, 0, .3);
        }

        @keyframes titleGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .announce-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(231, 76, 60, .4),
                inset 0 1px 0 rgba(255, 255, 255, .2);
            text-decoration: none;
            color: #fff;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 3px;
            cursor: pointer;
            transition: transform .35s cubic-bezier(.34, 1.56, .64, 1),
                box-shadow .35s ease;
            min-height: 108px;
            min-width: 120px;
            -webkit-tap-highlight-color: transparent;
        }

        .announce-area:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 18px 50px rgba(231, 76, 60, .5);
        }

        .announce-area:active {
            transform: translateY(-2px) scale(.96);
            transition-duration: .1s;
        }

        .announce-area .announce-icon {
            font-size: 32px;
            margin-bottom: 4px;
        }

        .back-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--back-grad);
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(17, 153, 142, .4),
                inset 0 1px 0 rgba(255, 255, 255, .2);
            text-decoration: none;
            color: #fff;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 3px;
            cursor: pointer;
            transition: transform .35s cubic-bezier(.34, 1.56, .64, 1),
                box-shadow .35s ease;
            min-height: 108px;
            min-width: 120px;
            -webkit-tap-highlight-color: transparent;
        }

        .back-area:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 18px 50px rgba(17, 153, 142, .5);
        }

        .back-area:active {
            transform: translateY(-2px) scale(.96);
            transition-duration: .1s;
        }

        .back-area .back-icon {
            font-size: 32px;
            margin-bottom: 4px;
        }

        .box-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .job-box {
            aspect-ratio: 9 / 20;
            display: flex;
            flex-direction: column;
            border-radius: 16px;
            overflow: hidden;
            background: var(--card-2);
            border: 2px solid var(--line);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .14),
                inset 0 1px 0 rgba(255, 255, 255, .25);
        }

        .media-area {
            flex: 0 0 70%;
            min-height: 0;
            padding: 8px;
            position: relative;
            border-bottom: 1px solid var(--line);
            background: rgba(127, 127, 127, .05);
        }

        .media-scroll {
            height: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 2px;
            scrollbar-width: thin;
        }

        .media-scroll::-webkit-scrollbar { width: 5px; }
        .media-scroll::-webkit-scrollbar-thumb {
            background: var(--scroll-thumb);
            border-radius: 4px;
        }

        .f-image {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            max-height: 88%;
            border-radius: 10px;
            overflow: hidden;
            cursor: zoom-in;
            background: rgba(0, 0, 0, .12);
            -webkit-tap-highlight-color: transparent;
        }

        .f-image img {
            display: block;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 10px;
        }

        .f-video {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            max-height: 88%;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            background: rgba(0, 0, 0, .18);
            -webkit-tap-highlight-color: transparent;
        }

        .f-video video {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 10px;
            background: #000;
        }

        .f-card {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: rgba(127, 127, 127, .07);
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .f-card:active {
            transform: scale(.98);
            box-shadow: 0 2px 10px rgba(0, 0, 0, .15);
        }

        .f-card .fc-icon {
            font-size: 22px;
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: rgba(102, 126, 234, .12);
        }

        .f-card .fc-body { flex: 1; min-width: 0; }

        .f-card .fc-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--txt);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .f-card .fc-kind {
            font-size: 11px;
            color: var(--dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .f-card .fc-actions { display: flex; gap: 4px; flex-shrink: 0; }

        .f-card .fc-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            transition: background .2s ease, transform .2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .f-card .fc-btn:hover {
            background: rgba(127, 127, 127, .15);
            transform: scale(1.08);
        }

        .f-card .fc-second { color: #ff9800; }
        .f-card .fc-first { color: #667eea; }

        .all-loaded-tip {
            grid-column: 1 / -1;
            text-align: center;
            padding: 16px;
            font-size: 13px;
            color: var(--dim);
            opacity: .7;
            user-select: none;
        }

        .info-area {
            flex: 0 0 5%;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 0 5px;
            background: linear-gradient(90deg,
                    rgba(102, 126, 234, .14),
                    rgba(255, 165, 0, .14));
            border-bottom: 1px solid var(--line);
            font-size: 10.5px;
            color: var(--txt);
            white-space: nowrap;
            overflow: hidden;
        }

        .info-time {
            flex-shrink: 0;
            font-weight: 700;
            color: var(--gold);
            max-width: 42%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .info-title {
            flex: 1;
            min-width: 0;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .text-area {
            flex: 0 0 25%;
            min-height: 0;
            padding: 8px 10px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.7;
            color: var(--txt);
            white-space: pre-wrap;
            word-break: break-word;
            background: rgba(127, 127, 127, .05);
            scrollbar-width: thin;
        }

        .text-area::-webkit-scrollbar { width: 5px; }
        .text-area::-webkit-scrollbar-thumb {
            background: var(--scroll-thumb);
            border-radius: 4px;
        }

        .viewer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2147483646;
            background: rgba(5, 8, 20, .97);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 16px;
        }

        .viewer.open { display: flex; }

        .viewer .v-close {
            position: absolute;
            top: 14px; right: 14px;
            width: 46px; height: 46px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, .14);
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .viewer .v-close:active { background: rgba(255, 255, 255, .3); }

        .viewer .v-body {
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .viewer img {
            max-width: 96%;
            max-height: 92%;
            object-fit: contain;
            border-radius: 8px;
        }

        .viewer video {
            max-width: 96%;
            max-height: 92%;
            object-fit: contain;
            border-radius: 8px;
            background: #000;
        }

        .viewer iframe {
            width: 96%; height: 100%;
            border: none;
            border-radius: 10px;
            background: #fff;
        }

        .viewer .v-toolbar {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
            white-space: nowrap;
        }

        .viewer .v-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: 22px;
            border: none;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .4);
        }

        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2147483647;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(8, 10, 25, .72);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            opacity: 0;
            visibility: hidden;
            transition: opacity .4s ease, visibility .4s ease;
            pointer-events: none;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .loader-wrap {
            position: relative;
            width: 160px; height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader-ring {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, .1);
            border-top-color: #f6d365;
            border-right-color: #fda085;
            animation: ringSpin .8s linear infinite;
        }

        .loader-ring::before {
            content: '';
            position: absolute;
            top: 12px; left: 12px; right: 12px; bottom: 12px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-bottom-color: #a78bfa;
            border-left-color: #667eea;
            animation: ringSpin 1.4s linear infinite reverse;
        }

        .loader-ring::after {
            content: '';
            position: absolute;
            top: 26px; left: 26px; right: 26px; bottom: 26px;
            border-radius: 50%;
            border: 1px solid transparent;
            border-top-color: #fb7185;
            border-right-color: #2dd4bf;
            animation: ringSpin 2s linear infinite;
        }

        .loader-text {
            position: relative;
            z-index: 5;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #f6d365, #fda085, #f6d365);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textShine 1.5s linear infinite;
        }

        @keyframes ringSpin { to { transform: rotate(360deg); } }
        @keyframes textShine {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        @media (min-width: 820px) {
            .box-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }
        @media (min-width: 1240px) {
            .box-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        }
