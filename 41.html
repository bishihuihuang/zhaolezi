<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>看看作业</title>
    <style>
        /* ========== 全局重置 ========== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            min-height: 100vh;
            background: var(--bg);
            color: var(--txt);
            overflow-x: hidden;
            position: relative;
        }

        /* ========== 背景流光层 ========== */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-flow-1 {
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: var(--flow-grad);
            background-size: 400% 400%;
            animation: flowDriftLarge 20s ease-in-out infinite;
            will-change: transform;
        }

        .bg-flow-2 {
            position: absolute;
            top: -60%;
            left: -40%;
            width: 220%;
            height: 220%;
            background: radial-gradient(ellipse at 30% 70%,
                    rgba(255, 140, 100, .35), transparent 50%),
                radial-gradient(ellipse at 65% 35%,
                    rgba(120, 180, 255, .3), transparent 45%),
                radial-gradient(ellipse at 80% 80%,
                    rgba(220, 130, 250, .25), transparent 40%);
            animation: flowDrift 20s ease-in-out infinite alternate;
            will-change: transform;
        }

        .bg-flow-3 {
            position: absolute;
            top: -30%;
            left: -20%;
            width: 180%;
            height: 180%;
            background: radial-gradient(circle at 50% 50%,
                    rgba(255, 200, 130, .15), transparent 60%),
                radial-gradient(circle at 20% 80%,
                    rgba(80, 220, 200, .2), transparent 50%);
            animation: flowRotate 20s linear infinite;
            will-change: transform;
        }

        @keyframes flowDriftLarge {
            0% { transform: translate(0%, 0%) scale(1); }
            50% { transform: translate(-2%, -2%) scale(1.05); }
            100% { transform: translate(0%, 0%) scale(1); }
        }

        @keyframes flowDrift {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(3%, -4%) scale(1.05) rotate(5deg); }
            100% { transform: translate(-2%, 3%) scale(.97) rotate(-5deg); }
        }

        @keyframes flowRotate {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.08); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* ========== 透明悬浮球 ========== */
        .orb {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%,
                    rgba(255, 255, 255, .3),
                    rgba(255, 255, 255, .1) 50%,
                    transparent 70%);
            box-shadow: 0 0 60px rgba(255, 255, 255, .08),
                inset 0 0 30px rgba(255, 255, 255, .04);
            pointer-events: none;
            will-change: transform, opacity;
        }

        .orb-1 { width: 260px; height: 260px; top: 12%; left: 8%; animation: orbFloatA 18s ease-in-out infinite, orbSpin 40s linear infinite; }
        .orb-2 { width: 160px; height: 160px; top: 55%; left: 75%; animation: orbFloatB 22s ease-in-out infinite, orbSpin 55s linear infinite; }
        .orb-3 { width: 110px; height: 110px; top: 68%; left: 20%; animation: orbFloatA 16s ease-in-out infinite reverse, orbSpin 35s linear infinite; }
        .orb-4 { width: 220px; height: 220px; top: 28%; left: 60%; animation: orbFloatB 20s ease-in-out infinite reverse, orbSpin 50s linear infinite; }
        .orb-5 { width: 80px; height: 80px; top: 80%; left: 45%; animation: orbFloatA 14s ease-in-out infinite, orbSpin 30s linear infinite; }

        @keyframes orbFloatA {
            0% { transform: translate(0, 0) scale(1); opacity: .6; }
            30% { transform: translate(18px, -22px) scale(1.04); opacity: .8; }
            60% { transform: translate(-12px, 10px) scale(.96); opacity: .5; }
            100% { transform: translate(0, 0) scale(1); opacity: .6; }
        }

        @keyframes orbFloatB {
            0% { transform: translate(0, 0) scale(1); opacity: .5; }
            35% { transform: translate(-20px, 12px) scale(1.06); opacity: .7; }
            70% { transform: translate(14px, -15px) scale(.94); opacity: .4; }
            100% { transform: translate(0, 0) scale(1); opacity: .5; }
        }

        @keyframes orbSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ========== 主体布局 ========== */
        main {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 14px 96px;
        }

        .container {
            width: 100%;
            max-width: 1440px;
            background: var(--card);
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, .35),
                0 0 0 1px rgba(255, 255, 255, .3),
                inset 0 1px 0 rgba(255, 255, 255, .6);
            padding: 16px;
            color: var(--txt);
        }

        /* ========== 顶部标题区 + 更新公告 + 返回主页 ========== */
        .top-grid {
            display: grid;
            grid-template-columns: 1fr 220px 220px;
            gap: 12px;
            margin-bottom: 16px;
        }

        .title-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--title-grad);
            background-size: 300% 300%;
            animation: titleGradient 6s ease infinite;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(255, 150, 50, .35),
                inset 0 1px 0 rgba(255, 255, 255, .2);
            position: relative;
            overflow: hidden;
            transition: transform .4s cubic-bezier(.34, 1.56, .64, 1),
                box-shadow .4s ease;
            min-height: 108px;
            padding: 16px;
            text-align: center;
        }

        .title-area:hover {
            transform: translateY(-4px) scale(1.005);
            box-shadow: 0 18px 50px rgba(255, 150, 50, .4);
        }

        .title-area h1 {
            font-size: 40px;
            font-weight: 900;
            line-height: 1.3;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, .3);
        }

        .title-sub {
            font-size: 13px;
            color: rgba(255, 255, 255, .88);
            margin-top: 4px;
            letter-spacing: 1px;
            font-weight: 400;
            text-shadow: 0 1px 4px rgba(0, 0, 0, .3);
        }

        @keyframes titleGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ========== 更新公告区域 ========== */
        .announce-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(231, 76, 60, .4),
                inset 0 1px 0 rgba(255, 255, 255, .2);
            text-decoration: none;
            color: #fff;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 3px;
            cursor: pointer;
            transition: transform .35s cubic-bezier(.34, 1.56, .64, 1),
                box-shadow .35s ease;
            min-height: 108px;
            min-width: 120px;
            -webkit-tap-highlight-color: transparent;
        }

        .announce-area:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 18px 50px rgba(231, 76, 60, .5);
        }

        .announce-area:active {
            transform: translateY(-2px) scale(.96);
            transition-duration: .1s;
        }

        .announce-area .announce-icon {
            font-size: 32px;
            margin-bottom: 4px;
        }

        /* ========== 返回主页区域 ========== */
        .back-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--back-grad);
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(17, 153, 142, .4),
                inset 0 1px 0 rgba(255, 255, 255, .2);
            text-decoration: none;
            color: #fff;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 3px;
            cursor: pointer;
            transition: transform .35s cubic-bezier(.34, 1.56, .64, 1),
                box-shadow .35s ease;
            min-height: 108px;
            min-width: 120px;
            -webkit-tap-highlight-color: transparent;
        }

        .back-area:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 18px 50px rgba(17, 153, 142, .5);
        }

        .back-area:active {
            transform: translateY(-2px) scale(.96);
            transition-duration: .1s;
        }

        .back-area .back-icon {
            font-size: 32px;
            margin-bottom: 4px;
        }

        /* ========== 柜体网格（默认手机：每行 2 个） ========== */
        .box-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        /* ========== 单个长方柜：宽高比 9:20，三段 9:14 / 9:1 / 9:5 ========== */
        .job-box {
            aspect-ratio: 9 / 20;
            display: flex;
            flex-direction: column;
            border-radius: 16px;
            overflow: hidden;
            background: var(--card-2);
            border: 2px solid var(--line);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .14),
                inset 0 1px 0 rgba(255, 255, 255, .25);
        }

        /* ---- 上部 9:14 文件显示区 ---- */
        .media-area {
            flex: 0 0 70%;
            min-height: 0;
            padding: 8px;
            position: relative;
            border-bottom: 1px solid var(--line);
            background: rgba(127, 127, 127, .05);
        }

        .media-scroll {
            height: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 2px;
            scrollbar-width: thin;
        }

        .media-scroll::-webkit-scrollbar {
            width: 5px;
        }

        .media-scroll::-webkit-scrollbar-thumb {
            background: var(--scroll-thumb);
            border-radius: 4px;
        }

        /* 图片：按原本比例 contain 显示，不碰边柜 */
        .f-image {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            max-height: 88%;
            border-radius: 10px;
            overflow: hidden;
            cursor: zoom-in;
            background: rgba(0, 0, 0, .12);
            -webkit-tap-highlight-color: transparent;
        }

        .f-image img {
            display: block;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 10px;
        }

        /* 视频：无控件封面，点击全屏播放 */
        .f-video {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            max-height: 88%;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            background: rgba(0, 0, 0, .18);
            -webkit-tap-highlight-color: transparent;
        }

        .f-video video {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 10px;
            background: #000;
        }

        /* 卡片类（PDF / 文档 / 链接） */
        .f-card {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: rgba(127, 127, 127, .07);
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .f-card:active {
            transform: scale(.98);
            box-shadow: 0 2px 10px rgba(0, 0, 0, .15);
        }

        .f-card .fc-icon {
            font-size: 22px;
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: rgba(102, 126, 234, .12);
        }

        .f-card .fc-body {
            flex: 1;
            min-width: 0;
        }

        .f-card .fc-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--txt);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .f-card .fc-kind {
            font-size: 11px;
            color: var(--dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .f-card .fc-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .f-card .fc-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            transition: background .2s ease, transform .2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .f-card .fc-btn:hover {
            background: rgba(127, 127, 127, .15);
            transform: scale(1.08);
        }

        .f-card .fc-second {
            color: #ff9800;
        }

        .f-card .fc-first {
            color: #667eea;
        }

        /* 全部加载完毕提示条 */
        .all-loaded-tip {
            grid-column: 1 / -1;
            text-align: center;
            padding: 16px;
            font-size: 13px;
            color: var(--dim);
            opacity: .7;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ---- 中部 9:1 更新时间 + 标题 ---- */
        .info-area {
            flex: 0 0 5%;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 0 5px;
            background: linear-gradient(90deg,
                    rgba(102, 126, 234, .14),
                    rgba(255, 165, 0, .14));
            border-bottom: 1px solid var(--line);
            font-size: 10.5px;
            color: var(--txt);
            white-space: nowrap;
            overflow: hidden;
        }

        .info-time {
            flex-shrink: 0;
            font-weight: 700;
            color: var(--gold);
            max-width: 42%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .info-title {
            flex: 1;
            min-width: 0;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ---- 下部 9:5 纯文本区 ---- */
        .text-area {
            flex: 0 0 25%;
            min-height: 0;
            padding: 8px 10px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.7;
            color: var(--txt);
            white-space: pre-wrap;
            word-break: break-word;
            background: rgba(127, 127, 127, .05);
            scrollbar-width: thin;
        }

        .text-area::-webkit-scrollbar {
            width: 5px;
        }

        .text-area::-webkit-scrollbar-thumb {
            background: var(--scroll-thumb);
            border-radius: 4px;
        }

        /* ========== 全屏预览查看器 ========== */
        .viewer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2147483646;
            background: rgba(5, 8, 20, .97);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 16px;
        }

        .viewer.open {
            display: flex;
        }

        .viewer .v-close {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, .14);
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            -webkit-tap-highlight-color: transparent;
        }

        .viewer .v-close:active {
            background: rgba(255, 255, 255, .3);
        }

        .viewer .v-body {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .viewer img {
            max-width: 96%;
            max-height: 92%;
            object-fit: contain;
            border-radius: 8px;
        }

        .viewer video {
            max-width: 96%;
            max-height: 92%;
            object-fit: contain;
            border-radius: 8px;
            background: #000;
        }

        .viewer iframe {
            width: 96%;
            height: 100%;
            border: none;
            border-radius: 10px;
            background: #fff;
        }

        .viewer .v-toolbar {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
            white-space: nowrap;
        }

        .viewer .v-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: 22px;
            border: none;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .4);
            -webkit-tap-highlight-color: transparent;
        }

        /* ========== 加载覆盖层（转场） ========== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2147483647;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(8, 10, 25, .72);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            opacity: 0;
            visibility: hidden;
            transition: opacity .4s ease, visibility .4s ease;
            pointer-events: none;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .loader-wrap {
            position: relative;
            width: 160px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, .1);
            border-top-color: #f6d365;
            border-right-color: #fda085;
            animation: ringSpin .8s linear infinite;
        }

        .loader-ring::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-bottom-color: #a78bfa;
            border-left-color: #667eea;
            animation: ringSpin 1.4s linear infinite reverse;
        }

        .loader-ring::after {
            content: '';
            position: absolute;
            top: 26px;
            left: 26px;
            right: 26px;
            bottom: 26px;
            border-radius: 50%;
            border: 1px solid transparent;
            border-top-color: #fb7185;
            border-right-color: #2dd4bf;
            animation: ringSpin 2s linear infinite;
        }

        .loader-text {
            position: relative;
            z-index: 5;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(90deg,
                    #f6d365, #fda085, #f6d365);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textShine 1.5s linear infinite;
        }

        @keyframes ringSpin {
            to { transform: rotate(360deg); }
        }

        @keyframes textShine {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

/* ========== 响应式：平板 / 电脑 ========== */
        @media (min-width: 820px) {
            .box-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (min-width: 1240px) {
            .box-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        @media (min-width: 1800px) {
            .box-grid {
                grid-template-columns: repeat(5, minmax(0, 1fr));
            }
        }

        @media (max-width: 700px) {
            main {
                padding: 12px 10px 92px;
            }

            .container {
                padding: 12px;
                border-radius: 18px;
            }

            .top-grid {
                grid-template-columns: 1fr 120px 120px;
                gap: 8px;
            }

            .title-area {
                min-height: 86px;
                border-radius: 16px;
            }

            .title-area h1 {
                font-size: 28px;
                letter-spacing: 3px;
            }

            .title-sub {
                font-size: 10.5px;
                letter-spacing: 1px;
            }

            .announce-area {
                padding: 6px 10px;
                font-size: 12px;
                gap: 4px;
                min-height: 86px;
                border-radius: 16px;
                letter-spacing: 1px;
            }

            .announce-area .announce-icon {
                font-size: 18px;
            }

            .back-area {
                padding: 6px 14px;
                font-size: 12px;
                gap: 5px;
            }

            .back-icon {
                font-size: 16px;
            }

            .box-grid {
                gap: 10px;
                padding-top: 6px;
            }

            .job-box {
                border-radius: 12px;
            }

            .media-area {
                flex: 0 0 72%;
            }

            .info-area {
                flex: 0 0 4%;
                font-size: 9px;
                padding: 0 4px;
            }

            .info-time {
                max-width: 40%;
            }

            .text-area {
                flex: 0 0 24%;
                padding: 6px;
                font-size: 11px;
                line-height: 1.5;
            }

            .f-card {
                padding: 10px 12px;
                gap: 10px;
                min-height: 56px;
            }

            .f-card .fc-icon {
                width: 32px;
                height: 32px;
                font-size: 20px;
            }

            .f-card .fc-name {
                font-size: 14px;
            }

            .f-card .fc-kind {
                font-size: 12px;
            }

            .f-card .fc-actions {
                gap: 6px;
            }

            .f-card .fc-btn {
                width: 44px;
                height: 44px;
                font-size: 18px;
